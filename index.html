/* ---------- undo / redo ---------- */
const UNDO = [], REDO = [];
let REDOING = false;
function pushUndo(fn){
  if (!REDOING && REDO.length){ REDO.length = 0; $("#btnRedo").disabled = true; }
  UNDO.push(fn); if (UNDO.length > 50) UNDO.shift();
  $("#btnUndo").disabled = false;
}
const now = () => { const d = new Date(); return `${today()} ${pad2(d.getHours())}:${pad2(d.getMinutes())}`; };   // local time
function snapF(f){ const c = structuredClone(f); pushUndo(() => { const i = DATA.formulas.findIndex(x => x.id === c.id); if (i >= 0) DATA.formulas[i] = c; }); f.modified = now(); }
function snapM(m){ const c = structuredClone(m); pushUndo(() => { const i = DATA.materials.findIndex(x => x.id === c.id); if (i >= 0) DATA.materials[i] = c; }); m.modified = now(); }
function clampView(){
  if (VIEW.tab === "F" && VIEW.sub){
    const f = DATA.formulas.find(x => x.id === VIEW.id);
    if (!f) VIEW.sub = null;
    else if (VIEW.sub.type === "v" && !f.versions[VIEW.sub.idx]) VIEW.sub = null;
    else if (VIEW.sub.type === "var" && !f.variations[VIEW.sub.idx]) VIEW.sub = null;
  }
}
function undo(){
  const fn = UNDO.pop(); if (!fn) return;
  try{ REDO.push(serialize()); if (REDO.length > 10) REDO.shift(); $("#btnRedo").disabled = false; }catch(e){}
  fn(); invalidateMats();
  if (!UNDO.length) $("#btnUndo").disabled = true;
  clampView();
  buildUsage(); markDirty(); render();
}
function redo(){
  const s = REDO.pop(); if (!s) return;
  const cur = serialize();
  REDOING = true;
  pushUndo(() => { DATA = migrate(JSON.parse(cur)); });
  REDOING = false;
  DATA = migrate(JSON.parse(s));
  if (!REDO.length) $("#btnRedo").disabled = true;
  invalidateMats(); clampView();
  buildUsage(); markDirty(); render();
}

function pyrIcon(level, colour, size = 14){
  let s = `<svg class="pyricon" width="${size}" height="${size}" viewBox="0 0 14 14" aria-hidden="true">`;
  for (let i = 0; i < 5; i++){
    const y1 = 1 + 12*i/5, y2 = 1 + 12*(i+1)/5, hw = y => (y-1)/12*6;
    s += `<polygon points="${(7-hw(y1)).toFixed(2)},${y1.toFixed(2)} ${(7+hw(y1)).toFixed(2)},${y1.toFixed(2)} ${(7+hw(y2)).toFixed(2)},${y2.toFixed(2)} ${(7-hw(y2)).toFixed(2)},${y2.toFixed(2)}" fill="${i===level?colour:"none"}" stroke="${colour}" stroke-width="0.7"/>`;

function buildUsage(){
  USAGE = {};

    const add = (lines, where) => { for (const l of lines||[]){ (USAGE[l.materialId] ||= []).push({fid:f.id, name:f.name, where}); } };
    for (const v of f.versions) add(v.lines, "v"+v.v);

function calc(lines){
  // Perfumery percentages: a line's "content" is its dilution-corrected RM weight.
  // rel% = content / total non-solvent content (sums to 100; solvent lines show "–").
  // abs% = content / total formula weight (total = concentrate %); solvent lines show their weight share.
  let tw = 0, tc = 0, content = 0;
  const rows = (lines||[]).map(l => {
    const m = matById(l.materialId) || {};
    const w = l.weightG || 0, dil = l.dilutionPct ?? 100;
    const cost = w * (m.costPerGram||0) * dil/100;
    const cont = m.isSolvent ? 0 : w * dil/100;
    tw += w; tc += cost; content += cont;
    return {l, m, w, dil, cost, cont};
  });
  for (const r of rows){
    r.rel = r.m.isSolvent ? null : (content ? r.cont/content*100 : 0);
    r.absPct = tw ? (r.m.isSolvent ? r.w/tw*100 : r.cont/tw*100) : 0;

}

function solventIdx(lines, skip = -1){
  let j = lines.findIndex((l,i) => i !== skip && isEthanol(matById(l.materialId)));
  if (j < 0) j = lines.findIndex((l,i) => i !== skip && (matById(l.materialId)||{}).isSolvent);
  return j;
}

function pyrLevels(K){
  const buckets = [0,0,0,0,0]; let tot = 0;
  for (const r of K.rows){
    const p = r.m.pyramid;
    if (r.m.isSolvent || p == null || p > 4) continue;
    const v = r.rel || 0; buckets[p] += v; tot += v;
  }
  return {buckets, tot};
}
const PYRCOLS = ["#E3C34F","#9CB86B","#CD7F54","#8A6FAE","#6F5138"];
const PYRLABS = ["Top","Top-heart","Heart","Heart-base","Base"];
function pyrPyramid(K){
  const {buckets, tot} = pyrLevels(K);
  if (tot <= 0) return "";
  // five equal-height, centred bands; the WIDTH of each band shows its share
  const W = 128, H = 96, cx = W/2, rowH = H/5, gap = 2.5;
  const maxFrac = Math.max(...buckets)/tot;
  let parts = "";
  for (let i = 0; i < 5; i++){
    const frac = buckets[i]/tot;
    const y = i*rowH;
    if (frac <= 0) continue;
    const w = Math.max(3, (frac/maxFrac) * W);
    parts += `<rect x="${(cx-w/2).toFixed(1)}" y="${(y+gap/2).toFixed(1)}" width="${w.toFixed(1)}" height="${(rowH-gap).toFixed(1)}" rx="1.5"
      fill="${PYRCOLS[i]}"><title>${PYRLABS[i]} — ${fmt(frac*100,1)}%</title></rect>`;
    parts += `<text x="${W+7}" y="${(y+rowH/2+3).toFixed(1)}">${fmt(frac*100,1)}%</text>`;
  }
  return `<svg class="fpyr" width="185" height="${H+8}" viewBox="0 0 185 ${H+8}" role="img"
    aria-label="Olfactive pyramid: share of each level in the non-solvent content">${parts}</svg>`;
}
function pyrBar(K){
  const {buckets, tot} = pyrLevels(K);
  if (tot <= 0) return "";

    b > 0 ? `<span style="flex:${(b/tot).toFixed(4)};background:${PYRCOLS[i]}" title="${PYRLABS[i]} ${fmt(b/tot*100,1)}%"></span>` : "").join("") + `</div>`;
}
let SORT = {key:"orig", dir:1};
function sortRows(rows){
  rows.forEach((r,i) => r.idx = i);
  const by = {
    orig:(a,b)=>a.idx-b.idx,
    name:(a,b)=>(a.m.name||"").localeCompare(b.m.name||""),
    dil:(a,b)=>a.dil-b.dil,
    weight:(a,b)=>a.w-b.w,
    rel:(a,b)=>(a.rel??-1)-(b.rel??-1),
    abs:(a,b)=>a.absPct-b.absPct,
    cat:(a,b)=>(a.m.category||"").localeCompare(b.m.category||"")||(a.m.name||"").localeCompare(b.m.name||""),
    pyr:(a,b)=>(((a.m.pyramid??9)===5?9:a.m.pyramid??9)-((b.m.pyramid??9)===5?9:b.m.pyramid??9))||((a.m.name||"").localeCompare(b.m.name||""))
  }[SORT.key] || ((a,b)=>a.idx-b.idx);
  return [...rows].sort((a,b) => SORT.dir * by(a,b));
}
// a live variation follows the latest version, or the version it is pinned to (va.baseV)
function baseVersionOf(f, va){
  return (va && va.baseV != null ? f.versions.find(v => v.v === va.baseV) : null) || currentVersion(f);
}
function varLinesRaw(f, va){   // overrides + solvent delta, before target-weight scaling
  const src = baseVersionOf(f, va); if (!src) return [];
  const lines = src.lines.map(l => {
    const o = (va.dilutionOverrides||{})[l.materialId];
    if (o != null && o !== l.dilutionPct){
      return {...l, dilutionPct:o, weightG: (l.weightG||0) * (l.dilutionPct??100) / o};
    }
    return {...l};
  });
  if (va.remarks) for (const [i, code] of Object.entries(va.remarks)){   // colour marks of this variation
    if (lines[i]) lines[i] = {...lines[i], remark: code};
  }
  if (va.solventDeltaG){
    const j = solventIdx(lines);
    if (j >= 0) lines[j] = {...lines[j], weightG: (lines[j].weightG||0) + va.solventDeltaG};

}

  if (va.frozen || va.lines) return va.lines;
  let lines = varLinesRaw(f, va);

    if (c.totalW > 0){ const k = va.targetWeightG / c.totalW; lines = lines.map(l => ({...l, weightG:(l.weightG||0)*k})); }
  }
  return lines;
}

function renderLines(f, item, lines, K, editable, isVar){

    h += `<div class="toolRow"><button class="small" id="btnSheet" style="margin-left:auto">Formula sheet</button>

function dilSelect(m, cur, i, isVar){

    `<option value="custom">custom…</option></select>`;

function bindLineEditors(f, item){

      DATA.orderList.push({id: uid("o-"), materialId: m.id, name, note: `needed for ${f.name}`, price:"", added: today()});

    markDirty(); render();

function changeDilutionVar(f, va, i, d2){

    <div class="fieldGrid">

      dilutions: [{pct: conc, isBase: true, date: today(), notes: "aromatic concentration of the mix"}]};
    const pf = {id: uid("f-"), name, category: "Prediluties", created: today(), modified: now(), frozenImport: false,
      versions: [{v: 1, frozen: true, date: today(),
        notes: `Predilution for ${f.name} ${isVarView?`variation «${item.label}» (base v${cur.v})`:`v${cur.v}`} · factor ×${k} · total ${(+Wp.toFixed(3))} g · ${conc.toFixed(2)}% aromatic`,
        lines: picks.map(l => ({materialId: l.materialId, dilutionPct: l.dilutionPct??100, weightG: l.weightG*k, remark: 1}))}],
      variations: []};
    const idxSet = new Set(pickIdx);
    const newLines = cur.lines.filter((l,i) => !idxSet.has(i)).map(l => ({...l}));
    newLines.push({materialId: pm.id, dilutionPct: conc, weightG: baseSumW, remark: 1});
    const nv = {v: Math.max(...f.versions.map(x => x.v)) + 1, date: today(),
      notes: `Predilution «${name}» replaces ${pickIdx.length} lines of v${cur.v}${isVarView?` (composition per variation «${item.label}»)`:""}.`, lines: newLines};
    DATA.materials.push(pm); DATA.materials.sort((a,b) => a.name.localeCompare(b.name)); invalidateMats();
    if (!DATA.formulaCategories.includes("Prediluties")) DATA.formulaCategories.push("Prediluties");
    DATA.formulas.push(pf);
    f.versions.push(nv); f.frozenImport = false; f.modified = now();
    pushUndo(() => {
      const i = DATA.formulas.findIndex(x => x.id === f.id); if (i >= 0) DATA.formulas[i] = fClone;
      DATA.formulas = DATA.formulas.filter(x => x.id !== pf.id);
      DATA.materials = DATA.materials.filter(x => x.id !== pm.id); invalidateMats();
      if (VIEW.id === pf.id){ VIEW.id = null; VIEW.sub = null; }
    });
    buildUsage(); markDirty();
    if (sub.type !== "var") VIEW.sub = {type: "v", idx: f.versions.length - 1};
    render();
  });
}
function newVersion(f, fromIdx){
  snapF(f);
  const src = f.versions[fromIdx ?? f.versions.length-1];
  const v = {v: f.versions.length ? Math.max(...f.versions.map(x=>x.v))+1 : 1, date: today(), notes:"",
    lines: src ? src.lines.map(l => ({...l})) : []};
  f.versions.push(v); f.frozenImport = false;
  VIEW.sub = {type:"v", idx: f.versions.length-1};
  markDirty(); render();
}
function newVariation(f, sub){
  const viewed = sub && sub.type === "v" ? f.versions[sub.idx] : null;
  const latest = currentVersion(f);
  const onOlder = viewed && latest && viewed.v !== latest.v;
  openDialog(`<h3 style="margin:0 0 .3rem">New variation — ${esc(f.name)}</h3>
    <div class="hint" style="margin-bottom:.7rem">Same recipe in another presentation: other dilutions, another batch size. It follows the formula live until you freeze it.</div>
    <div class="fieldGrid">

      <label>Target total</label><span><input id="nvTarget" inputmode="decimal" placeholder="same as base" style="width:7rem;text-align:right"> g</span>
      <label>Follows</label><select id="nvBase">
        <option value="">latest version (now ${esc(vName(latest))})</option>
        ${onOlder ? `<option value="${viewed.v}" selected>this version only (${esc(vName(viewed))})</option>` : ""}
      </select>
    </div>`, "Create", () => {
    const label = $("#nvLabel").value.trim();
    if (!label){ alert("Give the variation a label."); return false; }
    const t = parseNum($("#nvTarget").value), bv = $("#nvBase").value;
    snapF(f);

    if (bv) va.baseV = +bv;
    f.variations.push(va);
    VIEW.sub = {type:"var", idx: f.variations.length-1};
    markDirty(); render();
  });

}

/* ---------- inventory (opt-in stock ledger) ---------- */
const basePct = m => ((m.dilutions||[]).find(d => d.isBase) || {}).pct ?? 100;
const fridgeMark = (m, dil) => (m.locations?.frigo && dil === basePct(m))
  ? ` <span title="Base concentration is stored in the fridge" style="color:var(--frozen)">❄</span>` : "";
function stockCalc(m){
  const ev = m.stockEvents || [];
  let base = null, idx = -1;
  ev.forEach((e,i) => { if (e.t === "take"){ base = e.g; idx = i; } });
  if (base == null) return {tracked:false, qty:null, ev};
  let q = base;
  ev.forEach((e,i) => { if (i > idx){
    if (e.t === "buy" && e.g != null) q += e.g;
    if ((e.t === "dil" || e.t === "prep") && e.g != null) q -= e.g;
  }});
  return {tracked:true, qty:q, ev};
}
function evLabel(e){
  const map = {take:"stocktake", buy:"purchase", dil:"dilution made", prep:"prepared"};
  let s = `${e.date} · ${map[e.t]||e.t}`;
  if (e.t==="take") s += ` → ${fmt(e.g)} g`;
  if (e.t==="buy") s += `: +${e.amount!=null?fmtS(e.amount):""} ${e.unit||"g"}${e.g!=null&&e.unit==="ml"?` (≈${fmt(e.g)} g)`:""}${e.g==null?" (no density — not counted)":""}${e.note?` · ${e.note}`:""}`;
  if (e.t==="dil") s += `: ${fmtS(e.pct)}% × ${fmt(e.totalG)} g → −${fmt(e.g)} g base`;
  if (e.t==="prep") s += `: ${e.formula} → −${fmt(e.g)} g`;
  return s;
}
function markPrepared(f, item, lines){
  const ded = [], other = [], untracked = [];
  for (const l of lines || []){
    const m = matById(l.materialId); if (!m || !(l.weightG > 0)) continue;
    const base = (m.dilutions||[]).find(d => d.isBase);
    const basePct = base ? base.pct : 100;
    if ((l.dilutionPct ?? 100) !== basePct){ other.push(m.name); continue; }
    if (!stockCalc(m).tracked){ untracked.push(m.name); continue; }
    ded.push({m, g: l.weightG});
  }
  const label = itemLabel(item);
  const msg = `Mark ${f.name} ${label} as prepared on ${today()}?\n\n` +
    (ded.length ? `Stock will decrease for ${ded.length} tracked material(s):\n${ded.slice(0,12).map(d=>`  − ${fmt(d.g)} g ${d.m.name}`).join("\n")}${ded.length>12?"\n  …":""}\n\n` : "No tracked base-dilution lines — nothing will be deducted.\n\n") +
    (other.length ? `${other.length} line(s) at other dilutions are untouched (their base was deducted when the dilution was made).\n` : "") +
    (untracked.length ? `${untracked.length} material(s) not tracked.\n` : "") +
    `\nThis can be done once per version/variation.`;
  if (!confirm(msg)) return;
  const fClone = structuredClone(f);
  const mClones = ded.map(d => structuredClone(d.m));
  pushUndo(() => {
    const i = DATA.formulas.findIndex(x => x.id === fClone.id); if (i >= 0) DATA.formulas[i] = fClone;
    mClones.forEach(c => { const j = DATA.materials.findIndex(x => x.id === c.id); if (j >= 0) DATA.materials[j] = c; });
  });
  for (const d of ded){
    (d.m.stockEvents ||= []).push({t:"prep", date: today(), g: d.g, formula: `${f.name} ${label}`});
    d.m.modified = now();
  }
  f.modified = now();
  item.prepared = {date: today(), deductedG: ded.reduce((s,d)=>s+d.g,0), materials: ded.length};
  markDirty(); render();
}

let IDOSE = null, IFRAOPEN = false, SCALEOPEN = false, NOTESOPEN = null, CATSOPEN = false;   // NOTESOPEN null = follow content
function catPanel(K){

function ifraPanel(f, item, K){
  const agg = new Map();
  for (const r of K.rows){
    if (r.m.isSolvent) continue;
    const e = agg.get(r.m.id) || {m: r.m, rel: 0};
    e.rel += r.rel || 0; agg.set(r.m.id, e);
  }
  const dose = IDOSE ?? K.totalAbsPct;
  const restricted = [], unknown = [];
  for (const e of agg.values()){
    const lim = e.m.ifraLimit;
    if (lim == null){ unknown.push(e.m.name); continue; }
    if (lim >= 99) continue;                       // verified: no restriction
    const finalPct = e.rel * dose / 100;
    restricted.push({m: e.m, finalPct, lim, ratio: lim > 0 ? finalPct/lim : Infinity});
  }
  restricted.sort((a,b) => b.ratio - a.ratio);
  const over = restricted.filter(r => r.ratio > 1);
  const verdict = !restricted.length ? "no restricted materials"
    : over.length ? `⚠ ${over.length} over limit` : "✓ within limits";
  let h = `<details class="panelBox" id="ifraBox"${IFRAOPEN?" open":""}>
    <summary style="cursor:pointer;font-size:.8rem;text-transform:uppercase;letter-spacing:.07em;font-weight:600;color:${over.length?"var(--danger)":"var(--accent-ink)"}">IFRA check — ${verdict}</summary>
    <div class="toolRow" style="margin-top:.5rem">At concentrate dosage <input type="text" id="ifraDose" style="width:5rem;text-align:right" value="${fmt(dose,2)}"> % of finished product
      <span class="hint">(default = this formula as-is)</span></div>`;
  if (!restricted.length){
    h += `<div class="hint">No restricted materials present.</div>`;
  } else {
    h += `<table class="lines"><thead><tr><th>Material</th><th class="num">In product %</th><th class="num">IFRA limit %</th><th class="num">Used</th></tr></thead><tbody>
    ${restricted.slice(0, over.length > 8 ? over.length : 8).map(r => `<tr${r.ratio>1?' style="color:var(--danger);font-weight:600"':''}>
      <td>${esc(r.m.name)}</td><td class="num">${fmt(r.finalPct,3)}</td><td class="num">${fmt(r.lim,3)}</td>
      <td class="num">${r.lim>0?fmt(r.ratio*100,0)+"%":"—"}</td></tr>`).join("")}
    </tbody></table>`;
  }
  if (unknown.length) h += `<div class="hint">Not yet verified against IFRA (${unknown.length}): ${unknown.slice(0,12).map(esc).join(", ")}${unknown.length>12?", …":""}</div>`;
  return h + `</details>`;
}

let BDRAG = null, BSORT = "orig";
function benchPoolSort(pool, K){
  if (BSORT === "orig") return pool;
  const r = k => K.rows[k.i];
  const by = {
    name:(a,b) => (r(a).m.name||"").localeCompare(r(b).m.name||""),
    dil:(a,b) => r(b).dil - r(a).dil,
    weight:(a,b) => r(b).w - r(a).w,
    rel:(a,b) => ((r(b).rel)??-1) - ((r(a).rel)??-1),
    cat:(a,b) => (r(a).m.category||"").localeCompare(r(b).m.category||"") || (r(a).m.name||"").localeCompare(r(b).m.name||""),
    pyr:(a,b) => (((r(a).m.pyramid??9)===5?9:r(a).m.pyramid??9) - ((r(b).m.pyramid??9)===5?9:r(b).m.pyramid??9)) || (r(a).m.name||"").localeCompare(r(b).m.name||"")
  }[BSORT];
  return by ? [...pool].sort(by) : pool;
}
function benchData(item, lines){
  const seen = new Map();
  const keyed = lines.map((l, i) => {
    const base = l.materialId + "|" + (l.dilutionPct ?? 100);
    const n = seen.get(base) || 0; seen.set(base, n + 1);
    return {key: base + "|" + n, l, i};
  });
  item.bench ||= {groups: []};
  const valid = new Set(keyed.map(k => k.key));
  // lines that disappeared from the formula are simply not shown; the stored keys are left untouched (no silent edits while rendering)
  const grouped = new Set(item.bench.groups.flatMap(g => g.keys.filter(k => valid.has(k))));
  return {keyed, byKey: new Map(keyed.map(k => [k.key, k])), pool: keyed.filter(k => !grouped.has(k.key))};
}
function renderBench(f, item, lines, K){
  const BD = benchData(item, lines);
  const row = k => { const r = K.rows[k.i]; return `<div class="brow" draggable="true" data-key="${k.key}">
    <input type="checkbox" class="bsel" data-key="${k.key}"><span class="bgrip">⠿</span>${pyrIcon(r.m.pyramid, catColour(r.m), 13)}
    <span class="bname">${esc(r.m.name)}${fridgeMark(r.m, r.dil)}${r.m.isSolvent?" (solvent)":""}</span><span class="bdil">${fmtS(r.dil)}%</span>
    <span class="bw">${fmt(r.w)} g</span><span class="bp">${r.rel==null?"–":fmt(r.rel,2)}%</span></div>`; };
  const stats = keys => { let w = 0, rel = 0, cont = 0;
    keys.forEach(key => { const k = BD.byKey.get(key); if (k){ const r = K.rows[k.i]; w += r.w; rel += r.rel || 0; cont += r.cont || 0; } });
    return `${keys.length} · ${fmt(w)} g · ${fmt(rel,2)}%` +

function benchMove(f, item, keys, target, beforeKey){

    const g = item.bench.groups[+target]; if (!g) return;
    let idx = beforeKey ? g.keys.indexOf(beforeKey) : -1;
    if (idx < 0) idx = g.keys.length;
    g.keys.splice(idx, 0, ...keys);
  }
  markDirty(); render();
}

  gact("bdown", gi => { const g = item.bench.groups; [g[gi], g[gi+1]] = [g[gi+1], g[gi]]; });
  gact("bempty", gi => { item.bench.groups[gi].keys = []; });

/* ---------- compare view ---------- */
function aggLines(lines){
  const map = new Map(); let tw = 0, content = 0;
  for (const l of lines||[]){
    const m = matById(l.materialId) || {}; const w = l.weightG||0;
    const cont = m.isSolvent ? 0 : w * (l.dilutionPct??100)/100;
    tw += w; content += cont;
    const e = map.get(l.materialId) || {m, w:0, cont:0, dils:new Set()};
    e.w += w; e.cont += cont; e.dils.add(l.dilutionPct??100);
    map.set(l.materialId, e);
  }
  for (const e of map.values()) e.rel = e.m.isSolvent ? null : (content ? e.cont/content*100 : 0);
  return {map, tw, content, abs: tw ? content/tw*100 : 0};
}
function cmpOptions(f){
  return [...f.versions.map((v,i)=>({key:"v"+i, label:`${vName(v)} (${v.date||"?"})${v.sourceName?` — ${v.sourceName}`:""}`})),
          ...f.variations.map((va,i)=>({key:"x"+i, label:`«${va.label}»${va.frozenFromName?` ⛄ ${va.frozenFromName}`:""}${va.date?` — ${va.date}`:""}`}))];
}
function cmpLines(f, key){
  return key[0]==="v" ? (f.versions[+key.slice(1)]?.lines||[]) : variationLines(f, f.variations[+key.slice(1)]||{lines:[]});
}
let CSORT = null;
function mapSortToCmp(){
  const m = {name:"name", dil:"name", weight:"wB", rel:"relB", abs:"relB", cat:"cat", pyr:"pyr", orig:"diff"};
  return {key: m[SORT.key] || "diff", dir: SORT.key==="orig" ? 1 : SORT.dir};
}
function renderCompare(f, sub){
  const c = $("#content");
  const opts = cmpOptions(f);
  if (!opts.find(o=>o.key===sub.a)) sub.a = opts[0].key;
  if (!opts.find(o=>o.key===sub.b)) sub.b = opts[opts.length-1].key;
  if (!CSORT) CSORT = mapSortToCmp();
  const A = aggLines(cmpLines(f, sub.a)), B = aggLines(cmpLines(f, sub.b));
  const ids = [...new Set([...A.map.keys(), ...B.map.keys()])];
  const rows = ids.map(id => {
    const a = A.map.get(id), b = B.map.get(id), m = (a||b).m;
    const solv = m.isSolvent;
    let cls, d;
    if (!a) { cls = "cmpAdd"; d = solv ? null : b.rel; }
    else if (!b) { cls = "cmpDel"; d = solv ? null : -a.rel; }
    else {
      d = solv ? null : b.rel - a.rel;
      const chg = solv ? Math.abs(b.w-a.w) > 5e-4 : (Math.abs(d) > 5e-3 || Math.abs(b.cont-a.cont) > 5e-4);
      cls = chg ? "cmpChg" : "";
    }
    return {m, a, b, d, cls, mag: d!=null ? Math.abs(d) : (solv && a && b ? 0.001*Math.abs(b.w-a.w) : 999)};
  });
  const by = {
    diff:(x,y) => (y.mag===999)-(x.mag===999) || y.mag-x.mag || (x.m.name||"").localeCompare(y.m.name||""),
    name:(x,y) => (x.m.name||"").localeCompare(y.m.name||""),
    wA:(x,y) => ((x.a?.w)??-1)-((y.a?.w)??-1),
    relA:(x,y) => ((x.a?.rel)??-1)-((y.a?.rel)??-1),
    wB:(x,y) => ((x.b?.w)??-1)-((y.b?.w)??-1),
    relB:(x,y) => ((x.b?.rel)??-1)-((y.b?.rel)??-1),
    dlt:(x,y) => ((x.d==null?-999:Math.abs(x.d))-((y.d==null?-999:Math.abs(y.d)))),
    cat:(x,y) => (x.m.category||"").localeCompare(y.m.category||"")||(x.m.name||"").localeCompare(y.m.name||""),
    pyr:(x,y) => (((x.m.pyramid??9)===5?9:x.m.pyramid??9)-((y.m.pyramid??9)===5?9:y.m.pyramid??9))||((x.m.name||"").localeCompare(y.m.name||""))
  }[CSORT.key] || ((x,y)=>y.mag-x.mag);
  rows.sort((x,y) => CSORT.dir * by(x,y));
  const cell = e => e ? `${fmt(e.w)} g <span class="hint">(${[...e.dils].sort((a,b)=>b-a).map(fmtS).join("/")}%)</span>` : "—";
  const relCell = e => e ? (e.rel==null ? "–" : fmt(e.rel,2)) : "—";
  const sel = (id, cur) => `<select id="${id}">${opts.map(o=>`<option value="${o.key}"${o.key===cur?" selected":""}>${esc(o.label)}</option>`).join("")}</select>`;
  const arrow = k => CSORT.key===k ? (CSORT.dir>0?" ▲":" ▼") : "";
  const hdr = (k, label, num) => `<th${num?' class="num"':''}><span class="sortable" data-csort="${k}">${label}${arrow(k)}</span></th>`;
  c.innerHTML = `<h2>${esc(f.name)} — compare</h2>
  <div class="toolRow"><span class="hint">A</span>${sel("cmpA", sub.a)}<span class="hint">B</span>${sel("cmpB", sub.b)}
    <button class="small" id="btnCmpClose" style="margin-left:auto">Close compare</button></div>
  <div class="toolRow"><span class="hint">Order:</span>
    <select id="cmpSortSel">
      <option value="diff"${CSORT.key==="diff"?" selected":""}>Difference (largest first)</option>
      <option value="cat"${CSORT.key==="cat"?" selected":""}>Category</option>
      <option value="pyr"${CSORT.key==="pyr"?" selected":""}>Pyramid top → base</option>
      ${["name","wA","relA","wB","relB","dlt"].includes(CSORT.key)?'<option value="" selected hidden>Column ▲▼</option>':""}
    </select></div>
  <table class="lines"><thead><tr>${hdr("name","Material")}${hdr("wA","A weight",1)}${hdr("relA","A rel %",1)}
    ${hdr("wB","B weight",1)}${hdr("relB","B rel %",1)}${hdr("dlt","Δ rel %",1)}</tr></thead><tbody>
  ${rows.map(r => `<tr class="${r.cls}"><td>${pyrIcon(r.m.pyramid, catColour(r.m), 13)}${esc(r.m.name||"?")}${r.m.isSolvent?" (solvent)":""}</td>
    <td class="num${r.a?"":" dim"}">${cell(r.a)}</td><td class="num${r.a?"":" dim"}">${relCell(r.a)}</td>
    <td class="num${r.b?"":" dim"}">${cell(r.b)}</td><td class="num${r.b?"":" dim"}">${relCell(r.b)}</td>
    <td class="num">${r.d==null?"":(r.d>0?"+":"")+fmt(r.d,2)}</td></tr>`).join("")}
  </tbody><tfoot><tr><td>Total</td><td class="num">${fmt(A.tw)} g</td><td class="num">abs ${fmt(A.abs,2)}%</td>
    <td class="num">${fmt(B.tw)} g</td><td class="num">abs ${fmt(B.abs,2)}%</td><td></td></tr></tfoot></table>
  <div class="legend">Differences: <i style="background:var(--hl4)"></i>only in B <i style="background:var(--hl2)"></i>only in A <i style="background:var(--hl3)"></i>changed — sorted by size of change; rel % compares per material (dilutions aggregated)</div>`;
  $("#cmpA").addEventListener("change", e => { sub.a = e.target.value; render(); });
  $("#cmpB").addEventListener("change", e => { sub.b = e.target.value; render(); });
  $("#btnCmpClose").addEventListener("click", () => { CSORT = null; VIEW.sub = sub.from || {type:"v", idx:f.versions.length-1}; render(); });
  c.querySelectorAll("[data-csort]").forEach(el => el.addEventListener("click", () => {
    const k = el.dataset.csort;
    if (CSORT.key === k) CSORT.dir *= -1; else CSORT = {key:k, dir:1};
    render();
  }));
  $("#cmpSortSel")?.addEventListener("change", e => { if (e.target.value){ CSORT = {key:e.target.value, dir:1}; render(); }});
}

/* ---------- formula import (photo-to-formula, phase 4) ---------- */
let IMPORTP = null;
function resolveImportLine(L){
  const m = (L.materialId && matById(L.materialId)) || DATA.materials.find(x => x.name === L.material) || null;
  const dil = L.dilutionPct ?? 100;
  const dilOwned = m ? (m.dilutions||[]).some(d => d.pct === dil) : true;
  return {m, dil, dilOwned};
}
function renderImport(){
  const c = $("#content");
  const p = IMPORTP;
  let tw = 0;
  const rows = p.lines.map(L => { const r = resolveImportLine(L); tw += L.weightG || 0; return {L, ...r}; });
  const newCount = rows.filter(r => !r.m).length, warnCount = rows.filter(r => r.m && !r.dilOwned).length;
  c.innerHTML = `<h2>Import formula — ${esc(p.name||"?")}</h2>
  <div class="metaLine">${esc(p.category||"Uncategorised")}${p.source?` · ${esc(p.source)}`:""}</div>
  <div class="panelBox"><h3>Check before confirming</h3>
    <div class="toolRow">Import as
      <select id="impTarget" style="min-width:18rem">
        <option value="">— a new formula —</option>
        ${[...DATA.formulas].sort((a,b)=>a.name.localeCompare(b.name)).map(x =>
          `<option value="${x.id}"${(p.targetFormula && x.name.toLowerCase() === String(p.targetFormula).toLowerCase()) ? " selected" : ""}>new version of: ${esc(x.name)} (now v${currentVersion(x)?currentVersion(x).v:0})</option>`).join("")}
      </select>
      <span class="hint">a new version keeps the existing variations, notes and history</span></div>
    <div><b>Total weight: ${fmt(tw)} g</b> <span class="hint">— a round number (100 / 1000) suggests a complete transcription</span></div>
    <div class="hint">${rows.length} lines · ${rows.length-newCount} matched · ${newCount} new (will be created as “to order”) · ${warnCount} with a dilution you don’t stock (⚠ convert in a next version)</div></div>
  <table class="lines"><thead><tr><th>Material</th><th class="num">Dilution</th><th class="num">Weight (g)</th><th>Status</th></tr></thead><tbody>
  ${rows.map(r => `<tr>
    <td>${r.m ? `${pyrIcon(r.m.pyramid, catColour(r.m), 13)}${esc(r.m.name)}` : esc(r.L.material)}</td>
    <td class="num">${fmtS(r.dil)}%${r.m && !r.dilOwned ? ' <span style="color:var(--amber)">⚠</span>' : ""}</td>
    <td class="num">${fmt(r.L.weightG||0)}</td>
    <td>${r.m ? (r.dilOwned ? '<span class="hint">matched</span>' : '<span style="color:var(--amber)">matched — dilution not owned</span>')
              : '<span class="badge" style="background:var(--amber-soft);color:var(--amber)">new · to order</span>'}${r.L.comment?` <span class="hint">${esc(r.L.comment)}</span>`:""}</td></tr>`).join("")}
  </tbody><tfoot><tr><td>Total</td><td></td><td class="num">${fmt(tw)}</td><td></td></tr></tfoot></table>
  ${p.notes ? `<div class="noteRead" style="margin:.6rem 0">${esc(p.notes)}</div>` : ""}
  <div class="toolRow" style="justify-content:flex-end"><button id="btnImpCancel">Cancel</button><button class="primary" id="btnImpOk">Confirm import</button></div>`;
  $("#btnImpOk").addEventListener("click", applyImport);
  $("#btnImpCancel").addEventListener("click", () => { IMPORTP = null; render(); });
}
function applyImport(){
  const p = IMPORTP;
  const targetId = $("#impTarget")?.value || "";
  const target = targetId ? DATA.formulas.find(x => x.id === targetId) : null;
  const oc = structuredClone(DATA.orderList);
  const createdIds = [], lines = [];
  for (const L of p.lines){
    let {m, dil} = resolveImportLine(L);
    if (!m){
      m = {id: uid("m-"), name: L.material, cas: L.cas || "", category: "Uncategorised", supplier: "", costPerGram: null,
        modified: now(), ifraLimit: null, inventory: "", pyramid: 5, isSolvent: false, description: "", wishlist: true,
        dilutions: [{pct: dil, isBase: true, date: today(), notes: "from import"}]};
      DATA.materials.push(m); createdIds.push(m.id);
      DATA.orderList.push({id: uid("o-"), materialId: m.id, name: m.name, note: `needed for ${p.name}`, price: "", added: today()});
    }
    lines.push({materialId: m.id, dilutionPct: dil, weightG: L.weightG || 0, remark: 1});
  }
  if (createdIds.length){ DATA.materials.sort((a,b) => a.name.localeCompare(b.name)); invalidateMats(); }
  if (target){   // add as a new version of an existing formula
    const clone = structuredClone(target);
    // provenance goes into the notes; the version label stays free for the user to choose
    const prov = `Imported ${today()}${p.name?` · source: ${p.name}`:""}${p.source?` · ${p.source}`:""}.`;
    const nv = {v: Math.max(...target.versions.map(x => x.v), 0) + 1, date: today(),
      name: p.versionName || "", notes: p.notes ? `${p.notes}\n\n${prov}` : prov, lines};
    target.versions.push(nv); target.frozenImport = false; target.modified = now();
    pushUndo(() => {
      DATA.orderList = oc;
      const i = DATA.formulas.findIndex(x => x.id === clone.id); if (i >= 0) DATA.formulas[i] = clone;
      DATA.materials = DATA.materials.filter(x => !createdIds.includes(x.id)); invalidateMats();
    });
    buildUsage(); markDirty(); IMPORTP = null;
    switchTab("F", target.id, {type:"v", idx: target.versions.length - 1});
    return;
  }
  let name = p.name || "Imported formula";
  while (DATA.formulas.some(x => x.name === name)) name += " (import)";
  const cat = p.category || "Uncategorised";
  if (!DATA.formulaCategories.includes(cat)) DATA.formulaCategories.push(cat);
  const f = {id: uid("f-"), name, category: cat, created: today(), modified: now(), frozenImport: false,
    versions: [{v: 1, date: today(), notes: p.notes || "", lines}], variations: []};
  DATA.formulas.push(f);
  pushUndo(() => {
    DATA.orderList = oc;
    DATA.formulas = DATA.formulas.filter(x => x.id !== f.id);
    DATA.materials = DATA.materials.filter(x => !createdIds.includes(x.id)); invalidateMats();
    if (VIEW.id === f.id){ VIEW.id = null; VIEW.sub = null; }
  });
  buildUsage(); markDirty(); IMPORTP = null;
  switchTab("F", f.id, {type:"v", idx:0});
}

function deliveredDialog(idx){
  const o = DATA.orderList[idx];
  const m = o.materialId ? matById(o.materialId) : DATA.materials.find(x => x.name.toLowerCase() === o.name.toLowerCase());
  const tracked = m ? stockCalc(m).tracked : false;

    const costPerGram = (dens) => {
      const am = amt.match(/([\d.,]+)\s*(g|gr|gram|ml)/i);
      if (!price || !am) return null;
      const val = parseNum(am[1]); if (!val) return null;

      return grams ? price / grams : null;

    if (m){
      const mc = structuredClone(m);
      pushUndo(() => { DATA.orderList = oc; const j = DATA.materials.findIndex(x => x.id === mc.id); if (j >= 0) DATA.materials[j] = mc; });

      if (cg) m.costPerGram = +cg.toFixed(4);
      m.purchaseDate = date; m.modified = now(); delete m.wishlist;
      const g = parseNum($("#dvG")?.value);

      DATA.orderList.splice(idx, 1);
      markDirty(); switchTab("M", m.id, null);
    } else {
      const cg = costPerGram(null);
      const nm = {id: uid("m-"), name: o.name, cas:"", category:"Uncategorised", supplier:"", costPerGram: cg ? +cg.toFixed(4) : null, modified: now(),
        ifraLimit:null, inventory: amt, purchaseDate: date, pyramid:5, isSolvent:false, description:"",
        dilutions:[{pct:100, isBase:true, date, notes:""}]};

        openDialog(`<h3 style="margin-top:0">Download the app</h3>
          <p>The downloaded <b>miFormulas.html</b> keeps your data in a file next to it, which needs <b>Chrome or Edge</b>; this browser cannot write to files, so the download would open read-only here.</p>
          <p>${SAFARI_MAC ? "On a Mac with Safari, <b>File \u203a Add to Dock</b> gives you the app in the Dock with automatic updates; your data then stays in the app's storage, so download a Backup now and then." : "To keep using this browser, stay on the site: your data lives in the browser here, and Backup downloads a copy."}</p>
          <p>Download anyway if you plan to open the file in Chrome or Edge.</p>`, "Download anyway", () => {
            const a = document.createElement("a"); a.href = "index.html"; a.download = "miFormulas.html"; document.body.appendChild(a); a.click(); a.remove();
            $("#landingHint").textContent = DL_MSG;
          }, "28rem");
        return;
      }
      $("#landingHint").textContent = DL_MSG;
    });
    };   // end demoStart
    if (RESTORE) offerReopen(() => demoStart("The remembered data file could not be opened; it was probably moved, renamed or deleted. " + BROWSER_MSG));
    else await demoStart(BROWSER_MSG);
    return;
  }
  const bak = await idb.get("dailyBak");
  if (bak && bak.json){
    LASTBAK = bak.date;
    const bs = $("#btnSnap");
    bs.style.display = ""; bs.textContent = `Restore daily snapshot (${bak.date})`;
    bs.addEventListener("click", () => {
      try{ DATA = migrate(JSON.parse(bak.json)); }
      catch(e){ alert("The snapshot could not be read."); return; }
      boot(); markDirty();
      $("#saveState").textContent = "Snapshot loaded — use Backup to write it to a file";
      $("#saveState").className = "dirty";
    });
  }
  if (FALLBACK){
    $("#landingHint").innerHTML = "This browser cannot write to files, so miFormulas.html is read-only here: it can show a data file but not save changes. Open this file in <b>Chrome or Edge</b> to keep your data in a file, or use <a href=\"https://miformulas.com\" target=\"_blank\" rel=\"noopener\">miformulas.com</a> in this browser (Safari on a Mac: File \u203a Add to Dock). Have a data file? Open data file\u2026 shows it and remembers it for next time.";
    const cached = await idb.get("cachedData");
    if (cached && cached.json){
      const b = $("#btnReopen");
      b.style.display = "";
      b.textContent = `Continue with data from ${new Date(cached.when).toLocaleString(LOCALE,{day:"2-digit",month:"2-digit",hour:"2-digit",minute:"2-digit"})}`;
      b.addEventListener("click", () => {
        try{ DATA = migrate(JSON.parse(cached.json)); }catch(e){ alert(CORRUPT_MSG); return; }
        boot();
        $("#saveState").textContent = "Cached copy — reload the file for the latest data"; });
    }
    return;
  }
  if (await tryRestore()){ boot(); return; }
  const FRESH_MSG = "You are running the app from your own computer. Keep miFormulas.html in a folder of its own, for instance Documents\\miFormulas, with your data file next to it and a subfolder \u201cbackups\u201d for Backup copies. Made a data file earlier? Use Open data file\u2026; the starter set would create a new one.";
  const GONE_MSG = "The remembered data file could not be opened; it was probably moved, renamed or deleted. Start with the starter set to create a new one, or open another data file.";
  function offerStarter(hint){   // no usable remembered file: the starter set creates one
  $("#landingHint").textContent = hint;
  const bsf = $("#btnStarter"); bsf.style.display = "";
  const NOFILE_MSG = "No data file was created, so nothing is saved. Start with the starter set to try again, or open an existing data file.";
  bsf.addEventListener("click", async () => {
    const d = await loadStarter(); if (!d) return;   // fetched first; the dialog button below gives the picker a fresh user gesture
    const dlg = $("#dlg");
    const onCancel = () => { $("#landingHint").textContent = NOFILE_MSG; };
    dlg.addEventListener("cancelled", onCancel, {once: true});
    openDialog(`<h3 style="margin-top:0">Where to keep your data file</h3>
      <p>The starter set will be saved as your data file, <b>miformulas-data.json</b>.</p>
      <p>In the next window, go to the folder where miFormulas.html is (for instance <b>Documents\\miFormulas</b>) and keep that file name. The app remembers the file and saves to it automatically; make a subfolder <b>backups</b> there for Backup copies.</p>`,
      "Choose location\u2026", () => {
        dlg.removeEventListener("cancelled", onCancel);
        (async () => {
          let h = null;
          try{ h = await window.showSaveFilePicker({id:"miformulas-data", startIn:"documents", suggestedName:"miformulas-data.json", types:[{description:"miFormulas data", accept:{"application/json":[".json"]}}]}); }
          catch(e){ /* cancelled */ }
          if (!h){ $("#landingHint").textContent = NOFILE_MSG; return; }
          DATA = d; HANDLE = h; await idb.set("fileHandle", h);
          boot(); saveData();
        })();
      }, "28rem");
  });
  }   // end offerStarter
  if (RESTORE) offerReopen(() => offerStarter(GONE_MSG)); else offerStarter(FRESH_MSG);
  }catch(e){ try{ console.warn("miFormulas: start-up stopped early", e); }catch(_){} /* sandboxed viewers: manual file open still works */ }
})();
</script>
</body>
</html>
