<style>
:root{
  --ground:#FBFCFD; --surface:#FFFFFF; --panel:#EDF1F5; --ink:#212A33; --muted:#6C7A88;
  --line:#DCE3EA; --accent:#A2277E; --accent-ink:#7E1B62; --accent-soft:#F9E3F1; --amber:#DD8500; --amber-soft:#FFEFD2;
  --danger:#C42F1F; --frozen:#3E7CB8; --frozen-soft:#E1EEF9;
  --hl0:#3B6FA0; --hl2:#C04A32; --hl3:#C9A227; --hl4:#4C8A46;
  --accent-deep:#3E1146; --header-ink:#FBEFDD; --header-mute:#E3B9D6; --zebra:rgba(62,124,184,.05);
  --bench:#E2F0F4; --bench2:#DCE7F5; --bench-line:#B9D5DE;
  --header-grad:linear-gradient(100deg,#3E1146,#8E2277 48%,#D4600F);
  --btn-grad:linear-gradient(115deg,#A2277E,#D4600F);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --ground:#1C1122; --surface:#2A1833; --panel:#241430; --ink:#F2E6F2; --muted:#B292BC;
    --line:#453050; --accent:#E667B0; --accent-ink:#F08CC5; --accent-soft:#3A1F38; --amber:#FFB454; --amber-soft:#3B2A12;
    --danger:#F08A75; --frozen:#7FA9D9; --frozen-soft:#1E2B3B;
    --accent-deep:#220A2B; --header-ink:#F7E9F5; --header-mute:#C79ABB; --zebra:rgba(230,103,176,.07);
    --bench:#122630; --bench2:#141F33; --bench-line:#2C4654;
    --header-grad:linear-gradient(100deg,#2A0C33,#701B5C 48%,#B34A0C);
    --btn-grad:linear-gradient(115deg,#C0388F,#C65E12);
  }
}
:root[data-theme="dark"]{
  --ground:#1C1122; --surface:#2A1833; --panel:#241430; --ink:#F2E6F2; --muted:#B292BC;
  --line:#453050; --accent:#E667B0; --accent-ink:#F08CC5; --accent-soft:#3A1F38; --amber:#FFB454; --amber-soft:#3B2A12;
  --danger:#F08A75; --frozen:#7FA9D9; --frozen-soft:#1E2B3B;
  --accent-deep:#220A2B; --header-ink:#F7E9F5; --header-mute:#C79ABB; --zebra:rgba(230,103,176,.07);
  --bench:#122630; --bench2:#141F33; --bench-line:#2C4654;
  --header-grad:linear-gradient(100deg,#2A0C33,#701B5C 48%,#B34A0C);
  --btn-grad:linear-gradient(115deg,#C0388F,#C65E12);
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--ground);color:var(--ink);font:15px/1.5 "Segoe UI",system-ui,-apple-system,sans-serif;display:flex;flex-direction:column}
button{font:inherit;color:inherit;background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:.35rem .8rem;cursor:pointer}
button:hover{border-color:var(--accent)}
button.primary{background:var(--btn-grad);border-color:transparent;color:#fff}
button.primary:hover{filter:brightness(1.1)}
button.small{padding:.15rem .5rem;font-size:.85rem}
a.small{font-size:.85rem;color:var(--accent-ink);text-decoration:underline}
button.ghost{border:none;background:none;color:var(--muted)}
button.ghost:hover{color:var(--danger)}

<script>
"use strict";
/* ---------- state ---------- */
let DATA = null, HANDLE = null, DIRTY = false, FALLBACK = !window.showOpenFilePicker;
let VIEW = {tab:"F", id:null, sub:null};   // sub = {type:'v'|'var', idx}
let USAGE = {};   // materialId -> [{fid, name, where}]
const $ = s => document.querySelector(s);
const esc = s => (s??"").toString().replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const uid = p => p + Math.random().toString(36).slice(2,8);
let LOCALE = undefined;   // number format for display; undefined = browser default, set in Settings
const fmt = (x,d=3) => x==null||isNaN(x) ? "–" : x.toLocaleString(LOCALE,{minimumFractionDigits:d,maximumFractionDigits:d});
const fmtS = (x,d=2) => x==null||isNaN(x) ? "–" : x.toLocaleString(LOCALE,{minimumFractionDigits:0,maximumFractionDigits:d});
const parseNum = s => {
  if (typeof s === "number") return s;
  s = (s||"").toString().trim();
  if (s.includes(",")) s = s.replace(/\./g,"").replace(",",".");          // Belgian: 1.234,56
  else if ((s.match(/\./g)||[]).length > 1) s = s.replace(/\./g,"");      // 1.234.567 → thousands
  /* a single dot without comma is a decimal point (phone keyboards, English habit): 2.5 stays 2.5 */
  const v = parseFloat(s); return isNaN(v) ? null : v;
};
const pad2 = n => String(n).padStart(2,"0");
const today = () => { const d = new Date(); return `${d.getFullYear()}-${pad2(d.getMonth()+1)}-${pad2(d.getDate())}`; };   // local date
const isMobile = () => window.matchMedia("(max-width:700px)").matches;
const PYR = ["Top","Top-heart","Heart","Heart-base","Base","?"];

/* ---------- persistence ---------- */
const idb = {
  // Fully defensive: sandboxed webviews (e.g. some cloud-storage file viewers) block IndexedDB.
  db: null,
  open(){ return new Promise(res => {
    let r;
    try { r = window.indexedDB.open("miformulas", 1); } catch(e){ res(); return; }
    if (!r){ res(); return; }

const SCHEMA = 1;

function migrate(d){

  d.orderList ||= [];

    for (const va of f.variations || [])   // a non-frozen variation with own lines (old detach experiments) becomes frozen
      if (va.lines && !va.frozen) va.frozen = true;
    for (const v of f.versions || [])      // Formulair imports are read-only
      if (v.sourceName && v.imported === undefined) v.imported = true;
  }
  for (const m of d.materials || []) delete m._descHit;   // transient search flag that once leaked into the file
  for (const o of d.orderList){            // old free-text amounts → number + unit

      const am = o.amount.match(/([\d.,]+)\s*(g|gr|gram|ml)?/i);
      o.unit = am && /ml/i.test(am[2]||"") ? "ml" : (o.unit || "g");
      o.amount = am ? parseNum(am[1]) : null;
    }

  if (d.meta.schema > SCHEMA) alert(`This data file was written by a newer miFormulas version (schema ${d.meta.schema}). Update the app before editing.`);
  return d;
}

function calc(lines){

  let tw = 0, tc = 0, content = 0;
  const rows = (lines||[]).map(l => {
    const m = matById(l.materialId) || {};
    const w = l.weightG || 0, dil = l.dilutionPct ?? 100;
    const cost = w * (m.costPerGram||0) * dil/100;

let SORT = {key:"orig", dir:1};

    name:(a,b)=>(a.m.name||"").localeCompare(b.m.name||""),
    dil:(a,b)=>a.dil-b.dil,

    const descHits = new Set();   // kept outside the data — never written to the file
    for (const m of DATA.materials){
      if (q){
        const hit = m.name.toLowerCase().includes(q) || (m.cas||"").toLowerCase().includes(q)
          || (m.supplier||"").toLowerCase().includes(q) || (m.starter && "starter set".includes(q));
        const descHit = !hit && q.length >= 3 && (m.description||"").toLowerCase().includes(q);
        if (!hit && !descHit) continue;
        if (descHit) descHits.add(m.id);
      }
      (groups[m.category||"Uncategorised"] ||= []).push(m);
    }
    if (descHits.size) html += `<div class="hint" style="padding:.5rem .8rem 0">${descHits.size} match(es) in descriptions ✎</div>`;
    for (const cat of Object.keys(groups).sort((a,b)=>a.localeCompare(b))){
      html += `<div class="cat"><span class="catdot" style="background:${catColourByName(cat)}"></span>${esc(cat)} <span class="hint" style="font-weight:400">${groups[cat].length}</span></div>`;
      for (const m of groups[cat])
        html += `<div class="item${m.id===VIEW.id?" sel":""}" data-id="${m.id}"><span${m.wishlist?' style="color:var(--amber);font-weight:600"':""}>${pyrIcon(m.pyramid, catColour(m), 12)}${esc(m.name)}${m.wishlist?" 🛒":""}${descHits.has(m.id)?' <span title="match in description" style="color:var(--frozen)">✎</span>':""}</span><span class="sub">${m.wishlist?'<b style="color:var(--amber)">to order</b>':(m.inventory?esc(m.inventory):(m.starter?'<span title="part of the starter set">starter</span>':""))}</span></div>`;
    }
  }
  if (VIEW.tab === "T"){
    html = "";
    for (const o of DATA.orderList || []){
      if (q && !o.name.toLowerCase().includes(q)) continue;
      html += `<div class="item" data-id="${o.id}"><span>${esc(o.name)}</span><span class="sub">${esc(o.added||"")}</span></div>`;
    }
    if (!html) html = `<div class="hint" style="padding:.8rem">Nothing to order.</div>`;
  }
  $("#list").innerHTML = html;
}
$("#list").addEventListener("click", e => {
  const it = e.target.closest(".item"); if (!it) return;
  HOMEVIEW = false;
  if (VIEW.tab === "T"){
    const o = (DATA.orderList||[]).find(x => x.id === it.dataset.id);
    if (o && o.materialId) switchTab("M", o.materialId, null);
    return;
  }
  VIEW.id = it.dataset.id; VIEW.sub = null; render();
});
let LAST = {F:{id:null,sub:null}, M:{id:null,sub:null}, T:{id:null,sub:null}};
let HOMEVIEW = false;   // on narrow screens the welcome screen needs the detail pane
function switchTab(t, id, sub){
  HOMEVIEW = false;
  LAST[VIEW.tab] = {id:VIEW.id, sub:VIEW.sub};
  VIEW = {tab:t, id: id !== undefined ? id : LAST[t].id, sub: sub !== undefined ? sub : LAST[t].sub};
  setTabs(); render();
}
$("#tabF").addEventListener("click", () => switchTab("F"));
$("#tabM").addEventListener("click", () => switchTab("M"));
$("#tabT").addEventListener("click", () => switchTab("T"));
function setTabs(){ $("#tabF").classList.toggle("active", VIEW.tab==="F"); $("#tabM").classList.toggle("active", VIEW.tab==="M"); $("#tabT").classList.toggle("active", VIEW.tab==="T"); }
$("#searchBox").addEventListener("input", renderSidebar);

/* ---------- formula view ---------- */
function renderFormula(f){
  const c = $("#content");
  let sub = VIEW.sub || {type:"v", idx: f.versions.length-1};
  const stamp = f.id + "|" + sub.type + "|" + sub.idx;
  if (stamp !== renderFormula._last){ renderFormula._last = stamp; NOTESOPEN = null; }   // new formula/version: follow content again
  if (sub.type === "cmp"){ renderCompare(f, sub); return; }
  if (sub.type==="v" && !f.versions[sub.idx]) sub = {type:"v", idx:f.versions.length-1};
  VIEW.sub = sub;
  const isVar = sub.type === "var";
  const item = isVar ? f.variations[sub.idx] : f.versions[sub.idx];
  if (!item){
    c.innerHTML = `<h2>${esc(f.name)}</h2><p class="hint">Empty formula — add a version.</p>
      <div class="toolRow"><button class="small" id="btnNewV">+ New version</button></div>`;
    $("#btnNewV").addEventListener("click", () => newVersion(f, null));
    return;
  }
  const frozen = isVar ? !!item.frozen : (item.frozen ?? f.frozenImport) || (sub.idx < f.versions.length-1) || item.imported;
  const editable = !frozen && !isVar && !readOnly();
  const liveVar = isVar && !item.frozen && !readOnly();
  const lines = isVar ? variationLines(f, item) : item.lines;
  const K = calc(lines);
  let h = `<h2>${esc(f.name)}${item ? `<button id="btnBenchToggle" class="benchBtn">${sub.bench?"Table view":"Bench view"}</button>` : ""}</h2>
  <div class="metaLine"><span>${esc(f.category||"")}${f.created?" · since "+f.created:""}${item.sourceName?` · imported as “${esc(item.sourceName)}”`:""}${f.starter?' · <span class="badge" style="background:var(--frozen-soft);color:var(--frozen)" title="Came with the app. Edit or delete it like any other formula.">starter set</span>':""}</span>
    ${frozen?`<span class="badge" title="Read-only snapshot">frozen${isVar && item.frozenFromName ? ` · from ${esc(item.frozenFromName)}` : ""}</span>`:""}
    <span class="actions">
      <button id="btnRenameF" title="Rename this formula">Rename</button>
      <button id="btnCopyF" title="The selected version becomes v1 of a new formula">Copy to new formula</button>
      <button id="btnCatF" title="Move to another category">Change category</button><i></i>
      <button id="btnDelF" class="danger" title="Delete the whole formula (undo possible)">Delete formula</button></span></div>
  <div class="fhead">${pyrPyramid(K)}
  ${pyrBar(K)}
  <div class="chipRow"><label class="hint">Version</label>
    <select id="verSel">${isVar?'<option value="" selected hidden>— viewing a variation —</option>':""}${f.versions.map((v,i) =>
      `<option value="${i}"${!isVar&&i===sub.idx?" selected":""}>${esc(vName(v))} (${v.date||"?"})${v.sourceName?` — ${esc(v.sourceName)}`:""}${v.imported?" 🔒":""}</option>`).join("")}</select>
    ${!isVar ? '<button class="small" id="btnNameV" title="Name this version">✎</button>' : ""}
    <button class="small" id="btnNewV">+ New version</button>
    ${f.versions.length + f.variations.length >= 2 ? '<button class="small" id="btnCmp">Compare…</button>' : ""}
    ${!isVar && item && !item.imported ? '<span class="actions"><button id="btnDelV" class="danger">Delete version</button></span>' : ""}</div>
  <div class="chipRow"><label class="hint">Variations</label>${f.variations.map((va,i) =>
    `<span class="chip var${isVar&&i===sub.idx?" sel":""}${va.frozen?" frozen":""}" data-va="${i}" title="${esc(va.sourceName||"")}${va.frozenFromName?`frozen from ${esc(va.frozenFromName)}`:""}${va.date?" · "+va.date:""}">${esc(va.label)}${va.frozen?" ⛄":""}</span>`).join("")}
    <button class="small" id="btnNewVar">+ New variation</button>
    ${isVar && !item.frozen ? '<button class="small" id="btnFreeze" title="Fix the amounts as they are now; stops following the formula">Freeze</button>':""}
    ${isVar ? '<span class="actions"><button id="btnDelVar" class="danger">Delete variation</button></span>':""}</div></div>`;
  if (item){
    if (isVar && !item.frozen){
      const bv = baseVersionOf(f, item);
      h += `<div class="toolRow"><span class="hint">Live variation — follows</span>
        <select id="varBase">
          <option value=""${item.baseV == null ? " selected" : ""}>latest version (now ${esc(vName(currentVersion(f)))})</option>
          ${f.versions.map(v => `<option value="${v.v}"${item.baseV === v.v ? " selected" : ""}>${esc(vName(v))} (${v.date||"?"})</option>`).join("")}
        </select>
        <span class="hint">now computed from ${esc(vName(bv))} · dilution changes preserve rel%</span></div>`;
    }
    if (sub.bench){ h += renderBench(f, item, lines, K); } else {
    const seenD = new Set(), dupNames = new Set();
    for (const l of lines || []){ const k = l.materialId + "|" + (l.dilutionPct ?? 100);
      if (seenD.has(k)) dupNames.add((matById(l.materialId)||{}).name || "?"); seenD.add(k); }
    if (dupNames.size) h += `<div class="hint" style="color:var(--amber);font-weight:600">⚠ Duplicate lines (same material and dilution twice): ${[...dupNames].map(esc).join(", ")}</div>`;
    h += renderLines(f, item, lines, K, editable, isVar);
    if (lines.length){   // everything that acts on the ticked lines lives here, in one place
      h += `<div class="tickBar"><span class="hint">Ticked lines:</span>
        <span class="tickGrp"><span class="hint">mark</span>
          <span class="swatch" data-mark="2" style="background:var(--hl2)" title="Red"></span>
          <span class="swatch" data-mark="4" style="background:var(--hl4)" title="Green"></span>
          <span class="swatch" data-mark="0" style="background:var(--hl0)" title="Blue"></span>
          <span class="swatch" data-mark="3" style="background:var(--hl3)" title="Yellow"></span>
          <button class="small" data-mark="1">Unmark</button>
          <button class="small ghost" id="btnClearMarks" title="Remove every mark in this ${isVar?"variation":"version"}">clear all</button></span>
        ${editable||liveVar ? `<span class="tickGrp"><span class="hint">dilution</span>
          <button class="small" id="btnDilDown" title="Next lower % — rel% preserved, ethanol exchanged">Lower</button>
          <button class="small" id="btnDilUp" title="Next higher % — rel% preserved, ethanol exchanged">Higher</button></span>
        <span class="tickGrp"><button class="small" id="btnPredil" title="Bundle the ticked lines into a separate, weighable mix (creates a new version)">Create predilution…</button></span>` : ""}
      </div>`;
    }
    const content = K.rows.reduce((s,r) => s + r.cont, 0);
    const ethIdx = lines.findIndex(l => isEthanol(matById(l.materialId)));
    const wOther = K.totalW - (ethIdx >= 0 ? (lines[ethIdx].weightG||0) : 0);
    const maxAbs = wOther > 0 ? content/wOther*100 : 0;
    h += `<details class="panelBox" id="scaleBox"${SCALEOPEN?" open":""}>
      <summary style="cursor:pointer;font-size:.8rem;text-transform:uppercase;letter-spacing:.07em;font-weight:600;color:var(--accent-ink)">Batch scaling</summary>
      <div class="scaleGrid" style="margin-top:.6rem">
      ${editable||liveVar?`<span>Apply factor</span><span><input type="text" id="scaleF" inputmode="decimal" placeholder="2,500"> ×</span>
        <button class="small" id="btnApplyFactor">Apply</button><span></span>`:""}
      <span>Target total</span><span><input type="text" id="scaleW" inputmode="decimal" value="${fmt(K.totalW)}"> g</span>
      ${editable||liveVar?'<button class="small" id="btnApplyScale">Apply</button>':"<span></span>"}<span></span>
      ${editable?`<span>Set EtOH for target abs %</span><span><input type="text" id="targetAbs" inputmode="decimal" value="${fmt(K.totalAbsPct,2)}"> %</span>
        <button class="small" id="btnSetAbs">Apply</button><span class="hint">max ${fmt(maxAbs,2)} % (EtOH at 0 g)</span>`:""}
    </div>
    ${!(editable||liveVar) ? `<div class="hint" style="margin-top:.4rem">Read-only entry — the target is used for the printed weighing sheet.</div>` : ""}
    </details>`;
    const hasNotes = !!(item.notes || "").trim();
    h += `<details class="panelBox" id="notesBox"${(NOTESOPEN ?? hasNotes) ? " open" : ""}>
      <summary style="cursor:pointer;font-size:.8rem;text-transform:uppercase;letter-spacing:.07em;font-weight:600;color:var(--accent-ink)">Notes${hasNotes ? "" : ' <span class="hint" style="font-weight:400;text-transform:none;letter-spacing:0">— empty</span>'}</summary>
      <textarea class="notes" id="notesEd">${esc(item.notes || "")}</textarea></details>`;
    const trials = item.trials || [];
    h += `<div class="panelBox"><h3>Trial log</h3>
      ${trials.map((t,i)=>`<div class="trial"><span class="hint">${esc(t.date||"")}</span><span class="txt">${esc(t.text)}</span><button class="ghost small" data-deltrial="${i}" title="Remove entry">✕</button></div>`).join("")}
      <div class="toolRow"><input type="date" id="trialDate" value="${today()}">
        <input id="trialText" placeholder="Smelling note, maceration observation…" style="flex:1;min-width:14rem">
        <button class="small" id="btnAddTrial">Add</button></div></div>`;
    h += catPanel(K);
    h += ifraPanel(f, item, K);
    h += `<div class="toolRow" style="margin-top:.6rem">${item.prepared
      ? `<span class="badge" style="background:var(--accent-soft);color:var(--accent-ink)">prepared ${item.prepared.date} · ${item.prepared.materials} tracked material(s) · −${fmt(item.prepared.deductedG)} g</span>`
      : `<button class="small" id="btnPrep">Mark as prepared</button> <span class="hint">deducts base-dilution lines from tracked stock — once per version/variation</span>`}</div>`;
    }
  }
  c.innerHTML = h;
  $("#btnBenchToggle")?.addEventListener("click", () => {
    if (!sub.bench && item && !item.bench){   // first bench open: create the 5 default groups, explicitly saved
      snapF(f);
      item.bench = {groups: Array.from({length:5}, (_,i) => ({id: uid("g"), title: "Group " + (i+1), keys: []}))};
      markDirty();
    }
    VIEW.sub = {...sub, bench: !sub.bench}; render();
  });
  if (item && sub.bench) bindBench(f, item, lines, K);
  $("#btnRenameF")?.addEventListener("click", () => {
    const n = prompt("Formula name:", f.name); if (!n || n.trim() === f.name) return;
    snapF(f); f.name = n.trim(); buildUsage(); markDirty(); render();
  });
  $("#btnCopyF")?.addEventListener("click", () => copyFormula(f, sub));
  $("#btnCatF")?.addEventListener("click", () => {
    openDialog(`<h3 style="margin:0 0 .3rem">Category — ${esc(f.name)}</h3>
      <div class="toolRow" style="margin:.7rem 0">${catPickerHtml(f.category, "14rem")}</div>`, "Apply", () => {
      const cat = $("#catSel").value;
      if (!cat || cat === f.category) return;
      snapF(f); f.category = cat; rememberCat(cat);
      markDirty(); render();
    }, "22rem");
    bindNewCat();
  });
  $("#btnDelF")?.addEventListener("click", () => {
    if (!confirm(`Delete formula “${f.name}” with ${f.versions.length} version(s) and ${f.variations.length} variation(s)?\n\nUndo (Ctrl+Z) can bring it back during this session.`)) return;
    const idx = DATA.formulas.findIndex(x => x.id === f.id), copy = f;
    pushUndo(() => DATA.formulas.splice(idx, 0, copy));
    DATA.formulas.splice(idx, 1);
    VIEW.id = null; VIEW.sub = null; buildUsage(); markDirty(); render();
  });
  $("#verSel")?.addEventListener("change", e => { if (e.target.value !== ""){ VIEW.sub = {type:"v", idx:+e.target.value}; render(); }});
  $("#btnNameV")?.addEventListener("click", () => {
    const dlg = $("#dlg");
    dlg.innerHTML = `<div style="padding:1.2rem 1.4rem;min-width:24rem">
      <h3 style="margin:0 0 .3rem">Name version v${item.v}</h3>
      <div class="hint" style="margin-bottom:.7rem">Shown after the version number, e.g. “v${item.v} met predil (${item.date||today()})”.</div>
      <input id="vnName" value="${esc(item.name||"")}" placeholder="short label (empty = none)" style="width:100%">
      ${item.sourceName ? `<label style="display:block;margin-top:.8rem"><input type="checkbox" id="vnSrc" checked>
        keep the import reference “${esc(item.sourceName)}” in the list</label>` : ""}
      <div class="toolRow" style="justify-content:flex-end;margin-top:.9rem"><button id="dlgCancel">Cancel</button><button class="primary" id="dlgOk">Apply</button></div></div>`;
    dlg.showModal();
    $("#dlgCancel").addEventListener("click", () => dlg.close());
    $("#dlgOk").addEventListener("click", () => {
      const n = $("#vnName").value.trim(), keep = $("#vnSrc") ? $("#vnSrc").checked : true;
      dlg.close(); snapF(f);
      item.name = n;
      if (item.sourceName && !keep){
        item.notes = (item.notes ? item.notes + "\n\n" : "") + `Imported as “${item.sourceName}”.`;
        delete item.sourceName;
      }
      markDirty(); render();
    });
  });
  c.querySelectorAll("[data-sort]").forEach(el => el.addEventListener("click", () => {
    const k = el.dataset.sort;
    if (SORT.key === k) SORT.dir *= -1; else SORT = {key:k, dir:1};
    render();
  }));
  $("#sortSel")?.addEventListener("change", e => { if (e.target.value){ SORT = {key:e.target.value, dir:1}; render(); }});
  c.querySelectorAll(".matlink").forEach(a => a.addEventListener("click", () => {
    if (!a.dataset.mat) return;
    switchTab("M", a.dataset.mat, null);
  }));
  $("#btnDelV")?.addEventListener("click", () => {
    const pinned = f.variations.filter(va => !va.frozen && va.baseV === item.v).map(va => va.label);
    if (!confirm(`Delete ${vName(item)}?${pinned.length ? `\n\nLive variation(s) «${pinned.join("», «")}» follow this version; they will follow the latest version instead.` : ""}`)) return;
    snapF(f); f.versions.splice(sub.idx,1);
    for (const va of f.variations) if (va.baseV === item.v) delete va.baseV;
    VIEW.sub = {type:"v", idx: f.versions.length-1}; markDirty(); render();
  });
  if (item && !sub.bench){
    let lastCb = null;
    const cbs = [...c.querySelectorAll("input.selCb")];   // DOM order = displayed (sorted) order
    cbs.forEach((cb, pos) => cb.addEventListener("click", e => {
      if (e.shiftKey && lastCb !== null){
        const [a,b] = [Math.min(lastCb,pos), Math.max(lastCb,pos)];
        for (let j = a; j <= b; j++) cbs[j].checked = cb.checked;
      }
      lastCb = pos;
    }));
    const liveMarks = isVar && !item.frozen && !item.lines;   // marks live on the variation, not on the base version
    c.querySelectorAll("[data-mark]").forEach(b => b.addEventListener("click", () => {
      const sel = [...c.querySelectorAll("input.selCb:checked")].map(x => +x.dataset.i);
      if (!sel.length){ alert("Tick one or more lines first (checkboxes on the left)."); return; }
      snapF(f);
      const code = +b.dataset.mark;
      if (liveMarks){ item.remarks ||= {}; sel.forEach(i => { if (code === 1) delete item.remarks[i]; else item.remarks[i] = code; }); }
      else sel.forEach(i => item.lines[i].remark = code);
      markDirty(); render();
    }));
    $("#btnClearMarks")?.addEventListener("click", () => {
      snapF(f);
      if (liveMarks) delete item.remarks;
      else item.lines.forEach(l => l.remark = 1);
      markDirty(); render();
    });
  }
  c.querySelectorAll("[data-va]").forEach(el => el.addEventListener("click", ()=>{ VIEW.sub={type:"var",idx:+el.dataset.va}; render(); }));
  $("#btnNewV")?.addEventListener("click", ()=> newVersion(f, sub.type==="v"?sub.idx:null));
  $("#btnNewVar")?.addEventListener("click", ()=> newVariation(f, sub));
  $("#varBase")?.addEventListener("change", e => {
    snapF(f);
    if (e.target.value === "") delete item.baseV; else item.baseV = +e.target.value;
    markDirty(); render();
  });
  $("#btnFreeze")?.addEventListener("click", ()=>{
    const bv = baseVersionOf(f, item);
    if (!confirm(`Freeze variation «${item.label}» as it is now?\n\nIt keeps the amounts computed from ${vName(bv)} and no longer follows the formula.`)) return;
    snapF(f);
    item.lines = variationLines(f, item);
    item.frozenFrom = bv ? bv.v : null;            // remember which version it was frozen from
    item.frozenFromName = bv ? vName(bv) : "";
    item.frozen = true; item.date = today();
    markDirty(); render();
  });
  $("#btnDelVar")?.addEventListener("click", ()=>{ if(confirm(`Delete variation «${item.label}»?`)){ snapF(f); f.variations.splice(sub.idx,1); VIEW.sub=null; markDirty(); render(); }});
  $("#btnPrint")?.addEventListener("click", ()=> printSheet(f, item, lines, parseNum($("#scaleW")?.value)));
  $("#btnPrep")?.addEventListener("click", ()=> markPrepared(f, item, lines));
  $("#btnSheet")?.addEventListener("click", ()=> formulaSheetPrint(f, item, lines, K));
  $("#btnCsv")?.addEventListener("click", ()=> csvDownload(f, item, lines, K));
  $("#ifraDose")?.addEventListener("change", e => { IDOSE = parseNum(e.target.value); IFRAOPEN = true; render(); });
  $("#ifraBox")?.addEventListener("toggle", e => { IFRAOPEN = e.target.open; });
  $("#scaleBox")?.addEventListener("toggle", e => { SCALEOPEN = e.target.open; });
  $("#catsBox")?.addEventListener("toggle", e => { CATSOPEN = e.target.open; });
  $("#notesBox")?.addEventListener("toggle", e => { NOTESOPEN = e.target.open; });
  $("#btnApplyScale")?.addEventListener("click", ()=>{
    const t = parseNum($("#scaleW").value); if(!t || !K.totalW) return;
    snapF(f);
    if (isVar && !item.frozen){ item.targetWeightG = t; }
    else { const k = t / K.totalW; item.lines.forEach(l => l.weightG = (l.weightG||0)*k); }
    markDirty(); render();
  });
  $("#notesEd")?.addEventListener("change", e => { snapF(f); item.notes = e.target.value; markDirty(); });
  $("#btnAddTrial")?.addEventListener("click", () => {
    const txt = $("#trialText").value.trim(); if (!txt){ alert("Write a trial note first."); return; }
    snapF(f); (item.trials ||= []).push({date: $("#trialDate").value || today(), text: txt});
    markDirty(); render();
  });
  c.querySelectorAll("[data-deltrial]").forEach(b => b.addEventListener("click", () => {
    snapF(f); item.trials.splice(+b.dataset.deltrial, 1); markDirty(); render();
  }));
  $("#btnCmp")?.addEventListener("click", () => {
    const opts = cmpOptions(f);
    const cur = isVar ? "x"+sub.idx : "v"+sub.idx;
    let prev = !isVar && sub.idx > 0 ? "v"+(sub.idx-1) : opts.find(o => o.key !== cur)?.key;
    CSORT = mapSortToCmp();
    VIEW.sub = {type:"cmp", a: prev || cur, b: cur, from: {type: sub.type, idx: sub.idx}}; render();
  });
  $("#btnPredil")?.addEventListener("click", () => createPredilution(f, sub, item, lines));
  $("#btnDilDown")?.addEventListener("click", () => bulkDilShift(f, item, -1));
  $("#btnDilUp")?.addEventListener("click", () => bulkDilShift(f, item, +1));
  $("#btnApplyFactor")?.addEventListener("click", () => {
    const k = parseNum($("#scaleF").value);
    if (!k || k <= 0){ alert("Enter a factor above 0, e.g. 2,500."); return; }
    snapF(f);
    if (isVar && !item.frozen){ item.targetWeightG = K.totalW * k; }
    else { item.lines.forEach(l => l.weightG = (l.weightG||0) * k); }
    markDirty(); render();
  });
  $("#btnSetAbs")?.addEventListener("click", () => {
    const p = parseNum($("#targetAbs").value);
    if (!p || p <= 0){ alert("Enter a target abs % above 0."); return; }
    const content = K.rows.reduce((s,r) => s + r.cont, 0);
    const eIdx = item.lines.findIndex(l => isEthanol(matById(l.materialId)));
    const wOther = K.totalW - (eIdx >= 0 ? (item.lines[eIdx].weightG||0) : 0);
    const maxAbs = wOther > 0 ? content/wOther*100 : 0;
    if (p > maxAbs + 1e-9){ alert(`Not possible: maximum abs % is ${fmt(maxAbs,2)} % (EtOH at 0 g). Target ${fmt(p,2)} % would require negative ethanol.`); return; }
    const wEth = content*100/p - wOther;
    snapF(f);
    if (eIdx >= 0) item.lines[eIdx].weightG = wEth;

    <div class="fieldGrid">

    const pf = {id: uid("f-"), name, category: "Prediluties", created: today(), modified: now(), frozenImport: false,
      versions: [{v: 1, frozen: true, date: today(),
        notes: `Predilution for ${f.name} ${isVarView?`variation «${item.label}» (base v${cur.v})`:`v${cur.v}`} · factor ×${k} · total ${(+Wp.toFixed(3))} g · ${conc.toFixed(2)}% aromatic`,
        lines: picks.map(l => ({materialId: l.materialId, dilutionPct: l.dilutionPct??100, weightG: l.weightG*k, remark: 1}))}],
      variations: []};
    const idxSet = new Set(pickIdx);
    const newLines = cur.lines.filter((l,i) => !idxSet.has(i)).map(l => ({...l}));
    newLines.push({materialId: pm.id, dilutionPct: conc, weightG: baseSumW, remark: 1});
    const nv = {v: Math.max(...f.versions.map(x => x.v)) + 1, date: today(),
      notes: `Predilution «${name}» replaces ${pickIdx.length} lines of v${cur.v}${isVarView?` (composition per variation «${item.label}»)`:""}.`, lines: newLines};
    DATA.materials.push(pm); DATA.materials.sort((a,b) => a.name.localeCompare(b.name)); invalidateMats();
    if (!DATA.formulaCategories.includes("Prediluties")) DATA.formulaCategories.push("Prediluties");
    DATA.formulas.push(pf);
    f.versions.push(nv); f.frozenImport = false; f.modified = now();
    pushUndo(() => {
      const i = DATA.formulas.findIndex(x => x.id === f.id); if (i >= 0) DATA.formulas[i] = fClone;
      DATA.formulas = DATA.formulas.filter(x => x.id !== pf.id);
      DATA.materials = DATA.materials.filter(x => x.id !== pm.id); invalidateMats();
      if (VIEW.id === pf.id){ VIEW.id = null; VIEW.sub = null; }
    });
    buildUsage(); markDirty();
    if (sub.type !== "var") VIEW.sub = {type: "v", idx: f.versions.length - 1};
    render();
  });
}
function newVersion(f, fromIdx){
  snapF(f);
  const src = f.versions[fromIdx ?? f.versions.length-1];
  const v = {v: f.versions.length ? Math.max(...f.versions.map(x=>x.v))+1 : 1, date: today(), notes:"",
    lines: src ? src.lines.map(l => ({...l})) : []};
  f.versions.push(v); f.frozenImport = false;
  VIEW.sub = {type:"v", idx: f.versions.length-1};
  markDirty(); render();
}
function newVariation(f, sub){
  const viewed = sub && sub.type === "v" ? f.versions[sub.idx] : null;
  const latest = currentVersion(f);
  const onOlder = viewed && latest && viewed.v !== latest.v;
  openDialog(`<h3 style="margin:0 0 .3rem">New variation — ${esc(f.name)}</h3>
    <div class="hint" style="margin-bottom:.7rem">Same recipe in another presentation: other dilutions, another batch size. It follows the formula live until you freeze it.</div>
    <div class="fieldGrid">
      <label>Label</label><input id="nvLabel" placeholder="e.g. 20%, soap, 44gr" style="min-width:14rem">
      <label>Target total</label><span><input id="nvTarget" inputmode="decimal" placeholder="same as base" style="width:7rem;text-align:right"> g</span>
      <label>Follows</label><select id="nvBase">
        <option value="">latest version (now ${esc(vName(latest))})</option>
        ${onOlder ? `<option value="${viewed.v}" selected>this version only (${esc(vName(viewed))})</option>` : ""}
      </select>
    </div>`, "Create", () => {
    const label = $("#nvLabel").value.trim();
    if (!label){ alert("Give the variation a label."); return false; }
    const t = parseNum($("#nvTarget").value), bv = $("#nvBase").value;
    snapF(f);
    const va = {id: uid(f.id+"-var"), label, frozen:false, date: today(), notes:"", dilutionOverrides:{}, targetWeightG: t || null};
    if (bv) va.baseV = +bv;
    f.variations.push(va);
    VIEW.sub = {type:"var", idx: f.variations.length-1};
    markDirty(); render();
  });
  $("#nvLabel").focus();
}

/* ---------- inventory (opt-in stock ledger) ---------- */
const basePct = m => ((m.dilutions||[]).find(d => d.isBase) || {}).pct ?? 100;
const fridgeMark = (m, dil) => (m.locations?.frigo && dil === basePct(m))
  ? ` <span title="Base concentration is stored in the fridge" style="color:var(--frozen)">❄</span>` : "";
function stockCalc(m){
  const ev = m.stockEvents || [];
  let base = null, idx = -1;
  ev.forEach((e,i) => { if (e.t === "take"){ base = e.g; idx = i; } });
  if (base == null) return {tracked:false, qty:null, ev};
  let q = base;
  ev.forEach((e,i) => { if (i > idx){
    if (e.t === "buy" && e.g != null) q += e.g;
    if ((e.t === "dil" || e.t === "prep") && e.g != null) q -= e.g;
  }});
  return {tracked:true, qty:q, ev};
}
function evLabel(e){
  const map = {take:"stocktake", buy:"purchase", dil:"dilution made", prep:"prepared"};
  let s = `${e.date} · ${map[e.t]||e.t}`;
  if (e.t==="take") s += ` → ${fmt(e.g)} g`;
  if (e.t==="buy") s += `: +${e.amount!=null?fmtS(e.amount):""} ${e.unit||"g"}${e.g!=null&&e.unit==="ml"?` (≈${fmt(e.g)} g)`:""}${e.g==null?" (no density — not counted)":""}${e.note?` · ${e.note}`:""}`;
  if (e.t==="dil") s += `: ${fmtS(e.pct)}% × ${fmt(e.totalG)} g → −${fmt(e.g)} g base`;
  if (e.t==="prep") s += `: ${e.formula} → −${fmt(e.g)} g`;
  return s;
}
function markPrepared(f, item, lines){
  const ded = [], other = [], untracked = [];
  for (const l of lines || []){
    const m = matById(l.materialId); if (!m || !(l.weightG > 0)) continue;
    const base = (m.dilutions||[]).find(d => d.isBase);
    const basePct = base ? base.pct : 100;
    if ((l.dilutionPct ?? 100) !== basePct){ other.push(m.name); continue; }
    if (!stockCalc(m).tracked){ untracked.push(m.name); continue; }
    ded.push({m, g: l.weightG});
  }
  const label = itemLabel(item);
  const msg = `Mark ${f.name} ${label} as prepared on ${today()}?\n\n` +
    (ded.length ? `Stock will decrease for ${ded.length} tracked material(s):\n${ded.slice(0,12).map(d=>`  − ${fmt(d.g)} g ${d.m.name}`).join("\n")}${ded.length>12?"\n  …":""}\n\n` : "No tracked base-dilution lines — nothing will be deducted.\n\n") +
    (other.length ? `${other.length} line(s) at other dilutions are untouched (their base was deducted when the dilution was made).\n` : "") +
    (untracked.length ? `${untracked.length} material(s) not tracked.\n` : "") +
    `\nThis can be done once per version/variation.`;
  if (!confirm(msg)) return;
  const fClone = structuredClone(f);
  const mClones = ded.map(d => structuredClone(d.m));
  pushUndo(() => {
    const i = DATA.formulas.findIndex(x => x.id === fClone.id); if (i >= 0) DATA.formulas[i] = fClone;
    mClones.forEach(c => { const j = DATA.materials.findIndex(x => x.id === c.id); if (j >= 0) DATA.materials[j] = c; });
  });
  for (const d of ded){
    (d.m.stockEvents ||= []).push({t:"prep", date: today(), g: d.g, formula: `${f.name} ${label}`});
    d.m.modified = now();
  }
  f.modified = now();
  item.prepared = {date: today(), deductedG: ded.reduce((s,d)=>s+d.g,0), materials: ded.length};
  markDirty(); render();
}

let IDOSE = null, IFRAOPEN = false, SCALEOPEN = false, NOTESOPEN = null, CATSOPEN = false;   // NOTESOPEN null = follow content
function catPanel(K){

function ifraPanel(f, item, K){
  const agg = new Map();
  for (const r of K.rows){
    if (r.m.isSolvent) continue;
    const e = agg.get(r.m.id) || {m: r.m, rel: 0};
    e.rel += r.rel || 0; agg.set(r.m.id, e);
  }
  const dose = IDOSE ?? K.totalAbsPct;
  const restricted = [], unknown = [];
  for (const e of agg.values()){
    const lim = e.m.ifraLimit;
    if (lim == null){ unknown.push(e.m.name); continue; }
    if (lim >= 99) continue;                       // verified: no restriction
    const finalPct = e.rel * dose / 100;
    restricted.push({m: e.m, finalPct, lim, ratio: lim > 0 ? finalPct/lim : Infinity});
  }
  restricted.sort((a,b) => b.ratio - a.ratio);
  const over = restricted.filter(r => r.ratio > 1);
  const verdict = !restricted.length ? "no restricted materials"
    : over.length ? `⚠ ${over.length} over limit` : "✓ within limits";
  let h = `<details class="panelBox" id="ifraBox"${IFRAOPEN?" open":""}>
    <summary style="cursor:pointer;font-size:.8rem;text-transform:uppercase;letter-spacing:.07em;font-weight:600;color:${over.length?"var(--danger)":"var(--accent-ink)"}">IFRA check — ${verdict}</summary>
    <div class="toolRow" style="margin-top:.5rem">At concentrate dosage <input type="text" id="ifraDose" style="width:5rem;text-align:right" value="${fmt(dose,2)}"> % of finished product
      <span class="hint">(default = this formula as-is)</span></div>`;
  if (!restricted.length){
    h += `<div class="hint">No restricted materials present.</div>`;
  } else {
    h += `<table class="lines"><thead><tr><th>Material</th><th class="num">In product %</th><th class="num">IFRA limit %</th><th class="num">Used</th></tr></thead><tbody>
    ${restricted.slice(0, over.length > 8 ? over.length : 8).map(r => `<tr${r.ratio>1?' style="color:var(--danger);font-weight:600"':''}>
      <td>${esc(r.m.name)}</td><td class="num">${fmt(r.finalPct,3)}</td><td class="num">${fmt(r.lim,3)}</td>
      <td class="num">${r.lim>0?fmt(r.ratio*100,0)+"%":"—"}</td></tr>`).join("")}
    </tbody></table>`;
  }
  if (unknown.length) h += `<div class="hint">Not yet verified against IFRA (${unknown.length}): ${unknown.slice(0,12).map(esc).join(", ")}${unknown.length>12?", …":""}</div>`;
  return h + `</details>`;
}

/* ---------- bench view (free ordering & grouping) ---------- */
let BDRAG = null, BSORT = "orig";
function benchPoolSort(pool, K){
  if (BSORT === "orig") return pool;
  const r = k => K.rows[k.i];
  const by = {
    name:(a,b) => (r(a).m.name||"").localeCompare(r(b).m.name||""),
    dil:(a,b) => r(b).dil - r(a).dil,
    weight:(a,b) => r(b).w - r(a).w,
    rel:(a,b) => ((r(b).rel)??-1) - ((r(a).rel)??-1),
    cat:(a,b) => (r(a).m.category||"").localeCompare(r(b).m.category||"") || (r(a).m.name||"").localeCompare(r(b).m.name||""),
    pyr:(a,b) => (((r(a).m.pyramid??9)===5?9:r(a).m.pyramid??9) - ((r(b).m.pyramid??9)===5?9:r(b).m.pyramid??9)) || (r(a).m.name||"").localeCompare(r(b).m.name||"")
  }[BSORT];
  return by ? [...pool].sort(by) : pool;
}
function benchData(item, lines){
  const seen = new Map();
  const keyed = lines.map((l, i) => {
    const base = l.materialId + "|" + (l.dilutionPct ?? 100);
    const n = seen.get(base) || 0; seen.set(base, n + 1);
    return {key: base + "|" + n, l, i};
  });
  item.bench ||= {groups: []};
  const valid = new Set(keyed.map(k => k.key));
  // lines that disappeared from the formula are simply not shown; the stored keys are left untouched (no silent edits while rendering)
  const grouped = new Set(item.bench.groups.flatMap(g => g.keys.filter(k => valid.has(k))));
  return {keyed, byKey: new Map(keyed.map(k => [k.key, k])), pool: keyed.filter(k => !grouped.has(k.key))};
}
function renderBench(f, item, lines, K){
  const BD = benchData(item, lines);
  const row = k => { const r = K.rows[k.i]; return `<div class="brow" draggable="true" data-key="${k.key}">
    <input type="checkbox" class="bsel" data-key="${k.key}"><span class="bgrip">⠿</span>${pyrIcon(r.m.pyramid, catColour(r.m), 13)}
    <span class="bname">${esc(r.m.name)}${fridgeMark(r.m, r.dil)}${r.m.isSolvent?" (solvent)":""}</span><span class="bdil">${fmtS(r.dil)}%</span>
    <span class="bw">${fmt(r.w)} g</span><span class="bp">${r.rel==null?"–":fmt(r.rel,2)}%</span></div>`; };
  const stats = keys => { let w = 0, rel = 0, cont = 0;
    keys.forEach(key => { const k = BD.byKey.get(key); if (k){ const r = K.rows[k.i]; w += r.w; rel += r.rel || 0; cont += r.cont || 0; } });
    return `${keys.length} · ${fmt(w)} g · ${fmt(rel,2)}%` +
      (w > 0 ? ` · <span title="aromatic content of this group (dilution-corrected) as % of the group weight">${fmt(cont/w*100,2)}% arom.</span>` : ""); };
  const groups = item.bench.groups;
  let h = `<div class="benchArea"><div class="toolRow"><span class="hint">Drag rows into groups, or tick and use:</span>
    <select id="bMoveSel"><option value="">Move ticked to…</option><option value="pool">Unsorted</option>

function benchMove(f, item, keys, target, beforeKey){

  if (target !== "pool"){
    const g = item.bench.groups[+target]; if (!g) return;
    let idx = beforeKey ? g.keys.indexOf(beforeKey) : -1;
    if (idx < 0) idx = g.keys.length;
    g.keys.splice(idx, 0, ...keys);
  }
  markDirty(); render();
}

  gact("bdown", gi => { const g = item.bench.groups; [g[gi], g[gi+1]] = [g[gi+1], g[gi]]; });
  gact("bempty", gi => { item.bench.groups[gi].keys = []; });

    hd.addEventListener("dragstart", e => {
      GDRAG = +hd.dataset.bgdrag;
      e.dataTransfer.effectAllowed = "move";

  });

/* ---------- compare view ---------- */
function aggLines(lines){
  const map = new Map(); let tw = 0, content = 0;
  for (const l of lines||[]){
    const m = matById(l.materialId) || {}; const w = l.weightG||0;
    const cont = m.isSolvent ? 0 : w * (l.dilutionPct??100)/100;
    tw += w; content += cont;
    const e = map.get(l.materialId) || {m, w:0, cont:0, dils:new Set()};
    e.w += w; e.cont += cont; e.dils.add(l.dilutionPct??100);
    map.set(l.materialId, e);
  }
  for (const e of map.values()) e.rel = e.m.isSolvent ? null : (content ? e.cont/content*100 : 0);
  return {map, tw, content, abs: tw ? content/tw*100 : 0};
}
function cmpOptions(f){
  return [...f.versions.map((v,i)=>({key:"v"+i, label:`${vName(v)} (${v.date||"?"})${v.sourceName?` — ${v.sourceName}`:""}`})),
          ...f.variations.map((va,i)=>({key:"x"+i, label:`«${va.label}»${va.frozenFromName?` ⛄ ${va.frozenFromName}`:""}${va.date?` — ${va.date}`:""}`}))];
}
function cmpLines(f, key){
  return key[0]==="v" ? (f.versions[+key.slice(1)]?.lines||[]) : variationLines(f, f.variations[+key.slice(1)]||{lines:[]});
}
let CSORT = null;
function mapSortToCmp(){
  const m = {name:"name", dil:"name", weight:"wB", rel:"relB", abs:"relB", cat:"cat", pyr:"pyr", orig:"diff"};
  return {key: m[SORT.key] || "diff", dir: SORT.key==="orig" ? 1 : SORT.dir};
}
function renderCompare(f, sub){
  const c = $("#content");
  const opts = cmpOptions(f);
  if (!opts.find(o=>o.key===sub.a)) sub.a = opts[0].key;
  if (!opts.find(o=>o.key===sub.b)) sub.b = opts[opts.length-1].key;
  if (!CSORT) CSORT = mapSortToCmp();
  const A = aggLines(cmpLines(f, sub.a)), B = aggLines(cmpLines(f, sub.b));
  const ids = [...new Set([...A.map.keys(), ...B.map.keys()])];
  const rows = ids.map(id => {
    const a = A.map.get(id), b = B.map.get(id), m = (a||b).m;
    const solv = m.isSolvent;
    let cls, d;
    if (!a) { cls = "cmpAdd"; d = solv ? null : b.rel; }
    else if (!b) { cls = "cmpDel"; d = solv ? null : -a.rel; }
    else {
      d = solv ? null : b.rel - a.rel;
      const chg = solv ? Math.abs(b.w-a.w) > 5e-4 : (Math.abs(d) > 5e-3 || Math.abs(b.cont-a.cont) > 5e-4);
      cls = chg ? "cmpChg" : "";
    }
    return {m, a, b, d, cls, mag: d!=null ? Math.abs(d) : (solv && a && b ? 0.001*Math.abs(b.w-a.w) : 999)};
  });
  const by = {
    diff:(x,y) => (y.mag===999)-(x.mag===999) || y.mag-x.mag || (x.m.name||"").localeCompare(y.m.name||""),
    name:(x,y) => (x.m.name||"").localeCompare(y.m.name||""),
    wA:(x,y) => ((x.a?.w)??-1)-((y.a?.w)??-1),
    relA:(x,y) => ((x.a?.rel)??-1)-((y.a?.rel)??-1),
    wB:(x,y) => ((x.b?.w)??-1)-((y.b?.w)??-1),
    relB:(x,y) => ((x.b?.rel)??-1)-((y.b?.rel)??-1),
    dlt:(x,y) => ((x.d==null?-999:Math.abs(x.d))-((y.d==null?-999:Math.abs(y.d)))),
    cat:(x,y) => (x.m.category||"").localeCompare(y.m.category||"")||(x.m.name||"").localeCompare(y.m.name||""),
    pyr:(x,y) => (((x.m.pyramid??9)===5?9:x.m.pyramid??9)-((y.m.pyramid??9)===5?9:y.m.pyramid??9))||((x.m.name||"").localeCompare(y.m.name||""))
  }[CSORT.key] || ((x,y)=>y.mag-x.mag);
  rows.sort((x,y) => CSORT.dir * by(x,y));
  const cell = e => e ? `${fmt(e.w)} g <span class="hint">(${[...e.dils].sort((a,b)=>b-a).map(fmtS).join("/")}%)</span>` : "—";
  const relCell = e => e ? (e.rel==null ? "–" : fmt(e.rel,2)) : "—";
  const sel = (id, cur) => `<select id="${id}">${opts.map(o=>`<option value="${o.key}"${o.key===cur?" selected":""}>${esc(o.label)}</option>`).join("")}</select>`;
  const arrow = k => CSORT.key===k ? (CSORT.dir>0?" ▲":" ▼") : "";
  const hdr = (k, label, num) => `<th${num?' class="num"':''}><span class="sortable" data-csort="${k}">${label}${arrow(k)}</span></th>`;
  c.innerHTML = `<h2>${esc(f.name)} — compare</h2>
  <div class="toolRow"><span class="hint">A</span>${sel("cmpA", sub.a)}<span class="hint">B</span>${sel("cmpB", sub.b)}
    <button class="small" id="btnCmpClose" style="margin-left:auto">Close compare</button></div>
  <div class="toolRow"><span class="hint">Order:</span>
    <select id="cmpSortSel">
      <option value="diff"${CSORT.key==="diff"?" selected":""}>Difference (largest first)</option>
      <option value="cat"${CSORT.key==="cat"?" selected":""}>Category</option>
      <option value="pyr"${CSORT.key==="pyr"?" selected":""}>Pyramid top → base</option>
      ${["name","wA","relA","wB","relB","dlt"].includes(CSORT.key)?'<option value="" selected hidden>Column ▲▼</option>':""}
    </select></div>
  <table class="lines"><thead><tr>${hdr("name","Material")}${hdr("wA","A weight",1)}${hdr("relA","A rel %",1)}
    ${hdr("wB","B weight",1)}${hdr("relB","B rel %",1)}${hdr("dlt","Δ rel %",1)}</tr></thead><tbody>
  ${rows.map(r => `<tr class="${r.cls}"><td>${pyrIcon(r.m.pyramid, catColour(r.m), 13)}${esc(r.m.name||"?")}${r.m.isSolvent?" (solvent)":""}</td>
    <td class="num${r.a?"":" dim"}">${cell(r.a)}</td><td class="num${r.a?"":" dim"}">${relCell(r.a)}</td>
    <td class="num${r.b?"":" dim"}">${cell(r.b)}</td><td class="num${r.b?"":" dim"}">${relCell(r.b)}</td>
    <td class="num">${r.d==null?"":(r.d>0?"+":"")+fmt(r.d,2)}</td></tr>`).join("")}
  </tbody><tfoot><tr><td>Total</td><td class="num">${fmt(A.tw)} g</td><td class="num">abs ${fmt(A.abs,2)}%</td>
    <td class="num">${fmt(B.tw)} g</td><td class="num">abs ${fmt(B.abs,2)}%</td><td></td></tr></tfoot></table>
  <div class="legend">Differences: <i style="background:var(--hl4)"></i>only in B <i style="background:var(--hl2)"></i>only in A <i style="background:var(--hl3)"></i>changed — sorted by size of change; rel % compares per material (dilutions aggregated)</div>`;
  $("#cmpA").addEventListener("change", e => { sub.a = e.target.value; render(); });
  $("#cmpB").addEventListener("change", e => { sub.b = e.target.value; render(); });
  $("#btnCmpClose").addEventListener("click", () => { CSORT = null; VIEW.sub = sub.from || {type:"v", idx:f.versions.length-1}; render(); });
  c.querySelectorAll("[data-csort]").forEach(el => el.addEventListener("click", () => {
    const k = el.dataset.csort;
    if (CSORT.key === k) CSORT.dir *= -1; else CSORT = {key:k, dir:1};
    render();
  }));
  $("#cmpSortSel")?.addEventListener("change", e => { if (e.target.value){ CSORT = {key:e.target.value, dir:1}; render(); }});
}

/* ---------- formula import (photo-to-formula, phase 4) ---------- */
let IMPORTP = null;
function resolveImportLine(L){
  const m = (L.materialId && matById(L.materialId)) || DATA.materials.find(x => x.name === L.material) || null;
  const dil = L.dilutionPct ?? 100;
  const dilOwned = m ? (m.dilutions||[]).some(d => d.pct === dil) : true;
  return {m, dil, dilOwned};
}
function renderImport(){
  const c = $("#content");
  const p = IMPORTP;
  let tw = 0;
  const rows = p.lines.map(L => { const r = resolveImportLine(L); tw += L.weightG || 0; return {L, ...r}; });
  const newCount = rows.filter(r => !r.m).length, warnCount = rows.filter(r => r.m && !r.dilOwned).length;
  c.innerHTML = `<h2>Import formula — ${esc(p.name||"?")}</h2>
  <div class="metaLine">${esc(p.category||"Uncategorised")}${p.source?` · ${esc(p.source)}`:""}</div>
  <div class="panelBox"><h3>Check before confirming</h3>
    <div class="toolRow">Import as
      <select id="impTarget" style="min-width:18rem">
        <option value="">— a new formula —</option>
        ${[...DATA.formulas].sort((a,b)=>a.name.localeCompare(b.name)).map(x =>
          `<option value="${x.id}"${(p.targetFormula && x.name.toLowerCase() === String(p.targetFormula).toLowerCase()) ? " selected" : ""}>new version of: ${esc(x.name)} (now v${currentVersion(x)?currentVersion(x).v:0})</option>`).join("")}
      </select>
      <span class="hint">a new version keeps the existing variations, notes and history</span></div>
    <div><b>Total weight: ${fmt(tw)} g</b> <span class="hint">— a round number (100 / 1000) suggests a complete transcription</span></div>
    <div class="hint">${rows.length} lines · ${rows.length-newCount} matched · ${newCount} new (will be created as “to order”) · ${warnCount} with a dilution you don’t stock (⚠ convert in a next version)</div></div>
  <table class="lines"><thead><tr><th>Material</th><th class="num">Dilution</th><th class="num">Weight (g)</th><th>Status</th></tr></thead><tbody>
  ${rows.map(r => `<tr>
    <td>${r.m ? `${pyrIcon(r.m.pyramid, catColour(r.m), 13)}${esc(r.m.name)}` : esc(r.L.material)}</td>
    <td class="num">${fmtS(r.dil)}%${r.m && !r.dilOwned ? ' <span style="color:var(--amber)">⚠</span>' : ""}</td>
    <td class="num">${fmt(r.L.weightG||0)}</td>
    <td>${r.m ? (r.dilOwned ? '<span class="hint">matched</span>' : '<span style="color:var(--amber)">matched — dilution not owned</span>')
              : '<span class="badge" style="background:var(--amber-soft);color:var(--amber)">new · to order</span>'}${r.L.comment?` <span class="hint">${esc(r.L.comment)}</span>`:""}</td></tr>`).join("")}
  </tbody><tfoot><tr><td>Total</td><td></td><td class="num">${fmt(tw)}</td><td></td></tr></tfoot></table>
  ${p.notes ? `<div class="noteRead" style="margin:.6rem 0">${esc(p.notes)}</div>` : ""}
  <div class="toolRow" style="justify-content:flex-end"><button id="btnImpCancel">Cancel</button><button class="primary" id="btnImpOk">Confirm import</button></div>`;
  $("#btnImpOk").addEventListener("click", applyImport);
  $("#btnImpCancel").addEventListener("click", () => { IMPORTP = null; render(); });
}
function applyImport(){
  const p = IMPORTP;
  const targetId = $("#impTarget")?.value || "";
  const target = targetId ? DATA.formulas.find(x => x.id === targetId) : null;
  const oc = structuredClone(DATA.orderList);
  const createdIds = [], lines = [];
  for (const L of p.lines){
    let {m, dil} = resolveImportLine(L);
    if (!m){
      m = {id: uid("m-"), name: L.material, cas: L.cas || "", category: "Uncategorised", supplier: "", costPerGram: null,
        modified: now(), ifraLimit: null, inventory: "", pyramid: 5, isSolvent: false, description: "", wishlist: true,
        dilutions: [{pct: dil, isBase: true, date: today(), notes: "from import"}]};
      DATA.materials.push(m); createdIds.push(m.id);
      DATA.orderList.push({id: uid("o-"), materialId: m.id, name: m.name, note: `needed for ${p.name}`, price: "", added: today()});
    }
    lines.push({materialId: m.id, dilutionPct: dil, weightG: L.weightG || 0, remark: 1});
  }
  if (createdIds.length){ DATA.materials.sort((a,b) => a.name.localeCompare(b.name)); invalidateMats(); }
  if (target){   // add as a new version of an existing formula
    const clone = structuredClone(target);
    // provenance goes into the notes; the version label stays free for the user to choose
    const prov = `Imported ${today()}${p.name?` · source: ${p.name}`:""}${p.source?` · ${p.source}`:""}.`;
    const nv = {v: Math.max(...target.versions.map(x => x.v), 0) + 1, date: today(),
      name: p.versionName || "", notes: p.notes ? `${p.notes}\n\n${prov}` : prov, lines};
    target.versions.push(nv); target.frozenImport = false; target.modified = now();
    pushUndo(() => {
      DATA.orderList = oc;
      const i = DATA.formulas.findIndex(x => x.id === clone.id); if (i >= 0) DATA.formulas[i] = clone;
      DATA.materials = DATA.materials.filter(x => !createdIds.includes(x.id)); invalidateMats();
    });
    buildUsage(); markDirty(); IMPORTP = null;
    switchTab("F", target.id, {type:"v", idx: target.versions.length - 1});
    return;
  }
  let name = p.name || "Imported formula";
  while (DATA.formulas.some(x => x.name === name)) name += " (import)";
  const cat = p.category || "Uncategorised";
  if (!DATA.formulaCategories.includes(cat)) DATA.formulaCategories.push(cat);
  const f = {id: uid("f-"), name, category: cat, created: today(), modified: now(), frozenImport: false,
    versions: [{v: 1, date: today(), notes: p.notes || "", lines}], variations: []};
  DATA.formulas.push(f);
  pushUndo(() => {
    DATA.orderList = oc;
    DATA.formulas = DATA.formulas.filter(x => x.id !== f.id);
    DATA.materials = DATA.materials.filter(x => !createdIds.includes(x.id)); invalidateMats();
    if (VIEW.id === f.id){ VIEW.id = null; VIEW.sub = null; }
  });

function deliveredDialog(idx){
  const o = DATA.orderList[idx];

      DATA.orderList.splice(idx, 1);
      markDirty(); switchTab("M", m.id, null);
    } else {
      const cg = costPerGram(null);
      const nm = {id: uid("m-"), name: o.name, cas:"", category:"Uncategorised", supplier:"", costPerGram: cg ? +cg.toFixed(4) : null, modified: now(),
        ifraLimit:null, inventory: amt, purchaseDate: date, pyramid:5, isSolvent:false, description:"",
        dilutions:[{pct:100, isBase:true, date, notes:""}]};

    if (DATA.materials.some(x => x.name.toLowerCase() === name.toLowerCase())){ alert("A material with that name already exists."); return false; }
    const pct = parseNum($("#nmDil").value) || 100;
    const m = {id: uid("m-"), name, cas:"", category: $("#nmCat").value || "Uncategorised", supplier:"", costPerGram:null, modified: now(),
      ifraLimit:null, inventory:"", pyramid:5, isSolvent:false, description:"", dilutions:[{pct, isBase:true, date:today(), notes:""}]};
    DATA.materials.push(m); DATA.materials.sort((a,b)=>a.name.localeCompare(b.name)); invalidateMats();
    pushUndo(() => { DATA.materials = DATA.materials.filter(x => x.id !== m.id); invalidateMats(); if (VIEW.id === m.id){ VIEW.id = null; VIEW.sub = null; } });
    VIEW = {tab:"M", id:m.id, sub:null}; HOMEVIEW = false; setTabs(); markDirty(); render();
  });
  $("#nmName").focus();
});

/* ---------- print ---------- */
function printSheet(f, item, lines, targetW){
  const K = calc(lines);
  const k = targetW && K.totalW ? targetW/K.totalW : 1;
  const label = itemLabel(item);
  $("#printArea").innerHTML = `<h2>${esc(f.name)} — ${esc(label)}</h2>
  <div>Printed ${today()} · target ${fmt((K.totalW||0)*k)} g · concentrate ${fmt(K.totalAbsPct,2)}% · est. cost € ${fmt(K.totalCost*k,2)}</div>
  <table class="bench"><colgroup><col class="cbc"><col class="pyc"><col class="matc"><col class="dilc"><col class="wc"><col class="rc"></colgroup>
  <thead><tr><th></th><th></th><th>Material</th><th>Dilution</th><th class="num">Weigh (g)</th><th class="num">Rel %</th></tr></thead><tbody>
  ${sortRows(K.rows).map(r =>
    `<tr><td><span class="cb"></span></td><td>${pyrIcon(r.m.pyramid, catColour(r.m), 13)}</td><td>${esc(r.m.name)}${fridgeMark(r.m, r.dil)}</td><td>${fmtS(r.dil)}%</td>
      <td class="num">${fmt(r.w*k)}</td><td class="num">${r.rel==null?"–":fmt(r.rel,2)}</td></tr>`).join("")}
  </tbody></table>`;
  window.print();
}

/* ---------- browser storage: ask for persistence, warn when it is not granted ---------- */
async function requestPersistence(){
  try{ if (navigator.storage && navigator.storage.persist) await navigator.storage.persist(); }catch(e){}
  updateStorageHint();
}
async function updateStorageHint(){
  if (!DEMO || HANDLE){ $("#storageHint").hidden = true; return; }
  let persisted = false;
  try{ persisted = !!(navigator.storage && navigator.storage.persisted && await navigator.storage.persisted()); }catch(e){}
  if (persisted || sessionStorage.getItem("storageHintClosed")){ $("#storageHint").hidden = true; return; }
  const canFile = !FALLBACK && !!window.showSaveFilePicker;
  $("#storageHintText").textContent = "Your data is kept in this browser only and may be cleared when it closes. "
    + (canFile ? "Save it to a data file of your own, or download a Backup regularly." : "Download a Backup regularly; this browser cannot write to files, use Chrome or Edge to save to a data file.");
  $("#storageHintSave").style.display = canFile ? "" : "none";
  $("#storageHint").classList.toggle("nosave", !canFile);
  $("#storageHint").hidden = false;
}
$("#storageHintClose").addEventListener("click", () => { sessionStorage.setItem("storageHintClosed", "1"); $("#storageHint").hidden = true; });
// browser storage -> a data file of the user's own (Chrome/Edge): explain, pick the location, write, remember
function saveToDataFile(){
  if (!DATA || !window.showSaveFilePicker) return;
  openDialog(`<h3 style="margin-top:0">Where to keep your data file</h3>
    <p>Your formulas and materials will be saved as your data file, <b>miformulas-data.json</b>, and the app keeps saving to it from now on; the next time you open the app it offers to reopen it.</p>
    <p>In the next window, choose a folder of your own, for instance <b>Documents\\miFormulas</b>, and keep that file name. Make a subfolder <b>backups</b> there for Backup copies.</p>`,
    "Choose location\u2026", () => {
      (async () => {
        let h = null;
        try{ h = await window.showSaveFilePicker({id:"miformulas-data", startIn:"documents", suggestedName:"miformulas-data.json", types:[{description:"miFormulas data", accept:{"application/json":[".json"]}}]}); }
        catch(e){ /* cancelled */ }
        if (!h) return;
        HANDLE = h; await idb.set("fileHandle", h);
        await saveData(); updateStorageHint(); render();
      })();
    }, "28rem");
}
$("#storageHintSave").addEventListener("click", saveToDataFile);

/* ---------- settings ---------- */
async function openSettings(){
  const loc = (await idb.get("locale")) || "", url = (await idb.get("serverUrl")) || "", tok = (await idb.get("token")) || "";
  let remembered = null; try{ remembered = FALLBACK ? null : await idb.get("fileHandle"); }catch(e){}
  const locales = [["","Browser default"],["nl-BE","1.234,56  (nl-BE)"],["de-DE","1.234,56  (de-DE)"],["fr-FR","1 234,56  (fr-FR)"],["en-GB","1,234.56  (en-GB)"],["en-US","1,234.56  (en-US)"]];
  openDialog(`<h3 style="margin-top:0">Settings</h3>
    <div class="fieldGrid">
      <label>Number format</label><select id="setLocale">${locales.map(([v,l]) => `<option value="${v}"${v===loc?" selected":""}>${l}</option>`).join("")}</select>
      <label>Server endpoint</label><input id="setServer" value="${esc(url)}" placeholder="empty = no server">
      <label>Access token</label><input id="setToken" type="password" value="${esc(tok)}" autocomplete="off">
    </div>
    <div class="hint" style="margin-top:.6rem">A server is optional: without one the data lives in a local file or in this browser. Give <code>data.php</code> for the endpoint next to the app, or a full URL. Changing the server reloads the app.</div>
    ${INSTALL_EVT && !window.matchMedia("(display-mode: standalone)").matches ? `<div style="margin-top:.8rem"><button class="small primary" id="setInstall">Install as an app</button> <span class="hint">own window and icon in the taskbar or Start menu; the browser does the installing</span></div>` : ""}
    ${DEMO && !HANDLE && DATA && window.showSaveFilePicker ? `<div style="margin-top:.8rem"><button class="small primary" id="setToFile">Save to a data file…</button> <span class="hint">keep your data in a file of your own instead of in this browser</span></div>` : ""}
    ${DEMO && !HANDLE ? `<div style="margin-top:.8rem"><button class="small" id="setReset">Delete the data kept in this browser…</button></div>` : ""}
    ${remembered ? `<div style="margin-top:.5rem"><button class="small" id="setForget">Forget the remembered data file \u201c${esc(remembered.name)}\u201d…</button></div>` : ""}`,
  "Apply", () => {
    const nl = $("#setLocale").value || null, ns = $("#setServer").value.trim() || null, nt = $("#setToken").value.trim() || null;
    const serverChanged = (ns||"") !== (url||"") || (nt||"") !== (tok||"");
    (async () => {
      await idb.set("locale", nl); await idb.set("serverUrl", ns); await idb.set("token", nt);
      LOCALE = nl || undefined;
      if (serverChanged){ if (DIRTY) await saveData(); location.reload(); }
      else if (DATA) render();
    })();
  }, "26rem");
  $("#setToFile")?.addEventListener("click", () => { $("#dlg").close(); saveToDataFile(); });
  $("#setInstall")?.addEventListener("click", async () => {
    $("#dlg").close(); if (!INSTALL_EVT) return;
    INSTALL_EVT.prompt(); try{ await INSTALL_EVT.userChoice; }catch(_){}
    INSTALL_EVT = null; $("#btnInstall").style.display = "none";
  });
  $("#setForget")?.addEventListener("click", async () => {
    if (!confirm("Forget the remembered data file? The file itself is not touched; the app just stops offering Reopen for it.")) return;
    if (DIRTY) await saveData();
    await idb.set("fileHandle", null);
    $("#dlg").close(); location.reload();
  });
  $("#setReset")?.addEventListener("click", async () => {
    if (!confirm("Delete the data kept in this browser? Download a Backup first if you want to keep it.")) return;
    await idb.set("demoData", null); await idb.set("dailyBak", null);
    $("#dlg").close(); location.reload();
  });
}
$("#btnSettings").addEventListener("click", openSettings);
$("#btnSettingsLanding").addEventListener("click", openSettings);

/* ---------- install as an app (Chrome/Edge; Safari uses File > Add to Dock) ---------- */
let INSTALL_EVT = null;
window.addEventListener("beforeinstallprompt", e => {
  e.preventDefault(); INSTALL_EVT = e;

});
window.addEventListener("appinstalled", () => { INSTALL_EVT = null; $("#btnInstall").style.display = "none"; });
$("#btnInstall").addEventListener("click", async e => {

  INSTALL_EVT.prompt();

/* ---------- boot & render ---------- */
// a data file was opened here before (Chrome/Edge): offer to reopen it; onGone runs when it no longer exists
function offerReopen(onGone){
  $("#landingHint").textContent = "Your data file \u201c" + RESTORE.name + "\u201d is remembered. Click Reopen to continue; Chrome or Edge may ask once per session for permission to write to it. Open data file\u2026 switches to another file.";
  const b = $("#btnReopen");
  b.style.display = ""; b.textContent = `Reopen \u201c${RESTORE.name}\u201d`;
  b.addEventListener("click", async () => {
    try{
      if (await RESTORE.requestPermission({mode:"readwrite"}) !== "granted") return;
      if (await loadFromHandle(RESTORE)) boot();
    }catch(e){   // the file is gone (moved, renamed, deleted): forget it and let the caller offer a fresh start
      b.style.display = "none"; RESTORE = null; await idb.set("fileHandle", null);
      onGone();
    }
  });
}
const canSave = () => REMOTE || DEMO || !!HANDLE;   // server, browser storage or a writable local file → editing on a phone is safe
function lockInputs(){
  const keep = new Set(["searchBox","verSel","sortSel","cmpA","cmpB","cmpSortSel","bSortSel","scaleW",
    "btnPrint","btnBenchPrint","btnBenchToggle","btnBenchClose","btnCmp","btnCmpClose"]);
  $("#content").querySelectorAll("input,select,textarea,button").forEach(el => { if (!keep.has(el.id)) el.disabled = true; });
}
const readOnly = () => isMobile() && !canSave();   // one rule for CSS (body.ro), disabled inputs and hidden buttons
function render(){
  if (!DATA) return;
  document.body.classList.toggle("detail", !!VIEW.id || VIEW.tab === "T" || HOMEVIEW);
  document.body.classList.toggle("ro", readOnly());
  renderSidebar();
  const n = (DATA.orderList||[]).length;
  $("#tabT").textContent = "To order" + (n ? ` (${n})` : "");
  const c = $("#content");
  if (IMPORTP){ renderImport(); if (readOnly()) lockInputs(); return; }
  if (VIEW.tab === "T"){ renderOrders(); if (readOnly()) lockInputs(); return; }
  if (!VIEW.id){
    const recent = (arr, go) => arr.filter(x => x.modified).sort((a,b) => b.modified.localeCompare(a.modified)).slice(0,8)
      .map(x => `<div class="usage">· <a class="matlink" data-${go}="${x.id}">${esc(x.name)}</a> <span class="hint">${esc(x.modified)}${x.category?` · ${esc(x.category)}`:""}</span></div>`).join("")
      || '<div class="hint">Nothing edited yet — history builds up as you work.</div>';
    const nvv = DATA.formulas.reduce((s,x) => s + x.versions.length + x.variations.length, 0);
    c.innerHTML = `<h2>Welcome</h2>
    <div class="tiles">
      <div class="tile" style="background:var(--accent-soft)"><b>${DATA.formulas.length}</b><span>formulas</span></div>
      <div class="tile" style="background:var(--bench)"><b>${nvv}</b><span>versions & variations</span></div>
      <div class="tile" style="background:var(--amber-soft)"><b>${DATA.materials.length}</b><span>materials</span></div>
      <div class="tile" style="background:var(--frozen-soft)"><b>${(DATA.orderList||[]).length}</b><span>to order</span></div>
    </div>
    <p class="hint">Select a formula or material on the left, or create a new one.</p>
    <div class="panelBox"><h3>Recently edited formulas</h3>${recent(DATA.formulas, "gof")}</div>
    <div class="panelBox"><h3>Recently edited materials</h3>${recent(DATA.materials, "gom")}</div>
    <div class="panelBox"><h3>Import & export</h3>
      <div class="toolRow"><button class="small primary" id="btnImpF">Import formula…</button>
        <input type="file" id="impFile" accept=".json" style="display:none">
        <span class="hint">reads a miformulas-import .json (e.g. from a photo transcribed in Cowork)</span></div>
      <div class="toolRow"><button class="small" id="btnExpF">All formulas (Excel)</button>
        <button class="small" id="btnExpM">All materials (Excel)</button>
        <span class="hint">CSV, opens directly in Excel (Belgian decimals)</span></div>
    </div>`;
    c.querySelectorAll("[data-gom]").forEach(a => a.addEventListener("click", () => switchTab("M", a.dataset.gom, null)));
    c.querySelectorAll("[data-gof]").forEach(a => a.addEventListener("click", () => switchTab("F", a.dataset.gof, null)));
    $("#btnExpF")?.addEventListener("click", exportAllFormulas);
    $("#btnExpM")?.addEventListener("click", exportAllMaterials);
    $("#btnImpF")?.addEventListener("click", () => $("#impFile").click());
    $("#impFile")?.addEventListener("change", async e => {
      const file = e.target.files[0]; if (!file) return;
      let p;
      try{ p = JSON.parse(await file.text()); }
      catch(err){ alert("This file is not valid JSON."); return; }
      if (p?.type !== "miformulas-import" || !Array.isArray(p.lines) || !p.lines.length){
        alert("This is not a miFormulas import file (expected type “miformulas-import” with lines)."); return;
      }
      IMPORTP = p; render();
    });
    return;
  }
  if (VIEW.tab === "F"){
    const f = DATA.formulas.find(x => x.id === VIEW.id);
    if (f) renderFormula(f); else { VIEW.id = null; render(); }
  } else {
    const m = matById(VIEW.id);
    if (m) renderMaterial(m); else { VIEW.id = null; render(); }
  }
  if (readOnly()) lockInputs();
}
$("#btnBack").addEventListener("click", () => { VIEW.id = null; VIEW.sub = null; HOMEVIEW = false; render(); });
window.matchMedia("(max-width:700px)").addEventListener("change", () => { if (DATA) render(); });
function boot(){
  $("#landing").style.display = "none";
  if (isMobile()) HOMEVIEW = true;      // phones start on the welcome screen, not on an empty list
  buildUsage();
  $("#saveState").textContent = REMOTE ? "Connected to server" : HANDLE ? "Loaded" : DEMO ? "Data kept in this browser" : "Loaded (read-only fallback — use Backup to save)";
  setTabs(); render();
  updateStorageHint();
}
(async () => {
  try{
  await idb.open();
  THEME = (await idb.get("theme")) || "auto"; applyTheme();
  LOCALE = (await idb.get("locale")) || undefined;
  if (/^https?:$/.test(location.protocol)){
    TOKEN = (await idb.get("token")) || null;
    let url = await idb.get("serverUrl");
    if (url === undefined){                 // first visit on this device: detect once, then remember
      url = TOKEN ? "data.php" : await probeServer();
      await idb.set("serverUrl", url);
    }
    if (url){
      REMOTE = true; API = url;
      $("#landingHint").textContent = "Data is stored on the server (" + url + "). Saving is automatic; a conflict check protects against simultaneous edits on two devices.";
      const bo = $("#btnOpen"); bo.textContent = "Connect to server";
      bo.replaceWith(bo.cloneNode(true));   // drop the file-picker handler
      $("#btnOpen").addEventListener("click", async () => { if (await remoteLoad()) boot(); });
      if (await remoteLoad()) boot();
      return;
    }
    // no server: the browser keeps the data, unless a data file was opened here before (then that file is used)
    DEMO = true;
    if (await tryRestore()){ boot(); return; }
    const BROWSER_MSG = "Your data stays in this browser. Use Backup to download it, and Settings to connect a server of your own.";
    const demoStart = async (hint) => {
    $("#landingHint").textContent = hint;
    const demo = await idb.get("demoData");
    if (demo){
      try{ DATA = migrate(JSON.parse(demo)); boot(); return; }
      catch(e){ console.warn("miFormulas: data kept in this browser could not be loaded", e); }
    }
    const bs = $("#btnStarter"); bs.style.display = "";
    $("#btnDownload").style.display = ""; $("#btnFormulair").style.display = "";
    bs.addEventListener("click", async () => {
      const d = await loadStarter(); if (!d) return;
      DATA = d; boot(); markDirty();
    });
    $("#btnDownload").addEventListener("click", () => {
      $("#landingHint").textContent = "miFormulas.html is now in your Downloads folder. Move it to a folder of its own, for instance Documents\\miFormulas, and open it there in Chrome or Edge; it then keeps your data in a file next to it. If you already made formulas here, click Backup first and open that file in the downloaded app.";
    });
    };   // end demoStart
    if (RESTORE) offerReopen(() => demoStart("The remembered data file could not be opened; it was probably moved, renamed or deleted. " + BROWSER_MSG));
    else await demoStart(BROWSER_MSG);
    return;
  }
  const bak = await idb.get("dailyBak");
  if (bak && bak.json){
    LASTBAK = bak.date;
    const bs = $("#btnSnap");
    bs.style.display = ""; bs.textContent = `Restore daily snapshot (${bak.date})`;
    bs.addEventListener("click", () => {
      try{ DATA = migrate(JSON.parse(bak.json)); }
      catch(e){ alert("The snapshot could not be read."); return; }
      boot(); markDirty();
      $("#saveState").textContent = "Snapshot loaded — use Backup to write it to a file";
      $("#saveState").className = "dirty";
    });
  }
  if (FALLBACK){
    $("#landingHint").textContent = "This browser has no direct file access — the app is read-mostly here. Pick the data file once; it is remembered for next time.";
    const cached = await idb.get("cachedData");
    if (cached && cached.json){
      const b = $("#btnReopen");
      b.style.display = "";
      b.textContent = `Continue with data from ${new Date(cached.when).toLocaleString(LOCALE,{day:"2-digit",month:"2-digit",hour:"2-digit",minute:"2-digit"})}`;
      b.addEventListener("click", () => {
        try{ DATA = migrate(JSON.parse(cached.json)); }catch(e){ alert(CORRUPT_MSG); return; }
        boot();
        $("#saveState").textContent = "Cached copy — reload the file for the latest data"; });
    }
    return;
  }
  if (await tryRestore()){ boot(); return; }
  const FRESH_MSG = "You are running the app from your own computer. Keep miFormulas.html in a folder of its own, for instance Documents\\miFormulas, with your data file next to it and a subfolder \u201cbackups\u201d for Backup copies. Made a data file earlier? Use Open data file\u2026; the starter set would create a new one.";
  const GONE_MSG = "The remembered data file could not be opened; it was probably moved, renamed or deleted. Start with the starter set to create a new one, or open another data file.";
  function offerStarter(hint){   // no usable remembered file: the starter set creates one
  $("#landingHint").textContent = hint;
  const bsf = $("#btnStarter"); bsf.style.display = "";
  const NOFILE_MSG = "No data file was created, so nothing is saved. Start with the starter set to try again, or open an existing data file.";
  bsf.addEventListener("click", async () => {
    const d = await loadStarter(); if (!d) return;   // fetched first; the dialog button below gives the picker a fresh user gesture
    const dlg = $("#dlg");
    const onCancel = () => { $("#landingHint").textContent = NOFILE_MSG; };
    dlg.addEventListener("cancelled", onCancel, {once: true});
    openDialog(`<h3 style="margin-top:0">Where to keep your data file</h3>
      <p>The starter set will be saved as your data file, <b>miformulas-data.json</b>.</p>
      <p>In the next window, go to the folder where miFormulas.html is (for instance <b>Documents\\miFormulas</b>) and keep that file name. The app remembers the file and saves to it automatically; make a subfolder <b>backups</b> there for Backup copies.</p>`,
      "Choose location\u2026", () => {
        dlg.removeEventListener("cancelled", onCancel);
        (async () => {
          let h = null;
          try{ h = await window.showSaveFilePicker({id:"miformulas-data", startIn:"documents", suggestedName:"miformulas-data.json", types:[{description:"miFormulas data", accept:{"application/json":[".json"]}}]}); }
          catch(e){ /* cancelled */ }
          if (!h){ $("#landingHint").textContent = NOFILE_MSG; return; }
          DATA = d; HANDLE = h; await idb.set("fileHandle", h);
          boot(); saveData();
        })();
      }, "28rem");
  });
  }   // end offerStarter
  if (RESTORE) offerReopen(() => offerStarter(GONE_MSG)); else offerStarter(FRESH_MSG);
  }catch(e){ try{ console.warn("miFormulas: start-up stopped early", e); }catch(_){} /* sandboxed viewers: manual file open still works */ }
})();
</script>
