<style>
:root{
  --ground:#FBFCFD; --surface:#FFFFFF; --panel:#EDF1F5; --ink:#212A33; --muted:#6C7A88;
  --line:#DCE3EA; --accent:#A2277E; --accent-ink:#7E1B62; --accent-soft:#F9E3F1; --amber:#DD8500; --amber-soft:#FFEFD2;
  --danger:#C42F1F; --frozen:#3E7CB8; --frozen-soft:#E1EEF9;
  --hl0:#3B6FA0; --hl2:#C04A32; --hl3:#C9A227; --hl4:#4C8A46;
  --accent-deep:#3E1146; --header-ink:#FBEFDD; --header-mute:#E3B9D6; --zebra:rgba(62,124,184,.05);
  --bench:#E2F0F4; --bench2:#DCE7F5; --bench-line:#B9D5DE;
  --header-grad:linear-gradient(100deg,#3E1146,#8E2277 48%,#D4600F);
  --btn-grad:linear-gradient(115deg,#A2277E,#D4600F);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --ground:#1C1122; --surface:#2A1833; --panel:#241430; --ink:#F2E6F2; --muted:#B292BC;
    --line:#453050; --accent:#E667B0; --accent-ink:#F08CC5; --accent-soft:#3A1F38; --amber:#FFB454; --amber-soft:#3B2A12;
    --danger:#F08A75; --frozen:#7FA9D9; --frozen-soft:#1E2B3B;
    --accent-deep:#220A2B; --header-ink:#F7E9F5; --header-mute:#C79ABB; --zebra:rgba(230,103,176,.07);
    --bench:#122630; --bench2:#141F33; --bench-line:#2C4654;
    --header-grad:linear-gradient(100deg,#2A0C33,#701B5C 48%,#B34A0C);
    --btn-grad:linear-gradient(115deg,#C0388F,#C65E12);
  }
}
:root[data-theme="dark"]{
  --ground:#1C1122; --surface:#2A1833; --panel:#241430; --ink:#F2E6F2; --muted:#B292BC;
  --line:#453050; --accent:#E667B0; --accent-ink:#F08CC5; --accent-soft:#3A1F38; --amber:#FFB454; --amber-soft:#3B2A12;
  --danger:#F08A75; --frozen:#7FA9D9; --frozen-soft:#1E2B3B;
  --accent-deep:#220A2B; --header-ink:#F7E9F5; --header-mute:#C79ABB; --zebra:rgba(230,103,176,.07);
  --bench:#122630; --bench2:#141F33; --bench-line:#2C4654;
  --header-grad:linear-gradient(100deg,#2A0C33,#701B5C 48%,#B34A0C);
  --btn-grad:linear-gradient(115deg,#C0388F,#C65E12);
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--ground);color:var(--ink);font:15px/1.5 "Segoe UI",system-ui,-apple-system,sans-serif;display:flex;flex-direction:column}
button{font:inherit;color:inherit;background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:.35rem .8rem;cursor:pointer}
button:hover{border-color:var(--accent)}
button.primary{background:var(--btn-grad);border-color:transparent;color:#fff}
button.primary:hover{filter:brightness(1.1)}
button.small{padding:.15rem .5rem;font-size:.85rem}
a.small{font-size:.85rem;color:var(--accent-ink);text-decoration:underline;white-space:nowrap}

<template id="manualTpl"><h1 id="miformulas-manual">miFormulas manual</h1>
<p>miFormulas is a perfume formulation app that runs as a single HTML file in your browser. It keeps your materials, your formulas with their full version history, and the variations you make of them, and it does the perfumery arithmetic: dilution-corrected percentages, batch scaling, dilution changes, predilutions, an IFRA check, weighing sheets.</p>
<p>A few things set it apart. It imports your formulas and materials from Formulair, complete with notes, dilutions and colour marks (section <a href="#s19-coming-from-formulair">19</a>). You can select several lines of a formula at once and act on them together: mark them, shift their dilutions, or bundle them into a predilution (sections <a href="#s11-changing-dilutions">11</a> to 13). You can let your own AI assistant turn a photo, a PDF or a spreadsheet into a formula ready for import (section <a href="#s18-import-and-export">18</a>). The bench view lays a formula out in open groupings of materials, the way a Ryan Parfums-style bench sheet does, so that batches are prepared in the order you weigh them (section <a href="#s14-bench-view-and-printing">14</a>). And you can install it as an app with its own icon on Windows or macOS (section <a href="#s5-install-as-an-app-with-its-own-icon">5</a>).</p>
<p>There is nothing to install, no account, and your data stays in a file that you own.</p>
<p>And it will keep working. Before leaving Formulair the question was whether the next app would still exist in five years: many are one developer's hobby, and hosted ones stop when the hosting stops. miFormulas is one file that runs without any server, so your copy keeps working as it is, whatever happens to the site or the author. Your data is a plain JSON file you can read with any text editor. And the source is free software under the GPL: if the author loses interest, anyone can take it further.</p>
<p>This manual describes build 260909e. The build number of the copy you are using is shown next to the name in the top-left corner of the app.</p>

<h2 id="s1-getting-started">1. Getting started</h2>
<p>Open <a href="https://miformulas.com">https://miformulas.com</a> in a modern browser.</p>
<p><strong>Which browser.</strong> Chrome or Edge, on Windows or Mac, give you everything: your data in a file of your own and the app installed with its own icon. Safari on a Mac works as a Dock app with the data in the app's storage (section <a href="#s5-install-as-an-app-with-its-own-icon">5</a>). Firefox runs the app, but keeps the data in the browser only, cannot install it and may clear the storage when it closes; use it to have a look, not for daily work.</p>
<p class="helpfig">Screenshot in the online manual: <a href="https://miformulas.com/docs/manual.html#s1-getting-started">The start screen of miformulas.com.</a></p>
<p>The start screen offers three ways in:</p>
<ul>
<li><strong>Start with the starter set</strong> loads sixteen formulas and nearly two hundred materials to explore. They are marked "starter" so you can tell them from your own; edit or delete them as you like. Whatever you change or add from here on is your work, so make a habit of <strong>Backup</strong> (in the header) before you close the browser: it downloads a copy of the complete data file, named with date and time. Keep those copies together, for instance in <code>Documents\miFormulas\backups</code> (Windows) or <code>Documents/miFormulas/backups</code> (Mac).</li>
<li><strong>Open data file…</strong> opens a miFormulas data file you already have: the Backup you made last time, a file made by the Formulair importer, or a file a colleague sent you. This is how you get your own work back on another computer or in another browser: choose the most recent Backup from your backups folder and carry on where you left off. In Chrome and Edge the app then keeps saving to that file and offers to reopen it next time (section <a href="#s2-where-your-data-lives-browser-file-or-server">2</a>).</li>
<li><strong>Import from Formulair</strong> takes you to the importer for Formulair users (section <a href="#s19-coming-from-formulair">19</a>).</li>
</ul>
<p>Whichever way in you take, you land on the Welcome page with four tiles (formulas, versions and variations, materials, to order), the recently edited items, and the import and export buttons. Pick a formula or material in the list on the left, or create a new one with <strong>+ New formula</strong> and <strong>+ New material</strong> in the header.</p>
<p class="helpfig">Screenshot in the online manual: <a href="https://miformulas.com/docs/manual.html#s1-getting-started">The Welcome page after loading the starter set, with the amber storage bar.</a></p>
<p>Every change is saved automatically a few seconds after you make it; <strong>Ctrl+Z</strong> undoes it. Deleting a line, a version, a variation, a formula or a material always asks for confirmation.</p>
<h2 id="s2-where-your-data-lives-browser-file-or-server">2. Where your data lives: browser, file or server</h2>
<p>miFormulas stores everything in one JSON file, <code>miformulas-data.json</code>. The app can keep that file in three places, and the top-right of the header always tells you which one is in use ("Saved 14:02 · this browser", "Saved 14:02", "Connected to server").</p>
<p><strong>In the browser.</strong> On miformulas.com the app keeps the data in the browser's own storage on that computer. This is the quickest way to try things out, and it is fine for everyday use if you download a Backup regularly. Two things to know: every browser has its own storage (Edge and Chrome on the same computer do not see each other's data), and a browser that is set to clear site data when it closes will take your formulas with it. The app asks the browser to keep the storage persistent; as long as the browser has not confirmed that, an amber bar under the header reminds you to make backups.</p>
<p class="helpfig">Screenshot in the online manual: <a href="https://miformulas.com/docs/manual.html#s2-where-your-data-lives-browser-file-or-server">Browser storage: the amber bar reminds you, and Save to a data file… moves your work into a file (Chrome and Edge).</a></p>
<p><strong>In a file.</strong> In Chrome or Edge the app can read and write a data file on your disk directly. You see the file, you can copy it, put it in a synced folder, and open it on another computer. The app remembers which file you used; the next time you open it you click <strong>Reopen</strong> and, if the browser asks, allow it to write to the file again. This works with the downloaded app (section <a href="#s4-recommended-setup-and-the-other-ways-in">4</a>) and just as well on miformulas.com itself: <strong>Save to a data file…</strong> (in the amber bar or in Settings) moves your work from the browser's storage into a file, <strong>Open data file…</strong> on the start screen switches to an existing file, and the site remembers the file for next time. For a site the browser can also remember the permission itself, in particular once the site is installed as an app: the app then opens straight into your data, and Reopen only appears when the browser wants a fresh click. Combined with "Install as an app" (section <a href="#s5-install-as-an-app-with-its-own-icon">5</a>) that gives you an app with its own icon, your own data file, and updates that arrive by themselves. Firefox cannot write to files: on the site you work in the browser's storage and use Backup to save, and a downloaded copy opened in Firefox is read-mostly (pick the data file once, the app keeps a cached copy, and Backup is the way to save). Safari has no direct file access either, so expect the same there: browser storage and Backup; it has only been tried on the start screen.</p>
<p class="helpfig">Screenshot in the online manual: <a href="https://miformulas.com/docs/manual.html#s2-where-your-data-lives-browser-file-or-server">Next time, the start screen offers Reopen for the remembered data file.</a></p>
<p><strong>On a server.</strong> If you have a web server with PHP (a NAS at home, a small hosting account), put the app and the endpoint <code>server/data.php</code> on it and every device with the token shares the same data. The server refuses to overwrite changes made from another device in the meantime and keeps a daily snapshot. Section <a href="#s20-your-own-server">20</a> explains the setup.</p>
<p>Whichever mode you use, <strong>Backup</strong> in the header downloads a copy of the data file with a date and time in its name, and <strong>Open data file…</strong> on the start screen opens any such file. Moving between modes is nothing more than a Backup on one side and an Open on the other.</p>
<h2 id="s3-privacy-who-can-see-your-formulas">3. Privacy: who can see your formulas</h2>
<p>Nobody but you. miFormulas runs entirely on your own computer, inside your browser, and your data lives where you put it: in the browser's storage, in a file on your disk, or on a server you own. There is no account, no cloud, no telemetry and no update check, and the author of the app has no way to see your formulas. The app never uploads anything.</p>
<p>This is everything the app does on the network:</p>
<ul>
<li>On miformulas.com it loads the starter set from the same site when you click <strong>Start with the starter set</strong>, and on the first visit it checks once whether a <code>data.php</code> server sits next to it. The browser also fetches the small app manifest and the icons from the same site, which is what makes "Install as an app" possible.</li>
<li>The downloaded app makes one kind of request, and only when you click <strong>Start with the starter set</strong>: it fetches the starter set from miformulas.com. That request carries nothing of yours; as with any web page, the server sees that an address asked for a file. Once you have a data file, the app makes no request at all, and you can use it with the network switched off.</li>
<li>In server mode the app talks only to the server address you entered in Settings.</li>
<li><strong>Search</strong> in the order list, the product links and the links in the Help pages open Google, the shop or the site in a new tab, only when you click them.</li>
</ul>
<p>No analytics, no fonts or scripts loaded from elsewhere, nothing sent in the background. The Formulair importer reads your database in the browser and sends nothing; its database engine (sql.js) is embedded in the file.</p>
<p>miformulas.com is served by GitHub Pages, a static file server: it hands the same HTML file to everyone and receives nothing back. Like any website, its logs record that a page was requested from an address. If even that is more than you want, download the app once and never visit the site again.</p>
<p>The AI prompts in <a href="https://miformulas.com/docs/ai-prompts.html"><code>docs/ai-prompts.md</code></a> are the one exception, and you choose it yourself: what you paste or attach in an AI chat goes to that AI provider, under its terms, never to miformulas.</p>
<p><strong>Check it yourself.</strong> The whole app is one readable file, and the source is public under the GPL at <a href="https://github.com/miformulas/miformulas">https://github.com/miformulas/miformulas</a>.</p>
<ol>
<li>Open <code>miFormulas.html</code> (or <code>index.html</code>) in a text editor and search for <code>fetch(</code>. There are four in the code: the starter set, the <code>data.php</code> probe, and the two calls to your own server (load and save); the fifth hit is this sentence, because the manual is embedded in the app as the Help text. Search for <code>http</code> and you find the address of the starter set, the Google search address used by the order list, the licence links, and the links in the embedded manual. Outside this paragraph there is no <code>&lt;script src=</code>, no <code>XMLHttpRequest</code>, no <code>sendBeacon</code> and no <code>WebSocket</code>.</li>
<li>Or watch the browser: press F12, open the Network tab, and use the app for a while. With a data file, nothing appears at all.</li>
<li>Or compare: the file you download from miformulas.com is the file in the repository, byte for byte.</li>
</ol>
<p>These checks also tell you whether a copy of the app that reached you by another road was changed. Take the app from miformulas.com or from the repository.</p>
<h2 id="s4-recommended-setup-and-the-other-ways-in">4. Recommended setup, and the other ways in</h2>
<p>There is nothing to download or install in the usual sense: the whole app is one HTML file, <code>index.html</code> on the site, and it runs in any modern browser. Still, one setup beats the others if you want an app with its own icon and your formulas in a file on your own computer.</p>
<p><strong>Recommended: Chrome, on Windows and on Mac.</strong></p>
<ol>
<li>Open <a href="https://miformulas.com">https://miformulas.com</a> in Chrome. No Chrome? On Windows, Edge is already there and works exactly the same (the screenshots in section <a href="#s5-install-as-an-app-with-its-own-icon">5</a> are from Edge); on a Mac, install Chrome first, or read the Safari alternative below.</li>
<li>Click <strong>Install as an app</strong> on the start screen and confirm the browser's dialog. The app opens in its own window with its own icon; section <a href="#s5-install-as-an-app-with-its-own-icon">5</a> has the pictures and the menu route in case the link does not appear.</li>
<li>Click <strong>Start with the starter set</strong>, or <strong>Import from Formulair</strong> if that is where your formulas are (section <a href="#s19-coming-from-formulair">19</a>).</li>
<li>
<p>On the Welcome page click <strong>Save to a data file…</strong> (also in Settings). The app explains that it will create your data file, then asks where to keep it: choose a folder of your own, for instance <code>Documents\miFormulas</code>, and keep the name <code>miformulas-data.json</code>. From now on the app saves to that file and opens straight into it; make a subfolder <code>backups</code> there for the copies Backup makes.</p>
<p class="helpfig">Screenshot in the online manual: <a href="https://miformulas.com/docs/manual.html#s4-recommended-setup-and-the-other-ways-in">The app explains what it is about to create…</a></p>
<p class="helpfig">Screenshot in the online manual: <a href="https://miformulas.com/docs/manual.html#s4-recommended-setup-and-the-other-ways-in">…and the browser asks where to keep miformulas-data.json.</a></p>
</li>
</ol>
<p>That is all: your data is a file you can see, copy, put in a synced folder or restore from a backup, the app is a program of its own, and updates arrive by themselves.</p>
<p><strong>The other ways in</strong>, in order of preference:</p>
<ul>
<li><strong>Safari on a Mac, without Chrome.</strong> Choose <strong>File › Add to Dock</strong> (the start screen's <strong>Add to Dock…</strong> link explains it) and you get the same app in the Dock. Safari cannot write to a data file, so the data lives in the app's storage and Backup is your safety net; section <a href="#s5-install-as-an-app-with-its-own-icon">5</a> has the details.</li>
<li><strong>Just in the browser.</strong> Open the site and start; your work stays in the browser's storage, and an amber bar reminds you. Fine for a look; download a Backup before you leave, or click <strong>Save to a data file…</strong> when you decide to stay.</li>
<li>
<p><strong>The app file on your own computer.</strong> For those who want the file itself, offline or on a server of their own: On the start screen of miformulas.com click <strong>Download the app</strong>. The file <code>miFormulas.html</code> lands in your Downloads folder. Give it a folder of its own, for instance <code>Documents\miFormulas</code> (Windows) or <code>Documents/miFormulas</code> (Mac), and open it there in Chrome or Edge. The download is meant for Chrome and Edge; in Safari or Firefox the link says so first. The start screen now offers <strong>Start with the starter set</strong>; choose it and the app explains that it will create your data file, then asks where to keep it. Put <code>miformulas-data.json</code> in the same folder as the app and keep that name. From then on the app saves to that file automatically, and the next time you open the app it offers <strong>Reopen "miformulas-data.json"</strong>. Make a subfolder <code>backups</code> in the same folder for the copies that Backup makes.</p>
<p class="helpfig">Screenshot in the online manual: <a href="https://miformulas.com/docs/manual.html#s4-recommended-setup-and-the-other-ways-in">The downloaded app, opened from your own computer.</a></p>
<p class="helpfig">Screenshot in the online manual: <a href="https://miformulas.com/docs/manual.html#s4-recommended-setup-and-the-other-ways-in">Start with the starter set creates the data file next to the app.</a></p>
</li>
<li>
<p><strong>Coming from Formulair?</strong> Open <a href="https://miformulas.com/formulair-import.html">https://miformulas.com/formulair-import.html</a>, or click <strong>Import from Formulair</strong> in the app. It converts your Formulair database in the browser and adds it to miFormulas; nothing is uploaded. Section <a href="#s19-coming-from-formulair">19</a> has the steps.</p>
</li>
<li><strong>Everything at once.</strong> On the GitHub page <a href="https://github.com/miformulas/miformulas">https://github.com/miformulas/miformulas</a> click the green <strong>Code</strong> button, then <strong>Download ZIP</strong>. The ZIP holds the app, the Formulair importer, the starter data, the server endpoint and the tools.</li>
<li><strong>Your own server</strong>, so that all your devices share one library: section <a href="#s20-your-own-server">20</a>.</li>
</ul>
<p>Two things about the downloaded app that surprise people:</p>
<ul>
<li>The link between the app and your data file is kept by the browser, not by the HTML file. That is why the browser, and not miFormulas, asks once per session for permission to write to the file (for a local file it asks every session; for the site, and certainly for the installed app, it usually remembers), and why a freshly downloaded copy of the app still offers to reopen the data file you used before. Every local HTML file shares this memory, so it does not matter in which folder the app sits.</li>
<li>If Reopen fails because the data file was moved, renamed or deleted, the app says so, forgets the file and offers the starter set again. If you still have the file, use <strong>Open data file…</strong> to point the app at its new place.</li>
</ul>
<p>If you already made formulas on miformulas.com before downloading the app, click <strong>Backup</strong> there first; the downloaded app's start screen has <strong>Open data file…</strong> to continue with that file. (Using the site or the installed app instead? Then you do not need the download: <strong>Save to a data file…</strong> on the Welcome page or in Settings moves your data from the browser to a file of your own.)</p>
<p>Updating is the same as installing: download the new <code>miFormulas.html</code> and replace the old one. Your data file is separate and stays untouched.</p>
<h2 id="s5-install-as-an-app-with-its-own-icon">5. Install as an app with its own icon</h2>
<p>If you want miFormulas to feel like a program of its own rather than a tab, install it as an app: two minutes, no download, nothing difficult. It then opens in its own window without address bar or tabs, has its own icon in the taskbar, the Start menu or the Dock, and shows up when you switch between programs. Underneath it is the same app in the same browser: the installed app and the site in a normal tab share their data, their remembered data file and their updates.</p>
<p>Browsers only offer this for pages served over https, so it works with miformulas.com and with your own server if that has an https address. A downloaded <code>miFormulas.html</code> cannot be installed this way; the last part of this section shows a shortcut that comes close.</p>
<p><strong>The one-click way (Chrome and Edge, Windows and Mac).</strong> Open <a href="https://miformulas.com">https://miformulas.com</a>. When the browser can install the site, the start screen shows the link <strong>Install as an app</strong>, and the same button appears at the top of <strong>Settings</strong> (⚙) once you are working. Click it, and the browser's own install dialog appears with the name and icon; confirm, and the app opens in its own window. Nothing is downloaded and nothing else is installed: the browser does the work, and the installed app shares its data and its updates with the site in a normal tab. Want your data in a file of your own? Click <strong>Save to a data file…</strong> on the Welcome page (also in Settings): the app creates <code>miformulas-data.json</code> where you choose and remembers it. Chrome and Edge keep the permission to write to that file for an installed app, so from then on the app opens straight into your formulas, without questions. In Safari on a Mac the start screen shows <strong>Add to Dock…</strong> instead, which explains the File › Add to Dock route.</p>

<h3 id="windows">Windows</h3>

<p><strong>Google Chrome.</strong> Open <a href="https://miformulas.com">https://miformulas.com</a>. Click the <strong>⋮</strong> menu, then <strong>Cast, save and share</strong>, then <strong>Install miFormulas…</strong> (Chrome knows the app by name; for a site without a manifest the item reads "Install page as app…"), and confirm with <strong>Install</strong>. The small install icon at the right end of the address bar does the same. Chrome puts the app in the Start menu; right-click its taskbar icon while it runs to pin it. To remove it, open the app, click <strong>⋮</strong> in its title bar and choose <strong>Uninstall miFormulas…</strong>.</p>

<h3 id="macos">macOS</h3>
<p><strong>Safari</strong> (macOS Sonoma 14 or later). Open <a href="https://miformulas.com">https://miformulas.com</a>, then choose <strong>File</strong>, <strong>Add to Dock</strong>. Keep the name miFormulas and click <strong>Add</strong>. The app appears in the Dock and in the Applications folder of your home folder; open it from either. To remove it, drag it from your home folder's Applications folder to the Bin. Keep in mind that Safari cannot write to a data file. The Dock app keeps your data in its own storage, where it stays between sessions; the system only clears it when you clear website data or leave the app unused for a long time. Backup is your safety net, not your way of working: download one now and then, and use Chrome or Edge if you want a data file you can see and copy. The Dock app's storage is separate from Safari's tabs, so load the starter set, open your data file or fill in Settings in the Dock app itself. One trap: choosing Add to Dock a second time replaces the existing app and wipes its storage; download a Backup first.</p>
<p class="helpfig">Screenshot in the online manual: <a href="https://miformulas.com/docs/manual.html#s5-install-as-an-app-with-its-own-icon">The start screen in Safari on a Mac shows Add to Dock… instead of Install as an app.</a></p>
<p class="helpfig">Screenshot in the online manual: <a href="https://miformulas.com/docs/manual.html#s5-install-as-an-app-with-its-own-icon">Safari: File, Add to Dock.</a></p>

<p><strong>Chrome or Edge.</strong> The menus are the same as on Windows: in Chrome <strong>⋮</strong>, <strong>Cast, save and share</strong>, <strong>Install miFormulas…</strong>; in Edge <strong>⋯</strong>, <strong>Apps</strong>, <strong>Install this site as an app</strong>. The app lands in the Applications folder (Chrome Apps) and in Launchpad; drag it to the Dock to keep it there. Chrome and Edge on the Mac can write to a data file, so <strong>Open data file…</strong> and Reopen work as on Windows.</p>
<p><strong>The downloaded file.</strong> Neither Safari nor Chrome installs a local file as an app. What works is a small launcher: open <strong>Automator</strong>, create a new <strong>Application</strong>, add the action <strong>Run Shell Script</strong> and paste, with your own path:</p>
<pre><code>open -na "Google Chrome" --args --app="file:///Users/yourname/Documents/miFormulas/miFormulas.html"
</code></pre>
<p>Save it as miFormulas in your Applications folder and drag it to the Dock. To give it the miFormulas icon, open <code>miformulas.png</code> from the <code>icons</code> folder (<a href="https://miformulas.com/icons/miformulas.png">https://miformulas.com/icons/miformulas.png</a>) in Preview, select all and copy, then select the launcher in the Finder, press Cmd+I and paste onto the small icon in the top-left corner of the Info window.</p>
<p class="helpfig">Screenshot in the online manual: <a href="https://miformulas.com/docs/manual.html#s5-install-as-an-app-with-its-own-icon">Automator: a new document of the type Application.</a></p>

<h2 id="s6-the-screen">6. The screen</h2>
<p>The <strong>header</strong> holds, from left to right: the list toggle (☰, also Ctrl+B), <strong>Home</strong>, <strong>+ New formula</strong>, <strong>+ New material</strong>, the save state, <strong>Undo</strong> and <strong>Redo</strong>, <strong>Save</strong> (saving is automatic; this forces it now, also Ctrl+S), <strong>Backup</strong>, the reload button (⟳, use it after an update), the theme button (◐ Auto, ● Dark, ○ Light), <strong>Help</strong> (?, this manual inside the app, without the screenshots) and Settings (⚙).</p>
<p class="helpfig">Screenshot in the online manual: <a href="https://miformulas.com/docs/manual.html#s6-the-screen">The header.</a></p>
<p>The <strong>list panel</strong> on the left has three tabs. <strong>Formulas</strong> and <strong>Materials</strong> group their items by category with a coloured dot; the counter after each formula reads "3v · 1var" for three versions and one variation. <strong>To order</strong> is the shopping list. The search box filters the list: formulas by name; materials by name, CAS number and supplier, and from three characters also by the text in their description (those hits are marked with ✎). Typing "starter" lists the starter set.</p>
<p>The <strong>page</strong> on the right shows the selected formula or material, the order list, or the Welcome page.</p>
<p class="helpfig">Screenshot in the online manual: <a href="https://miformulas.com/docs/manual.html#s6-the-screen">The list panel on the left and a formula page on the right.</a></p>
<p>On a phone the list and the page take turns; the app is read-only there unless it can save (server, browser storage or a writable file), so that a tap cannot lose anything.</p>
<h2 id="s7-materials">7. Materials</h2>
<p>A material is anything you weigh: a raw material, a natural, a base, a solvent, one of your own predilutions. Its page holds the name, CAS number, category (with its own colour, used for the dots and the pyramid), supplier, the amount purchased, cost per gram, IFRA limit, whether it is a solvent, where it is stored (cupboard, fridge, freezer), and its position in the olfactive pyramid (Top, Top-heart, Heart, Heart-base, Base, or ?). Below that come the dilutions, the optional stock ledger, a free description, and the list of every formula the material appears in; click a name there to jump to it.</p>
<p class="helpfig">Screenshot in the online manual: <a href="https://miformulas.com/docs/manual.html#s7-materials">A material page: fields, dilutions and the stock ledger.</a></p>
<p><strong>Dilutions.</strong> A material offers only the dilutions you actually own. If you have Iso E Super at 100 % and at 10 % in ethanol, add both; if you only ever bought a 10 % dilution of a costly absolute, add only 10 %. One of them is the <strong>base</strong> dilution, the concentration that new formula lines start with; any dilution can be the base, and 100 % is not assumed. Deleting a dilution that formulas use is allowed: those lines keep their value, it only disappears from the pick list.</p>
<p><strong>Solvent.</strong> Tick this for ethanol, DPG, IPM, TEC and the like. Solvent lines carry no aromatic content: they do not count in the relative percentages and they are what the dilution tools exchange against.</p>
<p><strong>IFRA limit.</strong> Enter the limit in percent of the finished product for Category 4 (fine fragrance), taken from the standards library on ifrafragrance.org. Two special values: <strong>99</strong> means checked, no restriction; empty means not yet checked. The IFRA panel of a formula uses these figures (section <a href="#s16-ifra-check-and-category-panel">16</a>).</p>
<p><strong>Storage.</strong> A material stored in the fridge shows a ❄ next to formula lines that use it at its base concentration, also on the printed weighing sheet, so you know which bottles to fetch first.</p>
<p><strong>To order.</strong> A material you do not have yet, whether you added it from the order list or it came out of an import, carries the label "to order" and a 🛒 in the list until it is delivered.</p>
<p>Materials come from <strong>+ New material</strong> in the header (name, category and base dilution; the rest is filled in on the page), from the order list, from an import, or from the predilution tool. A material can only be deleted when no formula uses it; the page tells you which formulas do.</p>
<p>Filling in CAS numbers, IFRA limits, pyramid levels and descriptions for many materials is tedious; <a href="https://miformulas.com/docs/ai-prompts.html"><code>docs/ai-prompts.md</code></a> has a prompt that lets an AI assistant propose them from the <strong>All materials (Excel)</strong> export, for you to check and enter.</p>
<p>What miFormulas does not have is a built-in materials database of the kind some paid apps ship, where a new material arrives with its CAS number, IFRA limit and an odour description already filled in. The names, CAS numbers and IFRA limits of such a database are facts and could be shared freely; the odour descriptions are somebody's writing and cannot. For now the starter set, the Formulair import and the AI prompt above cover most of the ground; a shared materials file that can be imported on its own is an idea for later.</p>
<h2 id="s8-formulas-versions-and-variations">8. Formulas, versions and variations</h2>
<p>A <strong>formula</strong> is a named recipe in a category. Its history is a row of <strong>versions</strong>: v1, v2, v3 and so on, each with a date, an optional label, notes and its own lines. Only the latest version can be edited; every earlier version is a frozen record of what you did, kept exactly as it was. When you want to change something, create a new version (<strong>+ New version</strong> copies the version you are looking at) and edit that. Deleting a version is possible, deleting the past is not: a new version never rewrites an old one.</p>
<p class="helpfig">Screenshot in the online manual: <a href="https://miformulas.com/docs/manual.html#s8-formulas-versions-and-variations">The version row: the version list, + New version and Compare…</a></p>
<p>A <strong>variation</strong> is the same recipe in another presentation: the same formula at 20 % instead of 15 %, with the costly material taken from the 10 % dilution instead of the pure one, or made up as a 44 g batch instead of 100 g. A variation carries a label of your choice ("20%", "soap", "44gr") and comes in two kinds:</p>
<p class="helpfig">Screenshot in the online manual: <a href="https://miformulas.com/docs/manual.html#s8-formulas-versions-and-variations">New variation: a label, an optional target total, and which version it follows.</a></p>
<ul>
<li>A <strong>live</strong> variation stores only the deviations (dilution choices, a solvent correction, a target weight) and follows the formula. By default it follows the latest version; you can pin it to a specific version instead. Its lines are recomputed each time you look at it.</li>
<li>A <strong>frozen</strong> variation is a snapshot with its own lines that never changes. Click <strong>Freeze</strong> on a live variation to make it one; the badge shows which version it was frozen from.</li>
</ul>
<p>Formulas imported from Formulair are frozen too (section <a href="#s19-coming-from-formulair">19</a>): you read them, compare them and copy them, but to work on one you make a new version.</p>
<p><strong>Move into…</strong> appears on an imported formula that has one version and no variations, which is what every formula from the Formulair import looks like. It makes that formula a new version of another formula, or a frozen variation of one of its versions, and removes it from the list. Lines, notes, date, colour marks and trial log come along, and the import name stays on the version or variation as a reference. Everything is one Undo step. This is how you group the flat Formulair import (section <a href="#s19-coming-from-formulair">19</a>). Mind the order: choose the formula that should remain (usually the lowest number, or the base) as the target and move the others into it one by one; a formula that has already received versions cannot be moved itself any more.</p>
<p class="helpfig">Screenshot in the online manual: <a href="https://miformulas.com/docs/manual.html#s8-formulas-versions-and-variations">A live variation &quot;20%&quot; made up as 50 g, following the latest version.</a></p>
<p><strong>Copy to new formula</strong> takes the version you are looking at as v1 of a new formula, optionally with the variations. <strong>Rename</strong> and <strong>Change category</strong> do what they say; categories are shared between formulas and get a colour dot.</p>
<h2 id="s9-editing-a-formula">9. Editing a formula</h2>
<p>A formula line is a material, a dilution and a weight in grams. To add one, type the material's name in the <strong>Add material…</strong> box under the table (the list suggests as you type) and click <strong>Add line</strong>; the line starts at the material's base dilution with weight 0. Type the weight, choose another dilution from the list if you have one, or pick <strong>custom…</strong> for a percentage you do not stock (the app then warns with ⚠ that this dilution is not in your list, see section <a href="#s11-changing-dilutions">11</a>). Remove a line with ✕.</p>
<p class="helpfig">Screenshot in the online manual: <a href="https://miformulas.com/docs/manual.html#s9-editing-a-formula">A formula page: the lines table with dilution, weight, rel % and abs %.</a></p>
<p>If you add a material that is not in the library, the app offers to create it as a "to order" material: it goes on the order list, and the line is marked until the material is delivered.</p>
<p>The table can be ordered by original entry, by category or by pyramid level (top to base), or by clicking a column heading; the order is also used for the printed sheets. The little icon before each material name shows its pyramid level in the colour of its category.</p>
<p>Below the table sit <strong>Batch scaling</strong> (section <a href="#s12-batch-scaling-and-predilutions">12</a>), <strong>Notes</strong>, the <strong>Trial log</strong> (section <a href="#s13-colour-marks-notes-and-the-trial-log">13</a>), the <strong>Categories</strong> panel and the <strong>IFRA check</strong> (section <a href="#s16-ifra-check-and-category-panel">16</a>), and <strong>Mark as prepared</strong> for the stock ledger (section <a href="#s17-stock-orders-and-deliveries">17</a>).</p>
<h2 id="s10-percentages-and-the-perfumery-arithmetic">10. Percentages and the perfumery arithmetic</h2>
<p>The table shows two percentages per line, and they follow perfumery practice rather than plain weight shares.</p>
<p>The <strong>content</strong> of a line is its weight corrected for the dilution: 2 g of a 10 % dilution is 0.2 g of material.</p>
<p><strong>Rel %</strong> is the content of a line divided by the total content of all non-solvent lines. The column adds up to 100; solvent lines show a dash, because they carry no material. This is the composition of the concentrate, independent of how much ethanol is around it.</p>
<p><strong>Abs %</strong> is the content of a line divided by the total weight of the formula, solvents included. The total of this column is the concentration of the mix: a formula with 15 % abs in total is a 15 % concentrate. Solvent lines show their share of the weight here.</p>
<p>The <strong>cost</strong> of a line is weight × cost per gram × dilution, and the total cost is what the batch cost you in materials.</p>
<p>These rules are what makes the dilution tools work: changing a dilution while preserving rel % keeps the smell the same; the abs % and the total weight then tell you what happened to the strength and the batch size.</p>
<h2 id="s11-changing-dilutions">11. Changing dilutions</h2>
<p>Change the dilution of a line by choosing another value in its dilution list. Because a different dilution means a different weight for the same amount of material, the app asks how to proceed:</p>
<ul>
<li><strong>Preserve rel % and exchange solvent.</strong> The weight of the line changes so that its content stays the same, and the difference is taken from or given back to the solvent line (ethanol first, otherwise the first solvent). The total weight and the concentration do not change: this is the same formula, made from another bottle. Not available when there is no solvent line, or when the solvent line does not hold enough to give back.</li>
<li><strong>Preserve rel % only.</strong> The weight of the line changes, nothing else; the total weight and the abs % shift.</li>
<li><strong>Preserve weight.</strong> The grams stay as they are, so the material content and the rel % change. Use this when the weighing is the fact and the dilution was wrong.</li>
</ul>
<p class="helpfig">Screenshot in the online manual: <a href="https://miformulas.com/docs/manual.html#s11-changing-dilutions">Changing a dilution: the three ways to proceed, with the effect on weight and solvent.</a></p>
<p>The same question comes up when you replace a material by another one whose dilutions differ.</p>
<p><strong>Lower</strong> and <strong>Higher</strong> in the tick bar shift all ticked lines to the next lower or higher dilution that the material offers, preserving rel % and exchanging the solvent in one go (so the formula needs a solvent line); lines already at their lowest or highest are skipped and reported.</p>
<p class="helpfig">Screenshot in the online manual: <a href="https://miformulas.com/docs/manual.html#s11-changing-dilutions">Ticked lines and the tick bar: marks, Lower and Higher, Create predilution…</a></p>
<p>In a live variation the dilution list works the same way but stores an override instead of touching the version, so the variation keeps following the formula.</p>
<p>Lines with a dilution you do not stock are marked ⚠, typically after an import. They compute correctly; when you next make a version, convert them to a dilution you have with "preserve rel % and exchange solvent".</p>
<h2 id="s12-batch-scaling-and-predilutions">12. Batch scaling and predilutions</h2>
<p><strong>Batch scaling</strong> sits under the table. <strong>Apply factor</strong> multiplies every weight (2.5 turns a 40 g trial into 100 g). <strong>Target total</strong> rescales the whole formula to a given weight. <strong>Set EtOH for target abs %</strong> changes only the ethanol line so that the concentrate reaches the percentage you type, adding an ethanol line if there is none; the hint shows the maximum reachable with no ethanol at all. On a live variation, factor and target set the variation's target weight instead. On a read-only entry the target field is still there, because the printed weighing sheet uses it: type 10 g and print a 10 g weighing sheet without touching the formula.</p>
<p><strong>Create predilution…</strong> bundles ticked lines into a separate, weighable mix. Perfumers do this for the trace materials: instead of weighing 4 mg of five things, you weigh 4 g of each once into a premix and dose 0.4 g of that. The app takes the ticked lines as displayed, lets you name the predilution and choose a batch factor (the preview shows the mix weight, its aromatic strength and the smallest line), then creates three things at once: a frozen predilution formula in the category "Prediluties", a material in the category "Predils" with the aromatic concentration as its dilution and the cost per gram computed, and a new version of your formula in which the ticked lines are replaced by one line of the predilution at the same content. Everything is one Undo step.</p>
<p class="helpfig">Screenshot in the online manual: <a href="https://miformulas.com/docs/manual.html#s12-batch-scaling-and-predilutions">Create predilution: name, batch factor and a preview of the mix.</a></p>
<h2 id="s13-colour-marks-notes-and-the-trial-log">13. Colour marks, notes and the trial log</h2>
<p>Tick lines with the checkboxes on the left (Shift-click ticks a range) and use the <strong>tick bar</strong>: mark them red, green, blue or yellow, unmark them, or clear every mark. Marks are per version, or per variation for a live variation, and they carry over into new versions and copies. Use them as you like: what changed, what to smell for, what to check.</p>
<p><strong>Notes</strong> is a free text per version or variation, shown on the formula sheet. The <strong>Trial log</strong> is a dated list of short entries ("day 3, macerated, top too sharp") that also prints on the formula sheet.</p>
<h2 id="s14-bench-view-and-printing">14. Bench view and printing</h2>
<p><strong>Bench view</strong> (the button next to the formula name) is something you will not find in other formulation apps. It is inspired by the way Ryan Parfums builds his batches in his YouTube videos: start with the core materials, smell, then add the next group of materials step by step. Bench view turns the formula table into that kind of worksheet. The lines start in the <strong>Unsorted</strong> column on the left; drag them into named groups on the right, or tick several lines and choose <strong>Move ticked to…</strong>. The Unsorted column keeps every sort order of the table (original, A to Z, dilution, weight, rel %, category, pyramid), so sorting by category, ticking all the rose materials and moving them into one group takes a few clicks. Five groups are there to start with; <strong>+ Add group</strong> makes as many more as your batch needs, and you can rename, reorder and delete groups as you like. Each group shows its line count, weight, rel % and aromatic strength, so you see what each step adds to the batch. The arrangement is saved with the version or variation. <strong>Print bench sheet</strong> prints the groups with a checkbox per line, in the order you will weigh them.</p>
<p class="helpfig">Screenshot in the online manual: <a href="https://miformulas.com/docs/manual.html#s14-bench-view-and-printing">Bench view: the Unsorted column with its own sort order on the left, the groups you build the batch with on the right.</a></p>
<p>From the table view, three buttons under the lines:</p>
<ul>
<li><strong>Print weighing sheet</strong> prints the lines in the current order with a checkbox, the pyramid icon, the dilution, the grams to weigh and rel %, at the target weight from Batch scaling if you set one. Fridge materials carry the ❄.</li>
<li><strong>Formula sheet</strong> prints the complete entry with weights, both percentages, cost, notes and trial log.</li>
<li><strong>Excel</strong> downloads the entry as a CSV file with decimal commas, which Excel set to a European locale opens directly.</li>
</ul>
<p>Printing uses the browser's print dialog; choose "Save as PDF" there for a PDF.</p>
<h2 id="s15-comparing-versions">15. Comparing versions</h2>
<p><strong>Compare…</strong> (shown as soon as a formula has two entries) puts two versions or variations side by side, aggregated per material: weight and dilutions in A, weight and dilutions in B, rel % in each, and the difference in rel %. Lines only in B are green, lines only in A red, changed lines yellow; the default order puts the largest changes first, and the totals show the weight and the concentration of both. Change A and B with the two lists and close with <strong>Close compare</strong>.</p>
<p class="helpfig">Screenshot in the online manual: <a href="https://miformulas.com/docs/manual.html#s15-comparing-versions">Compare: two versions side by side, aggregated per material, largest change first.</a></p>
<h2 id="s16-ifra-check-and-category-panel">16. IFRA check and category panel</h2>
<p>The <strong>IFRA check</strong> panel judges the formula against the limits you entered on the materials. It takes each material's rel %, multiplies it by the concentrate dosage (by default the formula's own abs % total, but type another figure to see the same concentrate at 12 % or 20 % in a finished product), and compares the result with the material's limit. The heading says at once whether the formula is within limits or how many materials are over; the table shows the restricted materials with their share in the product, their limit and the percentage of the limit that is used, the worst first. Materials without a limit entered are listed as not yet verified. The check is a help, not an IFRA certificate: it knows only what you entered, and only for the product category you had in mind when you entered it.</p>
<p class="helpfig">Screenshot in the online manual: <a href="https://miformulas.com/docs/manual.html#s16-ifra-check-and-category-panel">The IFRA check panel: materials over their limit come first.</a></p>
<p>The <strong>Categories</strong> panel shows how the non-solvent content is spread over material categories, dilution-corrected, with a bar per category. The pyramid drawing above the table does the same per pyramid level.</p>
<p class="helpfig">Screenshot in the online manual: <a href="https://miformulas.com/docs/manual.html#s16-ifra-check-and-category-panel">The Categories panel.</a></p>
<h2 id="s17-stock-orders-and-deliveries">17. Stock, orders and deliveries</h2>
<p><strong>Stock</strong> is an optional ledger per material, in grams of the base concentration. Open the Stock panel on a material and set a <strong>stocktake</strong> (what is in the bottle now) to start tracking. From then on purchases add, and two things deduct: <strong>Dilution made</strong> (you made 50 g of a 10 % dilution, so 5 g of base left the bottle) and <strong>Mark as prepared</strong> on a formula, which deducts every base-dilution line of tracked materials, once per version or variation. Purchases in millilitres are converted with the material's density; without a density they are logged but not counted. The ledger follows the base material only, not the dilutions you made from it: a formula line at 10 % does not touch the stock, and an empty bottle of dilution is no problem as long as the base material is still there, because you can make a fresh dilution and log it as <strong>Dilution made</strong>. The estimate is only as good as the entries; the ledger keeps the last events so you can remove a wrong one.</p>
<p><strong>To order</strong> is the shopping list. Add a material from the list itself (existing or new), with <strong>Add to order list</strong> on a material page, or automatically when a formula or an import mentions a material you do not have. Each entry has a note, an amount and unit, a price and a product link; <strong>Search</strong> opens a Google search limited to the web shops you listed under <strong>Edit shop list</strong> (the list starts empty; add the shops you buy from, one domain per line). <strong>Delivered</strong> closes an entry: it records the amount purchased, the price and the date on the material, computes the cost per gram from price and amount (millilitres via density), adds to the stock ledger if the material is tracked, creates the material if it was new, and removes the "to order" label.</p>
<p class="helpfig">Screenshot in the online manual: <a href="https://miformulas.com/docs/manual.html#s17-stock-orders-and-deliveries">The order list.</a></p>
<h2 id="s18-import-and-export">18. Import and export</h2>
<p>The Welcome page has the import and export buttons. <strong>Import from Formulair…</strong> opens the importer described in section <a href="#s19-coming-from-formulair">19</a>.</p>
<p><strong>Import formula…</strong> reads a miformulas-import JSON file: a formula transcribed from a photo or a document, either as a new formula or as a new version of an existing one. The import page shows every line with its match in your library, the total weight (a round number suggests a complete transcription), which materials are new (they are created as "to order") and which dilutions you do not stock (⚠). Nothing is converted: dilutions and weights come in exactly as written, and you convert in a next version. Confirm, and the formula opens. The file format is the small JSON shown in prompt 1 of <a href="https://miformulas.com/docs/ai-prompts.html"><code>docs/ai-prompts.md</code></a>; anything that writes such a file can feed the app.</p>
<p class="helpfig">Screenshot in the online manual: <a href="https://miformulas.com/docs/manual.html#s18-import-and-export">The import page: every line with its match, the total weight, new materials and dilutions you do not stock.</a></p>
<p><strong>Turning a photo, PDF or spreadsheet into an import file.</strong> You do not have to write that file by hand. Any AI assistant that can read images and files (ChatGPT, Claude, Gemini, Copilot and others) produces it from a photo of a handwritten sheet, a scan, a PDF or a spreadsheet: paste the ready-made prompt from <a href="https://miformulas.com/docs/ai-prompts.html"><code>docs/ai-prompts.md</code></a> (also at https://miformulas.com/docs/ai-prompts.html), attach the photo or file, save the answer as a <code>.json</code> file and import it. The prompt tells the AI assistant to transcribe verbatim, to convert nothing, to use the name on the sheet and never to invent one, and to report the total weight and every doubtful line. Attach the <strong>All materials (Excel)</strong> export as well and the assistant uses the exact names of your library, so that every line lands on the right material. The app itself never talks to an AI; the conversion happens in the assistant of your choice, with your files, on your account. That separation is deliberate: a built-in AI would need a paid API key and would send your formulas to a third party, and neither fits an app that keeps everything on your own computer.</p>
<p><strong>All formulas (Excel)</strong> and <strong>All materials (Excel)</strong> download the whole library as CSV files, one row per formula line with both percentages and cost, and one row per material with all its fields, stock and dilutions. Decimals use a comma, as Excel in Belgium and most of Europe expects; elsewhere open them with Excel's text import and choose the separators.</p>
<h2 id="s19-coming-from-formulair">19. Coming from Formulair</h2>
<p>A word about Formulair first. I discovered perfumery together with Formulair, Sam Macer's formulation app for the Mac, and for an app built before the AI era it was remarkably complete: materials with their dilutions, formulas with notes and colour marks, costs, IFRA limits, stock. Only two things drove me to build miFormulas: the limits that come with a Mac-only app, and the possibilities that AI assistants now offer around a formulation notebook. The importer below is a bridge and a homage: everything you built in Formulair comes along.</p>
<p>The importer at <a href="https://miformulas.com/formulair-import.html">https://miformulas.com/formulair-import.html</a> reads the Formulair database entirely in your browser and adds your formulas and materials to miFormulas, whatever it uses to save (browser storage, a data file or a server). Nothing leaves your computer.</p>
<ol>
<li>The database is the file <code>DataModel.sqlite</code> in Formulair's own folder, which the Finder keeps hidden; the steps below get a complete copy of it onto your Desktop.</li>
<li>
<p>In Formulair choose <strong>File</strong>, <strong>Close</strong>; Formulair writes its latest changes into the database file and quits by itself (a plain Cmd+Q does not always write them). In the Finder choose <strong>Go</strong>, <strong>Go to Folder…</strong>, paste <code>~/Library/Containers/co.uk.lux-terra.Formulair/Data/Library/Application Support/Formulair/</code> and copy <code>DataModel.sqlite</code> to the Desktop. A quick check: <code>DataModel.sqlite</code> should now carry today's date, and <code>DataModel.sqlite-wal</code> next to it should be small (kilobytes, not megabytes). If the -wal file is large, your latest changes are still in it: copy all three files (<code>DataModel.sqlite</code>, <code>-wal</code> and <code>-shm</code>) to a folder <code>Formulair</code> on the Desktop and fold them in with one line in Terminal, <code>sqlite3 ~/Desktop/Formulair/DataModel.sqlite "PRAGMA wal_checkpoint(TRUNCATE);"</code>, then use the <code>DataModel.sqlite</code> from that folder.</p>
<p class="helpfig">Screenshot in the online manual: <a href="https://miformulas.com/docs/manual.html#s19-coming-from-formulair">Finder: Go, Go to Folder… with the Formulair path.</a></p>
<p class="helpfig">Screenshot in the online manual: <a href="https://miformulas.com/docs/manual.html#s19-coming-from-formulair">The Formulair folder: DataModel.sqlite with its -wal and -shm files. After File, Close the database carries today's date and the -wal file is small.</a></p>
</li>
<li>
<p>Open the importer: click <strong>Import from Formulair</strong> on the start screen or in the Import &amp; export box on the Welcome page, or go to <a href="https://miformulas.com/formulair-import.html">https://miformulas.com/formulair-import.html</a>. Drop <code>DataModel.sqlite</code> on it and wait a moment; the file can be large because Formulair keeps a long sync history inside it.</p>
<p class="helpfig">Screenshot in the online manual: <a href="https://miformulas.com/docs/manual.html#s19-coming-from-formulair">The Formulair importer after reading the database.</a></p>
</li>
<li>
<p>Click <strong>Add to miFormulas</strong>. The app opens and adds everything to what is already there: materials with the same name are matched (their Formulair dilutions come along and empty fields are filled in), the others are added, and every Formulair formula arrives as a frozen formula. A message tells you the counts; one Undo takes the whole import back, and a formula imported before is not imported twice. Prefer a file? <strong>Download miformulas-data.json</strong> gives the same data as a file, for a server or your own tools. <strong>Back to miFormulas</strong> at the top returns to the app without importing.</p>
</li>
</ol>
<p>Every Formulair formula becomes a miFormulas formula with one frozen version, keeping its notes, date, category and colour marks per line, and every material comes with its dilutions, CAS, supplier, cost, IFRA limit, pyramid level, stock and description; categories keep their colours. Nothing is converted or renamed, and amounts are in grams.</p>
<p>Formulair is flat: "Aura v04" and "Aura v05" are two separate formulas there, and they stay separate here. Grouping them into one formula with versions v4 and v5, and turning "Aura v05 20%" into a variation, is a decision for you, made afterwards in the app with <strong>Move into…</strong> (section <a href="#s8-formulas-versions-and-variations">8</a>): open "Aura v05", click Move into…, pick "Aura v04" (the app suggests it when the names differ only in the number at the end) and choose version or variation; then rename "Aura v04" to "Aura". Start from the formula that should remain and move the others into it, because a formula that already holds several versions can no longer be moved itself. The app never groups by itself, because every perfumer names things differently. For a large library, <a href="https://miformulas.com/docs/ai-prompts.html"><code>docs/ai-prompts.md</code></a> has a prompt that lets an AI assistant propose the grouping from the list of names, for you to review before you start.</p>
<p>The same conversion exists as a command-line script, <code>tools/formulair-naar-json.py</code>, for those who prefer a terminal.</p>
<h2 id="s20-your-own-server">20. Your own server</h2>
<p>With a server, every device you own works on the same data, and nobody has to remember to copy files. You need a web server with PHP (8.x) that you can put files on: a Synology or QNAP NAS with its web station, a Raspberry Pi, a small hosting account.</p>
<ol>
<li>Put <code>index.html</code> and <code>server/data.php</code> in a folder on the server, and create a folder <code>data</code> next to them that the web server is allowed to write to. On a NAS this means giving the web server's user (often <code>http</code>) read and write rights on that folder; the endpoint tells you in plain words when it cannot write.</li>
<li>Open <code>data.php</code> in a text editor and replace <code>change-me-to-a-long-random-token</code> by a long random string of your own. This token is the password to your data.</li>
<li>Put your <code>miformulas-data.json</code> in the <code>data</code> folder (a Backup from the app, or the file from the Formulair importer), or let the app create it.</li>
<li>Open the server's address in a browser. The app detects <code>data.php</code> next to itself, asks for the token once, and from then on says "Connected to server". On other devices, open the same address and give the same token; or open Settings and fill in the server endpoint and token by hand, which also works for a <code>data.php</code> at another address than the app.</li>
</ol>
<p>What the endpoint does: it returns the data with an ETag, accepts a save only when the ETag still matches, so that two devices can never overwrite each other (the app then shows a conflict warning: make a Backup, reload and redo the change), and it keeps a snapshot of the previous state in <code>data/snapshots</code> on the first save of each day, fourteen days long. Restoring one is copying that file over <code>miformulas-data.json</code>.</p>
<p>Reaching the server from outside your home is a matter of your network. A VPN such as Tailscale is the simple and safe way, and it can also give the server an https address, which the "Install as an app" options need. Do not put <code>data.php</code> on the open internet without https: the token travels in a header.</p>
<p>To update the app on the server, copy the new <code>index.html</code> over the old one; the data stays.</p>
<p>If you would like step-by-step instructions for your own device, <a href="https://miformulas.com/docs/ai-prompts.html"><code>docs/ai-prompts.md</code></a> has a prompt that turns this section and <code>data.php</code> into a guided setup with an AI assistant.</p>
<h2 id="s21-settings-theme-and-keyboard-shortcuts">21. Settings, theme and keyboard shortcuts</h2>
<p><strong>Settings</strong> (⚙, also on the start screen) has the number format (browser default, or a fixed locale such as 1.234,56 or 1,234.56; input accepts both comma and point in any case), the server endpoint and its token, and a few buttons that depend on the situation: <strong>Install as an app</strong> when the browser offers it, <strong>Save to a data file…</strong> and <strong>Delete the data kept in this browser…</strong> in browser-storage mode, and <strong>Forget the remembered data file…</strong> when a file is remembered.</p>
<p class="helpfig">Screenshot in the online manual: <a href="https://miformulas.com/docs/manual.html#s21-settings-theme-and-keyboard-shortcuts">Settings in browser-storage mode.</a></p>
<p>The <strong>theme</strong> button cycles between Auto (follows Windows or macOS), Dark and Light.</p>
<p>Shortcuts: <strong>Ctrl+Z</strong> undo, <strong>Ctrl+Y</strong> or <strong>Ctrl+Shift+Z</strong> redo (up to fifty steps), <strong>Ctrl+S</strong> save now, <strong>Ctrl+B</strong> hide or show the list panel, <strong>Shift-click</strong> on a checkbox ticks a range. On a Mac use Cmd instead of Ctrl.</p>
<h2 id="s22-backups-and-recovery">22. Backups and recovery</h2>
<p><strong>Backup</strong> in the header downloads the complete data file, named with date and time (<code>260907_1402_miformulas-data.json</code>). Make one before anything you are not sure about, and regularly in browser-storage mode; keep them in a <code>backups</code> folder.</p>
<p>The app also keeps one <strong>daily snapshot</strong> in the browser: the state before the first save of the day. In file mode, if the data file is lost, the start screen offers <strong>Restore daily snapshot</strong> with its date; load it and use Backup to write it to a file.</p>
<p>In server mode the server keeps daily snapshots for fourteen days (section <a href="#s20-your-own-server">20</a>).</p>
<p><strong>Open data file…</strong> opens any of these files. <strong>Undo</strong> covers everything you did since the app was opened, deletions included; it does not survive a reload.</p>
<h2 id="s23-questions-and-answers">23. Questions and answers</h2>
<p><strong>The start screen only offers Reopen, and I want the starter set.</strong> The browser still remembers your data file. Click Reopen; if the file exists you continue with it, and if it is gone the starter set comes back. To start a second library next to the first, make a Backup, then delete the browser data for the site (Settings in browser-storage mode) or open another data file.</p>
<p><strong>I opened the app in another browser and my data is not there.</strong> Browser storage and the remembered file belong to one browser. Use Backup in the first browser and Open data file… in the second, or switch to a file or a server, which every browser on the computer can open.</p>
<p><strong>Edge asks every time whether the app may edit the file.</strong> That is the browser's rule for local files: one click per session, and the app cannot avoid it. For a site with https the browsers may remember the choice.</p>
<p><strong>The amber bar says my data may be cleared.</strong> The browser has not promised to keep the site's storage. Click <strong>Save to a data file…</strong> in that bar to move your work into a file of your own (Chrome and Edge), or make backups, or check the browser's setting for clearing site data on exit.</p>
<p><strong>A line shows ⚠.</strong> Its dilution is not in the material's list. Add that dilution to the material if you do have it, or convert the line to a dilution you have in a next version.</p>
<p><strong>The IFRA panel says "not yet verified".</strong> Those materials have no limit entered. Look them up on ifrafragrance.org and enter the limit, or 99 if there is none.</p>
<p><strong>Can I use it on a phone?</strong> Yes, with a server, or with browser storage on the phone. Without a way to save, the app is read-only on a phone.</p>
<p><strong>Can the author of miFormulas see my formulas?</strong> No. Nothing leaves your computer unless you put it on a server of your own, and the app never contacts miformulas.com except to fetch the starter set when you ask for it. Section <a href="#s3-privacy-who-can-see-your-formulas">3</a> lists every network request the app makes and how to verify that yourself in the code.</p>
<p><strong>Where is the data of an installed app?</strong> In the browser that installed it, in the same place as the site: the app and the tab share their storage and their remembered file.</p>
<p><strong>I want the site to forget my data file.</strong> Open Settings (⚙): the button "Forget the remembered data file…" makes the app stop offering Reopen. The file itself is not touched.</p>
<p><strong>Where do I report a problem or suggest something?</strong> On GitHub, at <a href="https://github.com/miformulas/miformulas/issues">https://github.com/miformulas/miformulas/issues</a> (the <strong>Feedback</strong> link on the start screen goes there; writing there needs a free GitHub account). Say which browser you use and the build number shown next to the name in the header, and what you did; a Backup of a data file that shows the problem helps most, if you are willing to share it.</p>
<p class="helpfig">Screenshot in the online manual: <a href="https://miformulas.com/docs/manual.html#s23-questions-and-answers">Settings with a remembered data file: Forget the remembered data file…</a></p>

<script>
"use strict";
/* ---------- state ---------- */
let DATA = null, HANDLE = null, DIRTY = false, FALLBACK = !window.showOpenFilePicker;
let VIEW = {tab:"F", id:null, sub:null};   // sub = {type:'v'|'var', idx}
let USAGE = {};   // materialId -> [{fid, name, where}]
const $ = s => document.querySelector(s);
const esc = s => (s??"").toString().replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const uid = p => p + Math.random().toString(36).slice(2,8);
let LOCALE = undefined;   // number format for display; undefined = browser default, set in Settings
const fmt = (x,d=3) => x==null||isNaN(x) ? "–" : x.toLocaleString(LOCALE,{minimumFractionDigits:d,maximumFractionDigits:d});
const fmtS = (x,d=2) => x==null||isNaN(x) ? "–" : x.toLocaleString(LOCALE,{minimumFractionDigits:0,maximumFractionDigits:d});
const parseNum = s => {
  if (typeof s === "number") return s;
  s = (s||"").toString().trim();
  if (s.includes(",")) s = s.replace(/\./g,"").replace(",",".");          // Belgian: 1.234,56
  else if ((s.match(/\./g)||[]).length > 1) s = s.replace(/\./g,"");      // 1.234.567 → thousands
  /* a single dot without comma is a decimal point (phone keyboards, English habit): 2.5 stays 2.5 */
  const v = parseFloat(s); return isNaN(v) ? null : v;
};
const pad2 = n => String(n).padStart(2,"0");
const today = () => { const d = new Date(); return `${d.getFullYear()}-${pad2(d.getMonth()+1)}-${pad2(d.getDate())}`; };   // local date
const isMobile = () => window.matchMedia("(max-width:700px)").matches;
const PYR = ["Top","Top-heart","Heart","Heart-base","Base","?"];

/* ---------- persistence ---------- */
const idb = {
  // Fully defensive: sandboxed webviews (e.g. some cloud-storage file viewers) block IndexedDB.
  db: null,
  open(){ return new Promise(res => {
    let r;
    try { r = window.indexedDB.open("miformulas", 1); } catch(e){ res(); return; }
    if (!r){ res(); return; }
    r.onupgradeneeded = () => { try{ r.result.createObjectStore("kv"); }catch(e){} };
    r.onsuccess = () => { idb.db = r.result; res(); };
    r.onerror = () => res();
    r.onblocked = () => res();
  }); },
  get(k){ return new Promise(res => { if (!idb.db) return res(null);
    try{ const t = idb.db.transaction("kv").objectStore("kv").get(k); t.onsuccess = () => res(t.result); t.onerror = () => res(null); }
    catch(e){ res(null); } }); },
  set(k,v){ return new Promise(res => { if (!idb.db) return res();
    try{ const t = idb.db.transaction("kv","readwrite").objectStore("kv").put(v,k); t.onsuccess = res; t.onerror = res; }
    catch(e){ res(); } }); }
};
let RESTORE = null;
async function tryRestore(){
  if (FALLBACK) return false;
  try{
    const h = await idb.get("fileHandle");
    if (!h) return false;
    if (await h.queryPermission({mode:"readwrite"}) === "granted") return await loadFromHandle(h);
    RESTORE = h;   // needs a user gesture — landing shows a reopen button
    return false;
  }catch(e){ return false; }
}
const SCHEMA = 1;
const SHOP_DEFAULTS = [];   // web shops for the order-list search; edit the list in the To order tab
function migrate(d){
  d.meta ||= {schema: SCHEMA};
  d.shopSites ||= [...SHOP_DEFAULTS];
  d.orderList ||= [];
  for (const f of d.formulas || []){
    for (const va of f.variations || [])   // a non-frozen variation with own lines (old detach experiments) becomes frozen
      if (va.lines && !va.frozen) va.frozen = true;
    for (const v of f.versions || [])      // Formulair imports are read-only
      if (v.sourceName && v.imported === undefined) v.imported = true;
  }
  for (const m of d.materials || []) delete m._descHit;   // transient search flag that once leaked into the file
  for (const o of d.orderList){            // old free-text amounts → number + unit
    if (typeof o.amount === "string"){
      const am = o.amount.match(/([\d.,]+)\s*(g|gr|gram|ml)?/i);
      o.unit = am && /ml/i.test(am[2]||"") ? "ml" : (o.unit || "g");
      o.amount = am ? parseNum(am[1]) : null;
    }
  }
  // future structural upgrades go here: if (d.meta.schema === 1){ …; d.meta.schema = 2; }
  if (d.meta.schema > SCHEMA) alert(`This data file was written by a newer miFormulas version (schema ${d.meta.schema}). Update the app before editing.`);
  return d;
}
const CORRUPT_MSG = "The data file could not be read (invalid JSON). Nothing was changed.\n\nRestore a timestamped backup, the version history of your cloud storage, or the daily snapshot on the start screen.";
async function loadFromHandle(h){
  const f = await h.getFile();
  let parsed;
  try{ parsed = JSON.parse(await f.text()); }
  catch(e){ alert(CORRUPT_MSG); return false; }
  DATA = migrate(parsed);
  HANDLE = h; await idb.set("fileHandle", h);
  return true;
}
function serialize(){
  // keys starting with "_" are transient UI state and never reach the file
  return JSON.stringify(DATA, (k,v) => k.startsWith("_") ? undefined : (typeof v === "number" && !Number.isInteger(v) ? +v.toFixed(6) : v), 1);
}
async function openFile(){
  if (FALLBACK){ $("#fileFallback").click(); return; }
  try{
    const opts = {id:"miformulas-data", types:[{description:"miFormulas data",accept:{"application/json":[".json"]}}]};
    if (RESTORE) opts.startIn = RESTORE;
    const [h] = await window.showOpenFilePicker(opts);
    if (await loadFromHandle(h)) boot();
  }catch(e){}
}
$("#fileFallback").addEventListener("change", async e => {
  const f = e.target.files[0]; if(!f) return;
  const text = await f.text();
  let parsed;
  try{ parsed = JSON.parse(text); }
  catch(err){ alert(CORRUPT_MSG); return; }
  DATA = migrate(parsed);
  if (DEMO) idb.set("demoData", text); else idb.set("cachedData", {json: text, when: Date.now(), name: f.name});   // fast path for next visit (iOS)
  boot();
});
let saveTimer = null;
function markDirty(){
  DIRTY = true; $("#saveState").textContent = "Unsaved changes"; $("#saveState").className = "dirty";
  clearTimeout(saveTimer); saveTimer = setTimeout(saveData, 2500);
}
/* ---------- storage modes ----------
   REMOTE: a server endpoint (set in Settings, or detected once as data.php next to the app)
   HANDLE: a local file through the File System Access API
   DEMO:   served over http(s) without a server — the browser keeps the data in IndexedDB
   otherwise the read-mostly fallback with a file picker (iOS, Firefox) */
let REMOTE = false, DEMO = false, API = "";
const STARTER_URL = location.protocol === "file:" ? "https://miformulas.com/data/miformulas-starter.json" : "data/miformulas-starter.json";   // next to the app on a server; the downloaded app fetches it from the site
async function loadStarter(){
  try{
    const r = await fetch(STARTER_URL, {cache: "no-store"});
    if (!r.ok) throw new Error("HTTP " + r.status);
    return migrate(await r.json());
  }catch(e){ alert("The starter set could not be loaded (" + e.message + ")." + (location.protocol === "file:" ? "\n\nIt is fetched from miformulas.com, so this needs an internet connection." : "")); return null; }
}
let ETAG = null, TOKEN = null, CONFLICT = false;
async function probeServer(){
  // earlier builds always talked to data.php next to the app; keep that working without configuration
  try{ const r = await fetch("data.php", {cache: "no-store"}); return (r.status === 401 || r.ok) ? "data.php" : null; }
  catch(e){ return null; }
}
async function remoteLoad(){
  try{
    const r = await fetch(API, {headers: {"X-Token": TOKEN || ""}, cache: "no-store"});
    if (r.status === 401){
      const t = prompt("Access token for this miFormulas server:"); if (!t) return false;
      TOKEN = t.trim(); await idb.set("token", TOKEN); return remoteLoad();
    }
    if (r.status === 404){ alert("The server at " + API + " has no data file yet (HTTP 404)."); return false; }
    if (!r.ok){ alert(`Could not load data from the server (HTTP ${r.status}).`); return false; }
    ETAG = r.headers.get("ETag");
    let parsed; try{ parsed = await r.json(); }catch(e){ alert(CORRUPT_MSG); return false; }
    DATA = migrate(parsed); CONFLICT = false;
    return true;
  }catch(e){ alert("Server not reachable: " + e.message); return false; }
}
async function remoteSave(){
  const s = serialize();
  try{
    const r = await fetch(API, {method: "PUT", headers: {"Content-Type": "application/json", "X-Token": TOKEN || "", "If-Match": ETAG || ""}, body: s});
    if (r.status === 409){
      CONFLICT = true;
      $("#saveState").textContent = "⚠ Conflict: changed on another device — reload (F5) before editing"; $("#saveState").className = "dirty";
      if (!remoteSave._warned){ remoteSave._warned = true; alert("The data was changed on another device since you loaded it.\n\nUse Backup to keep your current work, then reload (F5) and redo the change."); }
      return;
    }
    if (r.status === 401){ TOKEN = null; await idb.set("token", null); $("#saveState").textContent = "Token rejected — reload to re-enter"; $("#saveState").className = "dirty"; return; }
    if (!r.ok){ $("#saveState").textContent = `Save failed (server ${r.status}) — use Backup`; $("#saveState").className = "dirty"; return; }
    ETAG = r.headers.get("ETag") || ETAG;
    DIRTY = false; remoteSave._warned = false;
    $("#saveState").textContent = "Saved " + new Date().toLocaleTimeString(LOCALE,{hour:"2-digit",minute:"2-digit"}) + " · server"; $("#saveState").className = "";
  }catch(e){ $("#saveState").textContent = "Server not reachable — changes kept in memory, use Backup"; $("#saveState").className = "dirty"; }
}
let LASTBAK = null;
async function saveData(){
  if (!DATA) return;
  if (REMOTE) return remoteSave();
  if (HANDLE){
    try{
      const s = serialize();
      const w = await HANDLE.createWritable();
      await w.write(s); await w.close();
      const day = today();
      if (LASTBAK !== day){ LASTBAK = day; idb.set("dailyBak", {date: day, json: s}); }
      DIRTY = false; $("#saveState").textContent = "Saved " + new Date().toLocaleTimeString(LOCALE,{hour:"2-digit",minute:"2-digit"}) + " \u00b7 " + HANDLE.name; $("#saveState").className = "";
    }catch(e){ $("#saveState").textContent = "Save failed — use Backup"; $("#saveState").className = "dirty"; }
  } else if (DEMO){
    const s = serialize();
    await idb.set("demoData", s);
    if (!saveData._persistAsked){ saveData._persistAsked = true; requestPersistence(); }
    const day = today();
    if (LASTBAK !== day){ LASTBAK = day; idb.set("dailyBak", {date: day, json: s}); }
    DIRTY = false; $("#saveState").textContent = "Saved " + new Date().toLocaleTimeString(LOCALE,{hour:"2-digit",minute:"2-digit"}) + " · this browser"; $("#saveState").className = "";
  } else {
    $("#saveState").textContent = "No file access — use Backup to download"; $("#saveState").className = "dirty";
  }
}
async function backup(){
  if (!DATA) return;
  const d = new Date(), p = n => String(n).padStart(2,"0");
  const name = `${String(d.getFullYear()).slice(2)}${p(d.getMonth()+1)}${p(d.getDate())}_${p(d.getHours())}${p(d.getMinutes())}_miformulas-data.json`;
  if (window.showSaveFilePicker){
    try{
      const opts = {id:"miformulas-backup", suggestedName:name,
        types:[{description:"miFormulas backup", accept:{"application/json":[".json"]}}]};
      const prev = await idb.get("backupHandle");
      if (prev) opts.startIn = prev;   // picker opens in the last backup location
      const h = await window.showSaveFilePicker(opts);
      const w = await h.createWritable(); await w.write(serialize()); await w.close();
      await idb.set("backupHandle", h);
      $("#saveState").textContent = "Backup saved: " + h.name; $("#saveState").className = "";
    }catch(e){ /* picker cancelled */ }
  } else {
    const a = document.createElement("a");
    a.href = URL.createObjectURL(new Blob([serialize()],{type:"application/json"}));
    a.download = name; a.click(); URL.revokeObjectURL(a.href);
