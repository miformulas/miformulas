  const prev = await idb.get("dailyBak");
  LASTBAK = day;
  if (!prev || prev.date !== day) idb.set("dailyBak", {date: day, json: serialize()});
}
// The copy in this browser, on its way in. Three outcomes, because they are three different things to say:
// "ok" the app is running, "broken" the copy itself could not be read, "stuck" the copy was read fine but the app
// could not open it. That last one used to be caught as "your data is damaged", on a start screen boot() had already
// hidden on its first line, so it left a blank page. Its own branch now, with the one thing that helps: a Backup.
function startFromBrowserCopy(demo){
  let d = null;
  try{ d = migrate(JSON.parse(demo)); }
  catch(e){ console.warn("miFormulas: data kept in this browser could not be loaded", e); return "broken"; }
  DATA = d;
  try{ boot(); return "ok"; }
  catch(e){
    console.warn("miFormulas: the data was read, but the app could not open it", e);
    $("#landing").style.display = ""; $("header").inert = true; $("#main").inert = true;
    $("#landingHint").textContent = "Your data was read, but the app could not open it ("
      + ((e && e.message) || "unknown error") + "). Nothing has been changed and your data is still in this browser: "
      + "download a Backup below, then reload (F5). If it happens again, that Backup opens in another browser or in the downloaded app.";
    const bk = $("#btnLandBak");
    bk.style.display = ""; bk.addEventListener("click", () => backup());
    // Nothing here may touch the data that is still sitting in this browser. A fresh start would write over it,
    // and so would opening a data file: loadFromHandle clears the browser copy the moment it has a file. The
    // Backup is the only way out, exactly as the hint and section 22 say; after it, F5 gives the usual screen.
    for (const id of ["btnStarter", "btnEmpty", "btnSnap", "btnOpen", "btnLandOpen", "btnReopen"])
      $("#" + id).style.display = "none";
    return "stuck";
  }
}
function boot(fresh){   // fresh = the app starts from the starter set, from nothing or from a snapshot, not from your own data
  $("#landing").style.display = "none";
  $("header").inert = false; $("#main").inert = false;   // released only now: before this there is no DATA to work on
  if (isMobile()) HOMEVIEW = true;      // phones start on the welcome screen, not on an empty list
  NAVFIRST = true; NAVI = 0; NAVMAX = 0;
  let hs = null; try{ hs = OPENLAST ? history.state : null; }catch(e){}
  if (hs && hs.mf) goPlace(hs);          // with "open where you left off" a reload lands back on the entry you were on
  else applyLastView();                  // Settings: open where you left off, if that place still exists
  if (STANDALONE){ $("#btnNavPrev").hidden = false; $("#btnNavNext").hidden = false; }
  buildUsage();
  setState(REMOTE ? "Connected to server" : HANDLE ? "Loaded" : DEMO ? "Data kept in this browser" : "Loaded (read-only fallback – use Backup to save)", "", false);
  setTabs(); render();
  if (STANDALONE && DEMO && !HANDLE){ saveNow._persistAsked = true; requestPersistence(); }   // installed app: granted silently, so the bar never flashes
  else updateStorageHint();
  if (!fresh) dailySnapshot();   // a start from the starter set would otherwise overwrite the snapshot that is offered on that very screen
  checkPendingImport();
}
(async () => {
  try{
  await idb.open();
  THEME = (await idb.get("theme")) || "auto"; applyTheme();
  LOCALE = (await idb.get("locale")) || undefined;
  OPENLAST = !!(await idb.get("openLast"));
  if (OPENLAST) LASTVIEW = (await idb.get("lastView")) || null;   // applied by boot(), once there is data to look in
  if (/^https?:$/.test(location.protocol)){
    TOKEN = (await idb.get("token")) || null;
    let url = await idb.get("serverUrl");
    if (url === undefined){                 // first visit on this device: detect once, then remember
      url = TOKEN ? "data.php" : await probeServer();
      await idb.set("serverUrl", url);
    }
    if (url){
      REMOTE = true; API = url;
      $("#landingHint").textContent = "Data is stored on the server (" + url + "). Saving is automatic; a conflict check protects against simultaneous edits on two devices.";
      const bo = $("#btnOpen"); bo.textContent = "Connect to server";
      bo.replaceWith(bo.cloneNode(true));   // drop the file-picker handler
      $("#btnOpen").addEventListener("click", async () => { if (await remoteLoad()) boot(); });
      if (await remoteLoad()) boot();
      else await offerSnapshot();
      if (SERVER_EMPTY){               // the server answers, but holds no data file yet
        $("#landingHint").textContent = "The server at " + url + " has no data file yet. Start with the starter set or open a Backup of your own, and the app writes it there; or use Connect to server once the file exists.";
        const bs = $("#btnStarter"); bs.style.display = "";
        $("#btnEmpty").style.display = "";
        // Open data file… is the button "Connect to server" took the place of, and this is the moment it is
        // needed: moving to a server begins with the Backup you made before you started.
        const bl = $("#btnLandOpen"); bl.style.display = "";
        bl.addEventListener("click", () => { if (snapStillThere()) openFile(); });
        bs.addEventListener("click", async () => { if (!snapStillThere()) return; const d = await loadStarter(); if (!d) return; DATA = d; boot(true); markDirty(); });
      }
      return;
    }
    // no server: the browser keeps the data, unless a data file was opened here before (then that file is used)
    DEMO = true;
    if (await tryRestore()){ boot(); return; }
    const BROWSER_MSG = "Your data stays in this browser. Use Backup to download it, and Settings to connect a server of your own."
      + (/Firefox\//.test(navigator.userAgent) ? " Firefox keeps your data in the browser only; for daily use, open miformulas.com in Chrome or Edge." : "");
    const demoStart = async (hint) => {
    $("#landingHint").textContent = hint;
    const demo = await idb.get("demoData");
    if (!demo){   // nothing here yet, but a Formulair import waiting: that becomes the data
      const pend = await idb.get("pendingImport");
      if (pend){ await idb.set("pendingImport", null); try{ DATA = migrate(JSON.parse(pend)); boot(true); markDirty(); return; }catch(e){ alert("The Formulair import could not be read; run the importer again."); } }
    }
    let demoBroken = false;
    if (demo){
      const uit = startFromBrowserCopy(demo);
      if (uit !== "broken") return;    // running, or stuck with its own screen: either way the start screen is settled
      demoBroken = true;
    }
    const bs = $("#btnStarter"); bs.style.display = "";
    $("#btnEmpty").style.display = "";
    $("#btnDownload").style.display = ""; $("#btnFormulair").style.display = "";
    if (demoBroken)   // a blank start screen after months of work needs a word of explanation
      $("#landingHint").textContent = "The data kept in this browser could not be read (it is damaged or was written by another program). "
        + "Your last Backup is the way back: use Open data file… above. Starting again here would overwrite what is left of it.";
    if (IOS){ $("#btnDownload").style.display = "none"; $("#btnFormulair").style.display = "none"; }   // neither is possible on an iPhone or iPad
    offerSnapshot();
    bs.addEventListener("click", async () => {
      if (!snapStillThere()) return;
      const d = await loadStarter(); if (!d) return;
      DATA = d; boot(true); markDirty();
    });
    const DL_MSG = "miFormulas.html is now in your Downloads folder. Move it to a folder of its own, for instance Documents\\miFormulas, and open it there in Chrome or Edge; it then keeps your data in a file next to it. If you already made formulas here, click Backup first and open that file in the downloaded app.";
    $("#btnDownload").addEventListener("click", e => {
      if (FALLBACK){   // Safari, Firefox: the downloaded copy could not save anything in this browser
        e.preventDefault();
        openDialog(`<h3 style="margin-top:0">Download the app</h3>
          <p>The downloaded <b>miFormulas.html</b> keeps your data in a file next to it, which needs <b>Chrome or Edge</b>; this browser cannot write to files, so the download would open read-only here.</p>
          <p>${SAFARI_MAC ? "On a Mac with Safari, <b>File \u203a Add to Dock</b> gives you the app in the Dock with automatic updates; your data then stays in the app's storage, so download a Backup now and then." : "To keep using this browser, stay on the site: your data lives in the browser here, and Backup downloads a copy."}</p>
          <p>Download anyway if you plan to open the file in Chrome or Edge.</p>`, "Download anyway", () => {
            const a = document.createElement("a"); a.href = "index.html"; a.download = "miFormulas.html"; document.body.appendChild(a); a.click(); a.remove();
            $("#landingHint").textContent = DL_MSG;
          }, "28rem");
        return;
      }
      $("#landingHint").textContent = DL_MSG;
    });
    };   // end demoStart
    if (RESTORE) offerReopen(() => demoStart("The remembered data file could not be opened; it was probably moved, renamed or deleted. " + BROWSER_MSG));
    else await demoStart(BROWSER_MSG);
    return;
  }
  if (FALLBACK){
    $("#landingHint").innerHTML = "This browser cannot write to files, so miFormulas.html is read-only here: it can show a data file but not save changes. Open this file in <b>Chrome or Edge</b> to keep your data in a file, or use <a href=\"https://miformulas.com\" target=\"_blank\" rel=\"noopener\">miformulas.com</a> in this browser (Safari on a Mac: File \u203a Add to Dock). Have a data file? Open data file\u2026 shows it and remembers it for next time.";
    const cached = await idb.get("cachedData");
    if (cached && cached.json){
      const b = $("#btnReopen");
      b.style.display = "";
      b.textContent = `Continue with data from ${new Date(cached.when).toLocaleString(LOCALE,{day:"2-digit",month:"2-digit",hour:"2-digit",minute:"2-digit"})}`;
      b.addEventListener("click", () => {
        try{ DATA = migrate(JSON.parse(cached.json)); }catch(e){ alert(CORRUPT_MSG); return; }
        boot();
        setState("Cached copy – reload the file for the latest data", "", false); });
    }
    await offerSnapshot();   // this branch keeps a daily snapshot like the others, and used to be the only one not offering it
    return;
  }
  if (await tryRestore()){ boot(); return; }
  await offerSnapshot();
  const FRESH_MSG = "You are running the app from your own computer. Keep miFormulas.html in a folder of its own, for instance Documents\\miFormulas, with your data file next to it and a subfolder \u201cbackups\u201d for Backup copies. Made a data file earlier? Use Open data file\u2026; the starter set would create a new one.";
  const GONE_MSG = "The remembered data file could not be opened; it was probably moved, renamed or deleted. Start with the starter set to create a new one, or open another data file.";
  function offerStarter(hint){   // no usable remembered file: the starter set creates one
  $("#landingHint").textContent = hint;
  const bsf = $("#btnStarter"); bsf.style.display = "";
  const NOFILE_MSG = "No data file was created, so nothing is saved. Start with the starter set to try again, or open an existing data file.";
  bsf.addEventListener("click", async () => {
    if (!snapStillThere()) return;
    const d = await loadStarter(); if (!d) return;   // fetched first; the dialog button below gives the picker a fresh user gesture
    const dlg = $("#dlg");
    const onCancel = () => { $("#landingHint").textContent = NOFILE_MSG; };
    dlg.addEventListener("cancelled", onCancel, {once: true});
    openDialog(`<h3 style="margin-top:0">Where to keep your data file</h3>
      <p>The starter set will be saved as your data file, <b>miformulas-data.json</b>.</p>
      <p>In the next window, go to the folder where miFormulas.html is (for instance <b>Documents\\miFormulas</b>) and keep that file name. The app remembers the file and saves to it automatically; make a subfolder <b>backups</b> there for Backup copies.</p>`,
      "Choose location\u2026", () => {
        dlg.removeEventListener("cancelled", onCancel);
        (async () => {
          let h = null;
          try{ h = await window.showSaveFilePicker({id:"miformulas-data", startIn:"documents", suggestedName:"miformulas-data.json", types:[{description:"miFormulas data", accept:{"application/json":[".json"]}}]}); }
          catch(e){ /* cancelled */ }
          if (!h){ $("#landingHint").textContent = NOFILE_MSG; return; }
          DATA = d; HANDLE = h; await idb.set("fileHandle", h);
          boot(true); saveData();
        })();
      }, "28rem");
  });
  }   // end offerStarter
  if (RESTORE) offerReopen(() => offerStarter(GONE_MSG)); else offerStarter(FRESH_MSG);
  }catch(e){ try{ console.warn("miFormulas: start-up stopped early", e); }catch(_){} /* sandboxed viewers: manual file open still works */ }
})();
</script>
