<style>
:root{
  --ground:#FBFCFD; --surface:#FFFFFF; --panel:#EDF1F5; --ink:#212A33; --muted:#5E6B77;   /* 4,5:1 of better on every surface here */
  --line:#DCE3EA; --accent:#A2277E; --accent-ink:#7E1B62; --accent-soft:#F9E3F1; --amber:#DD8500; --amber-ink:#945800; --amber-soft:#FFEFD2;   /* amber-ink: 4,73 on accent-soft, where 9C5D00 was 4,34 */
  --danger:#C42F1F; --danger-soft:#FBE9E5; --frozen:#376DA2; --frozen-soft:#E1EEF9;   /* frozen on frozen-soft: 4,60, where 3E7CB8 was 3,72 */
  --hl0:#3B6FA0; --hl2:#C04A32; --hl3:#B18F22; --hl4:#4C8A46;   /* a mark carries meaning, so 3:1 on the surface: 3,08, where C9A227 was 2,42 */
  --header-ink:#FBEFDD; --zebra:rgba(62,124,184,.05);
  --bench:#E2F0F4; --bench2:#DCE7F5; --bench-line:#B9D5DE;
  /* the orange end carries white text on every primary button and the header buttons: #D4600F gave 3,8:1
     against white and 3,4:1 against --header-ink, so it is a deeper orange now (5,4 and 4,7) */
  --header-grad:linear-gradient(100deg,#3E1146,#8E2277 48%,#AE4F0C);
  --btn-grad:linear-gradient(115deg,#A2277E,#AE4F0C);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme: dark;   /* checkboxes, date pickers, scrollbars and select lists follow the theme */
    --ground:#1C1122; --surface:#2A1833; --panel:#241430; --ink:#F2E6F2; --muted:#B292BC;
    --line:#453050; --accent:#E667B0; --accent-ink:#F08CC5; --accent-soft:#3A1F38; --amber:#FFB454; --amber-ink:#FFC078; --amber-soft:#3B2A12;
    --danger:#F08A75; --danger-soft:#3A1E1A; --frozen:#7FA9D9; --frozen-soft:#1E2B3B;
    --header-ink:#F7E9F5; --zebra:rgba(230,103,176,.07);
    --bench:#122630; --bench2:#141F33; --bench-line:#2C4654;
    --header-grad:linear-gradient(100deg,#2A0C33,#701B5C 48%,#B34A0C);
    --btn-grad:linear-gradient(115deg,#C0388F,#B65611);   /* 4,85 against white, where C65E12 was 4,19 */
  }
}
:root[data-theme="dark"]{

  --ground:#1C1122; --surface:#2A1833; --panel:#241430; --ink:#F2E6F2; --muted:#B292BC;
  --line:#453050; --accent:#E667B0; --accent-ink:#F08CC5; --accent-soft:#3A1F38; --amber:#FFB454; --amber-ink:#FFC078; --amber-soft:#3B2A12;

*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--ground);color:var(--ink);font:15px/1.5 "Segoe UI",system-ui,-apple-system,sans-serif;display:flex;flex-direction:column}
button{font:inherit;color:inherit;background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:.35rem .8rem;cursor:pointer}
button:hover{border-color:var(--accent)}
button.primary{background:var(--btn-grad);border-color:transparent;color:#fff}
button.primary:hover{filter:brightness(1.1)}
button.small{padding:.15rem .5rem;font-size:.85rem}
button.small.danger{color:var(--danger)}
button.small.danger:hover{border-color:var(--danger)}
a.small{font-size:.85rem;color:var(--accent-ink);text-decoration:underline;white-space:nowrap}
a.btn{font:inherit;font-size:.85rem;color:inherit;background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:.15rem .5rem;text-decoration:none;display:inline-block;white-space:nowrap;cursor:pointer}
a.btn:hover{border-color:var(--accent)}
a.btn.accent{color:var(--accent-ink);border-color:var(--accent)}   /* a button like the others, but the eye finds it */
a.btn.accent:hover{background:var(--accent-soft)}
button.ghost{border:none;background:none;color:var(--muted)}
button.ghost:hover{color:var(--danger)}
input,select,textarea{font:inherit;color:inherit;background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:.3rem .5rem}
input:focus,select:focus,textarea:focus{outline:2px solid var(--accent);outline-offset:-1px}
::placeholder{color:var(--muted);opacity:1}   /* Chrome fades the placeholder, which is unreadable on the dark theme */
/* two groups: what the content is on the left, what the file is on the right. The groups wrap as a whole,
   so a narrow window gets two tidy rows instead of buttons dropping off the right edge. */
header{display:flex;flex-wrap:wrap;align-items:center;gap:.4rem 1rem;padding:.5rem 1rem;background:var(--header-grad);color:var(--header-ink)}
.hleft,.hright{display:flex;align-items:center;gap:.4rem;min-width:0}
.hright{margin-left:auto}
header button,header .hsep{white-space:nowrap}
header h1{font-size:1.15rem;margin:0;font-weight:600;letter-spacing:.03em}
header h1 span{color:#FFC46B}
header button{background:transparent;color:var(--header-ink);border-color:rgba(255,255,255,.25)}
header button:hover{border-color:var(--amber);color:#fff}
header button:disabled{opacity:.4}
button.small.ico{min-width:2.25rem;min-height:2.25rem;padding:.2rem .35rem;font-size:1.1rem;line-height:1}   /* a tap target you can hit, with a symbol you can see */
button.small.ico svg{width:1.15rem;height:1.15rem;display:block;margin:auto;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
header button.small{min-height:2.25rem}
header .ico2{display:none}                                   /* Undo/Redo as arrows only when the row is tight */
header .ico2 svg{width:1.15rem;height:1.15rem;display:block;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
header .hsep{width:1px;height:1.3rem;background:rgba(255,255,255,.3);margin:0 .1rem}
header #btnSave{border-color:rgba(255,255,255,.55)}
/* the only place that says whether your work is saved: it carries its own dark ground, because the
   orange end of the header gradient cannot hold small text at AA, and which end it lands on depends on the width */
#saveState{font-size:.8rem;color:var(--header-ink);background:rgba(0,0,0,.28);padding:.12rem .5rem;border-radius:999px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0;margin-right:.3rem}
#saveState.wide{white-space:normal;max-width:26rem}          /* a warning is worth two lines */
#saveState.dirty{color:#FFD08A;font-weight:600}
main{flex:1;display:flex;min-height:0}
#storageHint{display:flex;gap:.8rem;align-items:center;padding:.35rem 1rem;background:var(--panel);color:var(--ink);font-size:.83rem;border-bottom:1px solid var(--line);border-left:4px solid var(--amber)}   /* a reminder, not an alarm */
#storageHint #storageHintSave{margin-left:auto}
#storageHint #storageHintClose{margin-left:.4rem}
#storageHint.nosave #storageHintClose{margin-left:auto}
#storageHint[hidden]{display:none}
#sidebar{width:310px;min-width:230px;background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column}
body.hidebar #sidebar{display:none}
body.hidebar #btnBar{background:var(--accent-soft);color:var(--accent-ink);border-color:var(--accent)}
#tabs{display:flex;border-bottom:1px solid var(--line)}
#tabs button{flex:1;border:none;border-radius:0;background:none;padding:.55rem;color:var(--muted);border-bottom:2px solid transparent}
#tabs button.active{color:var(--ink);border-bottom-color:var(--accent);font-weight:600}
#searchBox{margin:.6rem;padding:.4rem .6rem}
#list{flex:1;overflow-y:auto;padding-bottom:1rem}
.cat{font-size:.72rem;letter-spacing:.1em;text-transform:uppercase;color:var(--accent-ink);font-weight:600;
  padding:.55rem .8rem .3rem;position:sticky;top:0;z-index:1;
  background:linear-gradient(var(--panel) 62%,transparent);display:flex;align-items:center;gap:.45rem}
.cat::after{content:"";flex:1;height:1px;background:linear-gradient(90deg,var(--accent),transparent);opacity:.45}
.item.flat{cursor:default}   /* a to-order line without a material of its own opens nothing */
.item{padding:.3rem .8rem;cursor:pointer;display:flex;justify-content:space-between;gap:.4rem;align-items:baseline;
  border-left:3px solid transparent;transition:background .12s,border-color .12s}
.item:nth-of-type(even){background:var(--zebra)}
.item:hover{background:var(--accent-soft);border-left-color:var(--accent)}
.item:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
.item.sel{background:var(--accent-soft);font-weight:600;border-left-color:var(--accent)}
.item .sub{font-size:.75rem;color:var(--muted);white-space:nowrap;font-variant-numeric:tabular-nums}
.sugRow{padding:.25rem .8rem;display:flex;justify-content:space-between;gap:.5rem;align-items:center}
.sugRow .sub{font-size:.75rem;color:var(--muted)}
.brRow{display:flex;gap:.5rem;align-items:baseline;padding:.2rem .4rem;border-bottom:1px solid var(--line);user-select:none}
.brRow:last-child{border-bottom:0}
.brRow.have{opacity:.55}
.brRow .sub{font-size:.75rem;color:var(--muted);margin-left:auto;text-align:right}
#content{flex:1;overflow-y:auto;padding:1.2rem 1.6rem 3rem;min-width:0}
h2{margin:.2rem 0 .3rem;font-size:1.35rem}
.metaLine{color:var(--muted);font-size:.85rem;margin-bottom:.6rem;display:flex;flex-wrap:wrap;gap:.3rem .5rem;align-items:center}
.metaLine a.lookup{margin-left:.4rem}
.chipRow{display:flex;flex-wrap:wrap;gap:.35rem;margin:.5rem 0}
.badge{font-size:.72rem;border-radius:4px;padding:.05rem .4rem;background:var(--frozen-soft);color:var(--frozen);vertical-align:middle}
.tblwrap{max-width:100%;overflow-x:auto}
.nowrap{white-space:nowrap}
.panelBox,details.panelBox{max-width:100%}
table.lines{border-collapse:collapse;width:100%;margin:.6rem 0;font-variant-numeric:tabular-nums}
table.lines th{font-size:.75rem;text-transform:uppercase;letter-spacing:.06em;color:var(--accent-ink);text-align:left;padding:.3rem .5rem;border-bottom:2px solid var(--accent)}
table.lines td{padding:.22rem .5rem;border-bottom:1px solid var(--line)}
table.lines tbody tr:nth-child(even){background:var(--zebra)}
table.lines td.num,table.lines th.num{text-align:right}
table.lines tr.hl0 td,table.lines tr.hl2 td,table.lines tr.hl3 td,table.lines tr.hl4 td{border-top:1.5px solid;border-bottom:1.5px solid}
table.lines tr.hl0 td:first-child,table.lines tr.hl2 td:first-child,table.lines tr.hl3 td:first-child,table.lines tr.hl4 td:first-child{border-left-width:1.5px;border-left-style:solid}
table.lines tr.hl0 td:last-child,table.lines tr.hl2 td:last-child,table.lines tr.hl3 td:last-child,table.lines tr.hl4 td:last-child{border-right-width:1.5px;border-right-style:solid}
table.lines tr.hl0 td{border-color:var(--hl0)}
table.lines tr.hl2 td{border-color:var(--hl2)}
table.lines tr.hl3 td{border-color:var(--hl3)}
table.lines tr.hl4 td{border-color:var(--hl4)}
table.lines tr.solvent td{color:var(--muted);font-style:italic}
table.lines tr.badLine td{color:var(--danger);background:var(--danger-soft)}
table.lines tfoot td{font-weight:600;border-top:2px solid var(--ink);border-bottom:none}
table.lines input.w{width:6.5rem}
table.lines select.d{max-width:7rem}
.panelBox{background:var(--surface);border:1px solid var(--line);border-top:3px solid var(--accent);border-radius:8px;padding:.8rem 1rem;margin:.8rem 0}
#content .panelBox:nth-of-type(3n+2){border-top-color:var(--amber-ink)}
#content .panelBox:nth-of-type(3n){border-top-color:var(--frozen)}
#content details.panelBox{border-top-color:var(--frozen)}
.panelBox h3{margin:0 0 .5rem;font-size:.8rem;text-transform:uppercase;letter-spacing:.07em;color:var(--accent-ink)}
.toolRow{display:flex;flex-wrap:wrap;gap:.5rem;align-items:center;margin:.6rem 0}
.tickBar{display:flex;flex-wrap:wrap;gap:.4rem 1.1rem;align-items:center;margin:.2rem 0 .8rem;padding:.45rem .8rem;
  background:var(--panel);border-radius:8px;border:1px solid var(--line)}
.tickGrp{display:inline-flex;gap:.35rem;align-items:center}
.actions{margin-left:auto;display:flex;gap:.1rem;align-items:center}
.actions button{border:none;background:none;color:var(--muted);padding:.15rem .5rem;font-size:.83rem;border-radius:5px}
.actions button:hover{color:var(--accent-ink);background:var(--accent-soft)}
.actions button.danger{color:var(--danger)}
.actions button.danger:hover{background:var(--danger-soft);color:var(--danger)}
.actions i{width:1px;height:1rem;background:var(--line);margin:0 .3rem}
.notes{width:100%;min-height:9.5rem;margin-top:.3rem;line-height:1.5}
.noteRead{white-space:pre-wrap;background:var(--amber-soft);border-radius:6px;padding:.6rem .8rem;font-size:.9rem}
.help{max-width:52rem}.help h1{font-size:1.5rem;margin:.2rem 0 .8rem}.help h2{font-size:1.15rem;margin:1.8rem 0 .5rem;padding-top:.4rem;border-top:1px solid var(--line);color:var(--accent-ink)}
.help h3{font-size:1rem;margin:1.2rem 0 .4rem}.help p,.help li{line-height:1.5}.help ol.toc{columns:2;column-gap:2rem;padding-left:2rem;font-size:.92rem}.help ol.toc li{break-inside:avoid}
.help code{background:var(--panel);padding:.05em .3em;border-radius:3px;font-size:.92em}.help pre{background:var(--panel);padding:.6rem .8rem;border-radius:6px;overflow:auto;font-size:.85rem;white-space:pre-wrap}
.help .helpfig{font-size:.85rem;color:var(--muted);margin:.3rem 0 .6rem}.help .helpbar{display:flex;gap:.6rem;align-items:center;flex-wrap:wrap;margin-bottom:.6rem}.help a{color:var(--accent-ink)}
.fieldGrid{display:grid;grid-template-columns:9rem 1fr;gap:.35rem .8rem;align-items:center;max-width:34rem}
.scaleGrid{display:grid;grid-template-columns:12rem 8rem auto 1fr;gap:.5rem .8rem;align-items:center;max-width:46rem}
.scaleGrid input{width:5.5rem;text-align:right}
.scaleGrid button{justify-self:start;min-width:6.5rem}
.fieldGrid label{color:var(--muted);font-size:.85rem}
.pyr{display:flex;gap:.2rem}
.pyr button{padding:.15rem .5rem;font-size:.8rem}
.pyr button.sel{background:var(--accent);color:#fff;border-color:var(--accent)}
/* in the dark theme --accent is light: white on it is 3,03:1, the ground colour 6,01 */
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .pyr button.sel{color:var(--ground)}}
:root[data-theme="dark"] .pyr button.sel{color:var(--ground)}
.usage{font-size:.88rem}
.usage a{color:var(--accent);cursor:pointer;text-decoration:none}
.usage a:hover{text-decoration:underline}
dialog{border:1px solid var(--line);border-radius:10px;background:var(--surface);color:var(--ink);
  position:fixed;inset:0;margin:auto;max-width:min(34rem,94vw);max-height:88dvh;overflow:auto;
  box-shadow:0 8px 30px rgba(0,0,0,.25)}
dialog button{min-height:2.3rem;touch-action:manipulation}
dialog label{display:block}
@media (max-height:520px){dialog{max-height:94dvh}dialog h3{margin-top:0}}
dialog::backdrop{background:rgba(0,0,0,.35)}
#landing{position:fixed;inset:0;background:var(--ground);display:flex;align-items:center;justify-content:center;z-index:50}
#landing .card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:2rem 2.5rem;max-width:30rem;text-align:center}
.hint{font-size:.83rem;color:var(--muted)}
.legend{font-size:.78rem;color:var(--muted);margin:.3rem 0}
.legend i{display:inline-block;width:.7rem;height:.7rem;border-radius:2px;vertical-align:-1px;margin:0 .2rem 0 .6rem}
.swatch{width:1.15rem;height:1.15rem;border-radius:3px;border:1px solid var(--line);cursor:pointer;display:inline-block;vertical-align:middle}
.swatch:focus-visible,.sortable:focus-visible,.matlink:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:3px}
.swatch:hover{outline:2px solid var(--accent)}
.catdot{display:inline-block;width:.55rem;height:.55rem;border-radius:50%;flex:none;box-shadow:0 0 0 2px var(--panel),0 0 0 3px currentColor;color:var(--line)}
.pyricon{vertical-align:-2px;margin-right:.35rem;flex:none}
#verSel{max-width:26rem}
.sortable{cursor:pointer;user-select:none;white-space:nowrap}
.sortable:hover{color:var(--accent)}
table.lines tbody tr:hover{background:var(--accent-soft)}
.pyrbar{display:flex;height:12px;border-radius:6px;overflow:hidden;margin:.1rem 0 .7rem;max-width:34rem;box-shadow:0 1px 3px rgba(0,0,0,.15)}
.fhead{position:relative;padding-right:12.5rem;margin-bottom:.6rem;min-height:62px}   /* the chart is 62 px */
.fpyr{position:absolute;right:0;top:0}
.fpyr text{fill:var(--muted);font:500 9px "Segoe UI",system-ui,sans-serif;font-variant-numeric:tabular-nums}
/* a path, a URL or a long link must not push the page sideways, on any width */
.help code,.help pre,.help a{overflow-wrap:anywhere}
@media (max-width:900px){.fhead{padding-right:0;min-height:0}.fpyr{display:none}}
.pyrbar span{min-width:2px}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(8.5rem,1fr));gap:.7rem;margin:.9rem 0;max-width:46rem}
.tile{border-radius:10px;padding:.75rem 1rem;display:flex;flex-direction:column}
.tile b{font-size:1.55rem;line-height:1.25;font-variant-numeric:tabular-nums}
.tile span{font-size:.75rem;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.replBtn{float:right;margin-left:.5rem}
.matlink{cursor:pointer;color:inherit;text-decoration:none}
.matlink:hover{color:var(--accent);text-decoration:underline}
.trial{padding:.3rem 0;border-bottom:1px dashed var(--line);display:flex;gap:.6rem;align-items:baseline}
.trial .hint{white-space:nowrap}
.trial span.txt{flex:1;white-space:pre-wrap}
.benchArea{background:linear-gradient(150deg,var(--bench),var(--bench2));border-radius:10px;padding:.7rem 1rem .4rem;margin:.6rem 0}
.benchBtn{background:var(--bench);border-color:var(--bench-line);font-size:.85rem;font-weight:400;vertical-align:middle;margin-left:.7rem}
.benchBtn:hover{border-color:var(--accent)}
.bghandle{cursor:grab;color:var(--muted);flex:none;font-size:.85rem;letter-spacing:-2px}
.bghandle:hover{color:var(--accent)}
.bpanel.gdropbefore{box-shadow:0 -3px 0 var(--amber)}
.benchWrap{display:grid;grid-template-columns:1fr 1.15fr;gap:1rem;align-items:start;margin:.6rem 0}
@media (max-width:1450px){.benchWrap{grid-template-columns:1fr}}   /* below this the two columns are cut off by the sidebar */
.bpanel{background:var(--surface);border:1px solid var(--line);border-radius:8px;margin-bottom:.8rem}
.bhead{display:flex;gap:.5rem;align-items:center;padding:.45rem .7rem;border-bottom:2px solid var(--accent)}
.bhead .hint{white-space:nowrap}
.btitle{border:none;background:transparent;font-weight:600;flex:1;min-width:4rem;padding:.1rem .2rem}
.btitle:focus{outline:none;box-shadow:0 2px 0 var(--accent)}
.blist{min-height:2.2rem;padding:.25rem 0 .4rem}
.blist.dropin{outline:2px dashed var(--amber);outline-offset:-3px}
.brow{display:flex;gap:.45rem;align-items:center;padding:.15rem .6rem;font-size:.92rem;cursor:grab}
.brow:hover{background:var(--accent-soft)}
.brow.dragging{opacity:.35}
.brow.dropbefore{box-shadow:inset 0 2px 0 var(--amber)}
.bgrip{color:var(--muted);font-size:.85rem;letter-spacing:-2px;flex:none}   /* like .bghandle: a grip nobody can see is not a grip, and a touch screen has no hover */
.brow:hover .bgrip{color:var(--accent)}
.bname{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bdil{color:var(--muted);font-size:.8rem;width:3.6rem;text-align:right;flex:none}
.bw,.bp{font-variant-numeric:tabular-nums;font-size:.85rem;width:4.8rem;text-align:right;flex:none}
.bp{color:var(--muted)}
.bempty{padding:.4rem .7rem;font-size:.82rem;color:var(--muted);font-style:italic}
tr.cmpAdd td:first-child{box-shadow:inset 3px 0 var(--hl4)}
tr.cmpDel td:first-child{box-shadow:inset 3px 0 var(--hl2)}
tr.cmpChg td:first-child{box-shadow:inset 3px 0 var(--hl3)}
td.dim{color:var(--muted)}
#printArea{display:none}
@media (max-width:1300px){   /* tight: the storage mode moves into the tooltip, Undo and Redo become arrows */
  #stWhere{display:none}
  header .lbl{display:none}
  header .ico2{display:inline-flex;align-items:center}
  header #btnUndo,header #btnRedo{min-width:2.25rem}
}
@media (min-width:701px) and (max-width:1100px){
  header h1{font-size:1.05rem}
}
@media (max-width:700px){
  #btnNew,#btnNewMat,#btnRedo,#btnSave,.hsep,#btnBar{display:none}   /* creation is desktop work; saving is automatic */
  body.hidebar #sidebar{display:flex}          /* ☰ is out of reach here, so a hidden sidebar would be a blank screen */
  .actions{margin-left:0;width:100%;flex-wrap:wrap}
  header{gap:.4rem;padding:.45rem .6rem}
  header h1{font-size:1rem}
  #build{display:none}
  table.lines{width:100%;table-layout:fixed;font-size:.8rem}          /* Rel % fell off the screen: 468 px of table in a 368 px wrapper */
  table.lines td,table.lines th{overflow:hidden;text-overflow:ellipsis;padding:.16rem .3rem}
  body.detail #btnBack{display:inline-block}
  body.detail #sidebar{display:none}
  body:not(.detail) #content{display:none}
  #sidebar{width:100%;min-width:0}
  #content{padding:.8rem .7rem 3rem;overflow-x:auto}
  #stMain{display:none}                        /* the short form instead, and never cut off */
  .hright{flex-wrap:wrap}
  #saveState{font-size:.72rem;white-space:normal;overflow:visible;flex-basis:100%;order:9;text-align:right;max-width:none;margin:0}
  #saveState::before{content:attr(data-short)}
  .fieldGrid{grid-template-columns:1fr;gap:.15rem .8rem}
  .abscol,.costcol{display:none} /* portrait: drop Abs % and Cost to make room for the dilution picker */
  /* the order list is the one table that carries buttons, and a clipped button cannot be tapped at all:
     it keeps its own width inside its wrapper, the desk columns go, and the buttons wrap instead of falling off */
  table.lines.ord{width:auto;table-layout:auto}
  table.lines.ord td,table.lines.ord th{overflow:visible}
  table.lines.ord td.nowrap{white-space:normal}
  .deskcol{display:none}
  table.lines select.d{min-width:5.2rem}
  .scaleGrid{grid-template-columns:auto 1fr;gap:.4rem .6rem}
  #verSel{max-width:100%}
  .benchBtn{margin-left:.4rem}
}
/* read-only mode (a phone without a way to save): editing controls disappear entirely */
body.ro #btnNewV,body.ro #btnDelV,body.ro #btnRenameF,body.ro #btnCopyF,body.ro #btnCatF,body.ro #btnDelF,body.ro #btnMoveF,
body.ro #btnApplyFactor,body.ro #scaleF,body.ro #btnApplyScale,body.ro #btnSetAbs,body.ro #targetAbs,body.ro #btnAddTrial,body.ro #trialDate,body.ro #trialText,
body.ro #btnDelMat,body.ro #btnAddDil,body.ro #newDil,body.ro #newDilNote,body.ro #btnAddLine,body.ro #addMat,body.ro #btnPredil,body.ro #btnDilDown,body.ro #btnDilUp,
body.ro .swatch,body.ro [data-mark],body.ro #btnClearMarks,body.ro .selCb,body.ro .bsel,body.ro #bMoveSel,body.ro #btnAddGroup,body.ro #btnNameV,
body.ro [data-add],body.ro [data-deltrial],body.ro [data-deldil],body.ro [data-setbase],body.ro [data-del],body.ro [data-pyr],body.ro [data-repl],
body.ro .bghandle,body.ro [data-bup],body.ro [data-bdown],body.ro [data-bempty],body.ro [data-bdel],
body.ro #btnPrep,body.ro #btnTake,body.ro #btnBuy,body.ro #btnDil,body.ro #stTake,body.ro #stBuyAmt,body.ro #stBuyUnit,body.ro #stBuyNote,body.ro #stDilPct,body.ro #stDilG,body.ro [data-delev],
body.ro #btnImpFormulair,   /* a link, so lockInputs cannot disable it: an import here would have nowhere to go */
body.ro #btnUndo,body.ro #btnRedo,body.ro #btnSave{display:none !important}
#btnBack{display:none}
@media print{
  /* printing from the dark theme must not put light grey on white paper. The theme sets these on
     :root[data-theme="dark"], which weighs more than a bare :root, so this has to match it. */
  /* the automatic dark branch is :root:not([data-theme="light"]) and outweighs a bare :root, so it has to be
     named here too, or a printout from the default theme keeps the dark values */
  :root,:root[data-theme="dark"],:root[data-theme="light"],:root:not([data-theme="light"]){--muted:#6C7A88;--ink:#212A33}
  body>*{display:none !important}
  #printArea{display:block !important;font:14.5px/1.5 "Segoe UI",system-ui,sans-serif;color:#000}
  #printArea h2{margin:0 0 .2rem}
  #printArea h3{font-size:15.5px;margin:.9rem 0 .1rem}
  @page{margin:1.8cm}
  #printArea table{border-collapse:collapse;width:14.5cm;table-layout:fixed;margin-top:.4rem}

<template id="manualTpl"><h1 id="miformulas-manual">miFormulas manual</h1>
<p>miFormulas is a perfume formulation app that runs as a single HTML file in your browser. It keeps your materials and your formulas with their full version history, and it does the perfumery arithmetic: dilution-corrected percentages, batch scaling, dilution changes, predilutions, an IFRA check, weighing sheets.</p>
<p>A few things set it apart. It imports your formulas and materials from Formulair, complete with notes, dilutions and colour marks (section <a href="#s6-coming-from-formulair">6</a>). You can select several lines of a formula at once and act on them together: mark them, shift their dilutions, or bundle them into a predilution (sections <a href="#s13-changing-dilutions">13</a> to <a href="#s15-colour-marks-notes-and-the-trial-log">15</a>). You can let your own AI assistant turn a photo, a PDF or a spreadsheet into a formula ready for import (section <a href="#s20-import-and-export">20</a>). The bench view lays a formula out in open groupings of materials, the way a Ryan Parfums-style bench sheet does, so that batches are prepared in the order you weigh them (section <a href="#s16-bench-view-and-printing">16</a>). And you can install it as an app with its own icon on Windows or macOS (section <a href="#s5-install-as-an-app-with-its-own-icon">5</a>).</p>
<p>There is nothing to install, no account, and your data stays in a file that you own.</p>
<p>And it will keep working. Before leaving Formulair the question was whether the next app would still exist in five years: many are one developer's hobby, and hosted ones stop when the hosting stops. miFormulas is one file that runs without any server, so your copy keeps working as it is, whatever happens to the site or the author. Your data is a plain JSON file you can read with any text editor. And the source is free software under the GPL: if the author loses interest, anyone can take it further.</p>
<p>This manual describes build 260922f. The build number of the copy you are using is shown next to the name in the top-left corner of the app, and in the Help bar; on a phone the header leaves it out, so read it there.</p>
<h2 id="contents">Contents</h2><ol class="toc"><li><a href="#s1-getting-started">Getting started</a></li><li><a href="#s2-where-your-data-lives-browser-file-or-server">Where your data lives: browser, file or server</a></li><li><a href="#s3-privacy-who-can-see-your-formulas">Privacy: who can see your formulas</a></li><li><a href="#s4-recommended-setup-and-the-other-ways-in">Recommended setup, and the other ways in</a></li><li><a href="#s5-install-as-an-app-with-its-own-icon">Install as an app with its own icon</a></li><li><a href="#s6-coming-from-formulair">Coming from Formulair</a></li><li><a href="#s7-a-server-setup-for-cross-device-use">A server setup for cross-device use</a></li><li><a href="#s8-the-screen">The screen</a></li><li><a href="#s9-materials">Materials</a></li><li><a href="#s10-formulas-and-versions">Formulas and versions</a></li><li><a href="#s11-editing-a-formula">Editing a formula</a></li><li><a href="#s12-percentages-and-the-perfumery-arithmetic">Percentages and the perfumery arithmetic</a></li><li><a href="#s13-changing-dilutions">Changing dilutions</a></li><li><a href="#s14-batch-scaling-and-predilutions">Batch scaling and predilutions</a></li><li><a href="#s15-colour-marks-notes-and-the-trial-log">Colour marks, notes and the trial log</a></li><li><a href="#s16-bench-view-and-printing">Bench view and printing</a></li><li><a href="#s17-comparing-versions">Comparing versions</a></li><li><a href="#s18-ifra-check-and-category-panel">IFRA check and category panel</a></li><li><a href="#s19-stock-orders-and-deliveries">Stock, orders and deliveries</a></li><li><a href="#s20-import-and-export">Import and export</a></li><li><a href="#s21-settings-theme-and-keyboard-shortcuts">Settings, theme and keyboard shortcuts</a></li><li><a href="#s22-backups-and-recovery">Backups and recovery</a></li><li><a href="#s23-questions-and-answers">Questions and answers</a></li><li><a href="#s24-licence">Licence</a></li></ol>
<h2 id="s1-getting-started">1. Getting started</h2>
<p>Open <a href="https://miformulas.com">https://miformulas.com</a> in a modern browser.</p>
<p><strong>Which browser.</strong> Chrome or Edge, on Windows or Mac, give you everything: your data in a file of your own and the app installed with its own icon. Safari on a Mac works as a Dock app with the data in the app's storage (section <a href="#s5-install-as-an-app-with-its-own-icon">5</a>). Firefox runs the app, but keeps the data in the browser only, cannot install it and may clear the storage when it closes, even if you allowed persistent storage; use it to have a look, not for daily work. On an iPhone or iPad you add the site to the Home Screen and the data lives in that app; a data file is not possible there, because no browser on iOS can write one, so a server of your own (section <a href="#s7-a-server-setup-for-cross-device-use">7</a>) is what gives you the same data on your phone and your computer. On an Android phone or tablet, Chrome gives you everything a computer gives, a data file of your own included; the one difference is that Chrome asks permission for that file again at every start (sections <a href="#s4-recommended-setup-and-the-other-ways-in">4</a> and <a href="#s5-install-as-an-app-with-its-own-icon">5</a>).</p>
<p class="helpfig">Screenshot in the online manual: <a href="https://miformulas.com/docs/manual.html#s1-getting-started">The start screen of miformulas.com.</a></p>
<p>The start screen offers four ways in:</p>
<ul>
<li><strong>Start with the starter set</strong> loads sixteen formulas and nearly two hundred materials to explore. They are marked "starter" so you can tell them from your own; edit or delete them as you like. Whatever you change or add from here on is your work, so make a habit of <strong>Backup</strong> (in the header) before you close the browser: it writes a copy of the complete data file, named with date and time. In Chrome and Edge it asks where to put it and remembers that folder; elsewhere it lands in your downloads folder. Keep those copies together, for instance in <code>Documents\miFormulas\backups</code> (Windows) or <code>Documents/miFormulas/backups</code> (Mac).</li>
<li><strong>Open data file…</strong> opens a miFormulas data file you already have: the Backup you made last time, a file made by the Formulair importer, or a file a colleague sent you. This is how you get your own work back on another computer or in another browser: choose the most recent Backup from your backups folder and carry on where you left off. In Chrome and Edge the app then keeps saving to that file and offers to reopen it next time (section <a href="#s2-where-your-data-lives-browser-file-or-server">2</a>).</li>
<li><strong>Start empty</strong> gives you nothing at all: no formulas, no materials, an inventory you fill yourself. Use it when the starter set would only be in the way; Settings can clear that data again later, which brings the start screen back.</li>
<li><strong>Import from Formulair</strong> takes you to the importer for Formulair users (section <a href="#s6-coming-from-formulair">6</a>).</li>
</ul>
<p>The bottom line of the start screen has <strong>Settings…</strong>, <strong>Manual</strong> (this text, with its screenshots, on the site), <strong>Feedback</strong>, and, where they apply, <strong>Download the app</strong>, <strong>Install as an app</strong> and <strong>Import from Formulair…</strong>.</p>
<p>Whichever way in you take, you land on the Welcome page: four tiles (formulas, versions, materials, to order), a block <strong>Start here</strong> with the three things you usually come for (open a formula, <strong>+ New formula…</strong>, <strong>+ New material…</strong>), a line saying where your data lives, the recently edited items once you have edited something of your own, and the ways in for materials and formulas that come from elsewhere (section <a href="#s20-import-and-export">20</a>; the downloaded app leaves out the Formulair line, which needs the site). Pick a formula or material in the list on the left, or create a new one with <strong>+ New formula…</strong> and <strong>+ New material…</strong> in the header.</p>
<p class="helpfig">Screenshot in the online manual: <a href="https://miformulas.com/docs/manual.html#s1-getting-started">The Welcome page after loading the starter set, with the amber storage bar.</a></p>
<p>Every change is saved automatically a few seconds after you make it, and straight away when you switch away from the page or it goes out of sight, so a phone that puts the app aside keeps your last change. Close the page while something is still unsaved and the browser asks first; <strong>Ctrl+Z</strong> undoes a change. Deleting a line, a version or a formula always asks for confirmation, and a material that is still used in a formula is not deleted at all: the app says which formulas hold it (section <a href="#s9-materials">9</a>).</p>
<h2 id="s2-where-your-data-lives-browser-file-or-server">2. Where your data lives: browser, file or server</h2>
<p>miFormulas stores everything in one JSON file, <code>miformulas-data.json</code>. The app can keep that file in three places, and the top-right of the header always tells you which one is in use. Before the first save of a session it says where the data came from ("Data kept in this browser", "Loaded", "Connected to server"); after every save it names the time and the place ("Saved 14:02 · this browser", "Saved 14:02 · miformulas-data.json", with the name of your own file, or "Saved 14:02 · server"). On a window narrower than about 1300 pixels only the time is shown, to keep the header on one line; the place is then in the tooltip. Between a change and the save that follows it a second or two later, the header says "Unsaved changes" in colour; that colour is the app telling you it still has something to write, and it disappears by itself. A warning is always given in full: "Server not reachable: changes kept in memory, use Backup", "⚠ Conflict: changed on another device – reload (F5) before editing", "⚠ The server holds data that was not loaded here", "Token rejected: use Backup, then reload to enter it again" and "Save failed – use Backup". Each of them names the same way out, because a warning about your data is only useful with one. Two other states belong to particular situations: "Loaded (read-only fallback – use Backup to save)" in a browser that cannot write files (section <a href="#s4-recommended-setup-and-the-other-ways-in">4</a>), and "Cached copy – reload the file for the latest data" when the app started from the copy it kept while the file itself was not read yet. When the network comes back after "Server not reachable", the app saves again by itself.</p>
<p>Two buttons on the start screen belong to particular situations. With a server configured, <strong>Open data file…</strong> reads <strong>Connect to server</strong> instead, and asks for the token if the server wants one. In the read-mostly fallback (the downloaded app in Firefox or Safari, section <a href="#s4-recommended-setup-and-the-other-ways-in">4</a>) the start screen offers <strong>Continue with data from …</strong> with the date and time of the copy the app kept in the browser, so you do not have to pick the file again. In server mode a save that could not reach the server does not use that button: the status says "Server not reachable: changes kept in memory, use Backup", and after a reload the start screen offers <strong>Connect to server</strong> and, if there is one, the daily snapshot (section <a href="#s22-backups-and-recovery">22</a>).</p>
<p><strong>In the browser.</strong> On miformulas.com the app keeps the data in the browser's own storage on that computer. This is the quickest way to try things out, and it is fine for everyday use if you download a Backup regularly. Two things to know: every browser has its own storage (Edge and Chrome on the same computer do not see each other's data), and a browser that is set to clear site data when it closes will take your formulas with it. The app asks the browser to keep the storage persistent; as long as the browser has not confirmed that, a bar with an amber edge under the header reminds you to make backups. It is one line, shorter still on a phone, and the × closes it for good, because it says the same thing every time; the Welcome page keeps telling you where your data lives, under <strong>Start here</strong>.</p>
<p class="helpfig">Screenshot in the online manual: <a href="https://miformulas.com/docs/manual.html#s2-where-your-data-lives-browser-file-or-server">Browser storage: the amber bar reminds you, and Save to a data file… moves your work into a file (Chrome and Edge).</a></p>
<p><strong>In a file.</strong> In Chrome or Edge the app can read and write a data file on your disk directly. You see the file, you can copy it, put it in a synced folder, and open it on another computer. The app remembers which file you used; the next time you open it you click <strong>Reopen</strong> and, if the browser asks, allow it to write to the file again. This works with the downloaded app (section <a href="#s4-recommended-setup-and-the-other-ways-in">4</a>) and just as well on miformulas.com itself: <strong>Save to a data file…</strong> (in the amber bar or in Settings) moves your work from the browser's storage into a file, <strong>Open data file…</strong> on the start screen switches to an existing file, and the site remembers the file for next time. For a site the browser can also remember the permission itself, in particular once the site is installed as an app: the app then opens straight into your data, and Reopen only appears when the browser wants a fresh click. Combined with "Install as an app" (section <a href="#s5-install-as-an-app-with-its-own-icon">5</a>) that gives you an app with its own icon, your own data file, and updates that arrive by themselves. Firefox cannot write to files: on the site you work in the browser's storage and use Backup to save, and a downloaded copy opened in Firefox is read-mostly (pick the data file once, the app keeps a cached copy, and Backup is the way to save). Safari has no direct file access either, so expect the same there: browser storage and Backup; it has only been tried on the start screen.</p>
<p class="helpfig">Screenshot in the online manual: <a href="https://miformulas.com/docs/manual.html#s2-where-your-data-lives-browser-file-or-server">Next time, the start screen offers Reopen for the remembered data file.</a></p>
<p><strong>On a server.</strong> If you have a web server with PHP (a NAS at home, a small hosting account), put the app and the endpoint <code>server/data.php</code> on it and every device with the token shares the same data. The server refuses to overwrite changes made from another device in the meantime and keeps a daily snapshot. Section <a href="#s7-a-server-setup-for-cross-device-use">7</a> explains the setup.</p>
<p>Whichever mode you use, <strong>Backup</strong> in the header writes a copy of the data file with a date and time in its name (Chrome and Edge ask where; the other browsers put it in your downloads folder), and <strong>Open data file…</strong> on the start screen opens any such file. Moving between modes is nothing more than a Backup on one side and an Open on the other.</p>
<h2 id="s3-privacy-who-can-see-your-formulas">3. Privacy: who can see your formulas</h2>
<p>Nobody but you. miFormulas runs entirely on your own computer, inside your browser, and your data lives where you put it: in the browser's storage, in a file on your disk, or on a server you own. There is no account, no cloud, no telemetry and no update check, and the author of the app has no way to see your formulas. The app never uploads anything.</p>
<p>This is everything the app does on the network:</p>
<ul>
<li>On miformulas.com it loads the starter set from the same site when you click <strong>Start with the starter set</strong>, and on the first visit it checks once whether a <code>data.php</code> server sits next to it. The browser also fetches the small app manifest and the icons from the same site, which is what makes "Install as an app" possible.</li>
<li>The downloaded app makes two kinds of request, and each only when you click: <strong>Start with the starter set</strong> fetches the starter set from miformulas.com, and <strong>Get the latest library</strong> (in Settings, and in the CSV import window when no library is loaded) fetches the published materials library. Neither carries anything of yours; as with any web page, the server sees that an address asked for a file. Apart from those two clicks the app makes no request at all, so with a data file you can use it with the network switched off.</li>
<li>In server mode the app talks only to the server address you entered in Settings.</li>
<li><strong>Get the latest library</strong>, in Settings and in the CSV import window, fetches the published materials library from <code>data.miformulas.com</code>, and only when you click it. That request carries nothing of yours either: the library is a plain file that the server hands to anyone who asks.</li>
<li><strong>Search my shops</strong> in the order list, the product links, the <strong>TGSC</strong>, <strong>Olfactorian</strong> and <strong>IFRA</strong> links on a material page and the links in the Help pages open Google, DuckDuckGo, the shop or the site in a new tab, only when you click them. The IFRA link also puts the CAS number on your clipboard, nothing else.</li>
</ul>
<p>No analytics, no fonts or scripts loaded from elsewhere, nothing sent in the background. The Formulair importer reads your database in the browser and sends nothing; its database engine (sql.js) is embedded in the file.</p>
<p>miformulas.com is served by GitHub Pages, a static file server: it hands the same HTML file to everyone and receives nothing back. Like any website, its logs record that a page was requested from an address. If even that is more than you want, download the app once and never visit the site again.</p>
<p>The AI prompts in <a href="https://miformulas.com/docs/ai-prompts.html"><code>docs/ai-prompts.md</code></a> are the one exception, and you choose it yourself: what you paste or attach in an AI chat goes to that AI provider, under its terms, never to miformulas.</p>
<p><strong>Check it yourself.</strong> The whole app is one readable file, and the source is public under the GPL at <a href="https://github.com/miformulas/miformulas">https://github.com/miformulas/miformulas</a>.</p>
<ol>
<li>Open <code>miFormulas.html</code> (or <code>index.html</code>) in a text editor and search for <code>fetch(</code>. There are six in the code: the starter set, the <code>data.php</code> probe, three calls to your own server (load, the check before a save, and the save itself) and the published materials library behind <strong>Get the latest library</strong>; the seventh hit is this sentence, because the manual is embedded in the app as the Help text. Search for <code>http</code> and you find, in this order: the attribution line at the top of the file, the manual and the AI prompts on miformulas.com and the GitHub issues page (the <strong>Manual</strong> and <strong>Feedback</strong> links on the start screen, and the same two in the Help bar), the address of the starter set, <code>data.miformulas.com</code> for that library, the Google search address used by the order list, the DuckDuckGo and IFRA addresses behind the look-up links on a material page, <code>https://</code> put in front of a product link of your own that lacks one, the licence links, and the links in the embedded manual. Outside this paragraph there is no <code>&lt;script src=</code>, no <code>XMLHttpRequest</code>, no <code>sendBeacon</code> and no <code>WebSocket</code>.</li>
<li>Or watch the browser: press F12, open the Network tab, and use the app for a while. With a data file, nothing appears at all.</li>
<li>Or compare: the file you download from miformulas.com is the file in the repository, byte for byte.</li>
</ol>
<p>These checks also tell you whether a copy of the app that reached you by another road was changed. Take the app from miformulas.com or from the repository.</p>
<h2 id="s4-recommended-setup-and-the-other-ways-in">4. Recommended setup, and the other ways in</h2>
<p>There is nothing to download or install in the usual sense: the whole app is one HTML file, <code>index.html</code> on the site, and it runs in any modern browser. Still, one setup beats the others if you want an app with its own icon and your formulas in a file on your own computer.</p>
<p><strong>Recommended: Chrome, on Windows and on Mac.</strong></p>
<ol>
<li>Open <a href="https://miformulas.com">https://miformulas.com</a> in Chrome. No Chrome? On Windows, Edge is already there and works exactly the same (the screenshots in section <a href="#s5-install-as-an-app-with-its-own-icon">5</a> are from Edge); on a Mac, install Chrome first, or read the Safari alternative below.</li>
<li>Click <strong>Install as an app</strong> on the start screen and confirm the browser's dialog. The app opens in its own window with its own icon; section <a href="#s5-install-as-an-app-with-its-own-icon">5</a> has the pictures and the menu route in case the link does not appear.</li>
<li>Click <strong>Start with the starter set</strong>, or <strong>Import from Formulair</strong> if that is where your formulas are (section <a href="#s6-coming-from-formulair">6</a>).</li>
<li>
<p>On the Welcome page, in the storage bar or just under the tiles, click <strong>Save to a data file…</strong> – it is also in Settings. The app explains that it will create your data file, then asks where to keep it: choose a folder of your own, for instance <code>Documents\miFormulas</code>, and keep the name <code>miformulas-data.json</code>. From now on the app saves to that file and opens straight into it; make a subfolder <code>backups</code> there for the copies Backup makes. On a Mac, macOS asks once whether Chrome may use your Documents folder: click <strong>Allow</strong>, because without it the browser cannot create the file.</p>
<p class="helpfig">Screenshot in the online manual: <a href="https://miformulas.com/docs/manual.html#s4-recommended-setup-and-the-other-ways-in">The app explains what it is about to create…</a></p>
<p class="helpfig">Screenshot in the online manual: <a href="https://miformulas.com/docs/manual.html#s4-recommended-setup-and-the-other-ways-in">…and the browser asks where to keep miformulas-data.json.</a></p>
</li>
</ol>
<p>That is all: your data is a file you can see, copy, put in a synced folder or restore from a backup, the app is a program of its own, and updates arrive by themselves.</p>
<p><strong>The site hosts the app, not your data.</strong> Installing this way puts the app on your computer, not your formulas. The page itself is loaded from miformulas.com, which is why it updates by itself, but your work stays where you put it: in this browser's storage, or in your own data file. Nothing is uploaded, there is no account, and the site never sees what you make.</p>
<p><strong>The other ways in</strong>, in order of preference:</p>
<ul>
<li><strong>Safari on a Mac, without Chrome.</strong> Choose <strong>File › Add to Dock</strong> (the start screen's <strong>Add to Dock…</strong> link explains it) and you get the same app in the Dock. Safari cannot write to a data file, so the data lives in the app's storage and Backup is your safety net; section <a href="#s5-install-as-an-app-with-its-own-icon">5</a> has the details.</li>
<li><strong>On an iPhone or iPad.</strong> Open <a href="https://miformulas.com">https://miformulas.com</a> in Safari and use <strong>Add to Home Screen</strong> (the start screen offers the link and explains where it is). You get the app with its own icon and its own storage, separate from the Safari tab. It cannot keep your data in a file, because no browser on iOS can write one: download a Backup now and then, and if you want the same data on your phone and on your computer, that is what a server of your own is for (section <a href="#s7-a-server-setup-for-cross-device-use">7</a>). A phone is a fine second screen for the bench; the wide views, Bench view above all, come into their own on a bigger screen.</li>
<li><strong>On an Android phone or tablet.</strong> Open <a href="https://miformulas.com">https://miformulas.com</a> in Chrome and tap <strong>Install as an app</strong>; Chrome shows its own Install app window, and the app is then installed with your other apps (press and hold its icon in the app list to put it on the Home screen). It shares its storage with Chrome, so what you did in the tab is still there. The four steps above work as on a computer, <strong>Save to a data file…</strong> included: the Android file window opens in Downloads, you can browse to another folder and make one on the spot, and the name miformulas-data.json is filled in for you. The difference: Chrome on Android lets a site keep access to your file only until you close the site's tabs, so at every start the app shows <strong>Reopen</strong> and Chrome asks whether it may edit the file; tap Reopen, then Allow. A server of your own (section <a href="#s7-a-server-setup-for-cross-device-use">7</a>) avoids that question. A tablet is the better screen for the wide views, Bench view above all. Section <a href="#s5-install-as-an-app-with-its-own-icon">5</a> has the pictures.</li>
<li><strong>Just in the browser.</strong> Open the site and start; your work stays in the browser's storage, and an amber bar reminds you. Fine for a look; download a Backup before you leave, or click <strong>Save to a data file…</strong> when you decide to stay.</li>
<li>
<p><strong>The app file on your own computer.</strong> For those who want the file itself, offline or on a server of their own: On the start screen of miformulas.com click <strong>Download the app</strong>. The file <code>miFormulas.html</code> lands in your Downloads folder. Give it a folder of its own, for instance <code>Documents\miFormulas</code> (Windows) or <code>Documents/miFormulas</code> (Mac), and open it there in Chrome or Edge. The download is meant for Chrome and Edge; in Safari or Firefox the link says so first. The start screen now offers <strong>Start with the starter set</strong>; choose it and the app explains that it will create your data file, then asks where to keep it. Put <code>miformulas-data.json</code> in the same folder as the app and keep that name. From then on the app saves to that file automatically, and the next time you open the app it offers <strong>Reopen "miformulas-data.json"</strong>. Make a subfolder <code>backups</code> in the same folder for the copies that Backup makes.</p>
<p class="helpfig">Screenshot in the online manual: <a href="https://miformulas.com/docs/manual.html#s4-recommended-setup-and-the-other-ways-in">The downloaded app, opened from your own computer.</a></p>
<p class="helpfig">Screenshot in the online manual: <a href="https://miformulas.com/docs/manual.html#s4-recommended-setup-and-the-other-ways-in">Start with the starter set creates the data file next to the app.</a></p>
</li>
<li>
<p><strong>Coming from Formulair?</strong> Open <a href="https://miformulas.com/formulair-import.html">https://miformulas.com/formulair-import.html</a>, or click <strong>Import from Formulair…</strong> in the app when you are using it on the site; the downloaded app does not show that link, because the importer is a page on the site. It converts your Formulair database in the browser and adds it to miFormulas; nothing is uploaded. Section <a href="#s6-coming-from-formulair">6</a> has the steps.</p>
</li>
<li><strong>Everything at once.</strong> On the GitHub page <a href="https://github.com/miformulas/miformulas">https://github.com/miformulas/miformulas</a> click the green <strong>Code</strong> button, then <strong>Download ZIP</strong>. The ZIP holds the app, the Formulair importer, the starter data, the server endpoint and the tools.</li>
<li><strong>The same data on your computer, your laptop and your phone</strong>: section <a href="#s7-a-server-setup-for-cross-device-use">7</a>. The free way there needs no server and no domain of your own.</li>
</ul>
<p>Two things about the downloaded app that surprise people:</p>
<ul>
<li>The link between the app and your data file is kept by the browser, not by the HTML file. That is why the browser, and not miFormulas, asks once per session for permission to write to the file (for a local file it asks every session; for the site, and certainly for the installed app, it usually remembers), and why a freshly downloaded copy of the app still offers to reopen the data file you used before. Every local HTML file shares this memory, so it does not matter in which folder the app sits.</li>
<li>If Reopen fails because the data file was moved, renamed or deleted, the app says so, forgets the file and offers the starter set again. If you still have the file, use <strong>Open data file…</strong> to point the app at its new place.</li>
</ul>
<p>If you already made formulas on miformulas.com before downloading the app, click <strong>Backup</strong> there first; the downloaded app's start screen has <strong>Open data file…</strong> to continue with that file. (Using the site or the installed app instead? Then you do not need the download: <strong>Save to a data file…</strong> on the Welcome page or in Settings moves your data from the browser to a file of your own.)</p>
<p>Updating is the same as installing: download the new <code>miFormulas.html</code> and replace the old one. Your data file is separate and stays untouched.</p>
<h2 id="s5-install-as-an-app-with-its-own-icon">5. Install as an app with its own icon</h2>
<p>If you want miFormulas to feel like a program of its own rather than a tab, install it as an app: two minutes, no download, nothing difficult. It then opens in its own window without address bar or tabs, has its own icon in the taskbar, the Start menu or the Dock, and shows up when you switch between programs. Underneath it is the same app in the same browser: the installed app and the site in a normal tab share their data, their remembered data file and their updates.</p>
<p>Browsers only offer this for pages served over https, so it works with miformulas.com and with your own server if that has an https address. A downloaded <code>miFormulas.html</code> cannot be installed this way; the last part of this section shows a shortcut that comes close.</p>
<p><strong>The one-click way (Chrome and Edge, Windows and Mac).</strong> Open <a href="https://miformulas.com">https://miformulas.com</a>. When the browser can install the site, the start screen shows the link <strong>Install as an app</strong>, and the same button appears in <strong>Settings</strong> (⚙), under the fields, once you are working. Click it, and the browser's own install dialog appears with the name and icon; confirm, and the app opens in its own window. Nothing is downloaded and nothing else is installed: the browser does the work, and the installed app shares its data and its updates with the site in a normal tab. Want your data in a file of your own? Click <strong>Save to a data file…</strong> on the Welcome page, in the storage bar or under the tiles (also in Settings): the app creates <code>miformulas-data.json</code> where you choose and remembers it. Chrome and Edge keep the permission to write to that file for an installed app, so from then on the app opens straight into your formulas, without questions. In Safari on a Mac the start screen shows <strong>Add to Dock…</strong> instead, which explains the File › Add to Dock route.</p>

<h2 id="s6-coming-from-formulair">6. Coming from Formulair</h2>
<p>A word about Formulair first. I discovered perfumery together with Formulair, Sam Macer's formulation app for the Mac, and for an app built before the AI era it was remarkably complete: materials with their dilutions, formulas with notes and colour marks, costs, IFRA limits, stock. Only two things drove me to build miFormulas: the limits that come with a Mac-only app, and the possibilities that AI assistants now offer around a formulation notebook. The importer below is a bridge and a homage: everything you built in Formulair comes along.</p>
<p>The importer at <a href="https://miformulas.com/formulair-import.html">https://miformulas.com/formulair-import.html</a> reads the Formulair database entirely in your browser and adds your formulas and materials to miFormulas, whatever it uses to save (browser storage, a data file or a server). Nothing leaves your computer.</p>
<ol>
<li>The database is the file <code>DataModel.sqlite</code> in Formulair's own folder, which the Finder keeps hidden; the steps below get a complete copy of it onto your Desktop.</li>
<li>
<p>In Formulair choose <strong>File</strong>, <strong>Close</strong>; Formulair writes its latest changes into the database file and quits by itself (a plain Cmd+Q does not always write them). In the Finder choose <strong>Go</strong>, <strong>Go to Folder…</strong>, paste <code>~/Library/Containers/co.uk.lux-terra.Formulair/Data/Library/Application Support/Formulair/</code> and copy <code>DataModel.sqlite</code> to the Desktop. A quick check: <code>DataModel.sqlite</code> should now carry today's date, and <code>DataModel.sqlite-wal</code> next to it should be small (kilobytes, not megabytes). If the -wal file is large, your latest changes are still in it: copy all three files (<code>DataModel.sqlite</code>, <code>-wal</code> and <code>-shm</code>) to a folder <code>Formulair</code> on the Desktop and fold them in with one line in Terminal, <code>sqlite3 ~/Desktop/Formulair/DataModel.sqlite "PRAGMA wal_checkpoint(TRUNCATE);"</code>, then use the <code>DataModel.sqlite</code> from that folder.</p>
<p class="helpfig">Screenshot in the online manual: <a href="https://miformulas.com/docs/manual.html#s6-coming-from-formulair">Finder: Go, Go to Folder… with the Formulair path.</a></p>
<p class="helpfig">Screenshot in the online manual: <a href="https://miformulas.com/docs/manual.html#s6-coming-from-formulair">The Formulair folder: DataModel.sqlite with its -wal and -shm files. After File, Close the database carries today's date and the -wal file is small.</a></p>
</li>
<li>
<p>Open the importer: click <strong>Import from Formulair</strong> on the start screen or in the Import &amp; export box on the Welcome page, or go to <a href="https://miformulas.com/formulair-import.html">https://miformulas.com/formulair-import.html</a>. Drop <code>DataModel.sqlite</code> on it and wait a moment; the file can be large because Formulair keeps a long sync history inside it. When it is done it asks once whether the copy is complete, and points at the same <code>DataModel.sqlite-wal</code> file as step 2. If you point the browser straight at Formulair's own folder instead of at the copy on your Desktop, macOS asks whether the browser may access data from other apps: that other app is Formulair, so click <strong>Allow</strong>.</p>
<p class="helpfig">Screenshot in the online manual: <a href="https://miformulas.com/docs/manual.html#s6-coming-from-formulair">The Formulair importer after reading the database.</a></p>
</li>
<li>
<p>Click <strong>Add to miFormulas</strong>. The app opens and adds everything to what is already there: materials with the same name are matched (their Formulair dilutions come along and empty fields are filled in), the others are added, and every Formulair formula arrives as a frozen formula. A message tells you the counts; one Undo takes the whole import back, and a formula imported before is not imported twice. Prefer a file? <strong>Download miformulas-data.json</strong> gives the same data as a file, for a server or your own tools. <strong>Back to miFormulas</strong> at the top returns to the app without importing.</p>
</li>
</ol>
<p>Every Formulair formula becomes a miFormulas formula with one frozen version, keeping its notes, date, category and colour marks per line, and every material comes with its dilutions, CAS (if you wrote other names next to the CAS number in Formulair, the number stays and those names become alternative names), supplier, cost, IFRA limit, pyramid level, stock and description; categories keep their colours. Nothing is converted or renamed, and amounts are in grams.</p>
<p>Formulair is flat: "Aura v04" and "Aura v05" are two separate formulas there, and they stay separate here. Grouping them into one formula with versions v4, v5 and v6 is a decision for you, made afterwards in the app with <strong>Move into…</strong> (section <a href="#s10-formulas-and-versions">10</a>): open "Aura v04", the one with the lowest number, and click Move into…: the app suggests <strong>this formula</strong> as the target and lists "Aura v05", "Aura v05 20%" and "Aura v06" under Move together, ticked. Click Move: they become the next versions of "Aura v04" in one go, in the order of the numbers in their names; then rename "Aura v04" to "Aura" and give the 20 % one its label with the <strong>pencil</strong>. Opening another one first works too: the app then suggests the lowest-numbered formula as the target. A formula that already holds several versions can no longer be moved itself, so stragglers are moved from their own page. The app never groups by itself, because every perfumer names things differently. For a large collection, <a href="https://miformulas.com/docs/ai-prompts.html"><code>docs/ai-prompts.md</code></a> has a prompt that lets an AI assistant propose the grouping from the list of names, for you to review before you start.</p>
<p>The same conversion exists as a command-line script, <code>tools/formulair-naar-json.py</code>, for those who prefer a terminal.</p>
<h2 id="s7-a-server-setup-for-cross-device-use">7. A server setup for cross-device use</h2>
<p>A data file keeps your work on one computer. The moment you want the same formulas on a second computer and on your phone, something has to hold them in one place that all three can reach. That place is what the app calls a <strong>server</strong>: it loads from it at the start, saves to it after every change, and checks before each save that no other device wrote in the meantime.</p>
<p>It matters most for a phone. No browser on an iPhone or iPad can write to a data file, and Chrome on Android asks permission for the file at every start (section <a href="#s5-install-as-an-app-with-its-own-icon">5</a>). With a server, both simply open the app and are in the same data.</p>
<p>There are two ways there. <strong>A</strong> costs nothing and needs no server, no domain and nothing installed; it is the way for most people. <strong>B</strong> is for those who already have a NAS or a hosting account with PHP.</p>
<h3 id="a-a-free-cloudflare-worker">A. A free Cloudflare Worker</h3>
<p>Cloudflare runs small pieces of code, called Workers, and offers storage for files, called R2. The miFormulas endpoint is one file of about 150 lines that you paste into their editor; the storage holds your data file and the daily snapshots. Both have a free tier without a time limit, and miFormulas stays far inside it: R2 gives 10 GB of storage with a million writes and ten million reads a month, and a Worker 100,000 requests a day, while a data file of a few megabytes and a few hundred saves a day is what heavy use looks like. Enabling R2 may ask for a payment method; within the free tier nothing is charged.</p>
<p>What you end up with is an address like <code>https://miformulas-data.yourname.workers.dev</code>, a token you choose yourself, and your data in a bucket only you can read. It is https from the start, so <strong>Install as an app</strong> (section <a href="#s5-install-as-an-app-with-its-own-icon">5</a>) works on every device.</p>
<p>The screens below are how the Cloudflare dashboard looked in September 2026. Cloudflare moves its buttons from time to time; when a name does not match, their own documentation at <a href="https://developers.cloudflare.com/workers/">https://developers.cloudflare.com/workers/</a> is the place to look.</p>
<p><strong>Before you start.</strong> Have your data ready: click <strong>Backup</strong> in the app and keep that <code>.json</code> file at hand. And choose a token now, a long random string of some twenty characters. You will paste it into two places and nowhere else.</p>
<ol>
<li>
<p><strong>Make an account</strong> at <a href="https://dash.cloudflare.com">https://dash.cloudflare.com</a>. The free account is enough, and you do not need a domain.</p>
<p class="helpfig">Screenshot in the online manual: <a href="https://miformulas.com/docs/manual.html#s7-a-server-setup-for-cross-device-use">The two places in the Cloudflare sidebar, with what sits between them left out: Workers under Compute, R2 under Storage &amp; databases.</a></p>
</li>
<li>
<p><strong>Create the Worker.</strong> In the sidebar choose <strong>Compute</strong> and then <strong>Workers &amp; Pages</strong>, press <strong>Create application</strong>, and choose <strong>Start with Hello World!</strong>. Give it a name you will recognise, <code>miformulas-data</code> for instance; that name becomes part of the address. Deploy it once as it is.</p>
<p class="helpfig">Screenshot in the online manual: <a href="https://miformulas.com/docs/manual.html#s7-a-server-setup-for-cross-device-use">Creating the Worker: start from Hello World.</a></p>
</li>
<li>
<p><strong>Paste the code.</strong> Open the Worker's editor, select everything that is in it, and paste <code>server/worker.js</code> from the miFormulas repository over it (<a href="https://github.com/miformulas/miformulas/blob/main/server/worker.js">https://github.com/miformulas/miformulas/blob/main/server/worker.js</a>, the <strong>Copy raw file</strong> button). Deploy again.</p>
<p class="helpfig">Screenshot in the online manual: <a href="https://miformulas.com/docs/manual.html#s7-a-server-setup-for-cross-device-use">The Worker's code editor with worker.js pasted over the example.</a></p>
</li>
<li>
<p><strong>Create the storage.</strong> In the sidebar choose <strong>Storage &amp; databases</strong> and then <strong>R2 Object Storage</strong>, press <strong>Create bucket</strong>, and name it, <code>miformulas-data</code> for instance. This is where your data file will live.</p>
<p class="helpfig">Screenshot in the online manual: <a href="https://miformulas.com/docs/manual.html#s7-a-server-setup-for-cross-device-use">Creating the R2 bucket that will hold your data file.</a></p>
</li>
<li>
<p><strong>Connect the two.</strong> Back on the Worker's own page, not in the code editor, open its <strong>Bindings</strong> tab and press <strong>Add binding +</strong>, then choose <strong>R2 bucket</strong>. The variable name must be exactly <code>DATA</code>, and the bucket is the one you just made. That name is what the code looks for; finish with <strong>Deploy</strong>.</p>
<p class="helpfig">Screenshot in the online manual: <a href="https://miformulas.com/docs/manual.html#s7-a-server-setup-for-cross-device-use">The R2 bucket binding: the variable name must be exactly DATA.</a></p>
</li>
<li>
<p><strong>Set the token.</strong> On the same Worker, open the <strong>Settings</strong> tab and find <strong>Runtime variables and secrets</strong>. Press <strong>Add variable</strong>, put exactly <code>TOKEN</code> in <strong>Key</strong> and your own token in <strong>Value</strong>, tick <strong>Secret</strong>, and confirm with <strong>Add 1 variable and deploy</strong>. Tick that box: a secret is not shown again afterwards, while a plain variable stays readable to anyone who opens the dashboard.</p>
<p class="helpfig">Screenshot in the online manual: <a href="https://miformulas.com/docs/manual.html#s7-a-server-setup-for-cross-device-use">The token as a secret: Runtime variables and secrets, then Add variable with Secret ticked.</a></p>
</li>
<li>
<p><strong>Note the address.</strong> The Worker's <strong>Domains</strong> tab shows it under <strong>Worker URL</strong>, ending in <code>.workers.dev</code>. That is the endpoint the app needs.</p>
<p class="helpfig">Screenshot in the online manual: <a href="https://miformulas.com/docs/manual.html#s7-a-server-setup-for-cross-device-use">The address of the Worker, on its Domains tab under Worker URL.</a></p>
</li>
<li>
<p><strong>Check it before you go to the app.</strong> Open that address in a browser. It should answer <code>{"error":"invalid token","worker":5}</code>. That is good news: the Worker is alive, it found its bucket and its token, and it refused you because a browser sends no token. The number is the version of the code you pasted, so it also tells you whether a newer <code>worker.js</code> really took. Any other answer names the step that went wrong. <code>TOKEN secret is not set on the Worker</code> is step 6, <code>R2 bucket binding DATA is missing on the Worker</code> is step 5, and a Cloudflare error page instead of JSON means the code of step 3 did not deploy.</p>
<p class="helpfig">Screenshot in the online manual: <a href="https://miformulas.com/docs/manual.html#s7-a-server-setup-for-cross-device-use">The check in a browser: invalid token means the Worker is alive and found its bucket and its token.</a></p>
</li>
<li>
<p><strong>Connect the app.</strong> Open <a href="https://miformulas.com">https://miformulas.com</a>, click <strong>Settings</strong> (⚙), fill in the address as <strong>Server endpoint</strong> and your token as <strong>Access token</strong>, and click Apply. The app reloads, and because the bucket is still empty the start screen stays: it says the server has no data file yet, and offers three ways on. <strong>Start with the starter set</strong> and <strong>Start empty</strong> create one there; <strong>Open data file…</strong>, next to <strong>Connect to server</strong>, reads the Backup you put ready and the app saves that to the server. From then on the header says "Connected to server".</p>
<p class="helpfig">Screenshot in the online manual: <a href="https://miformulas.com/docs/manual.html#s7-a-server-setup-for-cross-device-use">Settings in miFormulas: the address as Server endpoint, your token as Access token.</a></p>
</li>
</ol>
<p>On your other computer and on your phone, only step 9: the same address, the same token. Install the app there (section <a href="#s5-install-as-an-app-with-its-own-icon">5</a>) and it opens straight into your data.</p>
<p><strong>Is my data really in there?</strong> The Worker reports on itself as well, at the same address with <code>?ping=1</code>. A browser cannot send the token, so this one asks for a command line (<code>curl.exe</code> on Windows, <code>curl</code> on macOS and Linux):</p>
<pre><code>curl -H "X-Token: your-token" "https://miformulas-data.yourname.workers.dev/?ping=1"
</code></pre>
<p>The answer is <code>{"ok":true,"worker":5,"etag":…,"bytes":…}</code>, where <code>bytes</code> is the size of the data file in the bucket, to hold against the size of your last Backup. The R2 page in the dashboard shows the same file with its size, next to the folder <code>snapshots/</code>.</p>
<p><strong>Keeping it.</strong> There is nothing to maintain. The app itself comes from miformulas.com and updates itself, and the Worker only holds your data; a newer <code>worker.js</code> is worth pasting in only when the release notes say so, and your data stays where it is because the code and the storage are separate things.</p>
<h3 id="b-your-own-web-server-with-php">B. Your own web server with PHP</h3>
<p>You need a web server with PHP (8.x) that you can put files on: a Synology or QNAP NAS with its web station, a Raspberry Pi, a small hosting account.</p>
<ol>
<li>
<p>Put <code>index.html</code> and <code>server/data.php</code> in a folder on the server, and create a folder <code>data</code> next to them that the web server is allowed to write to. On a NAS this means giving the web server's user (often <code>http</code>) read and write rights on that folder; the endpoint tells you in plain words when it cannot write.</p>
<p>That folder sits in the web root, and a web server serves what is in its web root: someone who tries the address <code>…/data/miformulas-data.json</code> gets your whole file, token or no token, because the token only guards <code>data.php</code>. On Apache the endpoint writes an <code>.htaccess</code> in that folder that denies it, and the repository carries the same file. Other web servers (nginx, Caddy, the web station of some NAS models) do not read <code>.htaccess</code>, so there the safe answer is a folder the web has no address for: open <code>data.php</code> and set <code>$DATA_DIR</code> to a path outside the web root, <code>dirname(__DIR__) . '/miformulas-data'</code> for instance. Step 5 tells you which of the two you have.
2. Open <code>data.php</code> in a text editor and replace <code>change-me-to-a-long-random-token</code> by a long random string of your own. This token is the password to your data.
3. Put your <code>miformulas-data.json</code> in the <code>data</code> folder (a Backup from the app, or the file from the Formulair importer), or let the app create it.
4. Open the server's address in a browser. The app detects <code>data.php</code> next to itself, asks for the token once, and from then on says "Connected to server". On other devices, open the same address and give the same token; or open Settings and fill in the server endpoint and token by hand, which also works for a <code>data.php</code> at another address than the app: the endpoint answers the browser's preflight and allows any origin, so the app and your data may live on two different addresses. Those two fields are there when you open the app from a web address, which is what a server is; the copy you downloaded to your own disk does not show them.
5. <strong>Check it when something is off.</strong> Open the address of <code>data.php</code> itself in a browser: <code>{"error":"invalid token"}</code> is the good answer, because a browser sends no token, and it already tells you that PHP runs and that the file is reachable. With the token it reports on itself. A browser cannot send a header, so this one asks for a command line (<code>curl.exe</code> on Windows, <code>curl</code> on macOS and Linux):</p>
<pre><code>curl -H "X-Token: your-token" "https://your-server/data.php?ping=1"
</code></pre>
<p>The answer is <code>{"ok":true,"etag":…,"bytes":…,"dataDirInWebRoot":…,"htaccess":…}</code>. <code>bytes</code> is the size of the data file on the server, which you can hold against the size of your last Backup; <code>"dataDirInWebRoot":true</code> with <code>"htaccess":false</code> is the case that step 1 is about. The call writes the <code>.htaccess</code> when it is missing and Apache is what you run.</p>
</li>
</ol>
<p>Reaching the server from outside your home is a matter of your network. A VPN such as Tailscale is the simple and safe way, and it can also give the server an https address, which the "Install as an app" options need. Do not put <code>data.php</code> on the open internet without https: the token travels in a header. None of this applies to way A, which is on the internet with https from the start.</p>
<p>To update the app on your own server, copy the new <code>index.html</code> over the old one; the data stays.</p>
<h3 id="what-the-endpoint-does-on-either-way">What the endpoint does, on either way</h3>
<p>It returns the data with an ETag and accepts a save only when the ETag still matches, so that two devices cannot overwrite each other as long as the server passes that ETag through (the app then shows a conflict warning: make a Backup, reload and redo the change; the very first save, when there is no data file yet, has nothing to match and is simply written), and it keeps a snapshot of the previous state on the first save of each day, fourteen days long: in <code>data/snapshots</code> on a PHP server, under <code>snapshots/</code> in the bucket on Cloudflare. A server that hides the ETag from the browser (a proxy that strips the header, or CORS without <code>Access-Control-Expose-Headers</code>) makes the app say so once: saving still works, but that protection is off until it is fixed. Both endpoints send that header themselves, together with the rest of the CORS block and an answer to the browser's preflight, so the app and the endpoint may sit at two different addresses; what can still take the header away is a proxy or a CDN in front of the server. A save is answered with the new ETag and with the number of bytes that were stored, the same figure <code>?ping=1</code> reports, so what is on the server can always be held against the size of your last Backup. Restoring a snapshot is copying that file over <code>miformulas-data.json</code>. When the app starts without loading anything from the server, because it was unreachable or held no data file yet, the first save looks once more before it writes: if a data file has arrived in the meantime, nothing is sent and the app says so, so that a fresh start here cannot land on top of work that was saved elsewhere.</p>
<p>If you would like step-by-step instructions for your own situation, <a href="https://miformulas.com/docs/ai-prompts.html"><code>docs/ai-prompts.md</code></a> has a prompt for each way. Keep in mind that an assistant knows the miFormulas side of it well and the Cloudflare dashboard badly: for way A the screens in this section are the authority, not what an assistant remembers.</p>
<h2 id="s8-the-screen">8. The screen</h2>
<p>The <strong>header</strong> holds two groups. On the left what the content is: the list toggle (☰, also Ctrl+B), <strong>Home</strong>, <strong>+ New formula…</strong> and <strong>+ New material…</strong>; the installed app adds a back and a forward arrow there, because an app window has no toolbar of its own (section <a href="#s21-settings-theme-and-keyboard-shortcuts">21</a>). On the right what the file is: the save state, <strong>Undo</strong> and <strong>Redo</strong> (arrows on a narrow window), <strong>Save</strong> (saving is automatic; this forces it now, also Ctrl+S), <strong>Backup</strong>, <strong>Import/Export</strong> (⇅, section <a href="#s20-import-and-export">20</a>), and then the four buttons you need rarely: reload (the circular arrow, for after an update), the theme (◐ auto, ● dark, ○ light; the icon is the setting and the tooltip spells it out), <strong>Help</strong> (?, this manual inside the app, without the screenshots) and Settings (⚙). Below about 1160 pixels the right group moves to a second row as a whole, so nothing ever runs off the edge.</p>
<p class="helpfig">Screenshot in the online manual: <a href="https://miformulas.com/docs/manual.html#s8-the-screen">The header.</a></p>
<p>The <strong>list panel</strong> on the left has three tabs. <strong>Formulas</strong> and <strong>Materials</strong> group their items by category with a coloured dot; the counter after each formula tells how many versions it holds. <strong>To order</strong> is the shopping list. The search box filters the list: formulas by name; materials by name, alternative names, CAS number and supplier, and from three characters also by the text in their description (those hits are marked with ✎). Accents and ligatures do not matter: "haiti" finds Vetiver Haïti and "coeur" finds Patchouli cœur, and the same folding decides whether an import lands on a material you already have. Each tab keeps its own term, so the name of a material does not stay behind in the formula list when you switch. Typing "starter" lists the starter set. When nothing in your inventory matches and a materials library is loaded (section <a href="#s20-import-and-export">20</a>), the panel says "Not in your inventory" and shows what the library does know, with a <strong>+ Add</strong> button that puts the material in your inventory with its facts.</p>
<p>The <strong>page</strong> on the right shows the selected formula or material, the order list, or the Welcome page.</p>
