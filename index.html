<p class="helpfig">Screenshot in the online manual: <a href="https://miformulas.com/docs/manual.html#s8-the-screen">The list panel on the left and a formula page on the right.</a></p>
<p>On a phone the list and the page take turns; the app is read-only there unless it can save (server, browser storage or a writable file), so that a tap cannot lose anything. Read-only takes away what would change something, in the windows as well: a materials library cannot be imported or fetched there, and <strong>Import from Formulair…</strong> is not offered, because there would be nowhere to save the result. Printing, the Excel export, <strong>Share this version</strong> and the dosage field of the IFRA check stay where they are, because none of them touches your data. The header leaves out ☰, <strong>+ New formula…</strong>, <strong>+ New material…</strong>, <strong>Redo</strong> and <strong>Save</strong> on a phone: the list is the main screen there, creating is desktop work, and saving happens by itself. The formula table drops the columns <strong>Abs %</strong> and <strong>Cost</strong> there, to leave room for the dilution picker; swipe the table sideways to see the rest. The order list drops <strong>Note</strong>, <strong>Price €</strong>, <strong>Product URL</strong> and <strong>Added</strong>, so that the material, the amount and the three buttons fit on the screen without swiping: in a shop you work from that list, you do not fill it in.</p>
<h2 id="s9-materials">9. Materials</h2>
<p>The <strong>Materials</strong> tab is your inventory: the materials you own or have on order. A <strong>materials library</strong> is something else, a reference file of facts that you import (section <a href="#s20-import-and-export">20</a>); it never changes what you own.</p>
<p>A material is anything you weigh: a raw material, a natural, a base, a solvent, one of your own predilutions. Its page holds the name, CAS number, alternative names (trade or common names such as Ambroxan for Ambroxide, separated by semicolons; they count in the search box and when an import matches its lines), category (the categories that come with the starter set and with a Formulair import carry a colour, used for the dots and the pyramid; beside the picker sits a small colour square that sets the colour of the chosen category, so a category you make yourself does not have to stay grey, and <strong>+ New category</strong> makes one without leaving the page), supplier, the amount purchased (free text, so an imported “2 × 50 ml” stays exactly as it was), cost per gram (of the pure material: for a dilution you bought, divide the price by its percentage), IFRA limit, whether it is a solvent, where it is stored (cupboard, fridge, freezer), and its position in the olfactive pyramid (Top, Top-heart, Heart, Heart-base, Base, or ?). Below that come the dilutions, the optional stock ledger (which also holds the date you bought it and the density in g/ml that section <a href="#s19-stock-orders-and-deliveries">19</a> uses to read a volume as a weight), a free description, and the list of every formula the material appears in; click a name there to jump to it. The heading counts them all and the list shows the first sixty, with "and N more" underneath when there are more. A material always keeps at least one dilution, so the last one cannot be deleted: add the other one first.</p>
<p><strong>Look it up.</strong> Next to the CAS number and category sit three small links that open in a new tab, so that checking a material is one click instead of copying its name around: <strong>TGSC</strong> and <strong>Olfactorian</strong> search those sites for the CAS number (only the number itself, whatever else the field holds; or the name, if there is no CAS) through DuckDuckGo, and <strong>IFRA</strong> opens the IFRA Standards library with the CAS number already on your clipboard, because that library has no address per material: paste it in the search box there. The app copies nothing from those sites into your inventory; what you enter is up to you.</p>
<p class="helpfig">Screenshot in the online manual: <a href="https://miformulas.com/docs/manual.html#s9-materials">A material page: fields, dilutions and the stock ledger.</a></p>
<p><strong>Dilutions.</strong> A material offers only the dilutions you actually own. If you have Iso E Super at 100 % and at 10 % in ethanol, add both; if you only ever bought a 10 % dilution of a costly absolute, add only 10 %. Add one with <strong>Add dilution</strong> (a percentage and an optional note) and make it the base with <strong>Set base</strong>; <strong>✕</strong> removes one, and the highest remaining dilution becomes the base if you remove that one. One of them is the <strong>base</strong> dilution, the concentration that new formula lines start with; any dilution can be the base, and 100 % is not assumed. Deleting a dilution that formulas use is allowed: those lines keep their value, it only disappears from the pick list.</p>
<p><strong>Solvent.</strong> Tick this for ethanol, DPG, IPM, TEC and the like. Solvent lines carry no aromatic content: they do not count in the relative percentages and they are what the dilution tools exchange against.</p>
<p><strong>IFRA limit.</strong> Enter the limit in percent of the finished product for Category 4 (fine fragrance), taken from the standards library on ifrafragrance.org. Three special values: <strong>99</strong> means checked, no restriction; <strong>0</strong> means prohibited in this category; empty means not yet checked, and so is any figure below zero. The IFRA panel of a formula uses these figures (section <a href="#s18-ifra-check-and-category-panel">18</a>).</p>
<p><strong>Storage.</strong> A material stored in the fridge shows a ❄ next to formula lines that use it at its base concentration, also on the printed weighing sheet, so you know which bottles to fetch first.</p>
<p><strong>To order.</strong> A material you do not have yet, whether you added it from the order list or it came out of an import, carries the label "to order" and a 🛒 in the list until it is delivered.</p>
<p>Materials come from <strong>+ New material…</strong> in the header (name, category and base dilution; the rest is filled in on the page), from the order list, from an import, or from the predilution tool. With a materials library loaded (section <a href="#s20-import-and-export">20</a>) the name field suggests the names in it, by name and by alternative name, and a match brings its facts along: CAS, category, pyramid level, IFRA limit, the alternative names, and a few lines at the top of the description: the odour words, then the impact, the substantivity and the concentration it is typically used at. Everything stays editable, and one Undo takes the whole material back. The search box in Materials also reaches the library: under your own results it lists what the library knows and you do not have ("Also in the materials library:", or "Not in your inventory. In the materials library:" when you have none of them), eight at a time with "and N more; narrow the search" underneath, each with a <strong>+ Add</strong>. <strong>Browse the library…</strong>, in the + New material window, opens the whole library with a search field and a tick box per material: useful when you start from nothing and want ten materials at once. Shift-click ticks a range, as in the formula table. What you already have is greyed out and cannot be ticked, everything arrives at 100 % base dilution, and the whole batch is a single Undo step. <strong>Delete material</strong> refuses as long as any version uses the material, an older or a frozen one included, and names the formulas; the list of them stands on the page as well. Removing the lines from the latest version is the way out, and for a version that cannot be edited the refusal says so and points at <strong>Delete version</strong>, or at leaving the material where it is, since one you do not use costs you nothing. When nothing uses it any more, deleting asks for confirmation and says how many order-list entries go with it.</p>
<p>Two materials cannot carry the same name, and the app watches the alternative names in both directions. Type a name that one of your materials already carries as an alternative name and it says so before making a second material. Rename a material to a name that another one carries as an alternative name and it asks as well, with the consequence: from then on an import that uses that name lands on the renamed material instead of the other one.</p>
<p><strong>Alternative names may be shared, and often have to be.</strong> Four ylangs come from the same plant, and two isomers with a profile of their own sit under one chemical name, so a botanical or common name can belong to several of your materials at once; the library that comes with miFormulas has twenty-one such names. Your own names stay unique and always win, but a shared alternative name no longer says which jar you mean. The app therefore does not choose one behind your back: <strong>Add line</strong>, <strong>⇄ Replace</strong> and <strong>Delivered…</strong> ask which of them you mean, the import page shows the match it would make together with the other materials that answer to the same name, and the alternative names field tells you when a name you type is already carried by another material. It says which of the two cases you are in: another material carries it as an <strong>alternative name</strong> too, and typing it will ask which of you meant; or it is the <strong>own name</strong> of another material, and then that one always wins, so the alternative name you are typing will never reach this material at all. The suggestion lists behind those boxes carry one line per material with its alternative names beside it, and Chrome and Edge match what you type against those names too, so a botanical name four of your materials share brings up those four and picking one puts its own name in the box.</p>
<p class="helpfig">Screenshot in the online manual: <a href="https://miformulas.com/docs/manual.html#s9-materials">Browse the library: tick what belongs in your own inventory. What you already have is greyed out.</a></p>
<p>Filling in CAS numbers, IFRA limits, pyramid levels and descriptions for many materials is tedious; <a href="https://miformulas.com/docs/ai-prompts.html"><code>docs/ai-prompts.md</code></a> has a prompt that lets an AI assistant propose them from the <strong>Export all materials (Excel)</strong> export, for you to check and enter.</p>
<p>What some apps ship as a built-in materials database, miFormulas keeps as a file you import: a <strong>materials library</strong> (section <a href="#s20-import-and-export">20</a>). With one loaded, a new material arrives with its CAS number, category, pyramid level, IFRA limit, alternative names and a few lines of odour facts already in place, all of it editable. Those are facts, and facts can be shared freely; the odour descriptions on supplier sites are somebody's writing and are not in it. The library published by miFormulas holds several hundred materials under CC BY 4.0, and <strong>Get the latest library</strong> in Settings fetches the current one. It is not inside the app, the repository or the ZIP: it changes more often than the app does, so the app asks for it when you do.</p>
<h2 id="s10-formulas-and-versions">10. Formulas and versions</h2>
<p>A <strong>formula</strong> is a named recipe in a category. Its history is a row of <strong>versions</strong>: v1, v2, v3 and so on, each with a date, an optional label, notes and its own lines. Only the latest version can be edited; every earlier version is a frozen record of what you did, kept exactly as it was. When you want to change something, create a new version (<strong>+ New version</strong> copies the version you are looking at) and edit that. Deleting a version is possible, deleting the past is not: a new version never rewrites an old one.</p>
<p class="helpfig">Screenshot in the online manual: <a href="https://miformulas.com/docs/manual.html#s10-formulas-and-versions">The version row: the version list, + New version and Compare</a></p>
<p>Another presentation of the same recipe is a version too: the formula at 20 % instead of 15 %, with the costly material taken from the 10 % dilution instead of the pure one (make a new version and change the dilutions with <strong>Preserve rel % and exchange solvent</strong>, section <a href="#s13-changing-dilutions">13</a>), or made up as a 44 g batch instead of 100 g (Batch scaling, section <a href="#s14-batch-scaling-and-predilutions">14</a>). Give such a version a label with the <strong>pencil</strong> ("20%", "soap", "44gr") so the list tells them apart. Earlier builds had a separate notion of "variations" for this; it went in build 260915b, because versions do the same with less to learn. A data file that still holds variations loads with a warning: they are left in the file untouched, but not shown.</p>
<p>Formulas imported from Formulair are frozen too (section <a href="#s6-coming-from-formulair">6</a>): you read them, compare them and copy them, but to work on one you make a new version.</p>
<p>Frozen means the amounts are fixed, not that the entry is untouchable. You can still name a version with the <strong>pencil</strong>, write notes, add trial-log entries, set colour marks, arrange the bench view and use <strong>Mark as prepared</strong> on a frozen version: those are your annotations about it, not the recipe itself. In the version list a <strong>🔒</strong> marks a version that came in from an import, and the name it carried there is shown after the version number as a reference; the window behind the <strong>pencil</strong> has a tick box <strong>show the import reference</strong> to hide that name in the list once the grouping is done. It only hides it: the reference stays in the file, so a second Formulair import still recognises the formula.</p>
<p><strong>Move into…</strong> appears on any formula that still has one version, whatever it came from: a formula from the Formulair import, one you brought in with Import formula…, or one you typed yourself. It makes that formula a new version of another formula and removes it from the list. Lines, notes, date, colour marks and trial log come along; an import keeps its import name as a reference and stays frozen, a formula of your own arrives as an ordinary version that keeps its name as the version label, so nothing of it is lost from the list. Everything is one Undo step. This is how you group the flat Formulair import (section <a href="#s6-coming-from-formulair">6</a>). When other single-version formulas share the name, the dialog lists them under <strong>Move together</strong>: those whose name carries a version number ("Aura v04", "Aura v05 20%") come ticked and go into the target in the same go, as versions numbered by that number and then by name. Untick what should stay, and add any other single-version formula with the search field below the list. It does not matter which of them you open: the dialog suggests the one with the lowest number as the target, and if that is the formula you opened, it offers <strong>this formula</strong> and the others move into it. You can always choose another target; a formula that has already received versions cannot be moved itself any more.</p>
<p class="helpfig">Screenshot in the online manual: <a href="https://miformulas.com/docs/manual.html#s10-formulas-and-versions">Move into…: three imported formulas about to become one formula with its own history.</a></p>
<p><strong>Copy to new formula…</strong> takes the version you are looking at as v1 of a new formula, with its lines, bench arrangement, notes and trial log; the notes open with a line saying which formula and version it was copied from. <strong>Rename…</strong> and <strong>Change category…</strong> do what they say; categories are shared between formulas and get a colour dot, which the colour square beside the category picker sets. A new formula starts in <strong>Uncategorised</strong> unless you pick another category, whatever you happened to be looking at.</p>
<p><strong>Delete version</strong> asks first and names the formula and the version it is about. When it is the only version it says so: the formula then stays in your list without lines, and <strong>Delete formula</strong> is what removes the formula itself. Undo (Ctrl+Z) brings a deleted version back during the session.</p>
<h2 id="s11-editing-a-formula">11. Editing a formula</h2>
<p>A formula line is a material, a dilution and a weight in grams. To add one, type the material's name in the <strong>Add material…</strong> box under the table (the list suggests as you type) and click <strong>Add line</strong>; the line starts at the material's base dilution with weight 0. Type the weight, choose another dilution from the list if you have one (a trace dilution keeps the decimals it needs, so 0,001 % and 0,01 % do not both read as 0 %), or pick <strong>custom…</strong> for a percentage you do not stock (the app then warns with ⚠ that this dilution is not in your list, see section <a href="#s13-changing-dilutions">13</a>). Remove a line with ✕, and swap the material on a line for another with <strong>⇄</strong>: the dilution and the weight are carried over, so a line you weighed stays weighed. Both the box and ⇄ accept an alternative name of a material you own ("Ambroxan" finds your "Ambroxide"), so you do not create the same material twice, and the suggestion list shows each material with its alternative names beside it, so typing one of those names brings up the materials that carry it. When nothing of yours carries the name you typed, the app does not go straight to creating one: it runs the same search as the list panel in section <a href="#s8-the-screen">8</a> (name, alternative names, CAS number, supplier, and the description) and shows what that finds, with what it matched on, so that you can pick the material you meant. <strong>None of these</strong> goes on to create it. Adding a material the version already holds at that same dilution asks first, and says what a second line would mean: the weighing sheet lists it twice, while Compare adds the two together. Say yes and an amber line keeps warning about those <strong>duplicate lines</strong>, in the table and in the bench view alike, because it is nearly always a slip. Weights can be typed one after another without the mouse: <strong>Tab</strong> confirms the weight and moves to the next one, Shift+Tab to the previous, and Enter keeps you in the field you are in.</p>
<p class="helpfig">Screenshot in the online manual: <a href="https://miformulas.com/docs/manual.html#s11-editing-a-formula">A formula page: the lines table with dilution, weight, rel % and abs %.</a></p>
<p>If you add a material that is not in your inventory, the app offers to create it as a "to order" material: it goes on the order list, and the line is marked until the material is delivered. With a materials library loaded (section <a href="#s20-import-and-export">20</a>) it arrives with the facts the library holds, exactly as <strong>+ New material…</strong> does; the same goes for a formula import and for <strong>Delivered…</strong> on the order list.</p>
<p>The table can be ordered by original entry, by category or by pyramid level (top to base), or by clicking a column heading; the order is also used for the printed sheets. The little icon before each material name shows its pyramid level in the colour of its category.</p>
<p>Below the table sit <strong>Batch scaling</strong> (section <a href="#s14-batch-scaling-and-predilutions">14</a>, on the editable version only), <strong>Notes</strong>, the <strong>Trial log</strong> (section <a href="#s15-colour-marks-notes-and-the-trial-log">15</a>), the <strong>Categories</strong> panel and the <strong>IFRA check</strong> (section <a href="#s18-ifra-check-and-category-panel">18</a>), and <strong>Mark as prepared</strong> for the stock ledger (section <a href="#s19-stock-orders-and-deliveries">19</a>).</p>
<h2 id="s12-percentages-and-the-perfumery-arithmetic">12. Percentages and the perfumery arithmetic</h2>
<p>The table shows two percentages per line, and they follow perfumery practice rather than plain weight shares.</p>
<p>The <strong>content</strong> of a line is its weight corrected for the dilution: 2 g of a 10 % dilution is 0.2 g of material.</p>
<p><strong>Rel %</strong> is the content of a line divided by the total content of all non-solvent lines. The column adds up to 100; solvent lines show a dash, because they carry no material. This is the composition of the concentrate, independent of how much ethanol is around it.</p>
<p><strong>Abs %</strong> is the content of a line divided by the total weight of the formula, solvents included. The total of this column is the concentration of the mix: a formula with 15 % abs in total is a 15 % concentrate. Solvent lines show their share of the weight here.</p>
<p>The <strong>cost</strong> of a line is weight × cost per gram × dilution, and the total cost is what the batch cost you in materials. The column appears as soon as one material in your inventory carries a price, and stays away while none of them does, because a column of zeros says nothing.</p>
<p>These rules are what makes the dilution tools work: changing a dilution while preserving rel % keeps the smell the same; the abs % and the total weight then tell you what happened to the strength and the batch size.</p>
<h2 id="s13-changing-dilutions">13. Changing dilutions</h2>
<p>Change the dilution of a line by choosing another value in its dilution list. Because a different dilution means a different weight for the same amount of material, the app asks how to proceed:</p>
<ul>
<li><strong>Preserve rel % and exchange solvent.</strong> The weight of the line changes so that its content stays the same, and the difference is taken from or given back to the solvent line (ethanol first, otherwise the first solvent). The total weight and the concentration do not change: this is the same formula, made from another bottle. Not available when there is no solvent line, or when the solvent line does not hold enough to give back.</li>
<li><strong>Preserve rel % only.</strong> The weight of the line changes, nothing else; the total weight and the abs % shift.</li>
<li><strong>Preserve weight.</strong> The grams stay as they are, so the material content and the rel % change. Use this when the weighing is the fact and the dilution was wrong.</li>
</ul>
<p class="helpfig">Screenshot in the online manual: <a href="https://miformulas.com/docs/manual.html#s13-changing-dilutions">Changing a dilution: the three ways to proceed, with the effect on weight and solvent.</a></p>
<p>The same question comes up when you replace a material by another one whose dilutions differ.</p>
<p><strong>Lower</strong> and <strong>Higher</strong> in the tick bar shift all ticked lines to the next lower or higher dilution that the material offers, preserving rel % and exchanging the solvent in one go (so the formula needs a solvent line); lines already at their lowest or highest are skipped and reported, and so is a ticked solvent line, because the solvent is what takes up the difference.</p>
<p class="helpfig">Screenshot in the online manual: <a href="https://miformulas.com/docs/manual.html#s13-changing-dilutions">Ticked lines and the tick bar: marks, Lower and Higher, Create predilution…</a></p>
<p>Lines with a dilution you do not stock are marked ⚠, typically after an import. They compute correctly; when you next make a version, convert them to a dilution you have with "preserve rel % and exchange solvent".</p>
<h2 id="s14-batch-scaling-and-predilutions">14. Batch scaling and predilutions</h2>
<p><strong>Batch scaling</strong> sits under the table. <strong>Apply factor</strong> multiplies every weight (2.5 turns a 40 g trial into 100 g). <strong>Target total</strong> rescales the whole formula to a given weight. <strong>Set EtOH for target abs %</strong> changes only the ethanol line so that the concentrate reaches the percentage you type, adding an ethanol line if there is none; the hint shows the maximum reachable with no ethanol at all. Batch scaling is there on the editable version only, and the printed weighing sheet always shows the weights as they are stored. To weigh another quantity, make a new version and scale that one: the batch on your bench then carries a version number that points back into the app, which a rescaled print would not.</p>
<p><strong>Create predilution…</strong> bundles ticked lines into a separate, weighable mix. Perfumers do this for the trace materials: instead of weighing 4 mg of five things, you weigh 4 g of each once into a premix and dose 0.4 g of that. The app takes the ticked lines as displayed, lets you name the predilution and choose a batch factor (the preview shows the mix weight, its aromatic strength and the smallest line you will have to weigh, in grams like every other weight in the app, so you can see at a glance which factor makes it weighable), then creates three things at once: a frozen predilution formula in the category "Predilutions", a material in the category "Predils" with the aromatic concentration as its dilution and the cost per gram computed, and a new version of your formula in which the ticked lines are replaced by one line of the predilution at the same content. Everything is one Undo step.</p>
<p class="helpfig">Screenshot in the online manual: <a href="https://miformulas.com/docs/manual.html#s14-batch-scaling-and-predilutions">Create predilution: name, batch factor and a preview of the mix.</a></p>
<h2 id="s15-colour-marks-notes-and-the-trial-log">15. Colour marks, notes and the trial log</h2>
<p>Tick lines with the checkboxes on the left (Shift-click ticks a range) and use the <strong>tick bar</strong>: mark them red, green, blue or yellow, unmark them, or clear every mark in the version at once, which asks first and says how many go. Marks are per version, and they carry over into new versions and copies, and into a formula you move into another with <strong>Move into…</strong>. They stay inside the app: a shared file, the Excel exports and <strong>Export all my formulas</strong> carry the recipe, not your marks, because a colour means something to you and nothing to the person you send it to. Use them as you like: what changed, what to smell for, what to check.</p>
<p><strong>Notes</strong> is a free text per version, shown on the formula sheet. The <strong>Trial log</strong> is a dated list of short entries ("day 3, macerated, top too sharp") that also prints on the formula sheet.</p>
<h2 id="s16-bench-view-and-printing">16. Bench view and printing</h2>
<p>The arrangement belongs to the version and hangs on the lines themselves, so changing a dilution or deleting one of two identical lines leaves the other where you put it. <strong>Bench view</strong> (the button next to the formula name, which reads <strong>Table view</strong> while the bench is open, with <strong>Close bench</strong> underneath it) is something you will not find in other formulation apps. It is inspired by the way Ryan Parfums builds his batches in his YouTube videos: start with the core materials, smell, then add the next group of materials step by step. Bench view turns the formula table into that kind of worksheet. The lines start in the <strong>Unsorted</strong> column on the left; drag them into named groups on the right, or tick several lines and choose <strong>Move ticked to…</strong>. The Unsorted column keeps every sort order of the table (original, A to Z, dilution, weight, rel %, category, pyramid), so sorting by category, ticking all the rose materials and moving them into one group takes a few clicks. Five groups are there to start with; <strong>+ Add group</strong> makes as many more as your batch needs, and you can rename, reorder (the ⠿ handle, or ↑ and ↓) and delete groups as you like; <strong>⇤</strong> empties one back into Unsorted without deleting it. Each group shows its line count, weight, rel % and aromatic strength, so you see what each step adds to the batch. The arrangement is saved with the version. The groups stand beside the Unsorted column on a wide screen and below it on a narrower one, so the group buttons are always within reach. <strong>Print bench sheet</strong> prints the groups with a checkbox per line, in the order you will weigh them.</p>
<p class="helpfig">Screenshot in the online manual: <a href="https://miformulas.com/docs/manual.html#s16-bench-view-and-printing">Bench view: the Unsorted column with its own sort order on the left, the groups you build the batch with on the right.</a></p>
<p>From the table view, four buttons under the lines, in this order: <strong>Print full formula</strong>, <strong>Excel export</strong>, <strong>Share this version</strong> and <strong>Print weighing sheet</strong>. The line under them says what each is for. The two prints are not the same sheet: the full formula is the record of the version, the weighing sheet is what you work from at the bench. <strong>Ctrl+P</strong> or File › Print without one of these buttons prints that same weighing sheet of the version you are looking at, in bench view as well; outside a formula it prints a line saying so, so what goes to the printer is never a sheet left over from earlier.</p>
<ul>
<li><strong>Print weighing sheet</strong> prints the lines in the current order with a checkbox, the pyramid icon, the dilution, the grams to weigh and rel %, exactly as the version holds them; it never rescales, so what you weigh always matches a version number (section <a href="#s14-batch-scaling-and-predilutions">14</a>). Fridge materials carry the ❄, and a material you do not own yet reads "(to order)", so you notice at the bench and not at the cupboard.</li>
<li><strong>Print full formula</strong> prints the complete entry with weights, both percentages, the total, and the notes and the trial log underneath; the cost per line is there once a material of yours carries a price, exactly as the column on the screen appears only then. This is the record of the version, the one to keep on paper or as a PDF.</li>
<li><strong>Excel export</strong> downloads the entry as a CSV file, which a spreadsheet opens directly. Use this for a colleague who does not use miFormulas: they can read it, sort it and work in it. A line whose material you have since deleted has no name to write; the app says how many there are and asks before it leaves them out.</li>
<li><strong>Share this version</strong> downloads the entry as a miformulas-import file, the same format described in section <a href="#s20-import-and-export">20</a>. Send it to someone who does use miFormulas and they import it in one action, instead of typing your formula line by line. It holds the material names with their dilution and weight, the CAS numbers, a mark on the lines that are solvent in your inventory, the category, the label of this version and its notes, and nothing of your own lab: no price, no supplier, no stock, no trial log, no colour marks. The lines keep the order of the version, not the sort order on your screen. Here too a line to a material you deleted is left out, after the app has said how many and asked. Weights and dilutions are never converted, here or on the way in, so a dilution the other does not stock arrives with a ⚠ and they convert it themselves in a new version. A material they do not own yet is created for them as "to order", with its CAS and, where the file says so, as a solvent, so that their rel % and abs % read the same as yours. Where the two of you disagree about what is a solvent, their own material decides and the import page says so.</li>
</ul>
<p>Printing uses the browser's print dialog; choose "Save as PDF" there for a PDF. It always comes out dark on white, whichever theme you work in.</p>
<h2 id="s17-comparing-versions">17. Comparing versions</h2>
<p><strong>Compare</strong> (shown as soon as a formula has two versions) puts two versions side by side, aggregated per material: weight and dilutions in A, weight and dilutions in B, rel % in each, and the difference in rel %. Lines only in B are green, lines only in A red, changed lines yellow; the default order puts the largest changes first, and the totals show the weight and the concentration of both. A is the older of the two and B the newer, so the difference reads as what changed since A; opening Compare on the very first version puts that one in A and the next in B. Change A and B with the two lists and close with <strong>Close compare</strong>, which puts you back where you came from, the bench view included. Two versions side by side is not a sheet, so printing is done from one version: close the comparison first.</p>
<p class="helpfig">Screenshot in the online manual: <a href="https://miformulas.com/docs/manual.html#s17-comparing-versions">Compare: two versions side by side, aggregated per material, largest change first.</a></p>
<h2 id="s18-ifra-check-and-category-panel">18. IFRA check and category panel</h2>
<p>The <strong>IFRA check</strong> panel judges the formula against the limits you entered on the materials. An IFRA limit is a percentage of the <strong>finished product</strong>, and the finished product is everything in the bottle, so the check works from each material's share of the whole weight of this version, solvent lines included, and not from its rel %, which stands on the non-solvent content alone. That share is multiplied by the figure in the box, <strong>the percentage of the finished product this formula is</strong>, and compared with the material's limit. The box starts at 100 %: the formula as it stands, with whatever solvents it holds, is what ends up on skin. Write a formula that is a concentrate to be diluted later and you type the figure it goes in at, 12 or 20, and the panel reads as the finished product would.</p>
<p>The heading says at once whether the formula is within limits or how many materials are over; the table shows the restricted materials with their share in the product, their limit and the percentage of the limit that is used, the worst first. It stops at eight rows, or at however many are over their limit, so nothing over a limit is ever left out; a line under the table says how many further materials stayed below theirs. A material you ticked as a <strong>solvent</strong> stands in that table like any other, with its own share: IFRA counts it as part of the finished product whatever role it has in your formula. Materials without a limit entered are listed as not yet verified, and so are materials with a figure below zero, which cannot be a limit; when nothing in the formula carries a limit yet the heading says so, because an empty check is not a clearance. A limit of 0 reads as prohibited. A line whose material you have since deleted is named separately: it still counts in the weights, but there is nothing left to check it against. <strong>A predilution switches the check off.</strong> Its materials live as text in the description of the predilution material, not as lines, so the app cannot see them; checking anyway would report the formula as clean while a restricted material sits in the mix. The heading then says the check is off and names the predilution, and you check the version from before the predilution was made, or the predilution itself under Predilutions, where its materials are lines again. The check is a help, not an IFRA certificate: it knows only what you entered, and only for the product category you had in mind when you entered it.</p>
<p class="helpfig">Screenshot in the online manual: <a href="https://miformulas.com/docs/manual.html#s18-ifra-check-and-category-panel">The IFRA check panel: materials over their limit come first.</a></p>
<p>The <strong>Categories</strong> panel shows how the non-solvent content is spread over material categories, dilution-corrected, with a bar per category. The pyramid drawing above the table works per pyramid level, over the material that carries one: a line whose material still has no level (?) is left out, so those percentages are shares of what is classified, not of the whole concentrate.</p>
<p class="helpfig">Screenshot in the online manual: <a href="https://miformulas.com/docs/manual.html#s18-ifra-check-and-category-panel">The Categories panel.</a></p>
<h2 id="s19-stock-orders-and-deliveries">19. Stock, orders and deliveries</h2>
<p><strong>Stock</strong> is an optional ledger per material, in grams of the base concentration. Open the Stock panel on a material and set a <strong>stocktake</strong> (what is in the bottle now) to start tracking. From then on purchases add, and two things deduct: <strong>Dilution made</strong>, the row with the percentage, the total and the button <strong>Deduct base</strong> (you made 50 g of a 10 % dilution out of a base at 100 %, so 5 g of base left the bottle; with a base at 10 % it would be 50 g, and a dilution stronger than your base is refused) and <strong>Mark as prepared</strong> on a formula, which deducts every base-dilution line of tracked materials, once per version. Purchases in millilitres are converted with the material's density; without a density they are logged but not counted. The ledger follows the base material only, not the dilutions you made from it: a formula line at 10 % does not touch the stock, and an empty bottle of dilution is no problem as long as the base material is still there, because you can make a fresh dilution and log it as <strong>Dilution made</strong>. The estimate is only as good as the entries; the ledger keeps the last events so you can remove a wrong one.</p>
<p><strong>To order</strong> is the shopping list. Add a material from the list itself (existing or new), with <strong>Add to order list</strong> on a material page, or automatically when a formula or an import mentions a material you do not have. Each entry has a note, an amount and unit, a price and a product link; <strong>Search my shops</strong> opens a Google search limited to the web shops you listed under <strong>Edit shop list</strong> (add the shops you buy from, one domain per line). The list starts empty, and as long as it is, the button says <strong>Search the web</strong> instead, because that is what it would do. <strong>Delivered…</strong> closes an entry: you type the <strong>amount purchased</strong> as a number and pick its unit (g or ml, gram to start with), which is what lets the purchase and the ledger below it count with each other. For a material whose stock you track, the window asks one more thing: <strong>was the old stock used up?</strong> Leave the box off and the purchase is added to what the app still counts, which is the ordinary case of a second bottle beside the first. Tick it and the ledger starts again from this purchase, with a stocktake of 0 g on the purchase date, so a bottle you finished long ago does not keep counting. It records that amount and the purchase date on the material, computes <strong>Cost € / g</strong> from the price and the amount (divided by the base dilution, because that field is the price of a gram of pure material), adds to the stock ledger if the material is tracked, creates the material if it was new, and removes the "to order" label. What counts as new is decided by the same folding as everywhere else, alternative names included: type "Vertofix coeur" while you have "Vertofix cœur" and the entry is that material, not a second one, and the window says which material it is about to update; when several of your materials answer to the name, it asks which one first (section <a href="#s9-materials">9</a>). Millilitres need the density of the material: if it has none, the window shows a density field there and then and keeps what you type, because without it neither the cost per gram nor the stock can be worked out. The price itself is not kept on the material: it is only there to work out the cost per gram.</p>
<p class="helpfig">Screenshot in the online manual: <a href="https://miformulas.com/docs/manual.html#s19-stock-orders-and-deliveries">The order list.</a></p>
<h2 id="s20-import-and-export">20. Import and export</h2>
<p>The ⇅ button in the header opens <strong>Import &amp; export</strong>, a window with everything that comes in and goes out. The Welcome page keeps the two ways in that a new inventory starts with, and points at that window for the rest. <strong>Import from Formulair…</strong> opens the importer described in section <a href="#s6-coming-from-formulair">6</a>.</p>
<p><strong>Import materials inventory from CSV…</strong> is the way in for the materials you already keep in Excel, Numbers or Google Sheets, which is where almost everyone keeps them. Save the sheet as a CSV first (in Excel: <strong>File › Save As › CSV</strong>; the app reads the comma, the semicolon and the tab, a decimal comma as well as a point, and the Windows encoding Excel uses when you do not choose "CSV UTF-8"). Then choose the file, and the app shows its columns next to the fields of a material and lets you match them on screen. It fills the matches in itself when it recognises the headers: its own, from <strong>Export all materials (Excel)</strong>, and the usual names (Material, Ingredient, CAS No., Vendor, Price, IFRA, Notes); anything it did not recognise you pick from the list, and only <strong>Name</strong> is required. Under the matching you see the first rows of your sheet as they were read, and a count of what will happen: how many materials will be created, how many rows are skipped because you already have a material with that name, because the name stands twice in the sheet, or because an earlier row in the same sheet brings in a material that answers to it, which happens when the library gives that material an alternative name (nothing of yours is touched by an import) and how many rows have no name. The count is what the import really does: a row that will land on a material another row creates is not promised as a new one. What the sheet leaves empty, the materials library fills in when it knows the name (section <a href="#s9-materials">9</a>), so a sheet with nothing but names still arrives with CAS numbers, categories and pyramid levels. The window names the library that is loaded and says how many of the new names it knows; when none is loaded, it offers <strong>Get the latest library</strong> right there, so the first import does not have to pass through Settings. Pyramid takes the words Top, Top-heart, Heart, Heart-base, Base or the numbers 0 to 4; Solvent, Cupboard, Fridge and Freezer take yes or nothing; Dilutions takes the base first and the others after a slash ("100 / 10"), and a single figure like "10%" makes that the base; the same percentage twice in one cell is read once, as it is everywhere else in the app. A stock column is ignored, because stock is a ledger and an import cannot invent its history. The whole import is one Undo step. <strong>Download a template</strong> (in the same window, in Import &amp; export and on the Welcome page) writes a CSV with the columns the app uses itself and two example rows to overwrite, so nobody has to guess the format with an empty inventory.</p>
<p><strong>Import materials library…</strong> reads a miformulas-materials JSON file: a library of materials with their facts, which the app uses when you add a material, when you tick several in <strong>Browse the library…</strong>, and when a search in Materials finds nothing in your inventory. It is a reference, not your cupboard: nothing appears in your Materials tab until you create a material yourself. One library is loaded at a time, so importing a newer or fuller one replaces the previous one; the materials you own are never touched. Settings (⚙) names the library that is loaded, with its size and its licence, removes it again, and fetches the latest miFormulas library straight from the site with <strong>Get the latest library</strong>, so you do not have to download a file first. The library travels with your data, so it is in your Backup and on your other devices, and Undo takes an import or a removal back in one step. That is also why its size matters: it sits inside your data file, and every change you make writes that file whole, so a large library would be sent to your disk or your server over and over. The app names the size when you load one, and refuses a library above <strong>2 MB</strong>; the published miFormulas library is a fraction of that.</p>
<p><strong>Import formula…</strong> reads a miformulas-import JSON file: a formula transcribed from a photo or a document, or shared by another miFormulas user, either as a new formula or as a new version of an existing one. The import page shows every line with its match in your inventory (always by name, or by one of the alternative names of a material; a material id in the file is ignored, because an id from another data file points at another material). When the file names the material differently from you, that name is shown behind the match ("Ambroxide ← Ambroxan"), because this is the one moment at which you can check it; and when several of your materials answer to the name in the file, they are all named, so you see which one the import would take. It also shows the total weight (with, for a transcription, the reminder that a round number such as 100 or 1000 suggests a complete one; a file shared from another miFormulas is not a transcription, so there that line stays away), which materials are new (they are created as "to order") and which dilutions you do not stock (⚠). It also reads the file critically, because such a file is written elsewhere: a line without a material name, a weight that is not a number or is negative, and a dilution outside 0 to 100 are shown in red with the reason, and <strong>Confirm import</strong> stays out of reach until you correct them in the file. A file that holds no lines at all is refused in the same way, instead of confirming an import of nothing. What can be read is repaired quietly: a decimal comma, a percent sign after a dilution, a missing dilution (which means 100). If you already have a formula with the same name, a new version of it is preselected. Nothing else is converted: dilutions and weights come in exactly as written, and you convert in a next version. Confirm, and the formula opens; Undo takes the whole import back, including the materials, order lines and categories it created. The file format is the small JSON shown in prompt 1 of <a href="https://miformulas.com/docs/ai-prompts.html"><code>docs/ai-prompts.md</code></a>; anything that writes such a file can feed the app.</p>
<p>The same button reads a file that holds <strong>several formulas at once</strong>, the kind <strong>Export all my formulas</strong> writes. Such a file can hold tens of thousands of lines, so the page shows a summary instead of a table of lines: how many formulas, versions and lines, how many lines matched a material you own and how many materials will be created, how many lines use a dilution you do not stock and how many you and the sender disagree about being a solvent. Under that, one row per formula with its versions, lines and new materials. Every line is checked exactly as in a single import, and one that cannot be read blocks <strong>Confirm import</strong> with the formula it sits in named. The formulas arrive as new formulas, each with all its versions; one whose name you already have arrives as "Name (import)" and nothing of yours is touched, so you can join them afterwards with <strong>Move into…</strong> (section <a href="#s10-formulas-and-versions">10</a>). The materials it creates are marked "to order" in Materials but are <strong>not</strong> put on the order list, because hundreds of rows there would drown the list you keep yourself; add the ones you want with <strong>Add to order list</strong> on the material page. The whole import is a single Undo step.</p>
<p><strong>The same button also reads a CSV</strong>, the one <strong>Export all formulas (Excel)</strong> writes, so a collection that went out to a spreadsheet can come back. Choose a <code>.csv</code> file instead of a JSON one and the app puts its columns next to the fields it knows, the way the materials import does: Formula, Category, Entry, Date, Material, Dilution %, Weight g and Notes. Only <strong>Material</strong> and <strong>Weight g</strong> are required. The rows are grouped by Formula and Entry in the order they appear, an empty cell in either carries on the row above, and "v3 45gr" becomes the version label "45gr", because the app numbers versions itself. A material with " (solvent)" behind its name loses the suffix and comes in as a solvent line. The Total line is not read as a line whatever stands beside it: it is the check on the weights, and a version whose lines do not add up to it is named on the next screen, without blocking anything. A row that holds a weight but no material name, a section heading for instance, is left out and counted on both screens. The date from the sheet comes along as the date of the version. A file that carries an empty date keeps it empty on the way in, so a version you never dated does not quietly acquire today's date on a round trip; a file that names no date at all does get today's. Rel %, Abs % and Cost EUR are ignored, because the app works them out from the weights; a sheet that holds percentages or parts instead of grams goes in the <strong>Weight g</strong> column and is read exactly as it stands, since nothing is ever converted. Without a Formula column the file name is the formula and the whole sheet is one version, which is the ordinary case of one formula per sheet. From there on it is the import described above: line by line for a single version, a summary for more, every line checked the same way, and a formula whose name you already have arriving as "Name (import)" for <strong>Move into…</strong> (section <a href="#s10-formulas-and-versions">10</a>) to join afterwards. A sheet written from scratch, with one tab per formula or versions side by side in columns, has no shape the app can guess; for those the AI prompts below are the way in.</p>
<p class="helpfig">Screenshot in the online manual: <a href="https://miformulas.com/docs/manual.html#s20-import-and-export">The import page: every line with its match, the total weight, new materials and dilutions you do not stock.</a></p>
<p><strong>Turning a photo, PDF or spreadsheet into an import file.</strong> You do not have to write that file by hand. Any AI assistant that can read images and files (ChatGPT, Claude, Gemini, Copilot and others) produces it from a photo of a handwritten sheet, a scan, a PDF or a spreadsheet: paste the ready-made prompt from <a href="https://miformulas.com/docs/ai-prompts.html"><code>docs/ai-prompts.md</code></a> (also at https://miformulas.com/docs/ai-prompts.html), attach the photo or file, save the answer as a <code>.json</code> file and import it. The prompt tells the AI assistant to transcribe verbatim, to convert nothing, to use the name on the sheet and never to invent one, and to report the total weight and every doubtful line. Attach the <strong>Export all materials (Excel)</strong> export as well and the assistant uses the exact names of your inventory, so that every line lands on the right material. The app offers the prompts where they help: next to Import formula… and next to the Excel exports in Import &amp; export, under the server fields in Settings, in <strong>Move into…</strong> for grouping a Formulair import, and on the Welcome page while your list of formulas is still empty. The app itself never talks to an AI; the conversion happens in the assistant of your choice, with your files, on your account. That separation is deliberate: a built-in AI would need a paid API key and would send your formulas to a third party, and neither fits an app that keeps everything on your own computer.</p>
<p><strong>Export my inventory as a library…</strong> does the reverse of importing a library: it writes the materials you tick as a miformulas-materials file of your own, named <code>miformulas-my-materials.json</code>. Everything is ticked to begin with, Shift-click ticks a range, and the counter says how many of the ticked ones carry a description you wrote yourself, because those descriptions go into the file exactly as they are. What stays behind is what is nobody's business but yours: stock, price, supplier, dilutions and dates. The file carries no name, version, licence or attribution either, because it is your data and not a publication. Use it to carry your own facts to another computer, or to give a colleague a head start; when a file like that is imported as a library, its descriptions take the place of the odour lines the miFormulas library would otherwise fill in.</p>
<p><strong>Export all my formulas</strong> writes every formula with all its versions as one miformulas-import file, the same format a single shared formula uses. It is the counterpart of Export my inventory as a library: the formulas and their lines, with the material names, their dilutions and weights, the CAS numbers and a mark on the lines that are solvent in your inventory, plus the label, date and notes of each version. Nothing of your own lab goes along: no price, supplier, stock, trial log or colour marks. Use it to hand a colleague your whole collection, or to bring the formulas of one miFormulas into another without overwriting what is there, which is what a Backup would do. A line pointing to a material you have since deleted has no name to match on: the app says how many there are and asks before it writes the file, as the other exports do.</p>
<p><strong>Export all formulas (Excel)</strong> and <strong>Export all materials (Excel)</strong> download everything as CSV files, one row per formula line with both percentages and cost, and one row per material with all its fields, stock and dilutions. The formulas export carries a last column <strong>Notes</strong>, filled on the first line of each version, and writes more decimals whenever three would not hold the weight exactly, so that the file can be read back whole with <strong>Import formula…</strong>; only the trial log stays behind. The separators follow the number format in Settings: a comma for the decimal and a semicolon between the columns in Belgian and most European settings, a point and a comma in English ones, which is what Excel expects in each.</p>
<h2 id="s21-settings-theme-and-keyboard-shortcuts">21. Settings, theme and keyboard shortcuts</h2>
<p><strong>Settings</strong> (⚙, also on the start screen) has the number format (browser default, or a fixed locale such as 1.234,56 or 1,234.56; input accepts both comma and point in any case) and <strong>Open where you left off</strong>. That last one is off by default; with it on, the app starts on the formula or material you had open, and on the version you were looking at, as long as it is still there, instead of on the list. It is a setting of the device you set it on and not part of your data, so each computer and phone has its own, and switching it off forgets the place again. On the site there is also the <strong>server endpoint</strong> and its token; the app you downloaded has neither, because it always works on the data file next to it, and a server is set up in the Settings on the site. Then a few buttons that depend on the situation: <strong>Install as an app</strong> when the browser offers it, <strong>Save to a data file…</strong> and <strong>Delete the data kept in this browser</strong> in browser-storage mode, and <strong>Forget the remembered data file</strong> when a file is remembered. At the bottom sits the materials library (section <a href="#s20-import-and-export">20</a>): the name, size and licence of the one that is loaded, its attribution and source when it carries them, and the buttons <strong>Import materials library…</strong>, <strong>Remove the library</strong> and <strong>Get the latest library</strong>.</p>
<p class="helpfig">Screenshot in the online manual: <a href="https://miformulas.com/docs/manual.html#s21-settings-theme-and-keyboard-shortcuts">Settings in browser-storage mode.</a></p>
<p>The <strong>theme</strong> button (◐, ● or ○, the icon showing which of the three is set) cycles between Auto (follows Windows or macOS), Dark and Light.</p>
<p>Shortcuts: <strong>Ctrl+Z</strong> undo, <strong>Ctrl+Y</strong> or <strong>Ctrl+Shift+Z</strong> redo (the last ten of them), <strong>Ctrl+S</strong> save now, <strong>Ctrl+B</strong> hide or show the list panel, <strong>Shift-click</strong> on a checkbox ticks a range. On a Mac use Cmd instead of Ctrl. While the cursor is in a text field, Ctrl+Z is the browser's own undo for that field, not the app's; click outside it first to take back the change itself. In the list panel a row takes focus with Tab and opens with Enter, and the same goes for material names, sort headers and colour swatches. In a dialog <strong>Enter</strong> is the button on the right (Create, Apply, Add) and <strong>Escape</strong> closes it. Undo and redo both take you back to the formula or the material the change was on, so you see what came back.</p>
<p><strong>Back and forward.</strong> Every place you open is a step: a formula and the version you were looking at, a material, the order list, the Welcome page, the manual. Moving through those steps uses the browser's own history, so the <strong>back and forward buttons of your mouse</strong> work, and so do the browser's own two buttons, <strong>Alt+Left</strong> and <strong>Alt+Right</strong> (Cmd+[ and Cmd+] on a Mac), the swipe gesture on a trackpad, and the back button of an Android phone. Going back moves you, it never changes your data: Ctrl+Z stays the way to take a change back. Switching to another version of the same formula is a step of its own, so back returns you to the version you were reading. A step whose formula or material has been deleted since is skipped and lands you on the list. Reloading the page lands you back on the step you were on when <strong>Open where you left off</strong> is ticked; with it off a reload starts on the list, like any other start. The installed app has no toolbar, so it shows the two arrows in the header instead; they grey out at the ends, and also when the browser has run out of steps to give, because a browser keeps only the last fifty or so. One step too far back at the very start leaves the app, as on any web page, and if you have unsaved work the browser asks first.</p>
<h2 id="s22-backups-and-recovery">22. Backups and recovery</h2>
<p><strong>Backup</strong> in the header writes the complete data file, named with date and time (<code>260907_1402_miformulas-data.json</code>); Chrome and Edge ask where it should go and remember that folder. Make one before anything you are not sure about, and regularly in browser-storage mode; keep them in a <code>backups</code> folder.</p>
<p>The app also keeps one <strong>daily snapshot</strong> in the browser: the state as it was the first time you opened the app that day, so before your first change. A start from the starter set, an empty start and a restored snapshot do not replace it, so what is offered is the state of the last day you really worked. Whenever the start screen appears without your data (the file is gone, the browser copy could not be read, the server holds nothing yet or cannot be reached, or the browser cannot write to files at all), it offers <strong>Restore daily snapshot</strong> with its date; load it and use Backup to write it to a file. When the browser copy is the thing that could not be read, the start screen says so and points at your last Backup, because starting again there would write over what is left of it. Restored while the server was unreachable, the snapshot is not written to the server: before its first save the app reads the server, and if data is there it refuses to overwrite it; use Backup, or reload (F5) once the server is back.</p>
<p><strong>If the app cannot open your data</strong>, the start screen says so and offers a <strong>Backup</strong> of everything that was read, and nothing else: a fresh start would write over the data that is still there. Download that file, reload, and if it happens again open it in another browser or in the downloaded app. A copy that could not be read at all is a different message: there the start screen says the data is damaged and points at your last Backup.</p>
<p>In server mode the server keeps daily snapshots for fourteen days (section <a href="#s7-a-server-setup-for-cross-device-use">7</a>).</p>
<p><strong>Open data file…</strong> opens any of these files. <strong>Undo</strong> covers the last fifty things you did since the app was opened, deletions included (Redo the last ten of them); it does not survive a reload.</p>
<h2 id="s23-questions-and-answers">23. Questions and answers</h2>
<p><strong>The start screen only offers Reopen, and I want the starter set.</strong> The browser still remembers your data file. Click Reopen; if the file exists you continue with it, and if it is gone the starter set comes back. To start a second set of data next to the first, make a Backup, then delete the browser data for the site (Settings in browser-storage mode) or open another data file.</p>
<p><strong>I opened the app in another browser and my data is not there.</strong> Browser storage and the remembered file belong to one browser. Use Backup in the first browser and Open data file… in the second, or switch to a file or a server, which every browser on the computer can open.</p>
<p><strong>Edge asks every time whether the app may edit the file.</strong> That is the browser's rule for local files: one click per session, and the app cannot avoid it. For a site with https the browsers may remember the choice.</p>
<p><strong>The amber bar says my data may be cleared.</strong> The browser has not promised to keep the site's storage. Click <strong>Save to a data file…</strong> in that bar to move your work into a file of your own (Chrome and Edge), or make backups, or check the browser's setting for clearing site data on exit.</p>
<p><strong>A line shows ⚠.</strong> Its dilution is not in the material's list. Add that dilution to the material if you do have it, or convert the line to a dilution you have in a next version.</p>
<p><strong>The IFRA panel says "not yet verified".</strong> Those materials have no limit entered. Look them up on ifrafragrance.org and enter the limit, or 99 if there is none.</p>
<p><strong>Where do the facts of a material come from?</strong> From you, or from a materials library you imported (section <a href="#s20-import-and-export">20</a>). Importing a library adds nothing to your inventory: the list of materials you own stays exactly as long as it was, because a library is a reference you look things up in, not stock you own. A library holds names, alternative names, CAS numbers, categories, pyramid levels, IFRA limits and short odour facts (odour words, impact, substantivity, typical use); when you add a material whose name is in the library, those come along and you can change every one of them afterwards. Without a library nothing changes: you type what you know.</p>
<p><strong>Can I use it on a phone?</strong> Yes. Open the site in Safari and use <strong>Add to Home Screen</strong> (the start screen explains it) for an app with its own icon; its storage is separate from the Safari tab, so load your data again there. A data file is not possible on iOS, so Backup is your safety net, and a server (section <a href="#s7-a-server-setup-for-cross-device-use">7</a>) is what puts the same data on your phone and your computer; the free way there, a Cloudflare Worker, needs no server and no domain of your own. On Android, Chrome is the way in: <strong>Install as an app</strong>, and a data file of your own works as on a computer, except that Chrome asks permission for it at every start (section <a href="#s5-install-as-an-app-with-its-own-icon">5</a>). The number keys on a phone show the decimal sign of your own language, which need not be the one you see in the app: type either, the app reads a comma and a point the same way. On an iPhone the look-up links of a material open in a browser view on top of the app; the X at the top left brings you back.</p>
<p><strong>How do I get my materials in? They are in a spreadsheet.</strong> Save the sheet as a CSV and use <strong>Import materials inventory from CSV…</strong> on the Welcome page, or in Import &amp; export behind ⇅ in the header; the app shows your columns next to its fields and you match them on screen. Only the name is required. Section <a href="#s20-import-and-export">20</a> has the details, and <strong>Download a template</strong> shows the columns the app uses itself.</p>
<p><strong>And my formulas? Those are in a spreadsheet too.</strong> If the sheet came out of miFormulas, <strong>Import formula…</strong> (behind ⇅ in the header) reads the CSV of <strong>Export all formulas (Excel)</strong> straight back: choose the .csv instead of a JSON file and match the columns on screen. For a sheet of your own there is no such round trip, because a formula sheet has no single shape, one tab per formula, versions side by side in columns, the dilution inside the name; there an AI assistant with prompt 1 of <a href="https://miformulas.com/docs/ai-prompts.html"><code>docs/ai-prompts.md</code></a> is the shortest way. Section <a href="#s20-import-and-export">20</a> describes both.</p>
<p><strong>Can the author of miFormulas see my formulas?</strong> No. Nothing leaves your computer unless you put it on a server of your own. The app contacts miformulas.com only for two files you ask for yourself: the starter set and, in Settings, the published materials library. Neither request carries anything of yours. Section <a href="#s3-privacy-who-can-see-your-formulas">3</a> lists every network request the app makes and how to verify that yourself in the code.</p>
<p><strong>Where is the data of an installed app?</strong> In the browser that installed it, in the same place as the site: the app and the tab share their storage and their remembered file. The app itself is loaded from miformulas.com so that it updates by itself, but nothing you make is sent there.</p>
<p><strong>I want the site to forget my data file.</strong> Open Settings (⚙): the button names the file, "Forget the remembered data file “miformulas-data.json”", so you can see which one it is about before you click. It makes the app stop offering Reopen; the file itself is not touched.</p>
<p><strong>Where do I report a problem or suggest something?</strong> On GitHub, at <a href="https://github.com/miformulas/miformulas/issues">https://github.com/miformulas/miformulas/issues</a> (the <strong>Feedback</strong> link on the start screen goes there; writing there needs a free GitHub account). If you would rather not use GitHub, write to info@miformulas.com. The bar above the Help pages has both at hand, next to <strong>Close</strong> and <strong>Contents</strong>: <strong>Read online, with screenshots</strong> opens this manual on the site with its pictures, <strong>Report a problem</strong> opens that issues page, and <strong>Or write an e-mail</strong> opens a message to that address. Say which browser you use and the build number (next to the name in the header, or in the Help bar on a phone), and what you did; a Backup of a data file that shows the problem helps most, if you are willing to share it.</p>
<p class="helpfig">Screenshot in the online manual: <a href="https://miformulas.com/docs/manual.html#s23-questions-and-answers">Settings with a remembered data file: Forget the remembered data file</a></p>

const idb = {

    if (!r){ res(); return; }

  get(k){ return new Promise(res => { if (!idb.db) return res(undefined);   // undefined = we do not know; a stored null is an answer

const UNDO = [], REDO = [];

function snapF(f){ const c = structuredClone(f); pushUndo(() => { const i = DATA.formulas.findIndex(x => x.id === c.id); if (i >= 0) DATA.formulas[i] = c; }); f.modified = now(); }

function undo(){

  if (v && (!v.id || (v.tab === "F" ? DATA.formulas.some(x => x.id === v.id) : v.tab === "M" ? DATA.materials.some(x => x.id === v.id) : true))) VIEW = v;

function matByName(name){   // your material by name or by one of its alternative names; a name of your own wins over an alias

    for (const m of DATA.materials){ const k = normName(m.name); if (k && !MATNAME.has(k)){ MATNAME.set(k, m); byName.add(k); } }
    // Materials of the same plant, or isomers with a profile of their own, share a botanical or common name by nature,

    // every such name is collected here, and whoever asks a human keeps asking instead of picking.
    for (const m of DATA.materials)

function calc(lines){

      ? `<div class="hint" style="padding:.8rem">Nothing here matches “${esc(box.value.trim())}”.${
          VIEW.tab === "M" ? " Materials are searched by name, alternative name, CAS number and supplier, and from three characters also in their description." : ""}</div>`

// The buttons of the formula itself, and their handlers. They are their own pair because a formula without versions
// needs them too: Delete version on the only version leaves the formula in the list, and the confirmation that got
// you there points at Delete formula, which used to exist nowhere on that page.
function metaActionsHtml(f, withCopy){
  return `<button id="btnRenameF" title="Rename this formula">Rename…</button>
      ${withCopy ? '<button id="btnCopyF" title="The selected version becomes v1 of a new formula">Copy to new formula…</button>' : ""}
      ${canMoveInto(f) ? '<button id="btnMoveF" title="This formula becomes a version of another formula">Move into…</button>' : ""}
      <button id="btnCatF" title="Move to another category">Change category…</button><i></i>
      <button id="btnDelF" class="danger" title="Delete the whole formula (undo possible)">Delete formula</button>`;
}
function bindFormulaMeta(f, sub){
  $("#btnRenameF")?.addEventListener("click", () => {
    const n = prompt("Formula name:", f.name); if (!n || n.trim() === f.name) return;
    if (DATA.formulas.some(x => x !== f && normName(x.name) === normName(n))){ alert(`Another formula is already called “${n.trim()}”.`); return; }
    snapF(f); f.name = n.trim(); buildUsage(); markDirty(); render();
  });
  $("#btnCopyF")?.addEventListener("click", () => copyFormula(f, sub));
  $("#btnMoveF")?.addEventListener("click", () => moveInto(f));
  $("#btnCatF")?.addEventListener("click", () => {
    openDialog(`<h3 style="margin:0 0 .3rem">Category – ${esc(f.name)}</h3>
      <div class="toolRow" style="margin:.7rem 0">${catPickerHtml(f.category, "14rem")}</div>`, "Apply", () => {
      const cat = $("#catSel").value;
      if (!cat || cat === f.category) return;
      snapF(f); f.category = cat; undoCat(rememberCat(cat));
      markDirty(); render();
    }, "22rem");
    bindNewCat();
  });
  $("#btnDelF")?.addEventListener("click", () => {
    if (!confirm(`Delete formula “${f.name}” with ${f.versions.length} version(s)?\n\nUndo (Ctrl+Z) can bring it back during this session.`)) return;
    const idx = DATA.formulas.findIndex(x => x.id === f.id), copy = f;
    pushUndo(() => DATA.formulas.splice(idx, 0, copy));

  });
}

function bindLineEditors(f, item){

    const all = [...document.querySelectorAll("input.w")];
    const at = all.findIndex(x => +x.dataset.i === i);
    const t = at < 0 ? null : (all[at + step] || all[at]);

      if (!isFinite(v)){ alert("That weight is too large."); render(); refocus(i, 0); return; }   // 1e999 parses to Infinity, which JSON.stringify writes away as null

function bulkDilShift(f, item, dir){   // dir -1 = next lower % (more diluted), +1 = next higher %

  if (!sel.length){ alert("Tick one or more lines first (checkboxes on the left)."); return; }
  const plan = [], skipped = [], solvSkipped = []; let delta = 0;
  for (const i of sel){
    const l = src[i]; const m = l && matById(l.materialId);
    if (l && m && m.isSolvent){ solvSkipped.push(m.name); continue; }   // the solvent is what takes up the difference
    if (!l || !m) continue;
    const dils = [...new Set((m.dilutions||[]).map(d => d.pct))];
    const d1 = l.dilutionPct ?? 100;
    const next = dir < 0
      ? dils.filter(p => p < d1).sort((a,b) => b-a)[0]
      : dils.filter(p => p > d1).sort((a,b) => a-b)[0];
    if (next == null){ skipped.push(m.name); continue; }
    const w1 = l.weightG || 0, w2 = w1 * d1 / next;
    plan.push({i, next, w2, materialId: l.materialId}); delta += w2 - w1;
  }

    alert(solvSkipped.length && !skipped.length
      ? `Nothing to shift – ${solvSkipped.join(", ")} ${solvSkipped.length === 1 ? "is a solvent" : "are solvents"}, and a solvent line is what takes up the difference. Tick the material lines you want to move instead.`
      : `Nothing to shift – the ticked lines are already at their ${dir<0?"lowest":"highest"} available dilution.`);
    return;
  }
  const sj = solventIdx(src);
  const solv = sj >= 0 ? {j: sj, mm: matById(src[sj].materialId)||{}, w: src[sj].weightG||0} : null;
  if (!solv){ alert("No solvent line in this formula – add ethanol first (e.g. via “Set EtOH for target abs %”) so the total weight can stay constant."); return; }
  if (delta > solv.w + 1e-9){
    alert(`Not possible: ${solv.mm.name} holds only ${fmt(solv.w)} g, but ${fmt(delta)} g must be taken out.\n\nAdd at least ${fmt(delta - solv.w)} g of solvent to the formula first.`);
    return;
  }
