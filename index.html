function nameStem(name){   // "Aura v05" → ["aura", 5]; "Aura" → ["aura", null]
  const m = /^(.*?)[\s._-]*v?(\d+)[a-z]?$/i.exec(name.trim());
  return m && m[1].trim() ? [m[1].trim().toLowerCase(), +m[2]] : [name.trim().toLowerCase(), null];
}
/* ---------- Formulair import: added to the current library, whatever the storage mode ---------- */
// one folding for every comparison: "haiti" finds "Ha\u00efti", "coeur" finds "c\u0153ur", and an import that
// writes "Patchouli coeur" lands on your own "Patchouli c\u0153ur"
const fold = x => (x || "").toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "")
  .replace(/\u0153/g, "oe").replace(/\u00e6/g, "ae").replace(/\u00f8/g, "o").replace(/\u00df/g, "ss").replace(/[\u0111\u00f0]/g, "d").replace(/\u0142/g, "l");
const normName = x => fold(x).trim().replace(/\s+/g, " ");
/* ---------- the materials library: one imported file of facts, used when you add a material ---------- */
const PROMPTS = "https://miformulas.com/docs/ai-prompts.html";   // the ready-made prompts for your own assistant, linked where they help
const LIST_URL = "https://data.miformulas.com/miformulas-materials.json";   // the published library; while it is empty, Settings only offers Import
const nMats = n => n + " material" + (n === 1 ? "" : "s");
// A library is reference material, but it is kept inside your data file, and every change writes that file
// whole: a big one travels to your disk or your server over and over. Hence a ceiling, and the size in words.
const LIBMAX = 2 * 1024 * 1024;
const nBytes = n => n >= 1048576 ? (n / 1048576).toFixed(1) + " MB" : Math.round(n / 1024) + " kB";
const libBytes = pkg => { const j = JSON.stringify(pkg); try{ return new Blob([j]).size; }catch(e){ return j.length; } };
function libraryFits(p){   // false, with the reason, for a library that would not be carried well
  const size = libBytes(p);
  if (size <= LIBMAX) return size;
  alert(`This materials library is ${nBytes(size)}, and the limit is ${nBytes(LIBMAX)}.\n\n`
    + "A library is kept inside your own data file, and every change you make writes that file again, "
    + "so a large one would be sent to your disk or your server over and over.\n\n"
    + "Use a smaller library, or one trimmed to the materials you work with.");
  return 0;
}
function listCredit(){   // CC BY asks for the attribution to be visible, so Settings shows it
  const L = DATA && DATA.materialList; if (!L) return "";
  const a = L.attribution ? esc(L.attribution) : "";
  const src = L.source ? (/^https?:/i.test(L.source) ? `<a href="${esc(L.source)}" target="_blank" rel="noopener">${esc(L.source)}</a>` : esc(L.source)) : "";
  return a || src ? `<div class="hint">${a}${a && src ? " · " : ""}${src}</div>` : "";
}
const listMaterials = () => (DATA && DATA.materialList && DATA.materialList.materials) || [];
function listFind(name){
  const n = normName(name);
  if (!n) return null;
  const all = listMaterials();
  return all.find(m => normName(m.name) === n) || all.find(m => (m.aliases || []).some(a => normName(a) === n)) || null;
}
function listFacts(m){   // odour, impact, substantivity and typical use have no field of their own: a few lines of text
  const b = [];
  if (m.odour && m.odour.length) b.push(m.odour.join(", "));
  if (m.strength) b.push("Impact: " + m.strength);
  if (m.tenacity) b.push("Substantivity: " + m.tenacity);
  if (m.use && m.use.mean){
    let u = "Typical use: " + m.use.mean + " %";
    if (m.use.low && m.use.high) u += ` (usual range: ${m.use.low} % to ${m.use.high} %)`;
    else if (m.use.low) u += ` (from ${m.use.low} %)`;
    if (m.use.n) u += `, ${m.use.n} formula${String(m.use.n) === "1" ? "" : "s"}`;
    b.push(u);
  }
  return b.join("\n");
}
async function fetchLibrary(){   // the published library behind Get the latest library; throws when it cannot be fetched or is not a library
  const r = await fetch(LIST_URL, {cache: "no-store"});
  if (!r.ok) throw new Error(r.status);
  let p = await r.json();
  if (p?.type !== "miformulas-materials" || !Array.isArray(p.materials)) throw new Error("format");
  p = normLibrary(p);
  if (!p.materials.length) throw new Error("empty");
  return p;
}
const ownFind = name => matByName(name);   // your own material by name or by one of its alternative names, as the import matches
function ownNames(){   // the names and alternative names you already have, normalised
  const s = new Set();
  for (const m of DATA.materials){
    s.add(normName(m.name));
    for (const a of (m.aliases || "").split(";")){ const n = normName(a); if (n) s.add(n); }
  }
  return s;
}
// A library entry counts as yours when its own name is one of yours, or when one of its alternative names
// is a material name of yours ("Ambroxan" for your "Ambroxide"). Not on a shared alternative name: a botanical
// name such as "cyperus scariosus root oil" sits on several entries, and Cypriol would then hide Cypriol cœur.
const ownsEntry = (e, have, ownMain) => have.has(normName(e.name)) || (e.aliases || []).some(a => ownMain.has(normName(a)));
const ownMainNames = () => new Set(DATA.materials.map(m => normName(m.name)));
const listHit = (e, t) => fold(e.name).includes(t) || (e.aliases || []).some(a => fold(a).includes(t));
function listSuggest(q){   // entries of the library you do not have yet, by name or alternative name
  const t = fold(q).trim();
  if (t.length < 2) return [];
  const have = ownNames(), ownMain = ownMainNames();
  return listMaterials().filter(e => listHit(e, t) && !ownsEntry(e, have, ownMain));
}
function addFromList(hit, name, pct, cat){   // one material from a library entry (or from a name alone); the caller sorts and does the Undo
  const want = cat || (hit && hit.category) || "Uncategorised";
  const same = DATA.materialCategories.find(x => x.localeCompare(want, undefined, {sensitivity:"base"}) === 0);
  const c = same || want;                       // "musks" next to your own "Musks" would be a second category for one thing
  if (!same){ DATA.materialCategories.push(c); DATA.materialCategories.sort((a,b)=>a.localeCompare(b)); }
  const nm = name || hit.name;
  const m = {id: uid("m-"), name: nm, cas: (hit && hit.cas) || "", category: c, supplier:"", costPerGram:null, modified: now(),
    ifraLimit: hit && hit.ifraLimit != null ? hit.ifraLimit : null, inventory:"",
    pyramid: hit && hit.pyramid != null ? hit.pyramid : 5, isSolvent: !!(hit && hit.isSolvent),
    description: hit ? (hit.description || listFacts(hit)) : "", dilutions:[{pct: pct || 100, isBase:true, date:today(), notes:""}]};
  if (hit){   // the name of the library entry is kept as an alternative name, so an import that uses it still matches
    const al = [hit.name, ...(hit.aliases || [])].filter(a => a && normName(a) !== normName(nm));
    if (al.length) m.aliases = [...new Set(al)].join("; ");
  }
  DATA.materials.push(m);
  return {m, newCat: same ? null : c};
}
// addFromList hangs the library entry's own name and its alternative names on the new material, so a later
// line carrying one of those names belongs on THIS material, not on a second one. An import keyed the map on
// the literal name of the line alone, so "Hedione" and "Methyl dihydrojasmonate" made two jars, each holding
// the other's name as an alias, and the IFRA check then weighed half a material against the whole limit.
function alsoKnownAs(m, map, val){
  for (const a of [m.name, ...String(m.aliases || "").split(";")]){
    const k = normName(a); if (k) map.set(k, val === undefined ? m : val);
  }
}
function newMaterialFrom(name, pct, extra){   // a material you do not own yet: the library fills in what it knows
  const r = addFromList(listFind(name), name, pct, null);
  Object.assign(r.m, extra || {});
  return r;
}
function addListMaterials(names){   // several materials from the library at once, one Undo step; returns the new ids
  const added = [], cats = [];
  for (const n of names){
    const e = listFind(n);
    if (!e || DATA.materials.some(x => normName(x.name) === normName(e.name))) continue;
    const r = addFromList(e, e.name, 100, null);
    added.push(r.m.id); if (r.newCat) cats.push(r.newCat);
  }
  if (!added.length) return added;
  DATA.materials.sort((a,b)=>a.name.localeCompare(b.name)); invalidateMats();
  pushUndo(() => { DATA.materials = DATA.materials.filter(x => !added.includes(x.id)); invalidateMats();
    if (cats.length) DATA.materialCategories = DATA.materialCategories.filter(x => !cats.includes(x));
    if (added.includes(VIEW.id)){ VIEW.id = null; VIEW.sub = null; } });
  markDirty();
  return added;
}
function addOneFromList(name){   // the + Add button under a search that found nothing of your own
  const ids = addListMaterials([name]);
  if (!ids.length) return;
  VIEW = {tab:"M", id: ids[0], sub:null}; HOMEVIEW = false; setTabs(); render();
}
function browseList(){   // pick several materials from the library in one go
  const all = listMaterials();

  const have = ownNames(), ownMain = ownMainNames();
  const mine = e => ownsEntry(e, have, ownMain);
  const picked = new Set();
  let shown = all.length, lastPos = null;
  const count = () => {
    $("#brCount").textContent = `${nMats(picked.size)} ticked · ${shown} of ${all.length} shown`;
    $("#dlgOk").textContent = picked.size ? `Add ${picked.size}` : "Add";
  };
  const draw = () => {
    lastPos = null;   // the positions shift with the filter, so a range starts afresh
    const t = $("#brQ").value.trim().toLowerCase();
    const sel = all.filter(e => !t || listHit(e, t) || (e.category || "").toLowerCase().includes(t) || (e.cas || "").toLowerCase().includes(t));
    shown = sel.length;
    $("#brRows").innerHTML = sel.length ? sel.map(e => {
      const own = mine(e);
      const facts = own ? "in your inventory"
        : [e.category, e.pyramid != null ? PYR[e.pyramid] : "", e.cas].filter(Boolean).map(esc).join(" · ");
      return `<label class="brRow${own ? " have" : ""}"><input type="checkbox" data-n="${esc(e.name)}"${own ? " disabled" : (picked.has(e.name) ? " checked" : "")}><span>${esc(e.name)}</span><span class="sub">${facts}</span></label>`;
    }).join("") : `<div class="hint" style="padding:.6rem">Nothing in the library matches.</div>`;
    count();
  };
  openDialog(`<h3 style="margin:0 0 .3rem">Add materials from the library</h3>
    <div class="hint">Tick what belongs in your own inventory; Shift-click ticks a range. They arrive with the facts of the library, at 100 % base dilution, and you can change everything afterwards.</div>
    <input id="brQ" placeholder="Search the library…" autocomplete="off" style="width:100%;margin:.6rem 0 .4rem">
    <div id="brRows" style="max-height:50vh;overflow:auto;border:1px solid var(--line);border-radius:6px"></div>
    <div class="hint" id="brCount" style="margin-top:.4rem"></div>`, "Add", () => {
    if (!picked.size){ alert("Tick the materials you want to add."); return false; }
    const ids = addListMaterials([...picked]);
    VIEW = {tab:"M", id:null, sub:null}; HOMEVIEW = false; setTabs(); render();
    alert(`${nMats(ids.length)} added to your inventory. Undo (Ctrl+Z) takes them back in one step.`);
  }, "34rem");
  $("#brQ").addEventListener("input", draw);
  $("#brRows").addEventListener("click", e => {   // click, not change: only click carries shiftKey
    const c = e.target.closest("input[data-n]"); if (!c) return;
    const cbs = [...$("#brRows").querySelectorAll("input[data-n]:not([disabled])")];
    const pos = cbs.indexOf(c);
    const tick = cb => { if (cb.checked) picked.add(cb.dataset.n); else picked.delete(cb.dataset.n); };
    if (e.shiftKey && lastPos !== null && pos >= 0){
      const [a, z] = [Math.min(lastPos, pos), Math.max(lastPos, pos)];
      for (let j = a; j <= z; j++){ cbs[j].checked = c.checked; tick(cbs[j]); }
    } else tick(c);
    lastPos = pos;
    count();
  });
  draw(); $("#brQ").focus();
}

  $("#exRows").addEventListener("click", e => {   // click, not change: only click carries shiftKey

    const pos = cbs.indexOf(c);
    const tick = cb => { if (cb.checked) picked.add(cb.dataset.i); else picked.delete(cb.dataset.i); };
    if (e.shiftKey && lastPos !== null && pos >= 0){
      const [a, z] = [Math.min(lastPos, pos), Math.max(lastPos, pos)];

function normLibrary(p){   // a library can come from anywhere: keep the usable entries and put every field in the shape the app expects
  const num = v => { if (v == null || v === "") return null; const n = typeof v === "number" ? v : parseNum(v); return n == null || isNaN(n) ? null : n; };
  const list = v => Array.isArray(v) ? v.map(x => String(x).trim()).filter(Boolean)
                  : (typeof v === "string" && v.trim() ? v.split(";").map(x => x.trim()).filter(Boolean) : []);
  const txt = v => typeof v === "string" ? v.trim() : typeof v === "number" ? String(v) : "";   // an object here would read as "[object Object]"
  const lvl = v => { const n = num(v); return n != null && Number.isInteger(n) && n >= 0 && n <= 4 ? n : null; };   // 5 is "?", which is no level
  const ifra = v => { const n = num(v); return n != null && n >= 0 ? n : null; };                                   // a negative value means "not looked up"
  const flag = v => v === true || v === 1 || /^(true|yes|y|1)$/i.test(typeof v === "string" ? v.trim() : "");        // "no" is not a solvent
  const seen = new Set();
  const materials = [];
  for (const m of p.materials || []){
    if (!m || typeof m.name !== "string" || !m.name.trim()) continue;
    const name = m.name.trim(), key = normName(name);
    if (seen.has(key)) continue;   // two entries with one name make Browse tick and count the wrong row
    seen.add(key);
    const e = {...m, name, aliases: list(m.aliases), odour: list(m.odour), cas: txt(m.cas), category: txt(m.category),
      description: txt(m.description),   // a library exported from an inventory carries its owner's own text
      strength: txt(m.strength), tenacity: txt(m.tenacity), pyramid: lvl(m.pyramid), ifraLimit: ifra(m.ifraLimit), isSolvent: flag(m.isSolvent)};
    for (const k of ["aliases","odour","cas","category","description","strength","tenacity"]) if (!e[k] || !e[k].length) delete e[k];
    for (const k of ["pyramid","ifraLimit"]) if (e[k] == null) delete e[k];
    if (!e.isSolvent) delete e.isSolvent;   // empty fields on every entry would add a third to the size of each save
    materials.push(e);
  }
  return {...p, materials};
}
function setMaterialList(pkg){   // import or remove, always one Undo step
  const before = DATA.materialList;
  DATA.materialList = pkg && {name: pkg.name || "Materials library", version: pkg.version || "", licence: pkg.licence || "",
    source: pkg.source || "", attribution: pkg.attribution || "", materials: pkg.materials};
  pushUndo(() => { DATA.materialList = before; });
  markDirty();
}
async function importListFile(file){
  let p;
  try{ p = JSON.parse(await file.text()); }catch(e){ alert("This file is not valid JSON."); return; }
  if (p?.type !== "miformulas-materials" || !Array.isArray(p.materials) || !p.materials.length){
    alert("This is not a miFormulas materials library (expected type “miformulas-materials” with materials)."); return;
  }
  p = normLibrary(p);
  if (!p.materials.length){ alert("This library holds no usable materials (every entry needs a name)."); return; }
  const size = libraryFits(p); if (!size) return;
  if (DATA.materialList && !confirm(`Replace the materials library “${DATA.materialList.name}” with “${p.name || "this library"}” (${nMats(p.materials.length)}, ${nBytes(size)})?\n\nThe materials you own are not touched.`)) return;
  setMaterialList(p); render();
  alert(`Materials library loaded: ${p.name || "library"}${p.version ? " " + p.version : ""}, ${nMats(p.materials.length)}, ${nBytes(size)}.\n\nNothing was added to your own inventory: the library is a reference, not stock. When you add a material with + New material, a name from the library fills in its CAS, category, pyramid level, IFRA limit and a few lines of odour facts. Undo (Ctrl+Z) takes the library back.`);
}

function mergeImport(pkg){
  const before = structuredClone(DATA);
  const byName = new Map(DATA.materials.map(m => [normName(m.name), m]));
  const ids = new Set([...DATA.materials.map(m => m.id), ...DATA.formulas.map(f => f.id)]);
  const idMap = new Map();
  const n = {matAdded: 0, matMatched: 0, dilAdded: 0, fAdded: 0, fSkipped: 0};
  for (const im of pkg.materials || []){
    const ex = byName.get(normName(im.name));
    if (ex){   // same name: one material; its Formulair dilutions come along, empty fields are filled in
      n.matMatched++; idMap.set(im.id, ex.id);
      ex.dilutions ||= [];
      for (const d of im.dilutions || []) if (!ex.dilutions.some(x => Math.abs(x.pct - d.pct) < 1e-9)){ ex.dilutions.push({...d, isBase: false}); n.dilAdded++; }
      ex.dilutions.sort((a, b) => b.pct - a.pct);
      if (ex.dilutions.length && !ex.dilutions.some(d => d.isBase)) ex.dilutions[0].isBase = true;
      for (const k of ["cas", "aliases", "supplier", "description", "inventory"]) if (!ex[k] && im[k]) ex[k] = im[k];
      for (const k of ["costPerGram", "ifraLimit", "pyramid", "density"]) if (ex[k] == null && im[k] != null) ex[k] = im[k];
      if ((!ex.category || ex.category === "Uncategorised") && im.category && im.category !== "Uncategorised") ex.category = im.category;
    } else {
      const m = structuredClone(im); delete m.starter;
      if (ids.has(m.id)) m.id = uid("m-");
      ids.add(m.id); idMap.set(im.id, m.id);
      DATA.materials.push(m); byName.set(normName(m.name), m); n.matAdded++;
    }
  }
  const addCats = (list, extra) => { for (const c of extra || []) if (c && !list.includes(c)) list.push(c); list.sort((a, b) => a.localeCompare(b)); };
  addCats(DATA.materialCategories ||= [], pkg.materialCategories);
  addCats(DATA.formulaCategories ||= [], pkg.formulaCategories);
  addCats(DATA.suppliers ||= [], pkg.suppliers);

function moveInto(f){

function newVersion(f, fromIdx){

  const v = {v: f.versions.length ? Math.max(...f.versions.map(x=>x.v))+1 : 1, date: today(), notes:"",
    lines: src ? src.lines.map(l => ({...l})) : []};
  if (src && src.bench) v.bench = structuredClone(src.bench);   // the way you weigh it stays the same
  f.versions.push(v); f.frozenImport = false;

  VIEW.sub = {type:"v", idx: f.versions.length-1, bench: !!(VIEW.sub && VIEW.sub.bench)};

const basePct = m => ((m.dilutions||[]).find(d => d.isBase) || {}).pct ?? 100;
const fridgeMark = (m, dil) => (m.locations?.frigo && dil === basePct(m))
  ? ` <span title="Base concentration is stored in the fridge" style="color:var(--frozen)">❄</span>` : "";
function stockCalc(m){
  const ev = m.stockEvents || [];
  let base = null, idx = -1;
  ev.forEach((e,i) => { if (e.t === "take"){ base = e.g; idx = i; } });
  if (base == null) return {tracked:false, qty:null, ev};
  let q = base;
  ev.forEach((e,i) => { if (i > idx){
    if (e.t === "buy" && e.g != null) q += e.g;
    if ((e.t === "dil" || e.t === "prep") && e.g != null) q -= e.g;
  }});
  return {tracked:true, qty:q, ev};
}
function evLabel(e){

  let s = `${e.date} · ${map[e.t]||e.t}`;
  if (e.t==="take") s += ` → ${fmt(e.g)} g${e.note?` · ${e.note}`:""}`;
  if (e.t==="buy") s += `: +${e.amount!=null?fmtS(e.amount):""} ${e.unit||"g"}${e.g!=null&&e.unit==="ml"?` (≈${fmt(e.g)} g)`:""}${e.g==null?" (no density – not counted)":""}${e.note?` · ${e.note}`:""}`;

function markPrepared(f, item, lines){
  const ded = [], other = [], untracked = [];

    const m = matById(l.materialId); if (!m || !(l.weightG > 0)) continue;
    const base = (m.dilutions||[]).find(d => d.isBase);
    const basePct = base ? base.pct : 100;
    if ((l.dilutionPct ?? 100) !== basePct){ other.push(m.name); continue; }
    if (!stockCalc(m).tracked){ untracked.push(m.name); continue; }
    ded.push({m, g: l.weightG});
  }
  const label = vName(item);
  const msg = `Mark ${f.name} ${label} as prepared on ${today()}?\n\n` +
    (ded.length ? `Stock will decrease for ${ded.length} tracked material(s):\n${ded.slice(0,12).map(d=>`  − ${fmt(d.g)} g ${d.m.name}`).join("\n")}${ded.length>12?"\n  …":""}\n\n` : "No tracked base-dilution lines – nothing will be deducted.\n\n") +
    (other.length ? `${other.length} line(s) at other dilutions are untouched (their base was deducted when the dilution was made).\n` : "") +
    (untracked.length ? `${untracked.length} material(s) not tracked.\n` : "") +
    `\nThis can be done once per version.`;
  if (!confirm(msg)) return;
  const fClone = structuredClone(f);
  const mClones = ded.map(d => structuredClone(d.m));
  pushUndo(() => {
    const i = DATA.formulas.findIndex(x => x.id === fClone.id); if (i >= 0) DATA.formulas[i] = fClone;
    mClones.forEach(c => { const j = DATA.materials.findIndex(x => x.id === c.id); if (j >= 0) DATA.materials[j] = c; });
  });
  for (const d of ded){
    (d.m.stockEvents ||= []).push({t:"prep", date: today(), g: d.g, formula: `${f.name} ${label}`});
    d.m.modified = now();
  }
  f.modified = now();
  item.prepared = {date: today(), deductedG: ded.reduce((s,d)=>s+d.g,0), materials: ded.length};
  markDirty(); render();
}

function applyCsvImport(parsed, map){

  const had = ownNames();   // what you had before this import started, so a name an earlier row brought in can be told apart
  for (const r of parsed.rows){
    const name = v(r, "name"); const n = normName(name);
    if (!n) continue;
    if (seen.has(n)){ dup++; continue; }
    // a row can also land on a material an earlier row created, through an alternative name the library gave it
    if (matByName(n)){ dup++; if (!had.has(n)) viaAlias++; continue; }
    seen.add(n);
    // "100 / 100 / 10" made the same dilution twice, which the app refuses everywhere else; the first stays the base
    const dil = [...new Set(v(r, "dilutions").split(/[\/;|]/).map(x => parseNum(x.replace("%", "").trim())).filter(x => x > 0 && x <= 100))];
    const base = dil.length ? dil[0] : 100;
    const res = addFromList(listFind(name), name, base, v(r, "category") || null);   // the sheet wins, the library fills the gaps
    const m = res.m; if (res.newCat) cats.push(res.newCat);
    invalidateMats();
    for (const k of ["cas", "supplier", "inventory", "purchaseDate", "description"]) if (v(r, k)) m[k] = v(r, k);
    if (v(r, "aliases")){   // addFromList keeps the library name as an alias so a later import still matches: add to it, never replace it
      const seenAl = new Set([normName(m.name)]), merged = [];
      for (const a of [...v(r, "aliases").split(";"), ...(m.aliases || "").split(";")]){
        const t = a.trim(), k = normName(t);
        if (t && k && !seenAl.has(k)){ seenAl.add(k); merged.push(t); }
      }
      m.aliases = merged.join("; ");
    }
    for (const k of ["costPerGram", "ifraLimit", "density"]){   // a negative price or density would make the cost of a formula negative;
      const x = parseNum(v(r, k));                              // a negative IFRA limit keeps its meaning: not looked up yet
      if (v(r, k) && x != null && !isNaN(x) && (k === "ifraLimit" || x >= 0)) m[k] = x;
    }
    const py = v(r, "pyramid");
    if (py){ const i = /^[0-4]$/.test(py) ? +py : PYR.findIndex(x => x.toLowerCase() === py.toLowerCase().replace(/\s*[-\/]\s*/g, "-")); if (i >= 0 && i <= 4) m.pyramid = i; }

    added.push(m.id);

  pushUndo(() => {   // one step: the materials and the categories they brought
    DATA.materials = DATA.materials.filter(x => !added.includes(x.id)); invalidateMats();
    if (cats.length) DATA.materialCategories = DATA.materialCategories.filter(x => !cats.includes(x));
    if (added.includes(VIEW.id)){ VIEW.id = null; VIEW.sub = null; }
  });
  markDirty();
  alert(`${added.length} material(s) imported into your inventory${dup ? `; ${dup} row(s) skipped because you already have that name` : ""}`
    + `${viaAlias ? ` (${viaAlias} of them because an earlier row in this sheet brought in a material that answers to it)` : ""}. Undo (Ctrl+Z) takes them all back.`);

}

function shareVersion(f, item, K){   // the version you are looking at, as a file another miFormulas user can import

let IDOSE = null, IFRAOPEN = false, SCALEOPEN = false, NOTESOPEN = null, CATSOPEN = false;   // NOTESOPEN null = follow content

  }
  const rows = [...agg.entries()].filter(([,e]) => e.rel > 0).sort((a,b) => b[1].rel - a[1].rel);

    <summary style="cursor:pointer;font-size:.8rem;text-transform:uppercase;letter-spacing:.07em;font-weight:600;color:var(--accent-ink)">Categories – ${rows.length} used</summary>
    <table class="lines" style="margin-top:.5rem"><thead><tr><th>Category</th><th class="num">Lines</th><th class="num">Rel %</th><th style="width:40%"></th></tr></thead><tbody>

    </tbody><tfoot><tr><td>Total</td><td class="num">${rows.reduce((s,[,e]) => s+e.n, 0)}</td><td class="num">${fmt(tot,2)}</td><td></td></tr></tfoot></table>
    <div class="hint">Share of the non-solvent content, dilution-corrected.</div></details>`;

// a predilution is a mix: its components live as text in the material's description, not as lines, so no
// percentage here can be right. isPredil marks the ones the app makes; the category is the fallback for
// the predilutions already in a data file, so that nothing has to be migrated or rewritten.
const isPredil = m => !!(m && (m.isPredil || m.category === "Predils"));
function ifraPanel(f, item, K, editable){
  const predils = [...new Set(K.rows.filter(r => isPredil(r.m)).map(r => r.m.name).filter(Boolean))];
  if (predils.length){   // switched off rather than wrong: a check that looks past a mix reads as a clearance
    return `<details class="panelBox" id="ifraBox"${IFRAOPEN?" open":""}>
    <summary style="cursor:pointer;font-size:.8rem;text-transform:uppercase;letter-spacing:.07em;font-weight:600;color:var(--amber-ink)">IFRA check – off (predilution in this version)</summary>
    <div class="hint" id="ifraOff" style="color:var(--amber-ink);margin-top:.5rem">This version holds a predilution (${predils.slice(0,6).map(esc).join(", ")}${predils.length>6?", …":""}), and the app does not look inside one: its materials are text in the description, not lines. Checking anyway would report this formula as clean while a restricted material sits in the mix, so the check is off here. Check the version before the predilution was made, or the predilution itself under <b>Predilutions</b>, where the materials are lines again.</div></details>`;
  }
  const agg = new Map();
  let gone = 0;   // lines whose material was deleted: they weigh, but there is nothing to check them against
  for (const r of K.rows){
    // Every line counts, solvent or not: an IFRA limit is a percentage of the finished product, and the
    // product is everything in the bottle. So the share used here is abs % (of the whole weight), which a
    // solvent line has as well, and not rel %, which stands on the non-solvent content alone.
    if (!r.m.name){ gone++; continue; }
    const e = agg.get(r.m.id) || {m: r.m, abs: 0};
    e.abs += r.absPct || 0; agg.set(r.m.id, e);
  }
  const dose = IDOSE ?? 100;   // this formula as it stands is the finished product, unless you say it goes in at less
  const restricted = [], unknown = [];
  for (const e of agg.values()){
    const lim = e.m.ifraLimit;
    if (lim == null || lim < 0){ unknown.push(e.m.name); continue; }   // below zero is not a limit: treat it as not yet checked
    if (lim >= 99) continue;                       // verified: no restriction
    const finalPct = e.abs * dose / 100;
    restricted.push({m: e.m, finalPct, lim, ratio: lim > 0 ? finalPct/lim : Infinity});
  }
  restricted.sort((a,b) => b.ratio - a.ratio);
  const over = restricted.filter(r => r.ratio > 1);
  const nMat = agg.size, nUnknown = unknown.length;
  const verdict = over.length ? `⚠ ${over.length} over limit`
    : restricted.length ? "✓ within limits"
    : nUnknown === nMat && nMat ? `nothing verified yet (${nMat})`   // not a clearance: no limit was ever filled in
    : "no restricted materials";
  let h = `<details class="panelBox" id="ifraBox"${IFRAOPEN?" open":""}>
    <summary style="cursor:pointer;font-size:.8rem;text-transform:uppercase;letter-spacing:.07em;font-weight:600;color:${over.length?"var(--danger)":"var(--accent-ink)"}">IFRA check – ${verdict}</summary>
    <div class="toolRow" style="margin-top:.5rem">At <input type="text" id="ifraDose" aria-label="Percentage of the finished product this formula is" style="width:5rem;text-align:right" inputmode="decimal" value="${fmtIn(dose,2)}"> % of the finished product
      <span class="hint">(default = this formula, solvents included, is the finished product)</span></div>`;
  if (!restricted.length){
    h += `<div class="hint">${nUnknown === nMat && nMat
      ? "None of the materials here carries an IFRA limit yet, so nothing was checked against one."
      : "No restricted materials present."}</div>`;
  } else {
    // The table stops at eight, or at however many are over their limit, so nothing over a limit is ever hidden.
    // What used to disappear in silence was the rest of the restricted list; it says so now, like the usage list.
    const toon = restricted.slice(0, over.length > 8 ? over.length : 8), rest = restricted.length - toon.length;
    h += `<table class="lines"><thead><tr><th>Material</th><th class="num">In product %</th><th class="num">IFRA limit %</th><th class="num">Used</th></tr></thead><tbody>
    ${toon.map(r => `<tr${r.ratio>1?' style="color:var(--danger);font-weight:600"':''}>
      <td>${esc(r.m.name)}</td><td class="num">${fmt(r.finalPct,3)}</td><td class="num">${r.lim === 0 ? "prohibited" : fmt(r.lim,3)}</td>
      <td class="num">${r.lim>0?fmt(r.ratio*100,0)+"%":"not allowed"}</td></tr>`).join("")}
    </tbody></table>${rest > 0 ? `<div class="hint" id="ifraMore">and ${rest} more restricted material(s), all further below their limit.</div>` : ""}`;
  }
  if (unknown.length) h += `<div class="hint">Not yet verified against IFRA (${unknown.length}): ${unknown.slice(0,12).map(esc).join(", ")}${unknown.length>12?", …":""}</div>`;
  // a line to a deleted material used to land in that list as "undefined", while it counts in the weights
  // ⇄ and the line delete are only drawn on an editable version, so an older or frozen one cannot follow
  // that instruction: there the way out is a new version.
  if (gone) h += `<div class="hint" style="color:var(--amber-ink)" id="ifraGone">${gone} line(s) point to a material that no longer exists. They count in the weights above, but there is nothing left to check them against: ${
    editable ? "give them a material again with ⇄, or remove them" : "make a new version to give them a material again, or to remove them"}.</div>`;
  return h + `</details>`;
}

function benchMove(f, item, keys, target, beforeKey){
  if (readOnly()) return;   // nothing here may be written, so nothing here takes an undo step
  snapF(f);
  for (const g of item.bench.groups) g.keys = g.keys.filter(k => !keys.includes(k));
  if (target !== "pool"){
    const g = item.bench.groups[+target]; if (!g) return;
    let idx = beforeKey ? g.keys.indexOf(beforeKey) : -1;
    if (idx < 0) idx = g.keys.length;
    g.keys.splice(idx, 0, ...keys);
  }
  markDirty(); render();
}
function bindBench(f, item, lines, K){
  const c = $("#content");

  // so repair it here as well. Quietly: there was nothing in it to lose, and migrate does the same on the next load.
  if (item.bench && !Array.isArray(item.bench.groups)) item.bench.groups = [];

    r.addEventListener("dragstart", e => {
      const key = r.dataset.key;

    });
    r.addEventListener("dragend", () => { BDRAG = null;
      c.querySelectorAll(".dragging").forEach(x => x.classList.remove("dragging"));
      c.querySelectorAll(".dropbefore").forEach(x => x.classList.remove("dropbefore"));
      c.querySelectorAll(".dropin").forEach(x => x.classList.remove("dropin")); });
    r.addEventListener("dragover", e => { e.preventDefault(); r.classList.add("dropbefore"); });
    r.addEventListener("dragleave", () => r.classList.remove("dropbefore"));

  }));
  gact("bup", gi => { const g = item.bench.groups; [g[gi-1], g[gi]] = [g[gi], g[gi-1]]; });
  gact("bdown", gi => { const g = item.bench.groups; [g[gi], g[gi+1]] = [g[gi+1], g[gi]]; });
  gact("bempty", gi => { item.bench.groups[gi].keys = []; });
  gact("bdel", gi => { item.bench.groups.splice(gi, 1); }, "Delete this bench group? Its lines go back to Unsorted.\n\nUndo (Ctrl+Z) brings it back.");

    hd.addEventListener("dragstart", e => {
      GDRAG = +hd.dataset.bgdrag;
      e.dataTransfer.effectAllowed = "move";

  });

    p.addEventListener("dragover", e => { if (GDRAG != null){ e.preventDefault(); e.stopPropagation(); p.classList.add("gdropbefore"); } });

/* ---------- compare view ---------- */
function aggLines(lines){
  const map = new Map(); let tw = 0, content = 0;
  for (const l of lines||[]){
    const m = matById(l.materialId) || {}; const w = l.weightG||0;
    const cont = m.isSolvent ? 0 : w * (l.dilutionPct??100)/100;
    tw += w; content += cont;
    const e = map.get(l.materialId) || {m, w:0, cont:0, dils:new Set()};
    e.w += w; e.cont += cont; e.dils.add(l.dilutionPct??100);
    map.set(l.materialId, e);
  }
  for (const e of map.values()) e.rel = e.m.isSolvent ? null : (content ? e.cont/content*100 : 0);
  return {map, tw, content, abs: tw ? content/tw*100 : 0};
}
function cmpOptions(f){
  return f.versions.map((v,i)=>({key:"v"+i, label:`${vName(v)} (${v.date||"?"})${v.sourceName?` – ${v.sourceName}`:""}`}));
}
function cmpLines(f, key){
  return f.versions[+key.slice(1)]?.lines || [];
}

function mapSortToCmp(){

}
function renderCompare(f, sub){

  const A = aggLines(cmpLines(f, sub.a)), B = aggLines(cmpLines(f, sub.b));

      cls = chg ? "cmpChg" : "";

    pyr:(x,y) => (((x.m.pyramid??9)===5?9:x.m.pyramid??9)-((y.m.pyramid??9)===5?9:y.m.pyramid??9))||((x.m.name||"").localeCompare(y.m.name||""))
  }[CSORT.key] || ((x,y)=>y.mag-x.mag);
  rows.sort((x,y) => CSORT.dir * by(x,y));
  const cell = e => e ? `${fmt(e.w)} g <span class="hint">(${[...e.dils].sort((a,b)=>b-a).map(fmtS).join("/")}%)</span>` : "–";
  const relCell = e => e ? (e.rel==null ? "–" : fmt(e.rel,2)) : "–";
  const sel = (id, cur) => `<select id="${id}" aria-label="Version ${id === "cmpA" ? "A" : "B"}">${opts.map(o=>`<option value="${o.key}"${o.key===cur?" selected":""}>${esc(o.label)}</option>`).join("")}</select>`;

  c.innerHTML = `<h2>${esc(f.name)} – compare</h2>
  <div class="toolRow"><span class="hint">A</span>${sel("cmpA", sub.a)}<span class="hint">B</span>${sel("cmpB", sub.b)}
    <button class="small" id="btnCmpClose" style="margin-left:auto">Close compare</button></div>
  <div class="toolRow"><span class="hint">Order:</span>
    <select id="cmpSortSel" aria-label="Sort the comparison">

      <option value="cat"${CSORT.key==="cat"?" selected":""}>Category</option>
      <option value="pyr"${CSORT.key==="pyr"?" selected":""}>Pyramid top → base</option>

    </select></div>
  <table class="lines"><thead><tr>${hdr("name","Material")}${hdr("wA","A weight",1)}${hdr("relA","A rel %",1)}
    ${hdr("wB","B weight",1)}${hdr("relB","B rel %",1)}${hdr("dlt","Δ rel %",1)}</tr></thead><tbody>
  ${rows.map(r => `<tr class="${r.cls}"><td>${pyrIcon(r.m.pyramid, catColour(r.m), 13)}${esc(r.m.name||"?")}${r.m.isSolvent?" (solvent)":""}</td>
    <td class="num${r.a?"":" dim"}">${cell(r.a)}</td><td class="num${r.a?"":" dim"}">${relCell(r.a)}</td>
    <td class="num${r.b?"":" dim"}">${cell(r.b)}</td><td class="num${r.b?"":" dim"}">${relCell(r.b)}</td>
    <td class="num">${r.d==null?"":(r.d>0?"+":"")+fmt(r.d,2)}</td></tr>`).join("")}
  </tbody><tfoot><tr><td>Total</td><td class="num">${fmt(A.tw)} g</td><td class="num">abs ${fmt(A.abs,2)}%</td>
    <td class="num">${fmt(B.tw)} g</td><td class="num">abs ${fmt(B.abs,2)}%</td><td></td></tr></tfoot></table>
  <div class="legend">Differences: <i style="background:var(--hl4)"></i>only in B <i style="background:var(--hl2)"></i>only in A <i style="background:var(--hl3)"></i>changed – sorted by size of change; rel % compares per material (dilutions aggregated)</div>`;

    render();
  }));

/* ---------- formula import (photo-to-formula, phase 4) ---------- */
let IMPORTP = null;
function resolveImportLine(L){
  // the import is the gate for files written elsewhere (an AI transcription, another perfumer): every line is checked
  if (!L || typeof L !== "object") L = {};                     // a file can hold null, a number or a string where a line belongs
  const nm = typeof L.material === "string" ? normName(L.material) : "";
  const m = !nm ? null                                   // a line without a name matches nothing: "" would land on the first material without aliases
    : matByName(L.material) || null;   // the name decides, never an id: "Ambroxan" on a sheet finds your "Ambroxide", while an id
                                       // from another data file (the starter set gives everyone m1…m199) would point at another material
  const w = L.weightG == null || L.weightG === "" ? null : parseNum(L.weightG);        // a transcription can hold "2,5" or nothing at all
  const dil = L.dilutionPct == null || L.dilutionPct === "" ? 100 : parseNum(L.dilutionPct);
  const bad = !nm ? "no material name"
    : w == null || !isFinite(w) ? "weight is not a number"   // "1e999" parses to Infinity, which JSON.stringify writes away as null
    : w < 0 ? "negative weight"
    : dil == null || !(dil > 0 && dil <= 100) ? "dilution must be above 0 and at most 100"
    : "";
  const dilOwned = m && !bad ? (m.dilutions||[]).some(d => d.pct === dil) : true;
  const solvMismatch = !bad && !!m && !!L.solvent !== !!m.isSolvent;   // the sender calls the line a solvent and you do not, or the reverse
  return {m, dil, w, bad, dilOwned, solvMismatch};
}
function resolveBulk(p){   // once per file: every line checked, then only the totals are drawn
  if (p._sum) return p._sum;
  const perF = []; const fresh = new Map();   // a material to create is counted once for the whole file
  let nv = 0, nl = 0, matched = 0, bad = 0, warn = 0, solv = 0;
  for (const f of asList(p.formulas)){
    let fl = 0, fbad = 0, fnew = 0, fv = 0;
    for (const v of asList(f?.versions)){
      nv++;
      let vl = 0;
      for (const L of asList(v?.lines)){
        nl++; fl++; vl++;
        const r = resolveImportLine(L);
        if (r.bad){ bad++; fbad++; continue; }
        if (r.m){ matched++; if (!r.dilOwned) warn++; if (r.solvMismatch) solv++; }
        else { const k = normName(L.material); if (!fresh.has(k)){ fresh.set(k, 1); fnew++;
                 const hit = listFind(L.material);   // the names that one material will answer to, counted once
                 if (hit) for (const a of [hit.name, ...(hit.aliases || [])]){ const kk = normName(a); if (kk) fresh.set(kk, 1); } } }
      }
      // applyBulkImport keeps only a version that holds lines, and only a formula that keeps a version. The
      // window used to count everything the file names, so it promised formulas and versions that never arrived.
      if (vl) fv++;
    }
    perF.push({name: f?.name || "?", versions: asList(f?.versions).length, komen: fv, lines: fl, bad: fbad, fresh: fnew,
               labels: asList(f?.versions).map(v => (v && v.name) || ""),   // so the labels are visible before you confirm
               twin: !!DATA.formulas.find(x => normName(x.name) === normName(f?.name))});
  }
  const komenV = perF.reduce((n, f) => n + f.komen, 0), komenF = perF.filter(f => f.komen).length;
  p._sum = {perF, nv, nl, matched, bad, warn, solv, fresh: fresh.size, komenV, komenF,
            wegV: nv - komenV, wegF: perF.length - komenF,
            twins: perF.filter(x => x.twin).length, badF: perF.filter(x => x.bad).length};
  return p._sum;
}
function renderBulkImport(){   // several formulas at once: a summary, because a file like this holds tens of thousands of lines

function applyBulkImport(){
  const p = IMPORTP, s = resolveBulk(p);
  if (s.bad){ alert("Some lines cannot be imported. Correct them in the file and import again."); return; }
  const createdIds = [], createdMatCats = [], createdFCats = [], createdFIds = [];
  const made = new Map();
  for (const f of asList(p.formulas)){
    const versions = [];
    for (const v of asList(f?.versions)){
      const lines = [];
      for (const L of asList(v?.lines)){
        const r = resolveImportLine(L);
        if (r.bad) continue;
        let m = r.m;
        if (!m){
          const k = normName(L.material);
          m = made.get(k);
          if (!m){
            const res = newMaterialFrom(L.material, r.dil, {wishlist: true,
              dilutions: [{pct: r.dil, isBase: true, date: today(), notes: "from import"}]});
            m = res.m;
            if (L.cas) m.cas = L.cas;              // what the sender transcribed wins over the library
            if (L.solvent) m.isSolvent = true;
            if (res.newCat) createdMatCats.push(res.newCat);
            createdIds.push(m.id); made.set(k, m); alsoKnownAs(m, made);
          }
        }
        lines.push({id: uid("l-"), materialId: m.id, dilutionPct: r.dil, weightG: r.w, remark: 1});
      }
      // a version exported without a date carries date:"" and keeps it; a file that names no date at all gets today
      if (lines.length) versions.push({v: versions.length + 1, date: okDate(v.date) || (v && "date" in v ? "" : today()),
        name: v.name || "", notes: v.notes || "", lines});
    }
    if (!versions.length) continue;
    let name = f?.name || "Imported formula";
    while (DATA.formulas.some(x => normName(x.name) === normName(name))) name += " (import)";
    const cat = f?.category || "Uncategorised";
    if (!DATA.formulaCategories.includes(cat)){ DATA.formulaCategories.push(cat); createdFCats.push(cat); }
    const nf = {id: uid("f-"), name, category: cat, created: today(), modified: now(), frozenImport: false, versions};
    DATA.formulas.push(nf); createdFIds.push(nf.id);
  }
  if (!createdFIds.length){   // nothing was made, so there is nothing to undo and nothing to save
    IMPORTP = null; render();
    alert("Nothing was imported: this file holds no formula with lines.");
    return;
  }
  if (createdIds.length){ DATA.materials.sort((a,b) => a.name.localeCompare(b.name)); invalidateMats(); }
  pushUndo(() => {   // one step: the formulas, the materials they created and both kinds of new category
    DATA.formulas = DATA.formulas.filter(x => !createdFIds.includes(x.id));
    DATA.materials = DATA.materials.filter(x => !createdIds.includes(x.id)); invalidateMats();
    if (createdMatCats.length) DATA.materialCategories = DATA.materialCategories.filter(x => !createdMatCats.includes(x));
    if (createdFCats.length) DATA.formulaCategories = DATA.formulaCategories.filter(x => !createdFCats.includes(x));
    if (createdFIds.includes(VIEW.id)){ VIEW.id = null; VIEW.sub = null; }
  });
  buildUsage(); markDirty(); IMPORTP = null;
  alert(`${createdFIds.length} formula(s) added${createdIds.length ? `, with ${createdIds.length} new material(s) marked “to order”` : ""}.`);
  HOMEVIEW = true; switchTab("F", null, null);
}
function renderImport(){

  const rows = p.lines.map(L => ({L: L && typeof L === "object" ? L : {}, ...resolveImportLine(L)}));

  // The same counting as the bulk preview: one material, however many of its names the file uses. A library
  // entry gives the new material its own name and its aliases, so a later line carrying one of those lands
  // on it instead of making a second; counting the literal names promised more than ever arrived.

  const solvCount = rows.filter(r => r.solvMismatch).length;
  const shared = /^shared from miformulas/i.test(p.source || "");   // a file from another miFormulas: the round-number hint means nothing there
  const twin = DATA.formulas.find(x => normName(x.name) === normName(p.name));

      </select>

    ${twin ? `<div class="hint" id="impTwin">You already have a formula called “${esc(twin.name)}”, so a new version is preselected; as a new formula it would arrive as “${esc(twin.name)} (import)”.</div>` : ""}

    <div class="hint">${rows.length} lines · ${rows.filter(r => !r.bad && r.m).length} matched · ${newCount} new (will be created as “to order”) · ${warnCount} with a dilution you don’t stock (⚠ convert in a next version)</div>

    ${p.checkNote ? `<div class="hint" id="impCheck" style="color:var(--amber-ink)">${esc(p.checkNote)}</div>` : ""}
    ${bad ? `<div class="hint" id="impBad" style="color:var(--danger)"><b>${bad} line(s) cannot be imported.</b> Correct them in the file and import again; nothing has been changed yet.</div>` : ""}</div>
  <table class="lines"><thead><tr><th>Material</th><th class="num">Dilution</th><th class="num">Weight (g)</th><th>Status</th></tr></thead><tbody>
  ${rows.map(r => `<tr${r.bad ? ' class="badLine"' : ""}>
    <td>${r.m ? `${pyrIcon(r.m.pyramid, catColour(r.m), 13)}${esc(r.m.name)}${

function applyImport(){
  const p = IMPORTP;
  const impName = p.name || "Imported formula";   // one name for the note on an order line and for the formula itself
  const checked = p.lines.map(L => ({L: L && typeof L === "object" ? L : {}, ...resolveImportLine(L)}));
  if (checked.some(r => r.bad)){ alert("Some lines cannot be imported. Correct them in the file and import again."); return; }
  const targetId = $("#impTarget")?.value || "";
  const target = targetId ? DATA.formulas.find(x => x.id === targetId) : null;
  const oc = structuredClone(DATA.orderList);
  const createdIds = [], createdCats = [], lines = [], made = new Map();   // a name that is new on two lines is created once
  for (const {L, m: found, dil, w} of checked){
    let m = found || made.get(normName(L.material));
    if (!m){
      const r = newMaterialFrom(L.material, dil, {wishlist: true,
        dilutions: [{pct: dil, isBase: true, date: today(), notes: "from import"}]});
      m = r.m;
      if (L.cas) m.cas = L.cas;                  // what you transcribed wins over the library
      if (L.solvent) m.isSolvent = true;         // a shared file says which of its lines are solvent
      if (r.newCat) createdCats.push(r.newCat);
      createdIds.push(m.id); made.set(normName(L.material), m); alsoKnownAs(m, made);
      DATA.orderList.push({id: uid("o-"), materialId: m.id, name: m.name, note: `needed for ${impName}`, price: "", added: today()});
    }
    lines.push({id: uid("l-"), materialId: m.id, dilutionPct: dil, weightG: w, remark: 1});
  }
  if (createdIds.length){ DATA.materials.sort((a,b) => a.name.localeCompare(b.name)); invalidateMats(); }
  if (target){   // add as a new version of an existing formula
    const clone = structuredClone(target);
    // provenance goes into the notes; the version label stays free for the user to choose
    const prov = `Imported ${today()}${p.name?` · source: ${p.name}`:""}${p.source?` · ${p.source}`:""}.`;
    const nv = {v: Math.max(...target.versions.map(x => x.v), 0) + 1, date: okDate(p.date) || ("date" in p ? "" : today()),
      name: p.versionName || "", notes: p.notes ? `${p.notes}\n\n${prov}` : prov, lines};
    target.versions.push(nv); target.frozenImport = false; target.modified = now();
    pushUndo(() => {
      DATA.orderList = oc;
      const i = DATA.formulas.findIndex(x => x.id === clone.id); if (i >= 0) DATA.formulas[i] = clone;
      DATA.materials = DATA.materials.filter(x => !createdIds.includes(x.id)); invalidateMats();
      if (createdCats.length) DATA.materialCategories = DATA.materialCategories.filter(x => !createdCats.includes(x));
    });
    buildUsage(); markDirty(); IMPORTP = null;
    switchTab("F", target.id, {type:"v", idx: target.versions.length - 1});
    return;
  }
  let name = impName;
  while (DATA.formulas.some(x => normName(x.name) === normName(name))) name += " (import)";   // "aura" and "Aura" are one name
  const cat = p.category || "Uncategorised";
  const newFCat = !DATA.formulaCategories.includes(cat);
  if (newFCat) DATA.formulaCategories.push(cat);
  const f = {id: uid("f-"), name, category: cat, created: today(), modified: now(), frozenImport: false,
    versions: [{v: 1, date: okDate(p.date) || ("date" in p ? "" : today()), name: p.versionName || "", notes: p.notes || "", lines}]};
  DATA.formulas.push(f);
  pushUndo(() => {   // one step: the formula, the materials it created, the order lines and both new categories
    DATA.orderList = oc;
    DATA.formulas = DATA.formulas.filter(x => x.id !== f.id);
    DATA.materials = DATA.materials.filter(x => !createdIds.includes(x.id)); invalidateMats();
    if (createdCats.length) DATA.materialCategories = DATA.materialCategories.filter(x => !createdCats.includes(x));
    if (newFCat) DATA.formulaCategories = DATA.formulaCategories.filter(x => x !== cat);
    if (VIEW.id === f.id){ VIEW.id = null; VIEW.sub = null; }
  });
  buildUsage(); markDirty(); IMPORTP = null;
  switchTab("F", f.id, {type:"v", idx:0});
}

function deliveredDialog(idx, chosen){
  const o = DATA.orderList[idx];
  // the folding decides here as well: an accent, a ligature or an alternative name used to leave you with a second,
  // empty material that answered to the name of the first one from then on
  if (!chosen && !o.materialId){
    const cands = matsByName(o.name);
    if (cands.length > 1){ pickMaterial(asHits(cands), o.name, m2 => deliveredDialog(idx, m2)); return; }
  }
  const m = chosen || (o.materialId ? matById(o.materialId) : ownFind(o.name));
  const st = m ? stockCalc(m) : {tracked: false, qty: null};
  const tracked = st.tracked;
  const dlg = $("#dlg");
  dlg.innerHTML = `<div style="padding:1.2rem 1.4rem;min-width:24rem">
    <h3 style="margin:0 0 .3rem">Delivered – ${esc(o.name)}</h3>
    <div class="hint" style="margin-bottom:.7rem">${m
      ? (m.name === o.name ? "Updates the existing material."
         : `Updates <b>${esc(m.name)}</b>, which is what you have under that name.`)
      : "Creates a new material."}</div>
    <div class="fieldGrid">
      <label for="dvAmt">Amount purchased</label><span><input id="dvAmt" value="${o.amount!=null?fmtSIn(o.amount):""}" placeholder="10" style="width:4.5rem;text-align:right" inputmode="decimal">
        <select id="dvU"><option${(o.unit||"g")==="g"?" selected":""}>g</option><option${o.unit==="ml"?" selected":""}>ml</option></select></span>
      <label for="dvPrice">Price paid €</label><input id="dvPrice" value="${esc(o.price||"")}" placeholder="12.50" style="width:6rem;text-align:right">
      <label for="dvDate">Purchase date</label><input type="date" id="dvDate" value="${today()}" style="justify-self:start">
      ${tracked ? `<label for="dvG">Add to stock ledger</label><span><input id="dvG" value="${o.amount!=null?fmtSIn(o.amount):""}" style="width:4.5rem;text-align:right" placeholder="amount"> <span class="hint" id="dvGU">${esc(o.unit||"g")}</span> · the same purchase, booked into the ledger</span>
      <label for="dvFresh">Old stock used up</label><span><input type="checkbox" id="dvFresh"> <span class="hint">the bottle was empty, so this purchase is the whole stock; leave it off and the app adds the purchase to the ${fmt(st.qty||0)} g it still counts</span></span>` : ""}
      <label for="dvDens" id="dvDensL" hidden>Density g/ml</label><span id="dvDensW" hidden><input id="dvDens" value="${m && m.density != null ? fmtSIn(m.density, 4) : ""}" placeholder="e.g. 0,95" style="width:5rem;text-align:right" inputmode="decimal"> <span class="hint">millilitres become grams with this; without it neither the cost per gram nor the stock can be worked out</span></span>
    </div>
    <div class="hint" style="margin-top:.4rem">With an amount and a price, Cost € / g is worked out; millilitres need the density of the material.${m && basePct(m) !== 100 ? ` ${esc(m.name)} has a base dilution of ${fmtS(basePct(m))} %, so ${fmtS(100/basePct(m),2)} g of it holds one gram of material and the price per gram is computed on that.` : ""}</div>
    <div class="toolRow" style="justify-content:flex-end;margin-top:.9rem"><button id="dlgCancel">Cancel</button><button class="primary" id="dlgOk">Confirm</button></div></div>`;
  dlg.showModal();
  const syncU = () => {   // millilitres without a density: say so here, and let the density be typed here as well
    const ml = $("#dvU").value === "ml", geen = !(m && m.density > 0);
    const w = $("#dvDensW"), l = $("#dvDensL");
    if (w && l){ w.hidden = l.hidden = !(ml && geen); }
    const gu = $("#dvGU"); if (gu) gu.textContent = $("#dvU").value;
  };
  $("#dvU").addEventListener("change", syncU); syncU();
  let gTouched = false;   // the ledger follows the purchase until you say otherwise
  $("#dvG")?.addEventListener("input", () => { gTouched = true; });
  $("#dvAmt").addEventListener("input", () => { if (!gTouched && $("#dvG")) $("#dvG").value = $("#dvAmt").value; });
  $("#dlgCancel").addEventListener("click", () => dlg.close());
  $("#dlgOk").addEventListener("click", () => {
    const val = parseNum($("#dvAmt").value), unit = $("#dvU").value;
    const amt = val != null ? `${fmtS(val)} ${unit}` : "";   // the field of a material stays free text, for imports and for what you typed years ago
    const date = $("#dvDate").value || today();
    const price = parseNum($("#dvPrice").value);
    const dvDens = parseNum($("#dvDens")?.value);
    const costPerGram = (dens, pct) => {          // the field holds the price of a gram of pure material
      if (!price || !val) return null;
      const d = dvDens != null && dvDens > 0 ? dvDens : dens;
      const grams = unit === "ml" ? (d ? val * d : null) : val;
      const pure = grams ? grams * ((pct ?? 100) / 100) : null;
      return pure ? price / pure : null;
    };
    // the same rule as the material page and the CSV import: a negative price makes the cost of every formula
    // that holds this material negative, and Delivered was the one way in
    if (price != null && price < 0){ alert("A price cannot be negative."); return; }
    if (dvDens != null && dvDens < 0){ alert("A density cannot be negative."); return; }
    if (val != null && val < 0){ alert("An amount cannot be negative."); return; }
    dlg.close();
    const oc = structuredClone(DATA.orderList);
    if (m){
      const mc = structuredClone(m);
      pushUndo(() => { DATA.orderList = oc; const j = DATA.materials.findIndex(x => x.id === mc.id); if (j >= 0) DATA.materials[j] = mc; });
      if (amt) m.inventory = amt;
      if (dvDens != null && dvDens > 0 && m.density == null) m.density = dvDens;   // typed here, so it counts from now on
      const cg = costPerGram(m.density, basePct(m));
      if (cg) m.costPerGram = +cg.toFixed(4);
      m.purchaseDate = date; m.modified = now(); delete m.wishlist;
      const g = parseNum($("#dvG")?.value);
      // the bottle you are replacing was empty: a stocktake of 0 on the purchase date, so the ledger starts
      // again here instead of counting this purchase on top of what it still thought was in the cupboard
      if ($("#dvFresh")?.checked) (m.stockEvents ||= []).push({t:"take", date, g: 0, note: "old stock used up"});
      if (g){ const grams = unit === "g" ? g : (m.density ? g * m.density : null);
        (m.stockEvents ||= []).push({t:"buy", date, amount: g, unit, g: grams, note: "delivered (order list)"}); }
      DATA.orderList.splice(idx, 1);
      markDirty(); switchTab("M", m.id, null);
    } else {
      const cg = costPerGram(null, 100);   // a new material starts at 100 %
      const r = newMaterialFrom(o.name, 100, {costPerGram: cg ? +cg.toFixed(4) : null, inventory: amt, purchaseDate: date,
        density: dvDens != null && dvDens > 0 ? dvDens : null,
        dilutions:[{pct:100, isBase:true, date, notes:""}]});
      const nm = r.m, newCat = r.newCat;
      pushUndo(() => { DATA.orderList = oc; DATA.materials = DATA.materials.filter(x => x.id !== nm.id); invalidateMats();
        if (newCat) DATA.materialCategories = DATA.materialCategories.filter(x => x !== newCat);
        if (VIEW.id === nm.id) VIEW.id = null; });
      DATA.materials.sort((a,b) => a.name.localeCompare(b.name)); invalidateMats();
      DATA.orderList.splice(idx, 1);
      markDirty(); switchTab("M", nm.id, null);
    }
  });
}

// look-up links on the material page: the app copies nothing and contacts nobody; the user clicks, in a new tab.
// DuckDuckGo rather than Google, so the query is not tied to an account. IFRA's library has no link per material:
// it opens with the CAS number (or the name) on the clipboard, ready to paste in its search box.
function lookupLinks(m){
  const cas = ((m.cas || "").match(CAS_RE) || [])[0] || "";
  const key = cas || (m.name || "").trim(); if (!key) return "";
  const ddg = q => "https://duckduckgo.com/?q=" + encodeURIComponent(q);
  const a = (href, label, title, extra = "") => `<a class="small lookup" href="${href}" target="_blank" rel="noopener" title="${title}"${extra}>${label} \u2197</a>`;
  return a(ddg(key + " tgsc"), "TGSC", "Look this material up on The Good Scents Company (via DuckDuckGo)")
    + a(ddg("site:olfactorian.com " + key), "Olfactorian", "Look this material up on Olfactorian (via DuckDuckGo)")
    + a("https://ifrafragrance.org/safe-use/library", "IFRA", `Opens the IFRA Standards library; the ${cas ? "CAS number" : "name"} is put on your clipboard, paste it in the search box there`, ` data-copy="${esc(key)}"`);
}

    snapM(m); m.stockEvents.splice(+b.dataset.delev, 1); markDirty(); render();
  }));
  c.querySelectorAll("[data-setbase]").forEach(b => b.addEventListener("click", () => {
    snapM(m); m.dilutions.forEach((d,i) => d.isBase = i === +b.dataset.setbase);
    markDirty(); render();
  }));
  c.querySelectorAll("[data-deldil]").forEach(b => b.addEventListener("click", () => {
    const d = m.dilutions[+b.dataset.deldil];
    if ((m.dilutions || []).length <= 1){   // without one, basePct falls back to 100 and Add line would quietly use a strength you do not own
      alert(`“${m.name}” would be left without a dilution, and every material needs one: 100 % is never implied here.\n\nAdd the other dilution first, then delete this one.`); return;
    }
    let used = 0, inF = new Set();
    for (const f of DATA.formulas)
      for (const it of f.versions)
        for (const l of it.lines || [])
          if (l.materialId === m.id && l.dilutionPct === d.pct){ used++; inF.add(f.name); }
    const msg = used
      ? `Delete dilution ${fmtS(d.pct)}% of “${m.name}”?\n\nIt is used in ${used} formula line(s) (${[...inF].slice(0,5).join(", ")}${inF.size>5?", …":""}). Those lines keep their ${fmtS(d.pct)}% value – it only disappears from the pick list for future edits.`
      : `Delete dilution ${fmtS(d.pct)}% of “${m.name}”? It is not used in any formula.`;
    if (!confirm(msg)) return;
    snapM(m); m.dilutions.splice(+b.dataset.deldil,1);
    if (m.dilutions.length && !m.dilutions.some(d => d.isBase)){   // there is always a base dilution
      m.dilutions.reduce((a,x) => !a || x.pct > a.pct ? x : a, null).isBase = true;
    }
    markDirty(); render();
  }));
  $("#btnAddDil")?.addEventListener("click", () => {
    const p = parseNum($("#newDil").value);
    if (p == null || !(p > 0 && p <= 100)){ alert("A dilution is a percentage between 0 and 100."); return; }
    if ((m.dilutions || []).some(d => d.pct === p)){ alert(`“${m.name}” already has a ${fmtS(p)} % dilution.`); return; }
    snapM(m);
    (m.dilutions ||= []).push({pct:p, isBase:false, date:today(), notes:$("#newDilNote").value.trim()});
    m.dilutions.sort((a,b)=>b.pct-a.pct); markDirty(); render();
  });
  c.querySelectorAll("[data-go]").forEach(a => a.addEventListener("click", () => {
    switchTab("F", a.dataset.go, null);
  }));
  $("#btnToOrder")?.addEventListener("click", () => {
    if (DATA.orderList.some(o => o.materialId === m.id)){ alert("Already on the order list."); switchTab("T"); return; }
    snapO(); DATA.orderList.push({id: uid("o-"), materialId: m.id, name: m.name, note: "restock", price: "", added: today()});
    markDirty(); switchTab("T");
  });
  $("#btnDelMat")?.addEventListener("click", () => {
    const uses = USAGE[m.id] || [];
    if (uses.length){
      const fnames = [...new Set(uses.map(u => u.name))];
      // an older or frozen version is read-only, so "remove those lines" cannot be done there: name the way out
      const oud = [...new Set(uses.map(u => u.fid))].filter(fid => {
        const f2 = DATA.formulas.find(x => x.id === fid);
        if (!f2) return false;
        const laatste = f2.versions[f2.versions.length - 1];
        return f2.frozenImport || !(laatste?.lines || []).some(l => l.materialId === m.id);
      }).length;
      alert(`Cannot delete “${m.name}”: used in ${uses.length} formula line(s) (${fnames.slice(0,5).join(", ")}${fnames.length>5?", …":""}).`
        + `\n\nRemove those lines from the latest version of each formula.`
        + (oud ? `\n\nIn ${oud} formula(s) it only sits in an older or frozen version, which cannot be edited. Delete version removes such a version, also a frozen one; or leave the material where it is, since one you do not use costs you nothing.` : ""));
      return;
    }
    const onOrder = DATA.orderList.filter(o => o.materialId === m.id).length;
    if (!confirm(`Delete material “${m.name}”? It is not used in any formula.${onOrder ? `\n\nIts ${onOrder} entry(ies) on the order list will be removed too.` : ""}\n\nUndo (Ctrl+Z) brings it back.`)) return;
    const idx = DATA.materials.findIndex(x => x.id === m.id), copy = m, oc = structuredClone(DATA.orderList);
    pushUndo(() => { DATA.materials.splice(idx, 0, copy); DATA.orderList = oc; invalidateMats(); });
    DATA.materials.splice(idx, 1); invalidateMats();
    DATA.orderList = DATA.orderList.filter(o => o.materialId !== m.id);
    VIEW.id = null; markDirty(); render();
  });
}

// The sheet prints the weights of the version as they are stored. It never rescales: a printed batch has
// to point back at a version number, so another quantity means a new version (Batch scaling makes one).
function sheetHtml(f, item, lines){
  const K = calc(lines);
  const label = vName(item);
  // No price anywhere means a cost of 0,00, which says nothing: the Cost column left the printed formula in
  // 260920k for that reason, and the summary line of the sheet carried the same figure on.
  const kost = K.rows.some(r => r.m && r.m.costPerGram != null) ? ` · est. cost € ${fmt(K.totalCost,2)}` : "";
  return `<h2>${esc(f.name)} – ${esc(label)}</h2>
  <div>Printed ${today()} · total ${fmt(K.totalW||0)} g · concentrate ${fmt(K.totalAbsPct,2)}%${kost}</div>
  <table class="bench"><colgroup><col class="cbc"><col class="pyc"><col class="matc"><col class="dilc"><col class="wc"><col class="rc"></colgroup>
  <thead><tr><th></th><th></th><th>Material</th><th>Dilution</th><th class="num">Weight (g)</th><th class="num">Rel %</th></tr></thead><tbody>
  ${sortRows(K.rows).map(r =>
    `<tr><td><span class="cb"></span></td><td>${pyrIcon(r.m.pyramid, catColour(r.m), 13)}</td><td>${esc(r.m.name)}${fridgeMark(r.m, r.dil)}${r.m.wishlist ? " (to order)" : ""}</td><td>${fmtS(r.dil)}%</td>
      <td class="num">${fmt(r.w)}</td><td class="num">${r.rel==null?"–":fmt(r.rel,2)}</td></tr>`).join("")}
  </tbody></table>`;
}
function printSheet(f, item, lines){
  $("#printArea").innerHTML = sheetHtml(f, item, lines);
  window.print();
}
// Ctrl+P or File > Print without touching a print button used to hand the printer whatever was there
// last, which at the scales is the wrong recipe. The area is emptied on every render, and filled here.
window.addEventListener("beforeprint", () => {
  const area = $("#printArea");
  if (!area || area.innerHTML.trim()) return;                   // a print button has just filled it
  const f = DATA && VIEW.tab === "F" && VIEW.id ? DATA.formulas.find(x => x.id === VIEW.id) : null;
  const item = f && VIEW.sub && VIEW.sub.type === "v" ? f.versions[VIEW.sub.idx] : null;
  // Compare is two versions side by side, which is not a sheet: say that, instead of "open a formula"
  // while one is open. Printing the comparison itself would be a second print layout for a screen you
  // read rather than carry to the bench.
  const cmp = !!(f && VIEW.sub && VIEW.sub.type === "cmp");
  area.innerHTML = item ? sheetHtml(f, item, item.lines)
    : cmp ? `<h2>miFormulas</h2><div>Two versions side by side is not a sheet to print. Use <b>Close compare</b>, then <b>Print weighing sheet</b> or <b>Print full formula</b>: each of them prints one version.</div>`
    : `<h2>miFormulas</h2><div>There is nothing to print here. Open a formula and use <b>Print weighing sheet</b> or <b>Print full formula</b>: each of them prints the version you are looking at.</div>`;
});

/* ---------- browser storage: ask for persistence, warn when it is not granted ---------- */
// Firefox grants persistence but still clears the storage when it is set to clear data on close, so do not ask and do not trust it
const FIREFOX = /Firefox\//.test(navigator.userAgent);
// iOS (an iPad in desktop mode says Macintosh, but has touch points): no install prompt, and no browser there can write to a file
const IOS = (/iPhone|iPad|iPod/.test(navigator.userAgent) || (/Macintosh/.test(navigator.userAgent) && navigator.maxTouchPoints > 1)) && !/CriOS|FxiOS|EdgiOS|OPiOS/.test(navigator.userAgent);
async function requestPersistence(){
  if (FIREFOX){ updateStorageHint(); return; }
  try{ if (navigator.storage && navigator.storage.persist) await navigator.storage.persist(); }catch(e){}
  updateStorageHint();
}
async function updateStorageHint(){
  if (!DEMO || HANDLE){ $("#storageHint").hidden = true; syncHomeToFile(); return; }
  let persisted = false;
  try{ persisted = !!(navigator.storage && navigator.storage.persisted && await navigator.storage.persisted()); }catch(e){}
  if ((persisted && !FIREFOX) || sessionStorage.getItem("storageHintClosed") || await idb.get("storageHintOff")){ $("#storageHint").hidden = true; syncHomeToFile(); return; }
  const canFile = !FALLBACK && !!window.showSaveFilePicker;
  // an installed app whose browser cannot write files (Safari's Dock app): an explanation, shown once
  const onceOnly = STANDALONE && !canFile;
  if (onceOnly && !sessionStorage.getItem("storageHintShown") && await idb.get("storageHintSeen")){ $("#storageHint").hidden = true; return; }
  if (isMobile()){   // a phone has no room for a paragraph, and the file picker is often not there either
    $("#storageHintText").textContent = "Your data lives in this browser \u2013 keep a Backup.";
    $("#storageHintSave").style.display = canFile ? "" : "none";
    $("#storageHint").classList.toggle("nosave", !canFile);
    $("#storageHint").hidden = false;
    syncHomeToFile();
    if (onceOnly){ sessionStorage.setItem("storageHintShown", "1"); idb.set("storageHintSeen", true); }
    return;
  }
  $("#storageHintText").textContent = canFile
    ? "Your data is kept in this browser only and may be cleared when it closes. Save it to a data file of your own, or download a Backup regularly."
    : onceOnly
      ? "Your data is kept in this app's storage and stays there between sessions, but the system can clear it (clearing website data, long inactivity). This app cannot write to a data file: download a Backup now and then."
      : "Your data is kept in this browser's storage and stays there between sessions, but the browser can clear it (clearing website data, a private window, long inactivity, or a setting that clears data on close). Download a Backup now and then"
        + (IOS ? "; no browser on an iPhone or iPad can write to a data file, and a server of your own is the way to share the same data with your computer."
          : FIREFOX ? "; in Firefox this happens even after you allow persistent storage."
          : "; to keep your data in a file of your own, use Chrome or Edge.");
  if (onceOnly){ sessionStorage.setItem("storageHintShown", "1"); idb.set("storageHintSeen", true); }
  $("#storageHintSave").style.display = canFile ? "" : "none";
  $("#storageHint").classList.toggle("nosave", !canFile);
  $("#storageHint").hidden = false;
  syncHomeToFile();
}
function syncHomeToFile(){   // the same button twice on one screen: the bar wins while it is there
  const b = $("#homeToFile"); if (b) b.style.display = $("#storageHint").hidden ? "" : "none";
}
$("#storageHintClose").addEventListener("click", () => {   // closed once is closed for good: it says the same thing every session
  sessionStorage.setItem("storageHintClosed", "1"); idb.set("storageHintOff", true); $("#storageHint").hidden = true; syncHomeToFile();
});
// browser storage -> a data file of the user's own (Chrome/Edge): explain, pick the location, write, remember

  if (!DATA || !window.showSaveFilePicker) return;
  openDialog(`<h3 style="margin-top:0">Where to keep your data file</h3>
    <p>Your formulas and materials will be saved as your data file, <b>miformulas-data.json</b>, and the app keeps saving to it from now on; the next time you open the app it offers to reopen it.</p>
    <p>In the next window, choose a folder of your own, for instance <b>Documents\\miFormulas</b>, and keep that file name. Make a subfolder <b>backups</b> there for Backup copies.</p>`,
    "Choose location\u2026", () => {
      (async () => {
        let h = null;
        try{ h = await window.showSaveFilePicker({id:"miformulas-data", startIn:"documents", suggestedName:"miformulas-data.json", types:[{description:"miFormulas data", accept:{"application/json":[".json"]}}]}); }
        catch(e){ /* cancelled */ }
        if (!h) return;
        HANDLE = h;
        if (await saveData()){                  // from here the file is the data
          await idb.set("fileHandle", h); await idb.set("demoData", null);
        } else {                                // the file could not be written: the browser keeps the data as before
          HANDLE = null;
          alert("The file could not be written (it may be locked or the disk full). Your data stays in this browser; try again or choose another location.");
          markDirty();
        }

/* ---------- back and forward: one history entry per place, so the mouse, the browser,
   Alt+Left and the Android back button all work without a line of their own ---------- */
function navState(){
  return {mf: 1, i: NAVI, tab: VIEW.tab, id: VIEW.id,
          sub: VIEW.sub ? {type: VIEW.sub.type, idx: VIEW.sub.idx} : null, home: HOMEVIEW, help: HELPVIEW};
}
function pushPlace(){
  if (NAVBACK) return;            // a popstate put us here, so its entry exists already
  try{
    if (NAVFIRST){
      NAVFIRST = false;
      // A reload keeps the entries around this one, and they keep the numbers they were pushed with. Starting
      // the count at zero made the app disagree with its own history: one step back then landed on a higher
      // number than the app knew, and the forward arrow went out while a forward step was there.
      const st = history.state;
      if (st && st.mf && typeof st.i === "number"){ NAVI = st.i; NAVMAX = Math.max(NAVMAX, st.i); }
      history.replaceState(navState(), "");
    }
    else { NAVI = NAVI + 1; NAVMAX = NAVI; history.pushState(navState(), ""); }   // a new step drops what lay ahead
  }catch(e){}                     // a browser that refuses it simply has no back and forward
  syncNav();
}
function syncNav(){               // the installed app has no toolbar of its own, so its buttons say where the ends are
  const b = $("#btnNavPrev"), f = $("#btnNavNext");
  if (b) b.disabled = NAVI <= 0;
  if (f) f.disabled = NAVI >= NAVMAX;
}
let NAVWAIT = null;
// A browser keeps a fixed number of steps (Chromium: fifty) and drops the oldest, and it never says so.
// NAVI kept counting, so after eighty places the back arrow stayed lit while pressing it did nothing at all.
// A browser also does nothing when the step is not there, so that is the signal: no popstate within a
// moment means this was the end of what it kept, and the counter moves to that end so the arrow goes out.
function navStep(dir){
  clearTimeout(NAVWAIT);
  NAVWAIT = setTimeout(() => {
    NAVWAIT = null;
    if (dir < 0) NAVI = 0; else NAVI = NAVMAX;
    // The entry the browser is sitting on still carries the index it was pushed with, and a later popstate
    // would read that stale number back: the forward arrow then went out while a forward step existed, and
    // the back arrow lit up again at the very end. So the entry is given the counter we just concluded.
    try{ history.replaceState(navState(), ""); }catch(e){}
    syncNav();
  }, 250);
  try{ if (dir < 0) history.back(); else history.forward(); }
  catch(e){ clearTimeout(NAVWAIT); NAVWAIT = null; }
}
window.addEventListener("popstate", e => {
  const s = e.state;
  clearTimeout(NAVWAIT); NAVWAIT = null;     // the step landed, so the end-of-history guess is off
  if (!DATA || !s || !s.mf) return;          // an entry that is not ours: let the browser do its thing
  // We moved back, so the entry we just left is reachable going forward, whatever this session had counted.
  // After a reload the counters start at zero while the surviving entries keep their old numbers, and without
  // this the first step back switched the forward arrow off.
  if (typeof s.i === "number" && s.i < NAVI) NAVMAX = Math.max(NAVMAX, NAVI);
  NAVI = typeof s.i === "number" ? s.i : NAVI;
  NAVBACK = true;
  try{
    IMPORTP = null;                          // an import preview is not a place you can come back to
    goPlace(s);
    setTabs();                               // setTabs closes the manual, so the flag goes after it
    HELPVIEW = !!s.help;
    render();
  } finally { NAVBACK = false; }
  syncNav();
});
